ビザは発行から3ヶ月以内に入国する必要がある。","X1は代行申請でも本人がビザセンターへ行って指紋採取が必要（X2は不要）。","滞在日数の目安は X1 約330〜350日、X2 約150〜170日。","渡航情報は仮の航空便でもよく、実際の航空券と一致しなくても問題ない。","中国側連絡先には北京大学国際合作部留学生事務室の情報を記入する。"],"sources":["nad1c4d69e689"]},{"id":"health_check_jp","phase":"pre","title":"日本で健康診断を受ける（必要な人のみ）","appliesTo":{"visa":["X1"]},"summary":"日本で受診した場合は「外国人体格检查表」（白い証明）を取得する。渡航後に中国側で青い証明へ切り替える必要がある。","notes":["日本で受けずに中国の指定医療機関で受診してもよい。その場合は青い証明が直接発行される。","レントゲン・心電図などは特に異常がなければ原則不要。"],"sources":["ne1cd0ad6011b","nbbed5fc388e1"]},{"id":"housing_booking","phase":"pre","title":"寮を予約する、または賃貸を契約する","window":"9月開始：7月末〜8月上旬 / 2月開始：1月末〜2月上旬","summary":"大学の留学生寮は自分で予約が必要。予約していないと寮には住めない。寮の部屋数には限りがあり、半数近くの留学生は寮以外に住んでいる。","notes":["⚠️ 予約開始から10分で満員になることもあるため、事前準備を早めにする。","予科、寮の提供が含まれる大学間交換留学プログラム、中国政府奨学金、国際中文教師奨学金は北京大学側が部屋を確保するので予約不要。","大学間の交換留学の場合は日本側の大学が寮を確保している可能性があるので事前に確認する。","サマースクール・短期留学は別途通知を確認する。"],"sources":["n690d781e6106","n0dede70ff906","n14e161185f83","n23faa8ef9b03"]},{"id":"tuition_payment","phase":"pre","title":"学費と保険料を支払う","summary":"学費はプログラムによって数万元。来華留学生保険は外国の保険加入状況に関わらず強制加入。","cost":"学費：数万元（プログラムによる） / 保険：1年 800元、半年 400元","notes":["⚠️ 金額が高いので、中国渡航前にオンラインで支払いを済ませておくと安心。","大学の留学生向けシステム：studyatpku.com / 保険購入サイト：lxbx.net","保険会社は国任保险・安盛（AXA）・中国财政平安のいずれでも内容は同じ。基本的には国任保险を選ぶ。","800元プランを選択後に対象期間を180日未満に設定すると400元になる。","学費・保険料の支払い完了は居留許可申請の事前条件。"],"sources":["n3584dbcda120","nc7da92d02801","nf6744365b4aa"]},{"id":"packing","phase":"pre","title":"荷物・持ち物を準備する","summary":"渡航・持ち物チェックリストを参照。滞在期間や書類の状況によって必要なものが変わる。","sources":["ned5f6d417396"]},{"id":"flight","phase":"pre","title":"航空券を手配して渡航する","requires":[{"id":"visa","why":"ビザ貼付済みのパスポートが必要"}],"summary":"入学許可書に記載された入学手続き（报到）の日の朝までに北京大学周辺に到着する日程で準備する。","notes":["多くの留学生は入学手続き日の1〜3日前に北京に到着する。","入学手続きは手続き日の16:00（日本時間17:00）頃には終了する。","⚠️ 新入生は入学手続き当日までキャンパス内に入れない可能性がある。"],"sources":["n690d781e6106"]},{"id":"airport_transfer","phase":"arrival","title":"空港から北京大学へ移動する","summary":"首都国際空港からはタクシーで40〜60分、電車で1時間〜1時間20分。大興国際空港からはタクシーで1時間〜1時間40分、電車で1〜1時間40分。","cost":"首都：タクシー80〜140元 / 電車 約30元　　大興：タクシー150〜250元 / 電車 約40元","notes":["新学期は首都国際空港で学校職員・学生ボランティアが指定時間・場所で迎えに来る場合がある。事前の連絡メールを確認する。","地図アプリ（百度地图・高德地图・Google Map）を事前に確認し、心配ならルートを印刷しておく。","⚠️ タクシーは現金払いが必須なので小銭を準備する。バスは乗車後に2元を車内の箱に投入。","寮に住む場合はタクシーを寮の近くで止めてもらう。中关新园なら「北京大学中关新园1号楼」まで。"],"sources":["n690d781e6106","nf782fd3fad87"]},{"id":"move_in","phase":"arrival","title":"入寮・入居する","requires":[{"id":"housing_booking","why":"予約・契約がないと入居できない"}],"summary":"寮の場合は中关新园1号楼（4号楼に変更の可能性あり）の受付で入寮手続きをする。","bring":["入学許可証（录取通知书）","パスポート","寮費（1ヶ月分以上の家賃 + 家賃1ヶ月分相当のデポジット/押金）"],"notes":["契約書の契約期間に注意する。夏に修了する場合は最長7月10〜15日、冬なら最長1月10〜15日で解約になる。","中关新园は全棟に顔認証システムがあり、入寮手続きの際に顔認証も登録する。","⚠️ X1ビザの場合、カードキーの有効期限が2〜3週間ほどに設定されている。居留許可の取得後に受付で再登録が必要。","賃貸の場合は入居時に設備（エアコン・冷蔵庫・洗濯機・給湯器・コンロ・水道電気ガス・Wi-Fi・ドア・鍵）の動作を確認し、部屋全体の写真・動画を撮っておくと敷金トラブルを防ぎやすい。"],"sources":["n0dede70ff906","n14e161185f83","n23faa8ef9b03","ndeb841474810"]},{"id":"zhusu_dengji","phase":"arrival","title":"住宿登記（滞在先の届け出）をする","requires":[{"id":"move_in","why":"滞在先が確定していないと登録できない"},{"id":"sim","when":{"housing":["rent","family"]},"why":"オンライン住宿登記の手続きには中国の電話番号が必要"}],"summary":"中国国内での宿泊場所を公安局に届け出る手続き。住む場所によって自分で申請する必要があるかどうかが変わる。","byHousing":{"dorm":"寮スタッフが登録してくれる（自分でネットから登録するように言われる場合もある）","hotel":"ホテルスタッフが登録してくれる","rent":"自分でネットから登録し、最寄りの公安局派出所へ行く","family":"自分でネットから登録する"},"notes":["⚠️ X1ビザの人は、居留許可申請で紙の「住宿登記表」が必要。寮の受付なら無料、ホテルの受付なら無料〜10元、賃貸なら管轄の派出所で発行してもらう。","オンライン登録には、パスポートの情報ページの写真、本人正面の写真（その場で撮影）、賃貸契約書等の証明資料の写真が必要。","「语言/Language」から日本語を選択できる。","派出所の営業時間は平日09:00-12:00, 14:00-17:00が一般的。","賃貸の場合、社区居民委員会や人民警察（民警）から連絡・訪問があり個人情報の登録を求められることがある。入居後1ヶ月間は知らない人からの電話・訪問に注意する。担当者から連絡・訪問が無い場合は登録は必要ない。","X1ビザの場合、居留許可を取得した後に、寮ならスタッフに、賃貸なら管轄の公安局・派出所に居留許可の情報を提供する必要がある。"],"discrepancy":"住宿登記システムのURLが記事によって異なる（到着直後の記事と住居の記事）。どちらも北京市公安局のシステムだが、アクセス前にどちらが現行かを確認したほうがよい。","sources":["n0dede70ff906","n690d781e6106"]},{"id":"baodao","phase":"enroll","title":"入学手続き（报到）をする","requires":[{"id":"admission_docs","why":"入学許可書に手続きの日時・場所が書かれている"}],"summary":"入学許可書に記載された入学手続き日に、指定された場所で入学登録・学籍登録を行う。例年2日間に渡って行われ、プログラムごとにどちらか1日が割り当てられる。","bring":["入学許可書（录取通知书 / Admission Notification）","パスポート","証明写真 2枚","関連費用の支払い手段（現金 / WeChat Pay / Alipay / クレカ / 银联卡）","あれば：JW201 / JW202表 / DQ表 / ビザ関連資料のコピー","あれば：留学申請で提出した資料のコピー・電子版"],"notes":["⚠️ 入学手続きの日から2週間を過ぎると自動的に入学放棄扱いになる。","手続きの日に到着できない・渡航が遅れる場合は必ずメールや電話等で連絡する。","間に合わなかった場合も平日9:00-12:00, 13:00-17:00に留学生オフィスで個別手続きが可能。","当日の内容：入学登録・学籍登録、各種資料の受け取り、学費・保険料の支払い、学生証の受け取り、新入生イベント申込み（任意）。","年により会場に電話会社や銀行の担当者が派遣され、SIMカード購入や口座開設ができる場合がある。","キャンパス入構は門の顔認証、通れない場合は警備員に入学許可証の写真やコピーを見せる。"],"sources":["n3584dbcda120","n690d781e6106"]},{"id":"baodao_x1_extra","phase":"enroll","title":"报到当日のX1ビザ向け手続き","appliesTo":{"visa":["X1"]},"requires":[{"id":"baodao","why":"入学手続きと同じ会場で行われる"}],"summary":"X1ビザの人は报到当日に追加の手続きがある（X2ビザの人は不要）。","itemsLabel":"当日の手続き","items":["健康診断が必要／認証が必要な人は、医療機関までの往復無料送迎バスの予約（先着順）","居留許可申請手続き（9月中はいつでも可能）","公安局職員・警察による本人確認（全員の場合と、特定の人・サンプル調査の場合がある）"],"notes":["居留許可申請は後日行う人が多い。入国後30日以内であれば後日でもよい。","当日に居留許可を申請する場合は、証明写真・住宿登記表・健康診断書（青い証明）も持参する。"],"sources":["n3584dbcda120"]},{"id":"student_card","phase":"enroll","title":"学生証（校园卡）を受け取る","requires":[{"id":"baodao","why":"入学手続き当日に実物が渡される"}],"summary":"学内の食堂・売店で支払いに使う。チャージして使用する。","notes":["⚠️ 学生証を取得する、または電子版学生証を登録するまでは学内の食堂を利用できない。","電子版は各自スマホから登録可能なので、入学手続き日より早く使える場合もある。","チャージ方法：Webサイト（card.pku.edu.cn）、WeChat / Alipay、学内の機械（現金対応）、北京大学App。"],"sources":["n3584dbcda120","nd7655beed895"]},{"id":"yuanxi_baodao","phase":"enroll","title":"院系报到・注册をする","appliesTo":{"program":["shinshu","honka","grad","yoka"]},"requires":[{"id":"baodao","why":"留办の手続きとは別に院系側の手続きがある"}],"summary":"留学生全体の留办の手続きとは別に、院系（学部・学院）側の手続きがある。","notes":["⚠️ 留学生全体の留办の手続きと、院系の手続きの2つがある。対外漢語以外の進修生・学位生が対象。","入学式は院系と大学全体の2回ある（学位生のみ）。非学位生向けは無いことがほとんど。"],"sources":["n960d0ae94257"]},{"id":"sim","phase":"setup","title":"SIMカードを購入する（中国の電話番号を取得）","window":"9月1日〜25日頃（仮設店舗は8月末〜9月上旬、2月下旬）","summary":"銀行口座の開設、Alipay・WeChat Payの利用、配車・デリバリー、各種本人認証に中国の電話番号が必要。","bring":["パスポート","入学許可書 または 学生証（学生向けプランを契約する場合）","料金（前払い）"],"cost":"学生向けセットプラン：1年間 500元 / 2年間 800元　　普通のプラン：月50〜100元程","where":"学内：中国移动（45甲地下・物美スーパー付近）、中国联通（29楼地下・ファミマ付近）。新学期はキャンパス内・寮周辺の仮設店舗がおすすめ。","notes":["⚠️ 居留許可申請ではパスポートを預けるため、SIMカード取得は居留許可申請の前に行う。","日本や外国で購入する中国SIM／香港SIMは、大陸SIMと認識されずエラーになる、前の利用者の登録が残っていて新規登録できないなどの問題がある。事前に買う場合は3〜30日用を一時利用にして、現地で買い直すのがおすすめ。","学生プランの上限（データ・通話・SMS）を超えると通信も通話も止まるので、個別にチャージする。国際電話は1日で上限を超える可能性あり。","AndroidはeSIMの設定がうまくいかない場合があるので、不安なら物理SIM。"],"sources":["n6305b4e3cabf"]},{"id":"bank","phase":"setup","title":"銀行口座を開設する","window":"9月1日〜25日頃","requires":[{"id":"sim","why":"SMS認証で使う中国の電話番号の登録が必要"},{"id":"zhusu_dengji","why":"住宿登記表が必要書類"},{"id":"student_card","why":"在学証明・学生証・在籍証明のいずれかが必要"}],"summary":"WeChat Pay・Alipayとの連携、奨学金の受け取り、各種支払いに中国現地の口座がほぼ必須。","bring":["パスポート（ビザ付き）","在学証明 or 学生証 or 大学留学生オフィスが発行した在籍証明","住宿登記表","中国の電話番号","50-100元（初回貯金用）","マイナンバー（分からなければ保険証番号などでも良い場合あり）"],"where":"キャンパス内・近隣が便利。中国工商銀行（ICBC）は西南門/小西门の近く、中国農業銀行（ABC）はキャンパス内西側。","notes":["⚠️ パスポート本体がないと開設できないことが多い。居留許可申請でパスポートを提出すると手続き完了まで開設できないため、居留許可申請の前に行う。","⚠️ 支店ごとに1日に開設できる口座数の上限（キャンパス外だと1日外国人10人までなど）があり、当日開設できず予約になる場合がある。","念の為2つ以上の口座を開設しておくと安心。","一部の中国の奨学金は銀行の指定がある（指定外だと手数料や振込遅延の場合あり）。","登録したパスポートの有効期限が切れると各種サービスが停止するので、更新したら早めに銀行の情報も更新する。","学内の中国農業銀行では北京大学オリジナルの銀行カードが発行される。"],"sources":["n35eb601ddae5"]},{"id":"payment_apps","phase":"setup","title":"WeChat / Alipay を設定する","requires":[{"id":"sim","why":"中国の電話番号での登録・認証が必要"},{"id":"bank","why":"口座との連携に必要"}],"summary":"中国でSIMカードと銀行口座を開設したら、WeChat / Alipay は即設定必須。決済・予約・光熱費の支払いなど生活のあらゆる場面で使う。","sources":["n960d0ae94257","n3584dbcda120","ndca8ccfbcae8"]},{"id":"wifi","phase":"setup","title":"学内WiFi・ポータルを設定する","requires":[{"id":"student_card","why":"学内アカウントが必要"}],"summary":"ポータル（portal.pku.edu.cn）、WiFi（its.pku.edu.cn）、学校メール（mail.pku.edu.cn / mail.stu.pku.edu.cn）を設定する。","sources":["n490c5918bbc0","n3584dbcda120","n386d808f7535"]},{"id":"tijian","phase":"residence","title":"健康診断／体格検査（体检）を受ける","appliesTo":{"visa":["X1"]},"summary":"居留許可の申請には健康診断の結果（「境外人員体格検査記録検証証明」＝青い証明）の提出が必要。日本で受診済みの場合も中国側で認証・切り替えが必要。","bring":["パスポート","証明写真（4.5×3.5cm）","費用"],"cost":"約346.7元（2025年時点）。初めて居留許可を申請する場合は無料のことあり（要確認）。","where":"海关总署（北京）国际旅行卫生保健中心 和平里本部（东城区和平里北街20号、7:30〜11:00・受付は10:30まで） / 北京国际旅行卫生保健中心 海淀门诊部（海淀区西北旺镇德政路10号、8:30〜11:00）","notes":["⚠️ 血液検査があるため、健診の8時間以上前から水・お茶以外の飲食を控える。","予約なしで行ってよい。9月は混雑するが、予約すると1〜2週間先になる場合があるので、朝早めに直接行って並ぶ方が効率が良い。","結果の受け取りは約4〜5営業日後に窓口へ。30元ほど払えば寮受付宛などに郵送してもらえる（健診から3〜7日後に到着）。","报到の際に医療機関までの往復無料送迎バスがある（先着順）。","日本で受診した場合は「外国人体格检查表」（白い証明）を提出して「境外人員体格検査記録検証証明」（青い証明）へ切り替える。","居留許可の有効期限内に申請する場合、または過去2年以内に居留許可を申請した場合は提出免除（政策変更の可能性があるので要確認）。"],"sources":["nbbed5fc388e1","ne1cd0ad6011b"]},{"id":"residence_permit","phase":"residence","title":"居留許可を申請する","appliesTo":{"visa":["X1"]},"window":"入国後30日以内（9月中はいつでも可能）","requires":[{"id":"zhusu_dengji","why":"紙の住宿登記表が必要書類"},{"id":"tijian","why":"健康診断証明（青い証明）が必要書類"},{"id":"tuition_payment","why":"学費・保険料の支払い完了が事前条件"},{"id":"sim","why":"申請中はパスポートを預けるため、先に済ませておく必要がある"},{"id":"bank","why":"申請中はパスポートを預けるため、先に済ませておく必要がある"}],"summary":"X1ビザで入国した場合、中国で長期滞在するには入国後に居留許可の取得が必須。全体で約2〜3週間かかる（住宿登記0〜1日、健康診断〜証明取得 約1週間、申請〜取得 約1〜2週間）。","bring":["証明写真（3.5cm × 5.3cm）","住宿登記表","健康診断証明（青い証明）","パスポート（X1ビザ貼付け済み）","外国人签证证件申请表"],"cost":"400元（1年未満）/ 800元（1年以上）。北京大学留学生事務室で代理申請する場合は +200元。値上げの可能性があるので最新情報を確認。","where":"方法①学校経由（おすすめ）：新太阳学生中心3階、火・木・金 13:00〜15:30、所要約2週間。方法②自分で公安局へ：中关村外国人服务大厅（海淀区双榆树北里甲22号院、北京大学から自転車で約15分）。","notes":["⚠️ 申請中はパスポートを約2週間預ける。この間、飛行機・高速鉄道の利用、ホテル宿泊、一部観光ができない。","⚠️ だからSIMカード取得と銀行口座開設は居留許可申請の前に済ませる。","代替として「外国人签证证件受理回执」（黄色い紙）が渡されるが、中国での認知度が低く使用を拒否される例も多い。拒否された場合は公安局のハンコがあること、パスポートのコピーと内容が一致することを説明して説得する。","自分で申請する場合は申請表に大学留学生事務室のハンコが必要。事務室が個人申請を断る（ハンコをくれない）場合もある。","居留許可取得後は有効期間内なら何度でも出入国可能。","既に他の種類（就労、探親など）の居留許可を持っている場合は、入学手続き後に「学習」タイプへ切り替え（X1/X2の再申請は不要）。","ビザフリーで入国した場合、中国で直接居留許可を申請することはできない。"],"clarification":"X2ビザ（180日未満・1学期）の場合、居留許可の申請は不要。ビザの記事と居留許可の記事の両方が「X2は不要」と明記している。一方、新入生スケジュールの記事には「X1/X2→居留許可への切替」という括弧書きがあり誤読しやすいので、専門記事の記述を優先する。ただし最終的には必ず大学・公安局の公式情報を確認すること。","sources":["ne3f008f7c5fd","nad1c4d69e689","n3584dbcda120"]},{"id":"dorm_card_update","phase":"residence","title":"居留許可の情報を寮受付で登録する","appliesTo":{"visa":["X1"],"housing":["dorm"]},"requires":[{"id":"residence_permit","why":"居留許可の取得後に行う"}],"summary":"X1ビザの場合、入寮時のカードキーは有効期限が2〜3週間ほどに設定されている。居留許可を取得した後に受付で情報を登録すると、部屋の契約期間までカードキーが使えるようになる。","notes":["賃貸の場合は、管轄の公安局・派出所に居留許可の情報を提供する。"],"sources":["n0dede70ff906"]},{"id":"course_reg","phase":"term","title":"履修登録（选课）をする","window":"9月第1週〜第3週頃（対外漢語は2週目以降）","summary":"学部・学院の説明会やオリエンテーションのあと履修登録を行う。授業開始後も9月第3週頃まで変更可能。","notes":["⚠️ プログラム（語学進修生・その他の進修生・学位生）によって選課のルールが異なるので混用しない。"],"sources":["ndd64e74f56c7","n3584dbcda120","n960d0ae94257"]},{"id":"clubs","phase":"term","title":"サークル（社団）に応募する","window":"9月下旬","summary":"百团大战などのサークル募集イベントがある。新入生向け活動は定員制・事前応募制の場合が多い。","sources":["n491ac622d20d","n960d0ae94257"]},{"id":"residence_ext","phase":"term","title":"居留許可を延長する（在学を継続する場合）","appliesTo":{"visa":["X1"]},"window":"有効期限の約3ヶ月前〜2週間前","summary":"在学を継続する場合は有効期限前に延長手続きが必要。学費・保険料の支払い済みが条件。","bring":["パスポート","証明写真","住宿登記表","支払い証明"],"cost":"1年未満 400元 / 1年以上 800元","notes":["延長の場合は健康診断は不要。","北大内で進学する場合は正式な合格通知後に申請。他大学へ進学する場合は進学先で手続きし、寮は退寮が必要。","卒業・修了する場合は期限内に出国、または観光ビザ・停留ビザを申請。","⚠️ 夏は混雑するので早めに確認する。"],"sources":["ne3f008f7c5fd"]},{"id":"checkout","phase":"exit","title":"退寮する","appliesTo":{"housing":["dorm"]},"window":"夏修了：最長7月10〜15日 / 冬修了：最長1月10〜15日","summary":"長期休暇中は中关新园が短期プログラムの学生寮として使われるため、契約はこの期限で解約になる。","notes":["⚠️ 実際に出発する1時間前までに荷物を整理して受付に連絡する。スタッフによる部屋のチェックがある。","スタッフの勤務時間は平日・土日祝9〜17時頃。午前10時より前に出る場合は前日に連絡しておくと先に部屋チェックだけ対応してもらえる。","部屋の掃除は不要で、不要な荷物を置いたままでも問題ない。","デポジット（押金）と住まなかった分の寮費が1日単位で返還される。返還はクレジットカードやWeChat / Alipayへ。","特殊な事情（入院・通院中など）がある場合は、居留許可の有効期限まで延長してくれる場合がある。"],"sources":["n0dede70ff906"]},{"id":"completion_docs","phase":"exit","title":"修了証明書・単位取得証明書を取得する","window":"6月下旬〜","summary":"修了手続きとして修了証明書・単位取得証明書等を発行してもらう。","notes":["⚠️ 個人で取得が必要な場合は、大学職員にしつこく連絡・確認する。書類はそのうち送ってくれるだろうと待っていたら、日本の大学で単位認定に必要な書類が何も届かず、卒業を1年延長したケースが過去に発生している。","中国では学生側が自分で確認するのが重要。「決まったら連絡する」と返信があってもその後連絡がない場合が多いので、一定期間過ぎたら自分から再確認する。"],"sources":["n960d0ae94257"]},{"id":"sim_close","phase":"exit","title":"SIM・電話番号の扱いを決める","summary":"中国の通話料・データ通信料は前払い・チャージ制なので、解約をしなくても問題ない。1年・2年セットは期間が過ぎれば自動的に使えなくなる。","notes":["⚠️ 毎月セット料金を自動支払いにしている場合は、支払い元の残高が無くなるまで支払われ続けるため、自動支払い設定を切る必要がある。","料金未払い（停机）・未使用が90日を超えると電話番号が自動解約（销号）・回収される。","帰国後も番号を維持したい場合は月30元程度の支払いを続ける必要がある。"],"sources":["n6305b4e3cabf"]}],"glossary":[{"cn":"报到","ja":"入学手続き・登録","note":"入学許可書に日付が指定される"},{"cn":"录取通知书","ja":"入学許可書（Admission Notification）"},{"cn":"注册","ja":"在籍登録"},{"cn":"院系","ja":"学部・学院"},{"cn":"选课","ja":"履修登録"},{"cn":"住宿登记","ja":"滞在先の公安局への届け出"},{"cn":"住宿登记表","ja":"住宿登記の証明書","note":"居留許可の申請に必要（紙）"},{"cn":"体检","ja":"健康診断・体格検査"},{"cn":"外国人体格检查表","ja":"白い証明","note":"日本で受診した場合に取得"},{"cn":"境外人员体格检查记录验证证明","ja":"青い証明","note":"居留許可申請に提出するもの"},{"cn":"居留许可","ja":"居留許可（Residence Permit）","note":"X1ビザの人が入国後に取得"},{"cn":"外国人签证证件申请表","ja":"ビザ・証件の申請書"},{"cn":"外国人签证证件受理回执","ja":"受理証明（黄色い紙）","note":"申請中のパスポート代替"},{"cn":"公安局","ja":"公安局","note":"出入国・在留の管理"},{"cn":"派出所","ja":"交番・地域の警察署"},{"cn":"民警","ja":"地域担当の人民警察"},{"cn":"社区居委会","ja":"住民委員会","note":"日本の町内会・自治会に相当"},{"cn":"校园卡","ja":"学生証","note":"食堂・売店の支払いに使う"},{"cn":"学生套餐","ja":"学生向けセットプラン","note":"SIMの通話＋データのセット"},{"cn":"停机","ja":"料金未払いによる回線停止"},{"cn":"销号","ja":"電話番号の自動解約・回収"},{"cn":"开户","ja":"口座開設"},{"cn":"银行卡","ja":"銀行カード"},{"cn":"借记卡","ja":"デビットカード（キャッシュカード）"},{"cn":"押金","ja":"デポジット・敷金"},{"cn":"房卡","ja":"部屋のカードキー"},{"cn":"租赁合同","ja":"賃貸契約書"},{"cn":"中介费","ja":"仲介手数料"},{"cn":"物业费","ja":"管理費"},{"cn":"押一付三","ja":"敷金1ヶ月・家賃3ヶ月前払い","note":"押一付一なら家賃1ヶ月ずつ"},{"cn":"公众号","ja":"WeChat公式アカウント"},{"cn":"百团大战","ja":"サークル勧誘イベント","note":"9月下旬"},{"cn":"预科","ja":"本科入学準備コース（foundation）"},{"cn":"进修生","ja":"非学位の進修生"},{"cn":"学位生","ja":"学位取得を目的とする学生"},{"cn":"一卡通","ja":"交通系のICカード・アプリ"}]}</script>

      2-gram に割ると散って、関係ない記事に負ける。語がそのまま出てくる
      文書を別枠で押し上げる。

   proto_retrieval.py と同じ式。12 問の手作り評価で recall@8 = 12/12。 */

var SEARCH = (function(){
  "use strict";

  var K1 = 1.2;
  var B = 0.82;        /* 長い記事（9.1 その他情報）が何にでも当たるのを抑える */
  var W_TITLE = 3;
  var W_HEADING = 3;
  var W_SYN = 0.45;    /* 同義語で足した分は本来の語より軽く */
  var W_EXACT = 6.0;   /* 内容語がそのまま出てくる文書を強く押し上げる */

  var PUNCT = /[（）()「」『』【】、。・,.:：;；!！?？\-—–ー~〜\/｜|"'’”＋+*#＃※→←↑↓…]/g;
  var KANJI = "一-鿿々〆";
  var KATA = "ァ-ヺー";
  var CONTENT = new RegExp("[" + KANJI + "]{2,}|[" + KATA + "]{2,}|[a-z0-9]{2,}", "g");

  var SCRAP = document.createElement("div");
  function untag(html){
    SCRAP.innerHTML = html;
    return SCRAP.textContent || "";
  }

  function norm(s){
    s = (s || "").normalize("NFKC").toLowerCase();
    s = s.replace(/[\s　]+/g, "").replace(PUNCT, "");
    return s;
  }
  function grams(s){
    s = norm(s);
    if(s.length < 2) return s ? [s] : [];
    var out = [];
    for(var i = 0; i < s.length - 1; i++) out.push(s.substr(i, 2));
    return out;
  }
  function contentWords(q){
    return norm(q).match(CONTENT) || [];
  }

  var syn = [];        /* [[正規化した見出し語, 資料側の語], ...] */
  function loadSynonyms(map){
    syn = Object.keys(map || {}).map(function(k){ return [norm(k), map[k]]; })
            .filter(function(p){ return p[0]; });
  }
  function expand(q){
    var nq = norm(q), out = [];
    for(var i = 0; i < syn.length; i++) if(nq.indexOf(syn[i][0]) !== -1) out.push(syn[i][1]);
    return out.join(" ");
  }

  var docs = null, tf = null, df = null, post = null, dl = null, flat = null,
      avgdl = 0, N = 0;

  /* 小節・手続き・用語を 1 件ずつの文書にする */
  function buildDocs(guide, tasks){
    var out = [];
    guide.articles.forEach(function(a){
      a.sections.forEach(function(s, si){
        var parts = [];
        s.blocks.forEach(function(b){
          if(b.t === "p" || b.t === "label" || b.t === "note" || b.t === "quote"){
            parts.push(untag(b.html));
          }else if(b.t === "list"){
            b.items.forEach(function(i){ parts.push(untag(i)); });
          }else if(b.t === "dl"){
            b.rows.forEach(function(r){
              parts.push((r.k ? r.k + "：" : "") + untag(r.v));
            });
          }else if(b.t === "table"){
            b.rows.forEach(function(r){ parts.push(r.join(" ")); });
          }else if(b.t === "att"){
            parts.push(b.name);
          }else if(b.t === "card"){
            parts.push(b.title + " " + (b.site || ""));
          }else if(b.t === "img" || b.t === "fig"){
            parts.push(b.caption || b.alt || "");
          }
        });
        var body = parts.filter(Boolean).join("\n");
        if(!body && !s.heading) return;
        out.push({ id: a.id + "#" + si, kind: "section", articleId: a.id,
                   title: a.title, heading: s.heading || "", body: body });
      });
    });
    tasks.tasks.forEach(function(t){
      var parts = [t.summary || ""]
        .concat(t.bring || [], t.items || [], t.notes || [],
                [t.cost || "", t.where || "", t.window || ""],
                (t.requires || []).map(function(r){ return r.why || ""; }));
      out.push({ id: "task:" + t.id, kind: "task", taskId: t.id,
                 title: t.title, heading: "", body: parts.filter(Boolean).join("\n") });
    });
    tasks.glossary.forEach(function(g){
      out.push({ id: "term:" + g.cn, kind: "term",
                 title: g.cn + " / " + g.ja, heading: "", body: g.note || "" });
    });
    return out;
  }

  function build(guide, tasks, synMap){
    loadSynonyms(synMap);
    docs = buildDocs(guide, tasks);
    N = docs.length;
    tf = new Array(N);
    dl = new Array(N);
    flat = new Array(N);
    df = new Map();
    post = new Map();
    var total = 0;
    for(var i = 0; i < N; i++){
      var d = docs[i];
      var g = [];
      var t = grams(d.title), h = grams(d.heading), w;
      for(w = 0; w < W_TITLE; w++) g = g.concat(t);
      for(w = 0; w < W_HEADING; w++) g = g.concat(h);
      g = g.concat(grams(d.body));
      var c = new Map();
      for(var j = 0; j < g.length; j++) c.set(g[j], (c.get(g[j]) || 0) + 1);
      tf[i] = c;
      dl[i] = g.length;
      total += g.length;
      flat[i] = norm(d.title + d.heading + d.body);
      c.forEach(function(_, term){
        df.set(term, (df.get(term) || 0) + 1);
        var p = post.get(term);
        if(p) p.push(i); else post.set(term, [i]);
      });
    }
    avgdl = total / Math.max(1, N) || 1;
    return { docs: N, terms: post.size };
  }

  function bm25(text, weight, scores){
    var qc = new Map();
    grams(text).forEach(function(t){ qc.set(t, (qc.get(t) || 0) + 1); });
    qc.forEach(function(qn, term){
      var p = post.get(term);
      if(!p) return;
      var n = df.get(term);
      var idf = Math.log(1 + (N - n + 0.5) / (n + 0.5));
      var boost = Math.min(qn, 3);
      for(var x = 0; x < p.length; x++){
        var i = p[x], f = tf[i].get(term);
        var denom = f + K1 * (1 - B + B * dl[i] / avgdl);
        scores[i] = (scores[i] || 0) + weight * idf * (f * (K1 + 1) / denom) * boost;
      }
    });
  }

  function search(q, k){
    if(!docs || !q || !q.trim()) return [];
    var scores = [];
    bm25(q, 1, scores);
    var ex = expand(q);
    if(ex) bm25(ex, W_SYN, scores);

    contentWords(q).forEach(function(w){
      if(w.length < 2) return;
      var hits = 0, i;
      for(i = 0; i < N; i++) if(flat[i].indexOf(w) !== -1) hits++;
      if(!hits) return;
      var idf = Math.log(1 + N / (1 + hits));
      var add = W_EXACT * idf * Math.log(1 + w.length);
      for(i = 0; i < N; i++) if(flat[i].indexOf(w) !== -1) scores[i] = (scores[i] || 0) + add;
    });

    var ranked = [];
    for(var i = 0; i < N; i++) if(scores[i]) ranked.push([i, scores[i]]);
    ranked.sort(function(a, b){ return b[1] - a[1]; });
    return ranked.slice(0, k || 10).map(function(r){
      return { doc: docs[r[0]], score: r[1] };
    });
  }

  return { build: build, search: search, words: contentWords, norm: norm };
})();

</script>
<script>
(function(){
"use strict";

/* ===== AI のまとめ機能の接続先 =====
   build_app.py が環境変数 AI_ENDPOINT の値を埋める（既定は空）。
   空なら AI の欄は出ず、ページは検索だけで動く（Artifact 上では外部 fetch が
   CSP で落ちるので、Artifact 版は空のまま生成する）。
   独立配備するときだけ、代理サーバ（例：アリババクラウド関数計算）の URL を
   AI_ENDPOINT に入れてビルドする。API キーはその代理側だけが持つ。 */
var AI_ENDPOINT = "";

var GUIDE = JSON.parse(document.getElementById("guide-data").textContent);
var TASKS = JSON.parse(document.getElementById("tasks-data").textContent);
var SYN = JSON.parse(document.getElementById("syn-data").textContent).map;
var ART = {};
GUIDE.articles.forEach(function(a){ ART[a.id] = a; });
var TASK_BY_ID = {};
TASKS.tasks.forEach(function(t){ TASK_BY_ID[t.id] = t; });

var PROFILE_KEYS = ["visa","housing","program"];
var PROFILE_LABEL = { visa:"ビザの種類", housing:"住まい", program:"プログラム" };
var STORE_KEY = "pku-guide-nav-v1";

var state = {
  profile: { visa:"unknown", housing:"unknown", program:"unknown" },
  done: {},
  open: {},
  showHidden: {}
};

/* ---------- storage (may throw or come back empty) ---------- */
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    var v = JSON.parse(raw);
    if(v && v.profile) PROFILE_KEYS.forEach(function(k){
      if(typeof v.profile[k] === "string") state.profile[k] = v.profile[k];
    });
    if(v && v.done && typeof v.done === "object") state.done = v.done;
  }catch(e){ /* private window, blocked storage, bad JSON */ }
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ profile:state.profile, done:state.done }));
  }catch(e){ /* nothing to do; the page still works */ }
}

/* ---------- dom helpers ---------- */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }

/* ⚠ / ❗ / ‼ で始まる行は本文中の注意書きとして強調する */
function isWarn(s){ return /^(⚠️?|❗|‼)/.test(s); }

/* 検索用の素テキスト。本文と重ねて持つと容量が倍になるので、
   必要になった記事だけ組み立てて記事オブジェクトに覚えさせる。 */
var SCRATCH = document.createElement("div");
function untag(html){
  SCRATCH.innerHTML = html;
  return SCRATCH.textContent || "";
}
function plainOf(a){
  if(a._plain != null) return a._plain;
  var out = [];
  a.sections.forEach(function(s){
    if(s.heading) out.push(s.heading);
    s.blocks.forEach(function(b){
      if(b.t === "list") b.items.forEach(function(i){ out.push(untag(i)); });
      else out.push(untag(b.html));
    });
  });
  a._plain = out.join("\n");
  return a._plain;
}

/* ---------- condition matching ---------- */
function conditionsOf(task){
  /* returns [{key,label,values}] for appliesTo entries */
  var out = [];
  var a = task.appliesTo || {};
  Object.keys(a).forEach(function(k){
    var opts = TASKS.options[k] || [];
    var labels = a[k].map(function(v){
      for(var i=0;i<opts.length;i++) if(opts[i].key === v) return opts[i].label;
      return v;
    });
    out.push({ key:k, values:a[k], labels:labels });
  });
  return out;
}
function taskVisible(task){
  var a = task.appliesTo || {};
  for(var k in a){
    var sel = state.profile[k];
    if(sel && sel !== "unknown" && a[k].indexOf(sel) === -1) return false;
  }
  return true;
}
function activeRequires(task){
  return (task.requires || []).filter(function(r){
    if(!r.when) return true;
    for(var k in r.when){
      var sel = state.profile[k];
      if(sel === "unknown" || !sel) return true;   /* unknown: keep and label it */
      if(r.when[k].indexOf(sel) === -1) return false;
    }
    return true;
  });
}
function shortCond(task){
  /* chip text like "X1のみ" / "寮のみ" */
  var chips = [];
  conditionsOf(task).forEach(function(c){
    if(c.key === "visa") chips.push(c.values.join("/") + "のみ");
    else if(c.key === "housing") chips.push(c.labels.map(function(l){
      return l.replace(/（.*$/,"").replace(/^大学の/,"");
    }).join("・") + "のみ");
    else if(c.key === "program") chips.push("一部プログラム");
  });
  return chips;
}

/* ---------- tabs ---------- */
var TABS = [
  { id:"tasks",    label:"手続き一覧" },
  { id:"docs",     label:"資料" },
  { id:"glossary", label:"用語集" },
  { id:"ask",      label:"Agent" }
];
var current = "tasks";
function renderTabs(){
  var nav = document.getElementById("tabs");
  clear(nav);
  TABS.forEach(function(t){
    var b = el("button","tab",t.label);
    b.setAttribute("role","tab");
    b.id = "tab-" + t.id;
    b.setAttribute("aria-selected", t.id === current ? "true" : "false");
    b.setAttribute("aria-controls","p-" + t.id);
    b.addEventListener("click", function(){ go(t.id); });
    nav.appendChild(b);
  });
}
function go(id){
  current = id;
  TABS.forEach(function(t){
    document.getElementById("p-" + t.id).hidden = (t.id !== id);
  });
  renderTabs();
  if(id === "ask"){
    ensureIndex();
    document.getElementById("ask-q").focus();
  }
}

/* ---------- profile fields ---------- */
function renderFields(){
  var wrap = document.getElementById("fields");
  clear(wrap);
  PROFILE_KEYS.forEach(function(k){
    var f = el("div","field");
    var lab = el("label", null, PROFILE_LABEL[k]);
    lab.setAttribute("for","f-" + k);
    var sel = el("select");
    sel.id = "f-" + k;
    (TASKS.options[k] || []).forEach(function(o){
      var op = el("option", null, o.label);
      op.value = o.key;
      if(state.profile[k] === o.key) op.selected = true;
      sel.appendChild(op);
    });
    sel.addEventListener("change", function(){
      state.profile[k] = sel.value;
      save();
      renderPhases();
    });
    f.appendChild(lab); f.appendChild(sel);
    wrap.appendChild(f);
  });
}

/* ---------- tasks ---------- */
function visibleTasks(){ return TASKS.tasks.filter(taskVisible); }

function nextTask(){
  /* 未完了で、前提もすべて済んでいる最初の手続き */
  var vis = visibleTasks();
  for(var i=0;i<vis.length;i++){
    if(state.done[vis[i].id]) continue;
    var pend = activeRequires(vis[i]).filter(function(r){ return !state.done[r.id]; });
    if(!pend.length) return vis[i];
  }
  return null;
}

function shortPhase(label){ return label.replace(/（.*$/, ""); }

function renderOverview(){
  var host = document.getElementById("overview");
  clear(host);
  var vis = visibleTasks();
  var done = vis.filter(function(t){ return state.done[t.id]; }).length;

  var top = el("div","ov-top");

  var pr = el("div","ov-prog");
  var bar = el("div","prog-bar");
  var fill = el("div","prog-fill");
  fill.style.width = (vis.length ? Math.round(done / vis.length * 100) : 0) + "%";
  bar.appendChild(fill);
  pr.appendChild(bar);
  pr.appendChild(el("span","prog-num", done + " / " + vis.length + " 件"));
  var rst = el("button","prog-reset","リセット");
  rst.addEventListener("click", function(){
    state.done = {};
    save();
    renderPhases();
  });
  pr.appendChild(rst);
  top.appendChild(pr);

  var nx = el("div","ov-next");
  nx.appendChild(el("span","lb","次にやること"));
  var nt = nextTask();
  if(!vis.length){
    nx.appendChild(el("span", null, "条件に合う手続きがありません"));
  }else if(nt){
    var jump = el("button", null, nt.title);
    jump.addEventListener("click", function(){ jumpToTask(nt.id); });
    nx.appendChild(jump);
  }else{
    nx.appendChild(el("span","alldone","すべて完了"));
  }
  top.appendChild(nx);
  host.appendChild(top);

  var grid = el("div","ov-phases");
  TASKS.phases.forEach(function(ph, i){
    var mine = vis.filter(function(x){ return x.phase === ph.key; });
    var d = mine.filter(function(x){ return state.done[x.id]; }).length;
    var cls = "ov-ph";
    if(!mine.length) cls += " empty";
    else if(d === mine.length) cls += " clear";
    var cell = el("button", cls);
    cell.appendChild(el("span","no", ("0" + (i + 1)).slice(-2)));
    cell.appendChild(el("span","nm", shortPhase(ph.label)));
    cell.appendChild(el("span","ct", mine.length ? d + " / " + mine.length : "対象なし"));
    var mini = el("div","mini");
    var mfill = el("i");
    mfill.style.width = (mine.length ? Math.round(d / mine.length * 100) : 0) + "%";
    mini.appendChild(mfill);
    cell.appendChild(mini);
    cell.addEventListener("click", function(){
      var target = document.getElementById("ph-" + ph.key);
      if(target) target.scrollIntoView({ behavior:"smooth", block:"start" });
    });
    grid.appendChild(cell);
  });
  host.appendChild(grid);
}

function taskCard(task){
  var wrap = el("div","task");
  wrap.dataset.id = task.id;
  var isDone = !!state.done[task.id];
  if(isDone) wrap.classList.add("done");

  var dot = el("button","dot");
  dot.setAttribute("role","checkbox");
  dot.setAttribute("aria-checked", isDone ? "true" : "false");
  dot.setAttribute("aria-label", task.title + "を完了にする");
  dot.addEventListener("click", function(){
    if(state.done[task.id]) delete state.done[task.id];
    else state.done[task.id] = 1;
    save();
    renderPhases();
  });
  wrap.appendChild(dot);

  var card = el("div","card");
  var head = el("button","t-head");
  head.setAttribute("aria-expanded", state.open[task.id] ? "true" : "false");
  head.appendChild(el("span","t-title",task.title));

  /* 畳んだ状態で要るのは「自分に関係あるか」「もう始められるか」の二つ。
     正確な時期は開いたときの事実表に出す。 */
  var meta = el("div","t-meta");
  shortCond(task).forEach(function(c){ meta.appendChild(el("span","chip cond",c)); });

  var reqs = activeRequires(task);
  var pending = reqs.filter(function(r){ return !state.done[r.id]; });
  if(reqs.length){
    var rc = el("span","chip" + (pending.length && isDone ? " block" : ""),
      pending.length ? "先に必要 " + pending.length + "件" : "前提ぜんぶ完了");
    meta.appendChild(rc);
  }
  if(meta.childNodes.length) head.appendChild(meta);
  card.appendChild(head);

  var body = el("div","t-body");
  body.hidden = !state.open[task.id];
  head.addEventListener("click", function(){
    state.open[task.id] = !state.open[task.id];
    body.hidden = !state.open[task.id];
    head.setAttribute("aria-expanded", state.open[task.id] ? "true" : "false");
  });

  if(task.summary) body.appendChild(el("p","t-sum",task.summary));

  var facts = [];
  if(task.window) facts.push(["時期", task.window]);
  if(task.cost)   facts.push(["費用", task.cost]);
  if(task.where)  facts.push(["場所", task.where]);
  if(facts.length){
    var dl = el("dl","facts");
    facts.forEach(function(r){
      dl.appendChild(el("dt", null, r[0]));
      dl.appendChild(el("dd", null, r[1]));
    });
    body.appendChild(dl);
  }

  if(reqs.length){
    var rb = el("div","blk pre");
    rb.appendChild(el("p","blk-h","先に必要なこと"));
    var ul = el("ul","reqs");
    reqs.forEach(function(r){
      var li = el("li");
      var ok = !!state.done[r.id];
      var st = el("span","req-st" + (ok ? " ok" : ""), ok ? "✓" : "!");
      st.setAttribute("aria-hidden","true");
      li.appendChild(st);
      var txt = el("span");
      var a = el("button","req-link", (TASK_BY_ID[r.id] || {}).title || r.id);
      a.addEventListener("click", function(){ jumpToTask(r.id); });
      txt.appendChild(a);
      var why = el("span","req-why"," — " + r.why);
      if(r.when){
        var conds = [];
        for(var k in r.when){
          var opts = TASKS.options[k] || [];
          r.when[k].forEach(function(v){
            for(var i=0;i<opts.length;i++) if(opts[i].key === v) conds.push(opts[i].label);
          });
        }
        why.textContent += "（" + conds.join("・") + "の場合）";
      }
      txt.appendChild(why);
      li.appendChild(txt);
      ul.appendChild(li);
    });
    rb.appendChild(ul);
    body.appendChild(rb);
  }

  if(task.bring && task.bring.length){
    var bb = el("div","blk");
    bb.appendChild(el("p","blk-h","持ち物・必要書類"));
    var bul = el("ul","checklist");
    task.bring.forEach(function(s){ bul.appendChild(el("li",null,s)); });
    bb.appendChild(bul);
    body.appendChild(bb);
  }

  if(task.items && task.items.length){
    var ib = el("div","blk");
    ib.appendChild(el("p","blk-h", task.itemsLabel || "内容"));
    var iul = el("ul","plain");
    task.items.forEach(function(s){ iul.appendChild(el("li",null,s)); });
    ib.appendChild(iul);
    body.appendChild(ib);
  }

  if(task.byHousing){
    var hb = el("div","blk");
    hb.appendChild(el("p","blk-h","住まいごとの扱い"));
    var hdl = el("dl","byh");
    var selH = state.profile.housing;
    Object.keys(task.byHousing).forEach(function(k){
      if(selH !== "unknown" && selH !== k) return;
      var opts = TASKS.options.housing, lab = k;
      for(var i=0;i<opts.length;i++) if(opts[i].key === k) lab = opts[i].label;
      hdl.appendChild(el("dt", null, lab.replace(/（.*$/,"")));
      hdl.appendChild(el("dd", null, task.byHousing[k]));
    });
    hb.appendChild(hdl);
    body.appendChild(hb);
  }

  if(task.notes && task.notes.length){
    /* ⚠ 付きは実際に損をする落とし穴なので、ただの補足と混ぜずに前に出す。
       印は枠側の ::before で付け直すため、本文からは外す。 */
    var warns = [], rest = [];
    task.notes.forEach(function(s){
      if(isWarn(s)) warns.push(s.replace(/^(⚠️?|❗|‼)\s*/, ""));
      else rest.push(s);
    });
    if(warns.length){
      var wb = el("div","blk warns");
      wb.appendChild(el("p","blk-h", rest.length ? "特に注意" : "注意点"));
      var wul = el("ul");
      warns.forEach(function(s){ wul.appendChild(el("li",null,s)); });
      wb.appendChild(wul);
      body.appendChild(wb);
    }
    if(rest.length){
      var ob = el("div","blk");
      ob.appendChild(el("p","blk-h", warns.length ? "そのほかの注意点" : "注意点"));
      var oul = el("ul","plain");
      rest.forEach(function(s){ oul.appendChild(el("li",null,s)); });
      ob.appendChild(oul);
      body.appendChild(ob);
    }
  }

  [["discrepancy","資料間で記述が違う点"],["clarification","誤読しやすい点"]].forEach(function(p){
    if(!task[p[0]]) return;
    var f = el("div","flag");
    f.appendChild(el("b",null,p[1]));
    f.appendChild(document.createTextNode(task[p[0]]));
    body.appendChild(f);
  });

  if(task.sources && task.sources.length){
    var sb = el("div","srcs");
    sb.appendChild(el("span","srcs-h","出典"));
    task.sources.forEach(function(id){
      var a = ART[id];
      if(!a) return;
      var b = el("button","src", a.title);
      b.addEventListener("click", function(){ openArticle(id); });
      sb.appendChild(b);
    });
    body.appendChild(sb);
  }

  card.appendChild(body);
  wrap.appendChild(card);
  return wrap;
}

function renderPhases(){

    var all = TASKS.tasks.filter(function(t){ return t.phase === ph.key; });

    sec.id = "ph-" + ph.key;

    var hd = el("div","phase-hd");

    hd.appendChild(el("h2", null, ph.label));

    if(vis.length){
      var d = vis.filter(function(t){ return state.done[t.id]; }).length;
      hd.appendChild(el("span","ct", d + " / " + vis.length));

      pbody.appendChild(rail);

/* ---------- articles ---------- */
/* 本文の html は生成時に strong / em / br / a[http] だけに絞ってある */
function fill(node, html){ node.innerHTML = html; return node; }

function renderBlock(b){
  if(b.t === "p")    return fill(el("p","doc-p"), b.html);
  if(b.t === "label")return fill(el("p","doc-label"), b.html);
  if(b.t === "note") return fill(el("p","doc-note " + (b.kind || "warn")), b.html);
  if(b.t === "quote")return fill(el("blockquote","doc-quote"), b.html);
  if(b.t === "dl"){
    var dl = el("dl","doc-dl");
    b.rows.forEach(function(r){
      if(r.k){
        dl.appendChild(el("dt", null, r.k));
        dl.appendChild(fill(el("dd"), r.v));
      }else{
        dl.appendChild(fill(el("dd","full"), r.v));
      }
    });
    return dl;
  }
  if(b.t === "att"){
    var at = el("a","doc-att");
    at.href = b.url; at.target = "_blank"; at.rel = "noopener";
    var ext = /\.([a-z0-9]{2,5})$/i.exec(b.name);
    at.appendChild(el("span","ext", ext ? ext[1].toUpperCase() : "ファイル"));
    at.appendChild(el("b", null, b.name));
    if(b.size) at.appendChild(el("span","size", b.size));
    return at;
  }
  if(b.t === "card"){
    var cd = el("a","doc-card");
    cd.href = b.url; cd.target = "_blank"; cd.rel = "noopener";
    cd.appendChild(el("b", null, b.title));
    if(b.site) cd.appendChild(el("span","site", b.site));
    return cd;
  }
  if(b.t === "img"){
    var figure = el("figure","doc-img");
    var im = el("img");
    im.src = b.src; im.alt = b.alt;
    im.width = b.w; im.height = b.h;
    im.loading = "lazy";
    /* 読み込めなかったときは説明文だけを段落として残す。
       「図」の枠は出さない（出ない画像の抜け殻になるため） */
    im.addEventListener("error", function(){
      var ph = el("p","doc-p", b.caption || b.alt);
      if(figure.parentNode) figure.parentNode.replaceChild(ph, figure);
    });
    figure.appendChild(im);
    if(b.caption) figure.appendChild(el("figcaption", null, b.caption));
    return figure;
  }
  if(b.t === "table"){
    var wrap = el("div","doc-tblwrap");
    var tbl = el("table","doc-tbl");
    var tb = el("tbody");
    b.rows.forEach(function(row){
      var tr = el("tr");
      row.forEach(function(c){ tr.appendChild(el("td", null, c)); });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    wrap.appendChild(tbl);
    return wrap;
  }
  if(b.t === "list"){
    var ul = el(b.ordered ? "ol" : "ul", b.ordered ? "doc-ol" : "doc-ul");
    b.items.forEach(function(it){ ul.appendChild(fill(el("li"), it)); });
    return ul;
  }
  return null;
}

function articleBody(a){
  var body = el("div","art-body");
  if(a.editorNote){
    var en = el("p","editor-note");
    en.appendChild(el("b", null, "このページでの扱い"));
    en.appendChild(document.createTextNode(a.editorNote));
    body.appendChild(en);
  }
  a.sections.forEach(function(s){
    var sec = el("div","sec" + (s.level === 3 ? " lv3" : ""));
    if(s.heading){
      sec.appendChild(el(s.level === 3 ? "h4" : "h3",
                         s.level === 3 ? "sec-h3" : "sec-h2", s.heading));
    }
    s.blocks.forEach(function(b){
      var n = renderBlock(b);
      if(n) sec.appendChild(n);
    });
    body.appendChild(sec);
  });
  return body;
}

function renderCats(){

/* ---------- 質問（検索 → 必要なら AI のまとめ） ---------- */
var TOP_K = 12;          /* AI に渡す資料の件数。上位12件で約2500〜6500字 */
var indexReady = false;
var lastHits = [];
var aiCtl = null;
var chatHistory = [];
function updateSend(){ document.getElementById("ask-go").disabled = !!aiCtl || !document.getElementById("ask-q").value.trim(); }

function ensureIndex(){
  if(indexReady) return;
  SEARCH.build(GUIDE, TASKS, SYN);
  indexReady = true;
}

var KIND_LABEL = { section:"資料", task:"手続き", term:"用語" };

function hitLabel(d){
  if(d.kind === "section") return d.title + (d.heading ? " ＞ " + d.heading : "");
  if(d.kind === "task") return d.title;
  return d.title;
}
function hitGo(d){
  if(d.kind === "section") return function(){ openArticle(d.articleId); };
  if(d.kind === "task") return function(){ jumpToTask(d.taskId); };
  return function(){
    go("glossary");
    var cn = d.title.split(" / ")[0];
    document.getElementById("gl-q").value = cn;
    renderGlossary(cn);
  };
}

/* 命中した内容語だけを控えめに目立たせる */
function markWords(node, text, words){
  var rest = text, guard = 0;
  while(rest && guard++ < 400){
    var at = -1, hit = null;
    words.forEach(function(w){
      if(!w || w.length < 2) return;
      var i = rest.toLowerCase().indexOf(w);
      if(i !== -1 && (at === -1 || i < at)){ at = i; hit = rest.substr(i, w.length); }
    });
    if(at === -1) break;
    if(at) node.appendChild(document.createTextNode(rest.slice(0, at)));
    node.appendChild(el("mark", null, hit));
    rest = rest.slice(at + hit.length);
  }
  if(rest) node.appendChild(document.createTextNode(rest));
}

function excerpt(d, words){
  /* 命中語の周りを切り出す。無ければ頭から。 */
  var body = d.body.replace(/\n/g, " / ");
  var lo = body.toLowerCase(), at = -1;
  words.forEach(function(w){
    if(!w || w.length < 2) return;
    var i = lo.indexOf(w);
    if(i !== -1 && (at === -1 || i < at)) at = i;
  });
  var from = at > 50 ? at - 40 : 0;
  return (from ? "…" : "") + body.substr(from, 150);
}

function runAsk(){
  var q = document.getElementById("ask-q").value.trim();
  var aiBox = document.getElementById("ask-ai");
  if(!q || aiCtl) return;
  document.getElementById("p-ask").classList.add("has-chat");
  document.getElementById("ask-egs").hidden = true;
  aiBox.appendChild(el("div","chat-user",q));
  document.getElementById("ask-q").value = "";
  updateSend();

  ensureIndex();
  var found = SEARCH.search(q, TOP_K);
  if(chatHistory.length){
    var previous = SEARCH.search(chatHistory.filter(function(m){ return m.role === "user"; }).slice(-2).map(function(m){ return m.content; }).join(" ") + " " + q, TOP_K);
    previous.forEach(function(h){ if(found.length < TOP_K && !found.some(function(x){ return x.doc.id === h.doc.id; })) found.push(h); });
  }
  lastHits = found;

  if(!found.length){
    aiBox.appendChild(el("p","empty",
      "「" + q + "」に関係する記載は見つかりませんでした。別の言い方や中国語表記（报到・体检・住宿登记など）でも試してください。"));
    return;
  }

  if(AI_ENDPOINT) askAI(q, found);
  else aiBox.appendChild(el("p","empty","Agent はまだ接続されていません。「資料」の虫眼鏡から検索できます。"));
}

function runDocsSearch(){
  var q = document.getElementById("docs-q").value.trim();
  var hits = document.getElementById("docs-hits");
  clear(hits);
  if(!q) return;
  ensureIndex();
  var found = SEARCH.search(q, TOP_K);
  if(!found.length){
    hits.appendChild(el("p","empty","該当する資料がありません。別のキーワードでも試してください。"));
    return;
  }
  hits.appendChild(el("p","hits-h","検索結果 " + found.length + " 件"));
  var words = SEARCH.words(q);
  found.forEach(function(h){
    var d = h.doc;
    var b = el("button","res");
    b.appendChild(el("span","res-k", KIND_LABEL[d.kind] || d.kind));
    var t = el("p","res-t");
    markWords(t, hitLabel(d), words);
    b.appendChild(t);
    if(d.body){
      var x = el("p","res-x");
      markWords(x, excerpt(d, words), words);
      b.appendChild(x);
    }
    b.addEventListener("click", hitGo(d));
    hits.appendChild(b);
  });
}

/* ---------- AI のまとめ ----------
   資料は本文ごと送らず、検索で選んだ小節の id だけを送る。代理側が
   自分の持つ資料から本文を引き、固定の指示を付けて模型に投げる。
   こうすると画面側から指示や資料を差し替えられない。 */

var ERR_JA = {
  rate_limited: "利用が集中しています。少し待ってからもう一度試してください。",
  unauthorized: "まとめ機能の設定が正しくありません（管理者向け：APIキーを確認）。",
  too_long:     "質問が長すぎます。短く分けて聞いてください。",
  upstream:     "回答の生成に失敗しました。もう一度試すか、「資料」の虫眼鏡から検索してください。",
  offline:      "Agent につながりませんでした。接続を確認するか、「資料」の虫眼鏡から検索してください。"
};

function aiShell(aiBox){
  var box = el("div","ai");
  var hd = el("div","ai-hd");
  hd.appendChild(document.createTextNode("Agent君"));
  var stop = el("button", null, "中止");
  stop.addEventListener("click", function(){ if(aiCtl) aiCtl.abort(); });
  hd.appendChild(stop);
  box.appendChild(hd);
  var body = el("div","ai-body");
  body.appendChild(el("span","ai-thinking","考えています…"));
  box.appendChild(body);
  aiBox.appendChild(box);
  return { box: box, body: body, stop: stop };
}

/* [S3] を、その番号が指す小節への飛び先に置き換える。
   模型は渡した番号しか使えないので引用先を作文できない。
   範囲外の番号は点線の無効な印にして、黙って通さない。 */
function renderAnswer(body, text, hits){
  clear(body);
  var re = /\[S(\d{1,2})\]/g, last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) body.appendChild(document.createTextNode(text.slice(last, m.index)));
    var n = parseInt(m[1], 10);
    var h = hits[n - 1];
    if(h){
      var a = el("a","cite", "S" + n);
      a.href = "#";
      a.title = hitLabel(h.doc);
      a.addEventListener("click", function(jump){
        return function(e){ e.preventDefault(); jump(); };
      }(hitGo(h.doc)));
      body.appendChild(a);
    }else{
      var bad = el("span","cite bad", "S" + n + "？");
      bad.title = "資料に対応しない引用番号です";
      body.appendChild(bad);
    }
    last = m.index + m[0].length;
  }
  if(last < text.length) body.appendChild(document.createTextNode(text.slice(last)));
}

function askAI(q, hits){
  var ui = aiShell(document.getElementById("ask-ai"));
  aiCtl = new AbortController();
  updateSend();
  ui.box.scrollIntoView({behavior:"smooth", block:"nearest"});
  var acc = "";

  fetch(AI_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    signal: aiCtl.signal,
    body: JSON.stringify({
      question: q,
      history: chatHistory.slice(-6),
      profile: state.profile,
      sectionIds: hits.map(function(h){ return h.doc.id; })
    })
  }).then(function(res){
    if(!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(error){ throw { code: error.error || ( res.status === 429 ? "rate_limited"
            : (res.status === 401 || res.status === 403) ? "unauthorized"
            : res.status === 413 ? "too_long" : "upstream") }; });
    }
    if(!res.body) throw { code: "upstream" };
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = "";
    function pump(){
      return reader.read().then(function(r){
        if(r.done) return;
        buf += dec.decode(r.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();
        for(var i = 0; i < lines.length; i++){
          var line = lines[i].trim();
          if(!line || line.indexOf("data:") !== 0) continue;
          var payload = line.slice(5).trim();
          if(!payload || payload === "[DONE]") continue;
          var j = null;
          try{ j = JSON.parse(payload); }catch(e){ continue; }
          if(j.error) throw { code: j.error };
          var piece = j.delta || (j.choices && j.choices[0] &&
            ((j.choices[0].delta && j.choices[0].delta.content) || j.choices[0].text));
          if(piece){
            acc += piece;
            renderAnswer(ui.body, acc, hits);
          }
        }
        return pump();
      });
    }
    return pump();
  }).then(function(){
    if(!acc.trim()){
      clear(ui.body);
      ui.body.appendChild(el("p","ai-err", ERR_JA.upstream));
    }
    if(acc.trim()){
      chatHistory.push({role:"user", content:q}, {role:"assistant", content:acc.replace(/\[S\d+\]/g, "").slice(0, 2400)});
      chatHistory = chatHistory.slice(-6);
    }
    ui.stop.remove();
    aiCtl = null;
    updateSend();
  }).catch(function(e){
    aiCtl = null;
    updateSend();
    if(e && e.name === "AbortError"){
      ui.stop.remove();
      ui.body.appendChild(el("p","ai-err","???????"));
      return;
    }
    ui.stop.remove();
    var code = (e && e.code) || "offline";
    var msg = ERR_JA[code] || ERR_JA.upstream;
    if(acc.trim()){
      ui.body.appendChild(document.createElement("br"));
      ui.body.appendChild(el("span","ai-err","（" + msg + "）"));
    }else{
      clear(ui.body);
      ui.body.appendChild(el("p","ai-err", msg));
    }
  });
}
