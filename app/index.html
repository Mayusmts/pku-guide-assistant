<title>燕園ナビ</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#FAF9F7; --surface:#FFFFFF; --surface-2:#F2F0EC; --surface-3:#EAE7E1;
  --ink:#1C1A19; --ink-2:#5C554F; --ink-3:#8B837B;
  --line:#E4E0D9; --line-2:#D1CBC2;
  --accent:#8E1B18; --accent-ink:#8E1B18; --accent-soft:#F8EBE9;
  --warn:#8A5207; --warn-soft:#FAF1E0; --warn-line:#E6D3AE;
  --done:#1D6B3F; --done-soft:#E7F1E9;
  --font-display:"Zen Old Mincho","Yu Mincho",YuMincho,"Hiragino Mincho ProN",serif;
  --font-body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#191716; --surface:#221F1E; --surface-2:#2A2725; --surface-3:#332F2C;
  --ink:#EFEBE6; --ink-2:#B2AAA2; --ink-3:#8A8178;
  --line:#332F2C; --line-2:#433D38;
  --accent:#E98A84; --accent-ink:#E98A84; --accent-soft:#2F201F;
  --warn:#D9A65A; --warn-soft:#2B2417; --warn-line:#4A3D22;
  --done:#74C28D; --done-soft:#1B2A21;
}}
:root[data-theme="dark"]{
  --ground:#191716; --surface:#221F1E; --surface-2:#2A2725; --surface-3:#332F2C;
  --ink:#EFEBE6; --ink-2:#B2AAA2; --ink-3:#8A8178;
  --line:#332F2C; --line-2:#433D38;
  --accent:#E98A84; --accent-ink:#E98A84; --accent-soft:#2F201F;
  --warn:#D9A65A; --warn-soft:#2B2417; --warn-line:#4A3D22;
  --done:#74C28D; --done-soft:#1B2A21;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.75;
  line-break:strict; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; line-height:1.4}
a{color:var(--accent-ink)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,
[role="checkbox"]:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; text-align:left}

/* ---------- header ---------- */
.hdr{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
.hdr-in{max-width:1120px; margin:0 auto; padding:10px 16px}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
/* 燕園紅を効かせるのは題名と塔の印だけに絞る */
.brand h1{font-size:28px; letter-spacing:.02em; color:var(--accent-ink)}
.mark{width:21px; height:31px; flex:none; color:var(--accent); align-self:center}
.tag-unofficial{
  font-family:var(--font-body); font-size:13px; font-weight:700; letter-spacing:.08em;
  color:var(--accent-ink); background:var(--accent-soft);
  border:1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  padding:2px 7px; border-radius:999px; white-space:nowrap;
}
.tabs{display:flex; gap:2px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font-size:17px; padding:8px 16px; border-radius:999px; white-space:nowrap;
  color:var(--ink-2); font-weight:500;
}
.tab[aria-selected="true"]{background:var(--ink); color:var(--ground); font-weight:700}

/* ---------- shell ---------- */
main{max-width:1120px; margin:0 auto; padding:22px 16px 72px}
.panel[hidden]{display:none!important}
.lede{font-size:13.5px; color:var(--ink-2); max-width:62ch; margin:0 0 20px}
#p-tasks > .lede{max-width:none}
/* 読み物のタブは幅を絞る。手続きと用語集は敷き詰めるので全幅のまま */
#p-docs,#p-ask{max-width:880px; margin:0 auto}

/* ---------- overview ---------- */
.overview{
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); margin-bottom:24px; overflow:hidden;
}
.ov-top{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:13px 16px; border-bottom:1px solid var(--line);
}
.ov-prog{display:flex; align-items:center; gap:11px; flex:1; min-width:210px}
.ov-next{font-size:12.5px; color:var(--ink-2); display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.ov-next .lb{font-size:10.5px; font-weight:700; letter-spacing:.07em; color:var(--ink-3); white-space:nowrap}
.ov-next button{font-weight:700; color:var(--accent-ink); text-decoration:underline; text-align:left}
.ov-next .alldone{color:var(--done); font-weight:700}
/* 段階ごとの進み具合。ここだけは横に並べて全体を一目で見せる */
.ov-phases{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  gap:8px; padding:14px 16px;
}
.ov-ph{
  display:flex; flex-direction:column; gap:5px; text-align:left;
  border:1px solid var(--line); border-radius:7px; padding:9px 10px;
  background:var(--surface-2);
}
.ov-ph:hover{border-color:var(--accent)}
.ov-ph .no{
  font-size:9.5px; font-weight:700; letter-spacing:.09em; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.ov-ph .nm{font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.45}
.ov-ph .ct{font-size:10.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.ov-ph .mini{height:3px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.ov-ph .mini i{display:block; height:100%; background:var(--done); border-radius:2px}
.ov-ph.clear{
  background:var(--done-soft);
  border-color:color-mix(in srgb, var(--done) 35%, transparent);
}
.ov-ph.empty{opacity:.5}

/* ---------- category chips ---------- */
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px}
.chip-f{
  font-size:12.5px; padding:6px 12px; border-radius:999px; white-space:nowrap;
  border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface);
}
.chip-f:hover{border-color:var(--accent)}
.chip-f[aria-pressed="true"]{
  background:var(--ink); color:var(--ground); border-color:var(--ink); font-weight:700;
}
.chip-f .n{font-size:11px; opacity:.6; margin-left:5px; font-variant-numeric:tabular-nums}

/* ---------- profile card ---------- */
.profile{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; margin-bottom:22px;
}
.profile h2{font-size:14px; letter-spacing:.06em; margin-bottom:3px}
.profile .why{font-size:12px; color:var(--ink-3); margin:0 0 14px}
.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:11px; font-weight:700; letter-spacing:.07em; color:var(--ink-2)}
.field select{
  font:inherit; font-size:13px; padding:8px 10px; border-radius:7px;
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink);
}

/* ---------- progress ---------- */
.prog-bar{flex:1; height:5px; background:var(--surface-3); border-radius:999px; overflow:hidden}
.prog-fill{height:100%; background:var(--done); border-radius:999px; transition:width .3s ease}
.prog-num{font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.prog-reset{font-size:11.5px; color:var(--ink-3); text-decoration:underline}

/* ---------- phase ---------- */
/* 手続きは順番が中身なので段を横に割らない。代わりに段ごとを見出し付きの
   ブロックにして、一本の線ではなく積み重ねとして読めるようにする。
   地の色は --ground（ページと同じ）にし、中の手続きカード（--surface）が
   明暗どちらのテーマでも浮いて見えるようにしている。 */
.phase{
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--ground); margin-bottom:14px; overflow:hidden;
}
.phase-hd{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:10px 16px; background:var(--surface-2); border-bottom:1px solid var(--line);
}
.phase-no{
  font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--accent-ink);
  font-variant-numeric:tabular-nums; align-self:center;
}
.phase-hd h2{font-size:15px}
.phase-hd .when{font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.phase-hd .ct{
  margin-left:auto; font-size:10.5px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.phase-body{padding:15px 16px 13px}
.phase-hidden{font-size:11.5px; color:var(--ink-3); margin:8px 0 0}
.phase-hidden button{text-decoration:underline; color:var(--ink-2)}
.rail{position:relative; padding-left:30px}
.rail::before{
  content:""; position:absolute; left:10px; top:6px; bottom:6px;
  width:1px; background:var(--line-2);
}

/* ---------- task ---------- */
.task{position:relative; margin-bottom:9px}
.dot{
  position:absolute; left:-30px; top:11px; width:21px; height:21px; border-radius:50%;
  border:1.5px solid var(--line-2); background:var(--surface);
  display:grid; place-items:center; padding:0; cursor:pointer;
}
.dot::after{content:""; width:8px; height:8px; border-radius:50%; background:transparent}
.dot[aria-checked="true"]{border-color:var(--done); background:var(--done)}
.dot[aria-checked="true"]::after{
  content:""; width:5px; height:9px; border:solid var(--surface);
  border-width:0 1.8px 1.8px 0; transform:rotate(45deg) translate(-1px,-1px); border-radius:0; background:none;
}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.task.done .card{background:var(--surface-2); border-color:var(--line)}
.task.done .t-title{color:var(--ink-3); text-decoration:line-through; text-decoration-thickness:1px}
.t-head{display:block; width:100%; padding:11px 14px}
.t-title{font-size:14.5px; font-weight:500; line-height:1.55; display:block}
.t-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:5px}
.chip{
  font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:2px 7px;
  border-radius:4px; background:var(--surface-3); color:var(--ink-2); white-space:nowrap;
}
.chip.cond{background:var(--accent-soft); color:var(--accent-ink)}
.chip.block{background:var(--warn-soft); color:var(--warn)}

/* ---------- task detail ---------- */
.t-body{
  border-top:1px solid var(--line); padding:15px 14px 14px;
  display:flex; flex-direction:column; gap:16px;
}
.t-sum{font-size:13.5px; color:var(--ink-2); margin:0; max-width:64ch; line-height:1.8}

/* 事実の表：窓口の前で一目で確かめるもの。申請書の記入欄に倣った二列組み */
.facts{
  display:grid; grid-template-columns:5em 1fr; gap:8px 14px; margin:0;
  padding:12px 14px; border-radius:7px;
  background:var(--surface-2); border:1px solid var(--line);
}
.facts dt{font-size:11.5px; font-weight:700; color:var(--ink-3); letter-spacing:.04em; padding-top:2px}
.facts dd{margin:0; font-size:13px; color:var(--ink); line-height:1.75; max-width:58ch}

.blk{margin:0}
.blk-h{
  font-size:11.5px; font-weight:700; letter-spacing:.05em; color:var(--ink-3);
  margin:0 0 8px; font-family:var(--font-body);
}
.blk ul{margin:0; padding:0; list-style:none}
.blk li{font-size:13px; color:var(--ink-2); line-height:1.75}

/* 前提条件は手続きの構造そのものなので、罫で括って他の箇条書きと区別する */
.blk.pre{border-left:2px solid var(--accent); padding-left:13px}
.reqs{display:flex; flex-direction:column; gap:8px}
.reqs li{display:flex; gap:8px; align-items:flex-start; font-size:12.5px}
.req-st{
  flex:none; width:15px; height:15px; border-radius:50%; margin-top:4px;
  display:grid; place-items:center; font-size:9px; font-weight:700; line-height:1;
  background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line);
}
.req-st.ok{background:var(--done-soft); color:var(--done); border-color:transparent}
.req-link{text-decoration:underline; font-weight:500}
.req-why{color:var(--ink-3)}

/* 持ち物は窓口に出すものなので、読み物ではなく点検表の形にする */
.checklist{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:5px 18px}
.checklist li{display:flex; gap:9px; align-items:flex-start}
.checklist li::before{
  content:""; flex:none; width:11px; height:11px; margin-top:6px;
  border:1.5px solid var(--line-2); border-radius:2.5px;
}
.plain{display:flex; flex-direction:column; gap:5px}
.plain li{display:flex; gap:9px; align-items:flex-start}
.plain li::before{
  content:""; flex:none; width:4px; height:4px; margin-top:10px;
  border-radius:50%; background:var(--line-2);
}
.byh{display:grid; grid-template-columns:auto 1fr; gap:6px 13px; margin:0}
.byh dt{font-size:12.5px; font-weight:700; color:var(--ink-2); white-space:nowrap}
.byh dd{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.75}

/* 落とし穴はまとめて前に出す。⚠ は印として付け直すので本文側の記号は外す */
.warns{
  background:var(--warn-soft); border:1px solid var(--warn-line);
  border-radius:7px; padding:12px 14px;
}
.warns .blk-h{color:var(--warn)}
.warns ul{display:flex; flex-direction:column; gap:8px}
.warns li{display:flex; gap:9px; font-size:12.5px; color:var(--ink); line-height:1.7}
.warns li::before{content:"\26a0"; flex:none; color:var(--warn); font-size:11px; margin-top:3px}

.flag{
  padding:11px 13px; border-radius:7px; font-size:12.5px; line-height:1.75;
  background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  color:var(--ink-2);
}
.flag b{display:block; font-size:11px; letter-spacing:.05em; color:var(--accent-ink); margin-bottom:4px}
.srcs{
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  padding-top:13px; border-top:1px dashed var(--line-2);
}
.srcs-h{font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.05em}
.src{
  font-size:11.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--line-2);
  color:var(--ink-2); background:var(--surface-2);
}
.src:hover{border-color:var(--accent); color:var(--accent-ink)}

/* ---------- articles ---------- */
.cat{margin-bottom:26px}
.cat h2{font-size:15px; letter-spacing:.05em; padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:2px}
.art{border-bottom:1px solid var(--line)}
.art-head{display:flex; gap:10px; align-items:baseline; width:100%; padding:11px 2px}
.art-head:hover .art-title{color:var(--accent-ink)}
.art-title{font-size:14px; flex:1; line-height:1.55}
.art-date{font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
.wip{font-size:10px; font-weight:700; color:var(--warn); background:var(--warn-soft); padding:1px 6px; border-radius:4px; white-space:nowrap}
.art-body{padding:8px 2px 24px; max-width:66ch; display:flex; flex-direction:column; gap:19px}
.sec{display:flex; flex-direction:column; gap:9px}
/* ■ 見出し＝記事内の大区切り、▶ 見出し＝その下位。▶ 節は左罫で従属を示す */
.sec-h2{
  font-family:var(--font-body); font-size:14.5px; font-weight:700; color:var(--ink);
  padding-bottom:6px; border-bottom:1px solid var(--line);
}
.sec-h3{font-family:var(--font-body); font-size:13px; font-weight:700; color:var(--ink-2)}
.sec.lv3{padding-left:12px; border-left:2px solid var(--line); gap:7px}

.doc-p{font-size:13.5px; color:var(--ink-2); line-height:1.85; margin:0; overflow-wrap:anywhere}
.doc-p strong,.doc-ul strong,.doc-ol strong,.doc-note strong{color:var(--ink); font-weight:700}
.doc-ul,.doc-ol{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px}
.doc-ul>li,.doc-ol>li{
  font-size:13.5px; color:var(--ink-2); line-height:1.8;
  display:flex; gap:9px; overflow-wrap:anywhere;
}
.doc-ul>li::before{
  content:""; flex:none; width:4px; height:4px; margin-top:11px;
  border-radius:50%; background:var(--line-2);
}
.doc-ol{counter-reset:doc}
.doc-ol>li::before{
  counter-increment:doc; content:counter(doc) ".";
  flex:none; min-width:1.3em; color:var(--ink-3); font-size:12px;
  font-variant-numeric:tabular-nums; margin-top:1px;
}
.doc-note{
  font-size:13px; line-height:1.8; margin:1px 0; padding:9px 12px;
  border-radius:0 6px 6px 0; overflow-wrap:anywhere;
}
.doc-note.warn{background:var(--warn-soft); border-left:2px solid var(--warn); color:var(--ink)}
.doc-note.tip{background:var(--surface-2); border-left:2px solid var(--line-2); color:var(--ink-2)}
/* 画像は外部ホストなので出せない。図があったことと説明文だけ残す */
.doc-quote{
  margin:0; padding:9px 13px; border-left:2px solid var(--line-2);
  font-size:13px; color:var(--ink-2); line-height:1.8;
}
/* 原文が太字で作っている小見出し。下に続く箇条書きの親だと分かる距離に置く */
.doc-label{
  font-family:var(--font-body); font-size:13px; font-weight:700;
  color:var(--ink); margin:0 0 -4px;
}
/* 「時期：内容」が並ぶ箇条書きは二列に組む */
.doc-dl{
  display:grid; grid-template-columns:minmax(auto,11em) 1fr; gap:7px 14px; margin:0;
  padding:11px 13px; border-radius:7px;
  background:var(--surface-2); border:1px solid var(--line);
}
.doc-dl dt{font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.7}
.doc-dl dd{margin:0; font-size:13px; color:var(--ink-2); line-height:1.75; overflow-wrap:anywhere}
.doc-dl dd.full{grid-column:1 / -1}
/* 添付ファイル。中身は収録していないのでリンク先で開く */
.doc-att{
  display:flex; gap:10px; align-items:baseline; text-decoration:none;
  padding:9px 12px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--surface-2); font-size:12.5px; line-height:1.7;
}
.doc-att:hover{border-color:var(--accent)}
.doc-att .ext{
  flex:none; font-size:9.5px; font-weight:700; letter-spacing:.06em;
  color:var(--accent-ink); background:var(--accent-soft);
  border-radius:3px; padding:1px 5px;
}
.doc-att b{flex:1; font-weight:500; color:var(--ink); overflow-wrap:anywhere}
.doc-att .size{flex:none; color:var(--ink-3); white-space:nowrap; font-size:11.5px}
/* 外部リンクカード（原文が埋め込みカードで置いている公式サイトなど） */
.doc-card{
  display:block; padding:9px 12px; text-decoration:none;
  border:1px solid var(--line-2); border-radius:7px; background:var(--surface);
}
.doc-card:hover{border-color:var(--accent)}
.doc-card b{display:block; font-size:13px; font-weight:500; color:var(--accent-ink); line-height:1.6}
.doc-card .site{display:block; font-size:11.5px; color:var(--ink-3); margin-top:1px}
/* 同梱した画像 */
.doc-img{margin:0}
.doc-img img{
  display:block; width:100%; height:auto; max-width:100%;
  border:1px solid var(--line); border-radius:7px; background:var(--surface);
}
.doc-img figcaption{font-size:11.5px; color:var(--ink-3); margin-top:6px; line-height:1.7}
/* 編集側で足した案内。原文ではないことが分かるように点線で囲む */
.editor-note{
  font-size:12.5px; line-height:1.8; color:var(--ink-2); margin:0;
  padding:10px 13px; border-radius:7px;
  background:var(--surface-2); border:1px dashed var(--line-2);
}
.editor-note b{
  display:block; font-size:10.5px; font-weight:700; letter-spacing:.07em;
  color:var(--ink-3); margin-bottom:3px;
}
/* 原文が数式機能で組んでいた表（授業時間割）。横幅が足りなければ表だけ横スクロール */
.doc-tblwrap{overflow-x:auto; margin:0}
.doc-tbl{border-collapse:collapse; font-size:13px}
.doc-tbl td{
  border:1px solid var(--line); padding:6px 13px; color:var(--ink-2);
  white-space:nowrap; font-variant-numeric:tabular-nums;
}

/* ---------- glossary ---------- */
/* 語は短く順番もないので、縦一列にせず敷き詰める */
.gl-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:9px}
.gl-item{
  display:flex; flex-direction:column; gap:1px;
  border:1px solid var(--line); border-radius:8px; padding:10px 12px;
  background:var(--surface);
}
.gl-item .cn{font-size:14px; font-weight:700; color:var(--ink); line-height:1.5}
.gl-item .ja{font-size:12.5px; color:var(--ink-2); line-height:1.6}
.gl-item .nt{font-size:11.5px; color:var(--ink-3); line-height:1.65; margin-top:3px}
.gl-empty{grid-column:1 / -1}

/* ---------- search / ask ---------- */
.searchbar{display:flex; gap:8px; margin-bottom:18px}
.searchbar input{
  flex:1; font:inherit; font-size:14px; padding:10px 13px; border-radius:8px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
}
.docs-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px}
.docs-toolbar h2{margin:0; font-size:22px}
.search-toggle{display:grid; place-items:center; width:44px; height:44px; border:1px solid var(--line-2); border-radius:50%; color:var(--ink); background:var(--surface)}
.search-toggle:hover,.search-toggle[aria-expanded="true"]{color:var(--accent-ink); border-color:var(--accent)}
#docs-search{margin-bottom:24px}
.agent-intro{text-align:center; padding:clamp(36px,9vh,100px) 0 20px}
.agent-intro h2{font-size:clamp(28px,5vw,40px); margin:0 0 12px}
.askbar{display:flex; flex-direction:column; gap:12px; padding:18px; border:1px solid var(--line-2); border-radius:20px; background:var(--surface); margin:0 auto 18px; max-width:760px}
.askbar textarea{
  width:100%; font:inherit; font-size:18px; line-height:1.8; padding:10px;
  border-radius:8px; border:0;
  background:var(--surface); color:var(--ink); resize:vertical; min-height:150px;
}
.askbar button{
  flex:none; align-self:flex-end; font-size:14px; font-weight:700;
  padding:10px 18px; border-radius:8px;
  background:var(--ink); color:var(--ground);
}
.askbar button.send-arrow{display:grid; place-items:center; width:46px; height:46px; padding:0; border-radius:50%}
#ask-ai{display:flex; flex-direction:column; gap:18px; max-width:760px; margin:0 auto 24px}
.chat-user{align-self:flex-end; max-width:80%; width:fit-content; margin:0; padding:12px 18px; color:var(--accent-ink); background:var(--accent-soft); border-radius:18px 18px 4px 18px; white-space:pre-wrap; overflow-wrap:anywhere}
#ask-ai .ai{align-self:flex-start; width:fit-content; max-width:88%; min-width:0; margin:0; background:var(--surface); border-color:var(--line); border-radius:18px 18px 18px 4px; overflow-wrap:anywhere}
#p-ask.has-chat .agent-intro{padding:20px 0}
#p-ask.has-chat .agent-intro h2{font-size:24px}
#p-ask.has-chat .askbar{position:sticky; bottom:12px; box-shadow:0 4px 24px #0000000d}
#p-ask.has-chat .askbar textarea{min-height:80px}
.askbar button:disabled{opacity:.45; cursor:default}
.ask-egs{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; max-width:760px; margin:0 auto 28px}
.ask-eg{
  font-size:11.5px; padding:5px 10px; border-radius:999px;
  border:1px solid var(--line); color:var(--ink-3); background:var(--surface);
}
.ask-eg:hover{border-color:var(--accent); color:var(--accent-ink)}
.hits-h{
  font-size:10.5px; font-weight:700; letter-spacing:.08em; color:var(--ink-3);
  margin:0 0 4px; padding-top:4px;
}
.res{display:block; width:100%; padding:12px 0; border-bottom:1px solid var(--line)}
.res:hover .res-t{color:var(--accent-ink)}
.res-k{font-size:10.5px; font-weight:700; letter-spacing:.07em; color:var(--ink-3)}
.res-t{font-size:14px; font-weight:500; margin:2px 0 3px; line-height:1.5}
.res-x{font-size:12.5px; color:var(--ink-2); line-height:1.7}
.res-x mark,.ai-body mark{
  background:var(--accent-soft); color:var(--accent-ink); font-weight:700;
  padding:0 1px; border-radius:2px;
}
.empty{font-size:13.5px; color:var(--ink-3); padding:28px 0; text-align:center}

/* AI がまとめた答え。資料そのものではないので枠で区別する */
.ai{
  border:1px solid color-mix(in srgb, var(--accent) 24%, transparent);
  border-radius:var(--r); background:var(--accent-soft);
  padding:14px 16px; margin-bottom:24px;
}
.ai-hd{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  font-size:10.5px; font-weight:700; letter-spacing:.07em;
  color:var(--accent-ink); margin-bottom:9px;
}
.ai-hd .warn-lb{color:var(--ink-3); font-weight:500; letter-spacing:0}
.ai-hd button{margin-left:auto; font-size:11.5px; color:var(--ink-2); text-decoration:underline}
.ai-body{font-size:13.5px; line-height:1.9; color:var(--ink); white-space:pre-wrap}
.ai-body .cite{
  display:inline-block; font-size:10.5px; font-weight:700; vertical-align:2px;
  padding:1px 6px; margin:0 2px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line-2); color:var(--ink-2);
  white-space:nowrap; text-decoration:none;
}
.ai-body .cite:hover{border-color:var(--accent); color:var(--accent-ink)}
.ai-body .cite.bad{
  background:none; border-style:dashed; color:var(--warn); cursor:default;
}
.ai-err{font-size:13px; line-height:1.8; color:var(--ink-2)}
.ai-thinking{font-size:13px; color:var(--ink-3)}

.stats{display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}

@media (max-width:520px){
  .rail{padding-left:24px}
  .rail::before{left:8px}
  .dot{left:-24px; width:18px; height:18px}
  .brand h1{font-size:23px}
  .tab{font-size:16px; padding:8px 12px}
  /* 二列組みは幅が足りないので、見出しを値の上に積む */
  .facts{grid-template-columns:1fr; gap:2px; padding:11px 13px}
  .facts dt{padding-top:9px}
  .facts dt:first-of-type{padding-top:0}
  .byh{grid-template-columns:1fr; gap:1px}
  .byh dd{margin-bottom:7px}
  .byh dd:last-child{margin-bottom:0}
  .doc-dl{grid-template-columns:1fr; gap:2px; padding:10px 12px}
  .doc-dl dt{padding-top:9px}
  .doc-dl dt:first-of-type{padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

業者へ代理申請依頼も可）で早めに申請しましょう。一般的に申請〜取得まで\u003cstrong>約2週間\u003c/strong>かかります。"]},{"t":"label","html":"留学用品の購入・荷物の準備"},{"t":"list","ordered":false,"items":["日本でしか購入できないものを中心に物品の購入・準備をしましょう。荷物が多い場合は、中国の友人・知人宅へ事前に送るか、渡航後に住居が決まってから日本の家族に発送してもらう方法がおすすめです。"]},{"t":"label","html":"各種留学準備手続き"},{"t":"list","ordered":false,"items":["必要に応じて、留学保険への加入、住民票の手続き、VPNの契約などを済ませまましょう。"]},{"t":"label","html":"航空券の手配・渡航"},{"t":"list","ordered":false,"items":["新入生は\u003cstrong>入学手続き（报到）の前日まで\u003c/strong>、在学生は\u003cstrong>授業開始日の前日まで\u003c/strong>に現地へ到着するように渡航計画を立てる直前に購入すると価格が非常に高いので、安く購入したい場合には2週間前までに購入するのがおすすめです。","日本側または中国側で渡航日程が指定されている場合には、その内容に従って準備してください。","留学生用航空券を購入すると、預けられる荷物が2つから3つに増える場合があるので、必要に応じて航空券の種類を選びましょう。"]}]},{"heading":"9月（秋学期開始・留学開始）","level":3,"blocks":[{"t":"dl","rows":[{"k":"8月末〜9月頭","v":"入学手続き（报到）、新入生・新規留学生のみ"},{"k":"8〜9月第3週ごろ","v":"履修登録、在学生のみ"},{"k":"9月第2週ごろ","v":"在学生在籍登録（注册）"},{"k":"9月第1週","v":"新入生オリエンテーション（プログラムによって内容は異なる）"},{"k":"授業開始","v":"対外漢語教育学院の中国語プログラムは、1週目はプログラム説明・オリエンテーションなどを実施し、2週目から授業開始"},{"k":"9月中旬〜下旬・中秋節","v":"前後に静園などで中秋節イベントを開催。夜は博雅塔がライトアップされ、前後約1週間は食堂などで月餅が販売される"},{"k":"9月下旬ごろの土日","v":"サークル新歓（名前は「百团大战」。土曜・日曜の昼間に新太陽中心〜百周年記念講堂周辺に100前後の大学公認サークルのブースが出る）"}]}]},{"heading":"10月","level":3,"blocks":[{"t":"dl","rows":[{"k":"10月1〜7日ごろ","v":"国慶節（連休。観光地は混雑。北京大学も観光地なので一部混雑）"},{"v":"\u003cstrong>国際文化祭\u003c/strong>（留学生向けイベント。国・地域ごとにブースを出展。）"},{"k":"10月下旬","v":"中間試験（授業・担当教員により、筆記試験・レポートなど試験方式が異なる）"}]}]},{"heading":"11月","level":3,"blocks":[{"t":"list","ordered":false,"items":["11月15日前後から3月15日前後まで、大学・寮などの温水式暖房・暖气が稼働（中国の北方は暖房あり、南方は暖房なし）"]}]},{"heading":"12月","level":3,"blocks":[{"t":"dl","rows":[{"k":"12月下旬〜1月上旬","v":"学期末試験期間（期末試験前限定で図書館が朝6時〜24時までオープン）"},{"k":"12月下旬〜1月中旬","v":"未名湖の氷の厚さが一定以上になると、スケートリンクとして無料開放（暖冬で氷が薄く、開放されない場合あり）。スケートシューズは第一体育館1階未名湖側窓口で低価格で貸し出し。"},{"k":"12月31日（大晦日）","v":"夜に大学内グラウンドと百周年記念講堂で年越しイベントを開催。未名湖・博雅塔周辺ではライトアップや年越しカウントダウンあり（\u003cstrong>中国は新暦大晦日は平日\u003c/strong>なので、場合によっては授業・テストあり）。"}]}]},{"heading":"1月","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>レポート課題\u003c/strong>（一部授業は12月に課題が公表され、1月上旬〜2月中旬に提出。成績評価は冬休み終了前までに行われる）","\u003cstrong>1月中旬〜：冬休み開始\u003c/strong>","\u003cstrong>冬休み中\u003c/strong>：順次大学の教学楼など閉鎖。特に\u003cstrong>春節前後7日間\u003c/strong>は\u003cstrong>大学機能がほぼ停止\u003c/strong>（食堂・スーパー・売店・教学楼の7〜8割が休業・閉鎖）、中国人学生・教職員の7割以上が帰省、留学生も旅行や一時帰国、\u003cstrong>学内人口・寮内人口が大幅に減少\u003c/strong>","北京市内でも、春節前後7日間は一時休業する店舗が多い（大型ショッピングモールなどは営業）"]}]},{"heading":"2月（春学期開始）","level":3,"blocks":[{"t":"dl","rows":[{"k":"旧暦大晦日","v":"春節前日は、大学内の各院系で小規模の大晦日パーティーを開催（ピザ・お菓子・飲み物などの飲食、ミニゲームなど）"},{"k":"春節","v":"毎年日付が変動するので注意。学位生には各院系の職員が事前に春節当日の3食分食堂無料券が配布される（春節の7日前頃から自分の院系から通知がないか確認）。非学位生は無い場合が多いが、一応所属院系に確認すると良い。"},{"k":"春節から7日間","v":"連休（大学機能ほぼ停止、一部食堂などは営業）"},{"k":"春節〜春節後","v":"大学内で小規模の文化体験イベントを開催。"},{"k":"春学期/2学期目授業開始","v":"2月下旬から（春節から8日目以降）"},{"k":"在籍登録（注册）・履修登録","v":"新学期は毎回必要なので忘れずに（院系で教务办公室で注册。対外漢語教育学院は授業出席で在籍確認される）"},{"k":"元宵節","v":"春節から15日後。ランタン祭り関連のイベントがあり。食堂では汤圆を販売。"}]}]},{"heading":"3月","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>3月中旬〜下旬ごろの土日\u003c/strong>：サークル新歓（名前は「百团大战」。土曜・日曜の昼間に新太陽中心〜百周年記念講堂周辺に100前後の大学公認サークルのブースが出る）"]}]},{"heading":"4月","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>4月上旬〜中旬\u003c/strong>：中間試験・中間レポート"]}]},{"heading":"5月","level":3,"blocks":[{"t":"dl","rows":[{"k":"5月1日〜5月5日","v":"労働節（5連休。観光地混雑。）"},{"k":"5月中","v":"学内イベント（大学内or大学〜円明園のミニマラソン。大学内運動会など）"},{"k":"５月〜7月","v":"複数年留学の学生は居留許可延長手続き。"}]}]},{"heading":"6月","level":3,"blocks":[{"t":"list","ordered":false,"items":["6月上旬〜下旬：期末試験","居留許可延長（翌年度も留学の場合）","卒業関連イベント","6月中旬〜7月上旬：卒業式（卒業式は院系別と大学全体本科・大学院の2回あり）","修了・離校手続き（留学修了者）","6月下旬〜7月上旬：夏休み開始"]}]},{"heading":"7月","level":3,"blocks":[{"t":"list","ordered":false,"items":["7月上旬：大学全体の卒業式","夏休み期間","帰国準備・荷物整理、退寮"]},{"t":"p","html":"※入学式・卒業式は学位生向けのみで非学位生・進修生・Visiting Studentは無し。\u003cbr>※入学式・卒業式には、家族/友人/知人などは式への参加はできないが、百周年纪念讲堂/食堂/教室等の指定の場所でライブ中継の視聴可能。式前後の日は、大学周辺のホテルはほとんど満室になるので、家族等を呼ぶ&amp;ホテルに泊まる場合には1ヶ月以上前には予約する。"},{"t":"quote","html":"\u003cstrong>ポイント\u003c/strong>\u003cbr>入学手続きなどは、中国人学生と留学生でスケジュールが異なるため日程に注意。\u003cbr>冬休み（特に春節）・夏休みは、食堂や教学楼などの大学機能が一部停止する。\u003cbr>中国の大学は多くの学生がキャンパス内・近郊の寮に住んでいるため、大学内の行事・イベントが多い。\u003cbr>中間・期末試験の時期は、なるべく試験・課題に集中。"}]},{"heading":"⏰ 授業時間","level":2,"blocks":[{"t":"table","rows":[["1限","2限"],["08:00-08:50","09:00-09:50"],["3限","4限"],["10:10-11:00","11:10-12:00"],["5限","6限"],["13:00-13:50","14:00-14:50"],["7限","8限"],["15:10-16:00","16:10-17:00"],["9限","10限"],["17:10-18:00","18:40-19:30"],["11限","12限"],["19:40-20:30","20:40-21:30"]]}]},{"heading":"🗓大学公式のカレンダー","level":2,"blocks":[{"t":"list","ordered":false,"items":["大学のスケジュールは、毎学期・毎年更新される大学の公式カレンダーを参考にしてください。","中国人学生と留学生で日程が異なる、あるいは留学生には関係のない日程もあるので注意してください。","北京大学の中でも、本部と医学部では一部日程が異なる場合があります。","大学ごとにカレンダーは異なり、北京大学と他の大学で長期休暇の開始・終了時期が１〜２週間ずれていることもあります。"]},{"t":"note","kind":"tip","html":"⭐️北京大学 2025-2026 学年校历: \u003ca href=\"https://www.pku.edu.cn/detail/3220.html\" target=\"_blank\" rel=\"noopener\">https://www.pku.edu.cn/detail/3220.html\u003c/a> ⭐️北京大学 2026-2027 学年校历: \u003ca href=\"https://www.pku.edu.cn/detail/3377.html\" target=\"_blank\" rel=\"noopener\">https://www.pku.edu.cn/detail/3377.html\u003c/a>"}]}],"wip":false},{"id":"n960d0ae94257","title":"📅 新入生留学スケジュール","directoryTitle":"新入生留学スケジュール","category":"schedule","tags":{"campus":["main"]},"editorNote":"出願から留学修了までの、一度だけ通る流れです。在学中の毎年の予定は「📅 年間スケジュール（燕園校区／本部）」を、手続きの持ち物と前後関係は「手続き」タブを見てください。","published":"2026-07-27","modified":"2026-08-10","chars":2483,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["このページでは、北京大学本部（医学部以外）のスケジュールを載せています。医学部や他の大学については、各大学・機関の情報を参照してください。","一部スケジュールは、毎年１〜２週間ずれることがあるので、必ず大学側の正式な通知・情報を確認してください。"]}]},{"heading":"留学申請","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>予科（foundation/pre-university/本科入学準備コース）\u003c/strong>"]},{"t":"dl","rows":[{"k":"9月入学","v":"11月〜5月出願　→　3〜４月or6〜7月結果通知　→　7〜8月初め入学関連資料取得（入学許可書、ビザ書類等）"},{"k":"2月入学","v":"11月〜12月出願　→　12〜1月結果通知　→　1月入学関連資料取得（入学許可書、ビザ書類等）"},{"v":"※予科は、１月前後、３月前後、６月前後に書類審査の結果通知。"}]},{"t":"list","ordered":false,"items":["\u003cstrong>本科（学部）\u003c/strong>"]},{"t":"dl","rows":[{"k":"9月入学（試験有り）","v":"1月〜2月出願　→　3月オンライン筆記試験（中国語、英語、数学）　→　3-4月面接　→　4-5月結果通知　→　7〜8月初め入学関連資料取得（入学許可書、ビザ書類等）"},{"k":"9月入学（SAT/IB/A-level）","v":"12〜2月出願　→　3月面接　→　4-5月結果通知　→　7〜8月初め入学関連資料取得（入学許可書、ビザ書類等）"},{"k":"9月入学（SAT/IB/A-level）","v":"6〜7月出願　→　7月面接　→　7月結果通知　→　7〜8月初め入学関連資料取得（入学許可書、ビザ書類等）"},{"v":"※試験は2026年入学からCSCA導入（中国政府奨学金申請予定者は事前に受験）。"},{"v":"※試験免除は、代わりに①英米系大学入試・評価結果（SAT1400点以上 or IB-Diplom36点以上 A-Level ABB以上 or ACT 30点以上）と②HSK6級210点以上等の中国語試験結果の提出が必要。"}]},{"t":"list","ordered":false,"items":["\u003cstrong>大学院（修士・博士）\u003c/strong>"]},{"t":"list","ordered":false,"items":["9月入学：10月〜翌1月出願　→　１〜３月書類審査　→　2月下旬〜4月二次試験（主に面接。一部専攻で筆記試験やプレゼン等による審査有り）　→　４〜５月結果通知　→　7〜8月初め入学関連資料取得"]},{"t":"label","html":"進修生"},{"t":"dl","rows":[{"k":"9月入学","v":"3月1日〜4月30日出願 　→　書類審査　→　6-7月結果通知　→ 7-8月上旬入学関連資料取得"},{"k":"2月入学","v":"11月1日〜11月30日出願　→　書類審査　→　12-1月結果通知　→ 1-2月入学関連資料取得"}]},{"t":"label","html":"交換留学（日本の大学からの申請）："},{"t":"list","ordered":false,"items":["大学内審査申請（自身の大学の担当者へ確認）"]}]},{"heading":"留学準備","level":2,"blocks":[]},{"heading":"留学準備・出発前","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>6月下旬〜8月上旬\u003c/strong>"]},{"t":"list","ordered":false,"items":["合格通知（录取通知书）の電子版取得","JW201／JW202／DQ表の取得"]},{"t":"label","html":"7月〜8月"},{"t":"list","ordered":false,"items":["ビザ申請（X1／X2）","荷物準備","航空券手配","日本で海外保険加入（任意・中国側でも800元の保険加入必須）","住民票海外転出届（任意）"]},{"t":"label","html":"7月下旬〜8月上旬"},{"t":"list","ordered":false,"items":["寮予約（中関新園など）または賃貸契約"]},{"t":"list","ordered":false,"items":["\u003cstrong>8月25日頃〜入学手続き日まで\u003c/strong>"]},{"t":"list","ordered":false,"items":["渡航","入寮・入居"]},{"t":"label","html":"8月末〜9月初め"},{"t":"list","ordered":false,"items":["生活準備（日用品購入、SIMカード購入、銀行解説など）","入学手続き（报到）"]}]},{"heading":"入学手続き〜入学初期（最重要期間）","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>8月末〜9月初め\u003c/strong>"]},{"t":"list","ordered":false,"items":["留学生事務室入学手続き/留办报到","院系报到・注册"]},{"t":"list","ordered":false,"items":["⚠️留学生全体の留办の手続きと、院系（対外漢語以外の進修生・学位生）の手続きの２つあり"]},{"t":"p","html":"オリエンテーション・説明会（）"},{"t":"p","html":"院系向け入学式（学位生のみ）"},{"t":"p","html":"大学全体入学式（学位生のみ）"},{"t":"list","ordered":false,"items":["⚠️入学式は院系と大学全体の２回あり！非学位生向けは無いことがほとんど。"]},{"t":"p","html":"授業選択（履修登録・対外漢語は２週目以降）"},{"t":"p","html":"新入生向け活動（定員制・事前応募制の場合多い）"},{"t":"label","html":"9月1日〜25日頃"},{"t":"list","ordered":false,"items":["SIMカード購入","銀行口座開設","各種アプリ設定（決済・生活系）","体检（健康診断）","居留許可申請（X1/X2→居留許可への切替）※手続き中はパスポートが手元に無いので、先にSIMカード購入、銀行口座開設をすると良い。"]},{"t":"list","ordered":false,"items":["\u003cstrong>9月第2週\u003c/strong>"]},{"t":"list","ordered":false,"items":["授業開始"]},{"t":"label","html":"9月下旬"},{"t":"list","ordered":false,"items":["サークル募集（百团大战など）"]}]},{"heading":"留学開始","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>2月下旬\u003c/strong>"]},{"t":"list","ordered":false,"items":["授業開始","在籍登録（注册）"]}]},{"heading":"留学終了前","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>6月上旬〜下旬\u003c/strong>"]},{"t":"list","ordered":false,"items":["期末テスト","夏休み開始"]},{"t":"label","html":"6月下旬〜"},{"t":"list","ordered":false,"items":["夏休み","修了手続き（修了証明書、単位取得証明書等発行）","帰国準備（部屋片付け、荷物の日本への郵送等）"]}]},{"heading":"☝️ポイント","level":2,"blocks":[]},{"heading":"✈️ 渡航前（6〜8月）","level":3,"blocks":[{"t":"list","ordered":false,"items":["入学通知書/录取通知书とビザ書類（JW系）は\u003cstrong>届いたらすぐ確認、ビザはすぐ手続き\u003c/strong>","大学寮は自分で予約必要。予約は\u003cstrong>早い者勝ち（システム申請開始から１０分で予約満員）\u003c/strong>","大学間の交換留学・協定に基づく留学の場合は寮は大学側が確保・予約してくれている可能性があるので、日本側の大学に事前確認。"]}]},{"heading":"📱 生活インフラ","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国でSIMカードと銀行口座開設したら、WeChat / Alipayは即設定必須"]}]},{"heading":"📝 学期末/留学修了","level":3,"blocks":[{"t":"list","ordered":false,"items":["寮の退去期限あり（1月10日頃or7月10日頃。要確認！）"]}]},{"heading":"⚠️ 注意事項","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>必ず大学の公式通知を優先\u003c/strong>","必ず同じプログラムの学生の情報を優先（非学位生、学位生、予科生、本科生、大学院生でスケジュールが全く異なる場合あり）","毎年スケジュールは多少変更あり（春節の時期により１〜２週間前後）","不明点は\u003cbr>　 大学側担当者（留学生オフィス、専攻・プログラム、授業担当教員）\u003cbr>　同じプログラムの学生\u003cbr>に確認！","⚠️\u003cstrong>中国では学生側が自分で確認するのが重要\u003c/strong>！大学側職員などからは、情報が完全に決まってからしか回答・メール返信しない場合も多い。「決まったら連絡する」と返信があってもその後一切連絡がない場合も多いので、時期が近づいたり一定期間過ぎたら自分から再確認しに行く。","留学修了前後も同様に、大学職員間で各種手続きをしてくれるプログラムの場合は問題は少ないが、個人で留学修了証・単位証明などの取得が必要な場合には、大学職員にしつこく連絡・確認する。書類はそのうち送ってくれるだろうと待っていたら、中国側から日本の大学で単位認定に必要な書類が何も届かず、日本の大学を卒業１年延長などのケースも過去に発生しているので十分注意が必要。","中国人学生と留学生では、入学手続きなどが別スケジュールのことが多いため、中国人学生だけでなく留学生・日本人学生にも確認する。"]}]}],"wip":false},{"id":"nad1c4d69e689","title":"1.1 日本での中国留学ビザ申請（渡航前）","directoryTitle":"1.1.1 日本での留学ビザ申請（X1ビザ・X2ビザ）","category":"pre","tags":{},"editorNote":"","published":"2026-07-27","modified":"2026-08-17","chars":3072,"sections":[{"heading":"1.1.1 ビザの基礎知識","level":2,"blocks":[]},{"heading":"中国留学で必要となる「ビザ」と呼ばれるものは、下記の２種類あります：","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>入国ビザ（签证 / VISA）：\u003c/strong>中国に入国する際にビザーフリー（観光目的など）ではなく留学生・就労者などのとして入国するために必要。半年留学の場合はこのビザだけ必要。"]},{"t":"list","ordered":false,"items":["\u003cstrong>居留許可（居留ビザ / Residence Permit）：\u003c/strong>入国した後に長期間中国に滞在する場合には、居留許可/居留ビザが必要になります。１年以上留学する場合にはこのビザも必要。"]},{"t":"list","ordered":false,"items":["\u003cstrong>半年（180日未満）の留学：入国ビザ（X2）のみ\u003c/strong>","\u003cstrong>1年以上（180日以上）の留学：入国ビザ（X1）＋居留許可（Residence Permit）\u003c/strong>"]}]},{"heading":"■ 入国ビザ（X1 / X2）について","level":3,"blocks":[{"t":"label","html":"▶ X1ビザ（長期留学）（日本で手続き）"},{"t":"list","ordered":false,"items":["対象：\u003cstrong>180日以上（2学期・1年以上）の留学\u003c/strong>","特徴："]},{"t":"list","ordered":false,"items":["\u003cstrong>入国後30日以内に居留許可の申請が必要\u003c/strong>（30日以内に申請ができない場合は大学担当者へ相談）","\u003cstrong>居留許可取得後は複数回の出入国が可能。\u003c/strong>","居留許可取得前に出国した場合（うっかりミス、急用で帰国など）："]},{"t":"list","ordered":false,"items":["学校留学生オフィスに連絡して入国ビザ関連書類を再発行","日本で再度X1ビザを申請→ビザ取得後に中国入国"]},{"t":"img","src":"img/visa-x1.webp","alt":"X1ビザの見本。中華人民共和国の入国ビザ（签证 / VISA）のシールで、種類（M. Category）の欄が「X1」になっている箇所が赤枠で囲ってある。入国期限・有効期間・入国回数などの欄が並び、下部に「请于入境之日起30日内申请居留证件（入国の日から30日以内に居留許可を申請すること）」と書かれている。氏名や番号の欄は見本のため伏せてある。","w":1107,"h":784,"href":"https://assets.st-note.com/img/1786296681-DQI620K7bZpgkrCnAqWUSteo.jpg","caption":"X1ビザの見本（氏名などの欄は伏せてある）"},{"t":"label","html":"▶ X2ビザ（短期留学）（日本で手続き）"},{"t":"list","ordered":false,"items":["対象：\u003cstrong>180日未満（1学期）の留学\u003c/strong>","特徴："]},{"t":"list","ordered":false,"items":["入国後180日未満まで中国国内に滞在可能","居留許可の申請は不要","\u003cstrong>中国滞在中は出国不可\u003c/strong>（香港・マカオ・台湾含む）","留学修了前に出国した場合（うっかりミス、急用で帰国など）："]},{"t":"list","ordered":false,"items":["学校留学生オフィスに連絡して入国ビザ関連書類を再発行","日本で再度X2ビザを申請→ビザ取得後に中国入国"]},{"t":"img","src":"img/visa-x2.webp","alt":"X2ビザの見本。中華人民共和国の入国ビザ（签证 / VISA）のシールで、種類（M. Category）の欄が「X2」になっている箇所が赤枠で囲ってある。様式は X1 と同じで、違うのは種類の欄だけ。氏名や番号の欄は見本のため伏せてある。","w":1106,"h":784,"href":"https://assets.st-note.com/img/1786296699-oewsHvLm8utSNrd7bgXFyD0O.jpg","caption":"X2ビザの見本（氏名などの欄は伏せてある）"}]},{"heading":"■ 居留許可（居留ビザ）（中国で手続き・X1→居留許可）","level":3,"blocks":[{"t":"dl","rows":[{"k":"対象","v":"X1ビザ（1年・2学期以上の留学）での入国者\u003cbr>　　　X2ビザ（半年・1学期の留学）の学生は不要"},{"k":"目的","v":"「学习（学習）」としての滞在許可"},{"v":"特徴："}]},{"t":"list","ordered":false,"items":["有効期間内の長期滞在が可能になる","有効期間内であれば何度でも\u003cstrong>出入国可（香港、マカオ、台湾、外国など）\u003c/strong>"]},{"t":"p","html":"※既に他の種類（就労、探親など）の居留許可を持っている場合\u003cbr>→ 入学手続き後に「学習」タイプへ切り替え手続き（X1/X2の再申請不要）\u003cbr>※ビザフリーの状態で中国に入国した場合、中国で直接「居留許可」を申請することはできません。"},{"t":"img","src":"img/visa-residence.webp","alt":"居留許可（中华人民共和国外国人居留许可 / RESIDENCE PERMIT）の見本。ビザのシールとは別の様式で、居留事由（Residence Category）の欄が「学習」になっている箇所が赤枠で囲ってある。性別・生年月日・パスポート番号・有効期限（有效期至）・発行日（签发日期）・発行地（签发地、見本では北京）・備考の欄が並ぶ。氏名や番号の欄は見本のため伏せてある。","w":1258,"h":832,"href":"https://assets.st-note.com/img/1786297656-rcaFhjelgDUXKyt2Z1nPm7Jb.jpg","caption":"居留許可の見本（氏名などの欄は伏せてある）"}]},{"heading":"■ X1/X2/居留許可の関係","level":3,"blocks":[{"t":"img","src":"img/visa-x1-x2-flow.webp","alt":"X1ビザ・X2ビザと居留許可の関係を、渡航前の準備と入国後の手続きに分けて並べた図。180日以内の短期留学は「X2ビザの申請・取得 → 入国 → そのまま最大180日間滞在可能（居留許可は不要）。ただし原則として使い切りのシングルビザ」。180日を超える長期留学は「X1ビザの申請・取得 → 入国 → 30日以内に『学習類居留許可』へ切り替え申請 → 完了すれば期間内は何度でも出入国自由（マルチ t","ordered":false,"items":["原則必要（出入国審査と同様の形式。最新情報は要確認）"]}]},{"heading":"代行申請の場合（ビザ代行業者・留学仲介業者などに依頼）","level":3,"blocks":[{"t":"list","ordered":false,"items":["手続きが面倒、よくわからない、ネット申請が何度しても通らない等という場合には、代理申請を利用することもおすすめ。","留学仲介業者・旅行会社・行政書士・法律事務所等に依頼することで、手続きを一通り行ってくれる。申請方法について詳しいため、資料が足りない、内容間違いがある等の不備が発生せず、スムーズに手続きを完了することができる。","googleで「中国　ビザ　申請　地名（自分の住んでいる地域）」で検索で、代理申請可能な業者が見つかる。","⚠️X1ビザについては、ビザセンターで本人の指紋採取が必要なので、代行申請でもビザセンターに行く必要あり（X2については不要）。"]}]}],"wip":false},{"id":"ne1cd0ad6011b","title":"1.1.2 日本での健康診断/体格検査（渡航前・必要な人のみ）","directoryTitle":"1.1.2 日本での健康診断/体格検査（必要な人のみ・渡航後も可）","category":"pre","tags":{"visa":["X1"]},"editorNote":"","published":"2026-07-29","modified":"2026-08-22","chars":2828,"sections":[{"heading":"◾️体格検査は居留許可を取得するための資料","level":2,"blocks":[{"t":"list","ordered":false,"items":["外国人体格検査は、中国で居留許可を取得する際に必要となる資料の１つです。","日本国内で中国政府奨学金の申請、日本側や中国側の大学・企業担当者から提出を求められた場合、その他各種申請を行う場合にも、必要となる場合があります。","受診から半年以上が過ぎた場合には、居留許可申請に使用できないため、再度受診が必要になります。","それ以外の留学生の方は、中国現地の指定医療機関で受診しても問題ありません（受診費用は日本より安い）。"]},{"t":"p","html":"居留許可取得までの手順概要"}]},{"heading":"🏥健康診断/体格検査（X1のみ）","level":2,"blocks":[{"t":"list","ordered":false,"items":["健康診断/体格検査は、日本で受診可能だが日本で取得した「外国人体格検査検査表」（白い正明）は中国現地で現地医療機関の認証を受けた「境外人員体格検査記録検証証明」（青い証明）への切り替えが必要。","中国現地の指定医療機関で受診した場合は、最初から「境外人員体格検査記録検証証明」（青い証明）が発行される。","中国現地で健康診断/体格検査を受けると、基本的に受診費用が日本より安い（日本では2万円〜4万円程、中国の指定医療機関では8千円-1万円程）。","そのため、特に日本で受診する必要がなければ（中国政府奨学金を申請する際に必要など）、中国現地で受けるのがおすすめ。"]},{"t":"p","html":"「外国人体格検査検査表」（白い正明）イメージ 日本で受診した際の結果証明"},{"t":"p","html":"「境外人員体格検査記録検証証明」（青い証明）イメージ 取得方法は次の２パターン： ①日本国内の病院で受診し「外国人体格検査検査表」（白い正明）を取得 → 中国国内の指定医療機関に提出し青い証明に切り替え・取得。 ②中国国内の指定医療機関で受診 → 受診結果として青い証明が発行・取得。"}]},{"heading":"▶ 日本で受診する場合","level":3,"blocks":[{"t":"list","ordered":false,"items":["日中友好医院等の中国留学ビザ用の健診を行なっている病院や各地域の国立病院または大学付属病院で受診。","検査結果は「外国人体格检查表」（白い証明）に記入。","中国に渡航後、北京の指定医療機関に「外国人体格检查表」（白い証明）にを提出し「境外人員体格検査記録検証証明」（青い証明）へ切り替え。","居留許可・居留ビザの手続き申請の際に他の資料と一緒に「境外人員体格検査記録検証証明」（青い証明）を提出。"]}]},{"heading":"▶ 中国で受診する場合","level":3,"blocks":[{"t":"list","ordered":false,"items":["北京の指定医療機関で受診。","検査結果として「境外人員体格検査記録検証証明」（青い証明）に記入。","居留許可・居留ビザの手続き申請の際に他の資料と一緒に「境外人員体格検査記録検証証明」（青い証明）を提出。"]}]},{"heading":"▶ 外国人体格検査表のフォーマット","level":3,"blocks":[{"t":"list","ordered":false,"items":["日本の各地域の国立病院または大学付属病院で受診する場合、病院によっては「外国人体格検査表」のフォーマット（両面印刷）と貼り付ける「証明写真」（3cm×4cm）の持参が必要な場合があります。必要に応じて、下記フォーマットを利用してください。"]},{"t":"att","name":"外国人体格检查表PDF.pdf","size":"231 KB","url":"https://note.com/api/v2/attachments/download/7daaba36629f4fe636be6587b3de445e"}]},{"heading":"日本国内のビザ用健診・外国人体格検査が可能な医療機関（参考）","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>受診可能な病院例\u003c/strong>"]},{"t":"list","ordered":true,"items":["日中友好病院（東京都渋谷区代々木）","国立病院（全国各地）","大学付属病院（全国各地）","中国・海外渡航者向けサービス充実の病院（病院ウェブサイトで確認）"]},{"t":"p","html":"東京及び東京周辺在住者の方で病院選びに迷ったら、多くの方が利用している\u003cstrong>「日中友好医院」\u003c/strong>で健診を受けるのがおすすめ。"},{"t":"p","html":"\u003cstrong>東京及び東京周辺在住者以外の方\u003c/strong>、「日中友好医院」より自宅に近い病院で受診したい方、受診料がより安い病院を探したい方は、\u003cstrong>各地域の国立病院（一部公立病院も可）、大学付属病院、\u003c/strong>その他規模の大きな病院や中国・海外渡航者向けサービスが充実している病院に\u003cstrong>「中国留学ビザのための健診・外国人体格検査の受診は可能か」を問い合わせ\u003c/strong>てみるのがおすすめ。一定規模以上の病院では受診可能な場合が多く、わざわざ遠くの病院まで行く必要がなくなります。\u003cbr>\u003cstrong>国立病院機構　病院一覧\u003c/strong>　\u003ca href=\"https://nho.hosp.go.jp/about/cnt1-0_000103.html\" target=\"_blank\" rel=\"noopener\">https://nho.hosp.go.jp/about/cnt1-0_000103.html\u003c/a>　\u003cbr>\u003cstrong>大学付属病院　病院一覧\u003c/strong>　\u003ca href=\"https://www.mext.go.jp/a_menu/koutou/iryou/1337441.htm\" target=\"_blank\" rel=\"noopener\">https://www.mext.go.jp/a_menu/koutou/iryou/1337441.htm\u003c/a>"},{"t":"p","html":"日中友好医院以外にも、下記のように病院ウェブサイト上に受診可能であることが明記されている病院もあり、費用もあらかじめ把握できる場合もあります。"},{"t":"p","html":"\u003cstrong>病院サイトに中国留学・外国人体格検査用の健診が可能であると明記されている病院一覧\u003cbr>東京\u003c/strong>　日中友好医院　\u003ca href=\"https://www.jcf-clinic.com/tokousya/\" target=\"_blank\" rel=\"noopener\">https://www.jcf-clinic.com/tokousya/\u003c/a>　中国留学ビザ用の健診で一番有名な機関（東京・東京周辺在住の方で病院選びに迷ったら日中友好医院を選ぶのが無難）\u003cbr>\u003cstrong>東京　\u003c/strong>東京大学医科学研究所附属病院　約30,000円～　\u003ca href=\"https://www.h.ims.u-tokyo.ac.jp/shindan/china\" target=\"_blank\" rel=\"noopener\">https://www.h.ims.u-tokyo.ac.jp/shindan/china\u003c/a>\u003cbr>\u003cstrong>東京　\u003c/strong>協和医院　22,000円　\u003ca href=\"https://kyo-wa.tokyo.jp/health-check/\" target=\"_blank\" rel=\"noopener\">https://kyo-wa.tokyo.jp/health-check/\u003c/a>\u003cbr>\u003cstrong>東京　\u003c/strong>稲城市立病院　24,000円程度　\u003ca href=\"https://www.hospital.inagi.tokyo.jp/health/health-diagnosis/personal/index.html\" target=\"_blank\" rel=\"noopener\">https://www.hospital.inagi.tokyo.jp/health/health-diagnosis/personal/index.html\u003c/a>\u003cbr>\u003cstrong>東京\u003c/strong>　平和記念医院　24,200円　\u003ca href=\"https://heiwa-med.com/travel.html\" target=\"_blank\" rel=\"noopener\">https://heiwa-med.com/travel.html\u003c/a>\u003cbr>\u003cstrong>神奈川　\u003c/strong>国立病院機構　相模原病院　約35,000円　\u003ca href=\"https://sagamihara.hosp.go.jp/jyushin/kenkoshindan_shosai.html\" target=\"_blank\" rel=\"noopener\">https://sagamihara.hosp.go.jp/jyushin/kenkoshindan_shosai.html\u003c/a>\u003cbr>\u003cstrong>愛知　\u003c/strong>国立病院機構　名古屋医療センター　約23,000円　\u003ca href=\"https://nagoya.hosp.go.jp/annai/outpatient_guidance/\" target=\"_blank\" rel=\"noopener\">https://nagoya.hosp.go.jp/annai/outpatient_guidance/\u003c/a>\u003cbr>\u003cstrong>滋賀　\u003c/strong>彦根市立病院　29,480円\u003cstrong>　\u003c/strong>\u003ca href=\"https://www.municipal-hp.hikone.shiga.jp/0000000639.html\" target=\"_blank\" rel=\"noopener\">https://www.municipal-hp.hikone.shiga.jp/0000000639.html\u003c/a>\u003cbr>\u003cstrong>新潟　\u003c/strong>国立病院機構　新潟病院　約28,000～35,000円　\u003ca href=\"https://niigata.hosp.go.jp/dist/pdf/travel_to_china_medical_check.pdf\" target=\"_blank\" rel=\"noopener\">https://niigata.hosp.go.jp/dist/pdf/travel_to_china_medical_check.pdf\u003c/a>\u003cbr>\u003cstrong>島根　\u003c/strong>国立病院機構　松江医療センター約32,000～35,000円　\u003ca href=\"https://matsue.hosp.go.jp/user/travelers-china/index.html\" target=\"_blank\" rel=\"noopener\">https://matsue.hosp.go.jp/user/travelers-china/index.html\u003c/a>\u003cbr>\u003cstrong>静岡\u003c/strong>　静岡県立病院機構　静岡県立総合病院　診察検査料金：20,000円～25,000円　診断書料金：3,300円（内税）　\u003ca href=\"https://www.shizuoka-pho.jp/sogo/about/activity/visa/\" target=\"_blank\" rel=\"noopener\">https://www.shizuoka-pho.jp/sogo/about/activity/visa/\u003c/a>\u003cbr>\u003cstrong>愛知\u003c/strong>　公立西知多総合病院　26,642円　\u003ca href=\"https://www.nishichita-hp.aichi.jp/guidance/checkup/travelers/\" target=\"_blank\" rel=\"noopener\">https://www.nishichita-hp.aichi.jp/guidance/checkup/travelers/\u003c/a>"}]}],"wip":false},{"id":"nf6744365b4aa","title":"1.3 渡航前の確認事項・留学費用・手続きなど","directoryTitle":"1.3 渡航前の確認事項・準備費用・関連手続きなど","category":"pre","tags":{},"editorNote":"","published":"2026-08-03","modified":"2026-08-20","chars":1576,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["渡航前には、「持ち物」と「必要費用」をしっかり確認しておきましょう。","必要に応じて関連の手続きなども行いましょう。"]}]},{"heading":"■ 必須の持ち物","level":2,"blocks":[{"t":"p","html":"最低限、以下は必ず準備しておきましょう。"},{"t":"list","ordered":false,"items":["パスポート","入学許可書（录取通知书 / Admission Notification）","現金またはクレジットカード","パソコン","スマートフォン","常備薬"]}]},{"heading":"■ 必要資金の目安","level":2,"blocks":[{"t":"list","ordered":false,"items":["①必要諸経費、②学費、③寮費・家賃、④生活費の４種類を賄える費用を準備しましょう","日本からの送金を予定している人は、送金手続き方法を事前に確認しましょう。送金手続き方法が不明な場合は、日本の銀行口座に紐づいているクレジットカード・デビッドカードを利用し、日本の銀行口座へ振り込み→中国で使用or中国の銀行/ATMで引き出しという方法も利便性が高いのでおすすめです。","途中で一時帰国を予定している場合（10月の国慶節連休、1-2月の冬休み、5月のメーデー連休、その他連休等）も、1年以上帰国しない場合も、帰国までの資金を目安に準備しましょう。"]}]},{"heading":"▶ ①必要諸経費内訳","level":3,"blocks":[{"t":"label","html":"① 航空券"},{"t":"dl","rows":[{"k":"往復の場合","v":"8万〜16万円"},{"k":"帰国分のみの場合","v":"4〜8万円"}]},{"t":"label","html":"② 現地ビザ関連費用（X1ビザ・1年間/2学期以上の留学のみ）"},{"t":"dl","rows":[{"k":"体格検査費用","v":"8千円〜1万円"},{"k":"居留許可申請","v":"8千円〜2万円"}]},{"t":"label","html":"③ 保険"},{"t":"list","ordered":false,"items":["中国留学生保険（加入必須）：8千円/半年、1.6万円/年\u003cbr>※\u003cstrong>日本等で海外留学保険に加入していても加入しなければなりません\u003c/strong>（中国国内の各国留学生数増加により保険無し学生の医療費問題が多数発生したため、原則全留学生必須加入としている）"]},{"t":"label","html":"④大学外国人寮デポジット/押金"},{"t":"list","ordered":false,"items":["固定or寮費１ヶ月分：2万円〜8万円\u003cbr>※中国政府奨学金、国際中文教師奨学金などの奨学生も必要"]}]},{"heading":"▶ ②学費（プログラム別）","level":3,"blocks":[{"t":"p","html":"プログラムや留学方法によって金額が異なります。\u003cbr>費用が変化することもあるので最新情報を確認してください。"},{"t":"list","ordered":false,"items":["\u003cstrong>普通进修生/普通進修生/Visiting Student\u003c/strong>"]},{"t":"dl","rows":[{"k":"中国語語学留学/汉语课程","v":"18000元人民币/学期　＝　約40万円/学期"},{"k":"学部聴講生/专业课程","v":"24000元人民币/学期　＝　約50万円/学期"}]},{"t":"list","ordered":false,"items":["\u003cstrong>高级进修生/高級進修生/Senior Visiting Student\u003c/strong>"]},{"t":"dl","rows":[{"k":"文科","v":"30000元人民币/学年"},{"k":"理科","v":"34000元人民币/学年"}]},{"t":"list","ordered":false,"items":["\u003cstrong>研究学者/访问研究者/Research Scholar/Visiting Researcher\u003c/strong>"]},{"t":"list","ordered":false,"items":["3320元人民币/月"]},{"t":"list","ordered":false,"items":["\u003cstrong>予科\u003c/strong>：27000元人民币/学期　＝　約60万円/学期","\u003cstrong>本科/学部/Undergraduate\u003c/strong>"]},{"t":"dl","rows":[{"k":"文科","v":"26,000元人民币/学年"},{"k":"理科","v":"30,000元人民币/学年"}]},{"t":"label","html":"大学院"},{"t":"list","ordered":false,"items":["プログラムによって学費が大きく異なるので下記資料（2026年版）を参照","学費表示金額は１年単位ではなく2-5年間のプログラム全体での学費。卒業時期を延長した場合は、別途費用が発生。"]},{"t":"att","name":"北京大学留学生研究生学费标准.pdf","size":"194 KB","url":"https://note.com/api/v2/attachments/download/024e24354facc7e5b1e9606205c5f366"},{"t":"list","ordered":false,"items":["⚠️サイト・システム上で\u003cstrong>日本国内で先払い可能\u003c/strong>。支払い方法がわからない・システムの不具合で支払えない場合は、\u003cstrong>現地で入学手続き当日に現金orクレカで支払い\u003c/strong>（クレカの支払い上限・口座残高を事前に確認）"]}]},{"heading":"▶ 住居費（寮）","level":3,"blocks":[{"t":"list","ordered":false,"items":["約7.5万円 × 6ヶ月\u003cbr>（家賃5ヶ月分＋デポジット1ヶ月分）\u003cbr>→ \u003cstrong>合計：約45万円\u003c/strong>"]}]},{"heading":"▶ 生活費","level":3,"blocks":[{"t":"list","ordered":false,"items":["月4万〜6万円 × 5ヶ月\u003cbr>→ \u003cstrong>合計：約20万〜30万円\u003c/strong>"]}]},{"heading":"■ 総額の目安","level":2,"blocks":[{"t":"note","kind":"tip","html":"👉 \u003cstrong>合計：約120万円以上（約6万元以上）\u003c/strong>"},{"t":"p","html":"＋　旅行、観光、娯楽、衣服・生活用品などで必要な費用"},{"t":"note","kind":"warn","html":"⚠️これらは個人差が大きく、総費用は大きく変動します。"}]},{"heading":"■ まとめ（重要ポイント）","level":2,"blocks":[{"t":"list","ordered":false,"items":["半年留学でも\u003cstrong>100万円以上の準備が必要\u003c/strong>","学費・寮費で大部分を占める","X1の場合は追加費用（居留許可・健康診断）が発生","余裕をもった資金計画が重要"]}]}],"wip":false},{"id":"ned5f6d417396","title":"中国渡航・持ち物チェックリスト","directoryTitle":"1.2 中国への渡航・持ち物","category":"pre","tags":{},"editorNote":"","published":"2026-08-02","modified":"2026-08-19","chars":6750,"sections":[{"heading":"1.2 中国への渡航・持ち物","level":2,"blocks":[{"t":"list","ordered":false,"items":["このページでは、中国留学の際の持ち物についての参考情報を記載しています。","数ヶ月単位〜１年単位の留学の場合、中国渡航後に\u003cstrong>現地で購入して賄えるものが多い\u003c/strong>ので、\u003cstrong>中国では買えないもの、中国だと非常に高価なものを中心に日本から持っていく\u003c/strong>のがおすすめです。","現地購入するもので現地での価格が気になるものがある場合は、\u003cstrong>渡航前に「淘宝」、「京东」などの中国ECサイト上での価格を確認\u003c/strong>すると参考になります。現地購入だと価格が非常に高いもの（主に中国が日本・外国から輸入しているもの）がある場合には、日本で購入して持っていきましょう。"]}]},{"heading":"1. 必須・基本的な持ち物","level":2,"blocks":[]},{"heading":"書類関連（大学・ビザ関連）","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>入学許可書（录取通知书）原本orコピーor電子版\u003c/strong> \u003cstrong>必須　\u003c/strong>（入学手続きで必須。学生証取得前は、入学手続き当日等は大学キャンパス内に入る際にに入学許可書を警備員に見せて入る。）","\u003cstrong>JW202/JW201表/DQ表の電子版orコピー\u003c/strong>　\u003cstrong>ほぼ必須\u003c/strong>（ビザ手続き上で問題が発生した際等に利用。「留学中国」サイトからダウンロード）","\u003cstrong>パスポート\u003c/strong> \u003cstrong>必須　\u003c/strong>（中国国内でも基本的に携帯。北京中心部観光、施設見学、高速鉄道・飛行機等、多くの場所で必須）","\u003cstrong>パスポートコピーorスマホ等の写真 ほぼ必須\u003c/strong>（中国では身分証確認が非常に多いため、パスポート紛失時や居留許可申請中でパスポートが手元にない場合は必須）","\u003cstrong>外国人体格检查表結果（健康診断結果）　日本で受信した場合はほぼ必須\u003c/strong>"]},{"t":"list","ordered":false,"items":["半年以内の留学/X2ビザの場合は不要","\u003cstrong>1年以上の留学/X1ビザの場合で、日本で受診済みの場合は必須\u003c/strong>（北京市指定病院で認証and証明切り替えを行う）","1年以上の留学/X1ビザの場合で、日本で受診していないor半年以上前に受診したor忘れた場合には、\u003cstrong>中国の指定病院（税関の病院）でも受診and検査結果取得可能\u003c/strong>。"]},{"t":"p","html":"\u003cstrong>提出済み書類のコピーor電子版ファイル　ほぼ必須\u003cbr>\u003c/strong>書類の再確認を行われる可能性ありのため、スマホかPCに電子版を入れておく。日本の高校/大学/大学院の在学/卒業/学位証明、語学成績証明等。入学許可書（录取通知书）に「学位証明の提出が必要」と書いてある場合は、基本的に原本またはコピーを持っていく）。"},{"t":"p","html":"\u003cstrong>学費支払済を証明するもののコピーor電子ファイルorサイト画面　ほぼ必須\u003c/strong>\u003cbr>念のためサイト画面や支払い記録が確認できるようにしておく。支払ったが学生側or大学側の問題で支払いが完了していないという場合に、サイト画面やクレカ記録等の支払済の証明が必要"},{"t":"list","ordered":false,"items":["学費未払いの場合は、入学手続き当日に現金・クレカで支払い"]},{"t":"list","ordered":false,"items":["\u003cstrong>寮費支払済を証明するもののコピーor電子ファイルorサイト画面　ほぼ必須\u003cbr>\u003c/strong>ごく稀に、寮職員側がどの学生なのかシステム上からすぐに探し出せない場合有り（同姓同名がここ１〜２年のシステム上の記録にあるなど）。その際は支払済の証明を見せれば、すぐに入寮手続きをしてくれる・","\u003cstrong>家族帯同用関連書類（家族のパスポートコピー、結婚証明書、出生証明書等）家族帯同者は必須\u003c/strong>\u003cbr>大学手続きでは不要だが、中国側でビザ手続き・招聘状の作成を行う際に必要","\u003cstrong>マイナンバーor健康保険証番号などがわかるもの（マイナンバーカードor健康保険証のコピーor写真、番号のメモ）　ほぼ必須\u003cbr>\u003c/strong>外国人が中国で\u003cstrong>銀行口座を開設する際\u003c/strong>に、母国の納税者番号の記入を要求される（国際的租税回避の防止のための「共通報告基準」（CRS）などによる目的）ので、日本人の場合はマイナンバーの番号を提供。マイナンバーの番号がわからない場合は、銀行スタッフに確認し、マイナンバーの代替番号として保険証等の番号を提供。番号が何もない場合は任意の番号で先に口座開設し、後から変更も可能。店舗・担当者によるので、どうしてもマイナンバーの番号の提供が必須だと言われたら、家族に連絡して番号をマイナンバーカードや市町村役所に確認してもらう。"]},{"t":"label","html":"書類関連（その他手続き）"},{"t":"list","ordered":false,"items":["\u003cstrong>運転免許証\u003cbr>\u003c/strong>中国で運転免許を取得する場合、日本で免許取得済みだと書類と筆記試験で中国免許取得可能","\u003cstrong>留学中に手続き・申請予定のプログラム・試験・大学などに必要な資料\u003c/strong>\u003cbr>中国留学中に就活をする、本科・大学院の申請をする、奨学金を申請する、公務員試験・資格試験を留学中や終了後すぐに受験する等の場合は、日本の在籍大学・卒業大学の在学証明証・卒業証明書・推薦状・戸籍謄本・住民票などの書類が必要になる場合は準備しておくと申請がスムーズ。\u003cbr>必要に応じて、日本の家族に中国へ郵送してもらうことも可。"]}]},{"heading":"現金・カード","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>中国人民元現金：最低3000元以上（中国に慣れていない場合はほぼ必須、慣れている場合は300元程度でも可）\u003c/strong>"]},{"t":"list","ordered":false,"items":["クレカ、WeChatpay、Alipayが設定等の問題で中国現地で１日目から使えない事例が毎年有り（例：Wehcat pay/Alipayの設定不備で使えない、Wehcat pay/Alipayを中国現地で設定しようと思ったらできなかった、クレカを中国で使ったら不審使用とクレカシステム側で判断されて即日ストップ（日本の家族に連絡してカード会社に解除申請するまで1日〜数日）、クレカが海外利用出来ない設定、クレカ海外使用上限が10-30万円程で寮費・学費支払いで既にオーバーして次の月まで1ヶ月間クレカ使えない等）。","特に心配な場合は学費・寮費/家賃は日本でwechat/Alipay/クレカ等で支払い、渡航の際にも1ヶ月分寮費＋1ヶ月分生活費＝6000元以上（空港等で両替）を現金で持参。","もしもWechatpay/Alipay/クレカが全てストップした場合は、知人友人、現地の日本人、日本人や留学生のWeChatグループで積極的に頼んで借りる（1ヶ月だけの夏季・冬季休暇中語学留学プログラムなどでも、全てストップして10万円以上借りる例あり）","最悪の場合は、航空券を日本の家族か知人友人に手配してもらい、一時帰国も検討。"]},{"t":"list","ordered":false,"items":["\u003cstrong>日本円現金：最低1万円以上 ほぼ必須\u003c/strong>"]},{"t":"list","ordered":false,"items":["日本帰国時の飲食・交通費等、中国人民元が足りないときに日本円→中国元への両替等"]},{"t":"label","html":"クレジットカード 必須"},{"t":"list","ordered":false,"items":["\u003cstrong>VISA・Master推奨\u003c/strong>、Amex・JCBも可だが使える場所がやや少ない","海外使用制限が無いか（特に未成年の場合）、海外使用上限は無いか（月10万円/30万円まで等）を中国渡航前に日本で事前に確認。9月に学費＋寮費を支払う際に上限オーバー、上限以内だがすぐに使用上限を超えて9月の生活費が無くなる等の例あり。","一定金額以上利用で、SMS/ショートメッセージ/短信に番号が送られて番号認証をするクレカは、中国だとSMSを受信できないので設定要確認（電話契約が海外対応している場合のみ海外・中国でSMS受信可能だが料金がやや高い）。"]},{"t":"label","html":"日本のキャッシュカード　デビッドカード機能付きならほぼ必須"},{"t":"list","ordered":false,"items":["VISA・Master・Unionpay/银联卡等のデビッドカードやクレジットカード機能付きなら中国での支払いや銀行/ATMで出金可（ない場合は海外で使えない）"]},{"t":"label","html":"中国の銀行のキャッシュカード　必須（作った場合）"},{"t":"list","ordered":false,"items":["中国の銀行口座が無い場合は、留学開始後に中国銀行・工商銀行等で口座開設可","日本の中国銀行・工商銀行・農業銀行等で口座開設をして預金し、中国の銀行・ATMで下ろす（UnionPay/银联卡機能）ことも可能だが、振込手続きが複雑で不便（日本の支店から振り込み→日本の提携先銀行の中国支店へ振り込み→中国の銀行口座へ振り込みのような仕組み）。"]}]},{"heading":"通信・IT機器","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>パソコン（WinとMac どちらも可） 必須\u003c/strong>"]},{"t":"list","ordered":false,"items":["中国でOSやシステムのアップデートをすると、中国化される場合があるので注意（特にMSは日本語・英語表記だった部分が中国語表記になる等の事例多数。表記が変わる以外は基本的に大きな問題無いが、）","オフィスソフトは、北京大学の学籍があると北京大学のソフトウェア提供サイトから学生用版が無料ダウンロード可（WinとMac両方あり）"]},{"t":"label","html":"パソコン充電器や周辺機器 ほぼ必須・現地購入も可能"},{"t":"list","ordered":false,"items":["中国現地で周辺機器を購入することも可能（廉価版などもあり）"]},{"t":"label","html":"スマートフォン 必須"},{"t":"list","ordered":false,"items":["SIMフリーor eSIM対応スマホ推奨。","Androidは中国では一部アプリ（Google playが開けないなど）等の使用制限あり。","日本のスマホに日本のSIMと中国のSIMの２つを入れて、必要に応じて切り替えという使用方法も可能。","中国現地でもスマホを買って、日本用と中国用の２台持ちの留学生も比較的多い。"]},{"t":"label","html":"中国で使用できるSIMカード　必須（現地購入）"},{"t":"list","ordered":false,"items":["入学シーズンは大学寮の外や大学キャンパス内等でも仮説テントを立ててSIMカードを販売している。","心配な場合は中国渡航前に、日本でAmazon等で販売している中国旅行用SIMカードを一時的に利用するのも可。日本で購入する場合は数日間〜１ヶ月間用を購入。SIM本体or eSIMのどちらでも可。外国販売のSIMは電話番号の使い回しが多いため、前の利用者が中国の各種サイトに登録している場合があるケースが多いため（新規登録でエラーが出やすい等の問題あり）、基本的には中国現地でSIMを購入するのがおすすめ。"]},{"t":"label","html":"スマホ充電バッテリー/モバイルバッテリー 必要に応じて"},{"t":"list","ordered":false,"items":["⚠️\u003cstrong>CCCマーク\u003c/strong>がない場合は、\u003cstrong>中国国内線持ち込み不可・没収（返却されない）\u003c/strong>。国際線は持ち込み可。CCCマーク有りは基本的に中国国内でしか販売していないため、\u003cstrong>中国国内でバッテリーを購入するのがおすすめ\u003c/strong>。"]},{"t":"label","html":"USBメモリ 必要に応じて"},{"t":"list","ordered":false,"items":["中国現地での購入も可能。"]},{"t":"label","html":"PC/スマホ周辺機器 必要に応じて"},{"t":"list","ordered":false,"items":["中国で廉価版購入も可能。"]},{"t":"label","html":"VPN設定・契約　必要に応じて"},{"t":"list","ordered":false,"items":["中国ではLINE、Google、Gmail、Instagram、YouTube、X(旧Twitter)等はそのままだと接続できない・使えないので、VPNが必要。国家級重要行事などがある時期は、１日〜１週間ほどVPN（特に無料VPN）はほとんど繋がらなくなる場合があるので、必要に応じて定評のある有料VPN（月1000円前後〜・10ドル前後〜）のものを契約するとよい。","中国に渡航してから設定・契約をしようとしても、中国のネット環境ではVPNのダウンロードやVPNを提供している企業のウェブサイトへのアクセス自体できない場合もあり。また、「中国で接続できる」と説明があっても、実際には接続できないもの（以前は接続できた）、接続が安定せず動画視聴がほぼできないもの、北京上海広東などの地域により接続が安定しないものなどもある。そのため、VPNを少しでも使う可能性がある場合は、日本で無料のVPNを複数インストール・設定したり、３〜７日無料トライアル版を渡航１〜２日前に複数インストール・設定しておくと安心。"]}]},{"heading":"健康・医薬品","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>常備薬 必須\u003c/strong>"]},{"t":"list","ordered":false,"items":["中国でも主要な薬はネットや薬局で購入可能だが、飲み慣れた日本の薬も準備。実際に必要になったが自分で持っていない場合には、日本人の友人知人に分けてもらえないか相談するのも良い。"]},{"t":"label","html":"海外留学保険証書原本or保険番号・情報のメモ"},{"t":"list","ordered":false,"items":["日本で保険に加入した場合は必要。","中国では外国での保険加入・未加入に関係なく、現地保険購入必須となっている。"]},{"t":"label","html":"メガネ・コンタクト・洗浄液 　メガネ・コンタクトの人は必須"},{"t":"list","ordered":false,"items":["中国でメガネ・コンタクトを購入する場合、度数が日本とは異なる表記なので注意。必要に応じてコンタクトを日本帰国までに必要な分だけ持っていく（大量に持参すると税関で確認される場合がごく稀にあるため、関連の証明を持っていき、税関で引っかかった場合には長期留学することとコンタクトが必要であることを説明）。"]}]},{"heading":"その他","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>コンセントプラグ変換器・電圧変換器　は基本的に必要なし\u003c/strong>"]},{"t":"list","ordered":false,"items":["日本の電圧は100V（50/60Hz）、中国の電圧は220V（50Hz）。","パソコン・スマホ等のほとんどの製品は変圧不要。","ドライヤー・コテ等の高い熱が発生する製品は必要な場合が多い。日本から持っていく場合は電圧が対応しているか確認。対応しているものの準備ができない場合は、中国現地で新しく購入するのがおすすめ"]},{"t":"p","html":"\u003cstrong>デジタルカメラ\u003c/strong>　ある場合は持っていくと良い（現地での故障・盗難・置き忘れ等には十分注意）"}]},{"heading":"2. 必要に応じて持参するもの（日本から持って行っても良いが中国現地でも購入可能）","level":2,"blocks":[]},{"heading":"食品・調味料","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>日本の食べ物・お菓子・お土産\u003c/strong>\u003cbr>インスタントラーメン、カップ麺、カレー、缶詰、パスタソースなどなんでも。中国で日本から輸入した商品を購入すると日本の２倍以上の価格のものが多い。日本のお菓子は現地で中国人学生や他の国の留学生に配ると喜ばれる場合が多い","\u003cstrong>日本の調味料\u003c/strong>\u003cbr>醤油、味噌、お酢、油、塩、鰹節、とろろ昆布、たこ焼き・お好み焼きソース、青のり、ポン酢、めんつゆ、ふりかけなど。特に自炊・料理をする場合。現地購入も可能だが値段が日本の２倍以上などで高い。中国の醤油や酢などの調味料は日本のものとやや味が異なることもある"]}]},{"heading":"衣類・化粧品","level":3,"blocks":[{"t":"p","html":"衣類・化粧品は基本的に中国現地でも安い製品の購入が可能。\u003cbr>有名ブランドの場合は、中国でも外国輸入になるため製品によっては日本より高い。"},{"t":"list","ordered":false,"items":["服・下着・靴下（個人の需要により、１〜２週間分。寮には洗濯機・乾燥機あり。多くの賃貸も洗濯機あり。）","化粧品、スキンケア・ヘアケア用品、日焼け止め（個人の需要による）","生理用品（個人の需要による）","フォーマルな服（スーツ、ワイシャツ、ブラウス、革靴など。）","防寒具（コート、ダウン等。）"]}]},{"heading":"学習・生活用品","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国語学習参考書（初心者は日本から持参推奨）","中国語辞書・電子辞書・辞書アプリ（オフライン利用可能なもの）","洗濯用品（洗剤、柔軟剤、洗濯ネットなど。特に洗剤などにこだわりがあれば、日本から持っていく）","お風呂用品（シャンプー、リンス、石鹸）","歯ブラシ、歯磨き粉","タオル、バスタオル","バッテリー、デジタルカメラ","カミソリ、髭剃り","ドライヤー（220V対応か確認）","爪切り、耳かき、綿棒","マスク（N95、空気汚染・黄砂時期用）","トランプ、UNO"]}]},{"heading":"3. 中国で購入可能なもの（現地で調達可）","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>水\u003c/strong>（1-2リットル、4-6リットル、ウォーターサーバ用等。※北京の水道水は硬水のため、電気ポット/ケトル等で沸かすと水垢が付きやすいため飲用水を沸かす方がおすすめ。うがい歯磨き等は水道水で可能だが、硬水/水道水に慣れないため飲用水を使う人もいます。）","\u003cstrong>空気清浄機\u003c/strong>（寮/部屋用。秋・冬の空気汚染/PM2.5が多い日あり。気にならない場合は不要。）","\u003cstrong>水筒\u003c/strong>（中国でも日本製の象印・タイガーなどはよく使われている。北京では水道水をそのまま飲む人は少なく、浄水器・飲用用の水・お湯が提供されている場所で水を汲んで飲むのが一般的。）","\u003cstrong>食器\u003c/strong>（コップ、茶碗、皿、箸、フォーク、スプーンなど）","\u003cstrong>調理器具\u003c/strong>（自炊・料理する人は必要。フライパン、鍋、お玉、ボウル、撹拌機）","\u003cstrong>使い捨て食器\u003c/strong>（友人知人と部屋で食事したりする場合。紙コップ、紙皿、割り箸、スプーン、フォーク）","\u003cstrong>冷蔵庫\u003c/strong>（寮の部屋には冷蔵庫は無いので自費購入。）","\u003cstrong>掃除用具\u003c/strong>（ほうき、ちりとり、ゴミ袋等）","\u003cstrong>掃除機\u003c/strong>（絨毯使用時、必要な人のみ）","\u003cstrong>家具\u003c/strong>（机、椅子、ソファ、棚・本棚、絨毯、ランプなど。個人の需要による）","\u003cstrong>パソコンディスプレイ\u003c/strong>（マルチ画面使用者）","\u003cstrong>洗濯物干し\u003c/strong>（寮に乾燥機があっても必要な場合あり）","\u003cstrong>文房具\u003c/strong>（ハサミ、カッター等）","\u003cstrong>自転車\u003c/strong>（新品100〜500元）、","\u003cstrong>電動バイク\u003c/strong>（新品2500〜8000元。中古1000〜5000元）"]}]},{"heading":"4. 渡航前の確認事項","level":2,"blocks":[]},{"heading":"書類・現金","level":3,"blocks":[{"t":"list","ordered":false,"items":["パスポート、入学許可書（录取通知书）、現金・クレジットカード、パソコン、スマホ、常備薬"]}]},{"heading":"住居・保険","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国の寮・賃貸・ホテルの予約","留学保険の加入（任意・必須ではないが加入推奨）"]}]},{"heading":"行政手続き","level":3,"blocks":[{"t":"list","ordered":false,"items":["役所での住民票海外転出届（任意・住民税の支払いが不要になる）","税金・年金・国民健康保険料の免除・猶予措置など手続き","⚠️一定の収入がある方は、住民票を海外にすると所得税などの税金手続きが別途発生するので注意（特に大きな収入がなければ影響なし。オンラインでできる給与が発生する仕事・アルバイト・インターンは、会社によっては税金手続きの関係でできない可能性大）","外務省たびレジ登録"]}]},{"heading":"通信・電子決済","level":3,"blocks":[{"t":"list","ordered":false,"items":["WeChat/微信・Alipay/支付宝の設定","VPN契約・設定（Gmail、LINE等使用予定の場合）"]}]},{"heading":"📖留学ガイドトップページ","level":3,"blocks":[]}],"wip":false},{"id":"n23faa8ef9b03","title":"1.4.2 賃貸物件","directoryTitle":"1.4.2 住居：賃貸（渡航前又は渡航後に契約）","category":"housing","tags":{"housing":["rent"]},"editorNote":"","published":"2026-07-30","modified":"2026-09-02","chars":8242,"sections":[{"heading":"賃貸物件について","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>大学の寮に住まない場合\u003c/strong>（予約できなかった、安い場所を探したい、より設備などが良い場所を探したい、立地要求があるなど）には、一般の賃貸に住むことも可能です。","予算が許す場合には賃貸ではなくホテルに長期滞在することも可能です（例、1泊5000円x30日=月15万円→中高価格帯賃貸と変わらない価格）","\u003cstrong>大学による支援はない\u003c/strong>ため、自力で探し、契約することになります。","家族親戚、友人知人が既に住んでいるところに同居する場合には、既に住んでいる方に相談してください。","寮・ホテル以外に居住する場合は、\u003cstrong>24時間以内の公安への「住宿登記」を必ず忘れない\u003c/strong>ようにしてください。"]}]},{"heading":"■ 賃貸物件概要：探す〜入居の流れ","level":2,"blocks":[{"t":"p","html":"賃貸物件を探してから入居するまでの流れ概要"}]},{"heading":"■ 賃貸物件の探し方","level":2,"blocks":[{"t":"p","html":"個人の予算・条件・希望などに合わせて探してください。中国では日本のアパートのような賃貸用物件は非常に少なく、マンション・分譲住宅の所有者（＝大家さん）が物件を貸し出す方式が多く、マンションの一角を借りることになります。"},{"t":"p","html":"賃貸物件の探し方の例"},{"t":"list","ordered":false,"items":["\u003cstrong>①日本人向け仲介業者・業者サイトを利用：\u003cbr>検索エンジンで「北京　賃貸」「北京　アパート」などで検索\u003c/strong>して出てきたサイト情報をもとに探すことが可能です。主に駐在員を対象としているため価格は高めですが、\u003cstrong>日本語だけで一通りの手続きが可能\u003c/strong>、現地での入居・手続きを現地スタッフが手伝ってくれる場合も多く、\u003cstrong>安心\u003c/strong>です。\u003cstrong>予算に余裕のある方\u003c/strong>におすすめです。北京市朝陽区などの物件あ多いが、大学近郊はやや少ない可能性があります。","\u003cstrong>②中国の賃貸・不動産サイトを利用：\u003c/strong>\u003cbr>本ページ後を参照。サイトにより物件の特徴が異なるが、低価格帯から高価格帯まで、大学横から北京中心部まで\u003cstrong>様々な物件を選択可能\u003c/strong>です。外国語対応は基本無しのため、\u003cstrong>中国語で手続きが可能な方\u003c/strong>（友人知人が通訳支援してくれる場合も）のみ利用可能です。また、サイトや物件により契約条件や契約内容が異なったり、掲載情報と実物の物件が異なる場合もあるので\u003cstrong>一定の注意が必要\u003c/strong>です（中国に慣れている方に相談した方が良い）。","\u003cstrong>③友人知人・学生・WeChatグループ・小红书での紹介：\u003c/strong>\u003cbr>日本人留学生、他国の留学生、中国人学生などに\u003cstrong>直接紹介\u003c/strong>してもらうことも可能です。北京大学の\u003cstrong>BBS/掲示板、大学生賃貸情報WeChatグループ\u003c/strong>（賃貸物件業者や大学学生が作成、既にグループに入っている人に入れてもらう）等にも学生向けの中低価格帯・大学近郊・ルームメイトが大学生・大家が大学教職員の賃貸情報が多く提供されています。小红书/Redでも北京の賃貸物件情報が掲載されている場合があります。業者を通さないため手数料無しや穴場物件の情報も一部見られます。居住可能期間が半年だけだったり、部屋の掃除がされていなかったり、契約条件・契約内容などは個別対応となるため、\u003cstrong>物件紹介者や大家さんへ各種契約情報を確認\u003c/strong>してください。"]}]},{"heading":"■ 中国の賃貸・不動産サイト","level":2,"blocks":[{"t":"p","html":"\u003cstrong>おすすめ（中国に慣れていない人でも安心）\u003c/strong>：写真と実物が基本的に同じ、対応・契約方法もマニュアル化されていることが多い。自如は毎週1-2回のトイレ・シャワー等の共有スペース掃除サービス有りの物件もあります（服务费等で最初から契約されている）："},{"t":"dl","rows":[{"k":"自如（ziroom）","v":"\u003ca href=\"https://www.ziroom.com/\" target=\"_blank\" rel=\"noopener\">https://www.ziroom.com/\u003c/a>"},{"k":"链家（lianjia）","v":"\u003ca href=\"https://bj.lianjia.com/\" target=\"_blank\" rel=\"noopener\">https://bj.lianjia.com/\u003c/a>"}]},{"t":"p","html":"\u003cstrong>その他（中国に慣れている人向け）：\u003c/strong>写真と実物が異なる、対応・契約方法がケースバイケース等："},{"t":"dl","rows":[{"k":"贝壳","v":"\u003ca href=\"https://bj.ke.com/\" target=\"_blank\" rel=\"noopener\">https://bj.ke.com/\u003c/a>"},{"k":"我爱我家","v":"\u003ca href=\"https://bj.5i5j.com/\" target=\"_blank\" rel=\"noopener\">https://bj.5i5j.com/\u003c/a>"},{"k":"58同城","v":"\u003ca href=\"https://bj.58.com/\" target=\"_blank\" rel=\"noopener\">https://bj.58.com/\u003c/a>"},{"k":"房天下","v":"\u003ca href=\"https://www.fang.com/\" target=\"_blank\" rel=\"noopener\">https://www.fang.com/\u003c/a>"},{"k":"安居客","v":"\u003ca href=\"https://beijing.anjuke.com/\" target=\"_blank\" rel=\"noopener\">https://beijing.anjuke.com/\u003c/a>"}]},{"t":"p","html":"※ サイト上の写真と実物物件が全く関係のない場合が多いため（住所や駅からの距離等も若干異なる場合あり）、契約前に必ず現地or写真・テレビ電話で物件を確認する。\u003cbr>※共有スペース（トイレ・シャワー・キッチン等）は、特にサービスがついていない場合は、住人が自分たちで掃除・ゴミ出しをすることになるので、ルームメイトと相談して分担などしてください。京东家政などに月数百元で外注することもできます。"},{"t":"p","html":"Ziroomの不動産情報例 家賃：3930/月（3ヶ月分まとめ払い） 基本情報：15.1平米(＝約8.3畳)、窓南向き、個室3つ+共有スペース1つ、20階建の11階 付属設備：WiFiルーター、スマートロック、キッチン換気扇、電子レンジ、温水器、洗濯機、椅子、ベッド 契約情報：即入居可能、2027年4月20日まで契約必須 ルームメイト/室友情報： 1室・入居22ヶ月目・男性・天秤座・研究開発 2室・入居137ヶ月目、男性、蠍座、運営/編集 住宅区画情報：稻香园、1994年築、集中暖房システム/セントラルヒーティング"}]},{"heading":"■ 北京大学周辺で学生・留学生が多いエリア","level":2,"blocks":[]},{"heading":"▶ 学校周辺","level":3,"blocks":[{"t":"list","ordered":false,"items":["中关园、燕东园、蔚秀园、暢春园、海淀路社区（北京大学教職員住宅・大家さんは大学教職員等が多い）","蓝旗营（北京大学と清華大学の教職員住宅・大家さんは大学教職員等が多い）","科源社区、科育社区、科育小区、科XX区など（「科XX区」は中国科学院教職員住宅、北京大学の東側〜五道口一帯は中国科学院の研究所が多い）"]}]},{"heading":"▶ 学生街","level":3,"blocks":[{"t":"list","ordered":false,"items":["五道口（人気・繁華街なので便利・家賃少し高め、北京大学・清華大学・北京語言大学等の間の位置）","六道口、学院路（北京語言大学、中国農業大学、北京林業大学などの大学が多い地域）"]}]},{"heading":"▶ その他","level":3,"blocks":[{"t":"list","ordered":false,"items":["知春路、苏州街、双榆树、暢香园など（ビジネス街も隣接するため、学生以外の賃貸契約者も多い）"]},{"t":"p","html":"自転車・徒歩の移動時間は大学内移動を含めておおよその時間を計算 徒歩：大学内移動10分含む 自転車：大学内移動3分含む 例：徒歩30分圏＝大学の門まで20分+大学内移動10分"}]},{"heading":"■ 費用の目安","level":2,"blocks":[]},{"heading":"賃貸物件の家賃","level":3,"blocks":[{"t":"dl","rows":[{"k":"北京大学の外国人留学生寮","v":"2400元/3600元/4500元"},{"k":"北京大学周辺の標準的な賃貸物件","v":"\u003cstrong>3500元〜（約7万円〜）\u003c/strong>"},{"k":"１部屋に２人で住む（二段ベッドなど）","v":"1500〜4000元"},{"k":"北京郊外・五環線より外側","v":"1500元〜"},{"k":"北京大学に近いリーズナブルなビジネスホテル","v":"200元/泊・6000元/月〜\u003cbr>（資金に余裕があれば、繁華街や日本人が多い地域（龍馬橋/亮马桥）に住むことも可。）"}]}]},{"heading":"初期費用","level":3,"blocks":[{"t":"p","html":"多くの場合、「家賃 + 敷金（押金） + 仲介手数料」が賃貸契約の際に支払いが必要になる。"},{"t":"dl","rows":[{"k":"家賃","v":"家賃１ヶ月分〜１年分（指定された月数分の家賃。契約する際に決定）\u003cbr>　※一般に、まとめて支払う方が割引されるため、例えば１ヶ月分ずつを６ヶ月間払うより６ヶ月分を一括でまとめ払いした方が安い。"},{"k":"敷金（押金・デポジット）","v":"０元〜家賃１ヶ月分\u003cbr>　※退去・解約時に全額返還される。しかし、部屋の物品・設備破損で修理・交換が必要な場合、家賃・光熱費が未払いの場合、契約違反等の違約金を支払っていない場合、\u003cstrong>最初に賃貸契約した年月分住まずに途中で退去・解約する場合\u003c/strong>に、実費〜全額が敷金（押金）から引かれる場合あり。本人へ修理・費用請求をした後に勝手に・気を利かせて敷金（押金）から引く例もあり。"},{"k":"仲介手数料","v":"家賃1ヶ月分の10%程〜1ヶ月分\u003cbr>　※不動産業者・サイト利用の場合に発生。仲介手数料がない場合もある（実際には大家さん等から別の方式で紹介料が支払われている）"}]}]},{"heading":"光熱費（電気・水道・ガス・ネット）","level":3,"blocks":[{"t":"list","ordered":false,"items":["月：合計100〜500元\u003cbr>（ルームシェアなら割り勘）","中国の場合は基本的に先払い・チャージ式","支払った分を使い切ると、電気、水道、ガス、ネットなどが突然止まる。支払いが完了すると即〜３時間ほどで復活する。"]}]},{"heading":"■ 家賃・光熱費支払い方法","level":2,"blocks":[{"t":"label","html":"家賃"},{"t":"list","ordered":false,"items":["不動産サイトを利用した場合は、その不動産業者が提供しているアプリやWeChat公众号から支払い。","大谷さんから銀行振込やWeChat/Alipayで支払うようになど支払い方法を指定される場合もあり。"]},{"t":"label","html":"光熱費"},{"t":"list","ordered":false,"items":["物件によって支払い方法が異なるので、入居時に大家・不動産業者へ確認","基本的には、自分で公共料金会社に直接支払う場合と、大家・管理会社・仲介会社にまとめて支払う場合の２パターン（最初から家賃に含まれていて実質使い放題の場合も有り）。","大家・管理会社・不動産業者に支払う場合は、指定された方法で支払い。管理会社や不動産業者に支払う場合は、専用のサイト、アプリ、ミニプログラム/小程序から支払いの場合もあり）","自分で直接支払う場合には、WeChatやAlipayの小程序/ミニプログラムから公共料金を支払い。契約書や請求書に記載されている「用户编号」や住所を利用して居住している物件を探して支払い・チャージ"]}]},{"heading":"■ 北京市内の家賃分布・特徴","level":2,"blocks":[{"t":"list","ordered":false,"items":["北京市内の家賃は、\u003cstrong>東京都心部と同程度、またはそれ以上に高い\u003c/strong>エリアもある。","基本的には、\u003cstrong>北京市中心部から郊外へ行くほど家賃は安くなる\u003c/strong>傾向がある。","\u003cstrong>繁華街やビジネス街の周辺\u003c/strong>は、ほかに比べて家賃がやや高めになることが多い。","中国のバスは時刻表が無く（＝決まった時間に来ない）、バス発着時刻が毎回30分程前後することもあるので、バス通学を検討する場合は注意。毎回時間に余裕を持って移動する必要あり。","大学から比較的近い場合は、自転車や電動バイク通学を検討することもおすすめ（現地価格：自転車は200元（4000円）〜、電動バイクは4000元（8万円）〜）。","中国では、有名な小学校・中学校・高校・大学の周辺は\u003cstrong>「学区房（学区住宅）」\u003c/strong>と呼ぶ。教育熱心な家庭が学区内への居住を希望することが多く、有名大学在学中の学生、大学本科/学部や大学院受験を検討する若者も賃貸を借りることが多いため、不動産価格・家賃ともに高くなる傾向がある。","北京大学の中国人大学院生向け学生寮がある\u003cstrong>万柳\u003c/strong>は、学生寮自体は通常の価格だが、高級住宅街（「万柳书院」など）があるエリアのため、一般の物件の中には家賃が高い物件もあり。"]},{"t":"p","html":"北京市内の地域別家賃・不動産価格の高低"},{"t":"label","html":"北京市の広さ"},{"t":"list","ordered":false,"items":["北京市の面積は、\u003cstrong>東京都の約8倍\u003c/strong>。","\u003cstrong>北京市五環内\u003c/strong>の面積は、\u003cstrong>東京23区\u003c/strong>とほぼ同じ規模で、都市機能も概ね似ている。","\u003cstrong>山手線の範囲\u003c/strong>は、北京では\u003cstrong>地下鉄2号線と10号線の間\u003c/strong>に収まる程度の規模となる。"]}]},{"heading":"■ 部屋の間取り例","level":2,"blocks":[{"t":"list","ordered":false,"items":["中国では日本のような賃貸物件専用の物件・アパートがほとんどなく、3DK・3K・2LKなどの間取りのマンションを購入した大家さんが貸し出すような方式が一般的です。そのため、日本の\u003cstrong>シェアハウス\u003c/strong>に近い形式の物件が多いです。","1つの物件内に複数の個室があり、そのうち1部屋を借り、\u003cstrong>シャワー・トイレ・キッチン・洗濯機・冷蔵庫\u003c/strong>などを住人同士で共有します。物件の玄関と各個室には、物理鍵・カードキー・暗証番号・指紋認証など様々な種類の鍵が付いています。","個室の部屋の大きさは、日本で3畳ほど（5〜6m^2）という物件もあるので、個室スペースが一定程度必要な場合は注意。写真ではわからない場合があるので、広さの情報を確認したり、内見（現地orオンライン）で確認するなどをするのがおすすめ。","階数が合計8階前後より少ない場合、エレベーターが設置されていない場合もあるので注意。エレベーター無しで8階（毎日階段で上り下り）の場合は、家賃が安い場合があ利。建物が古くても外付け・後付けのエレベーターが設置されているタイプもあり。"]},{"t":"p","html":"賃貸物件の間取り例 部屋1：3200元 部屋2：3800元 部屋3：5200元 部屋は各自掃除・ゴミ出し 共有スペースは住人で相談して掃除・ゴミ出しor京东家政等の家事代行サービスを利用して毎週1〜2回掃除してもらう"}]},{"heading":"家賃・同居人","level":3,"blocks":[{"t":"list","ordered":false,"items":["同じ物件でも、\u003cstrong>部屋の広さ・方角・設備\u003c/strong>によって家賃が異なる。","入居者がいる物件では、賃貸サイトに\u003cstrong>年齢・性別・職業\u003c/strong>などが掲載されていることが多く、掲載がない場合でも業者や大家に確認できることがある。","自分が先に住んでいても、空室には後から知らない人が入居する場合がある。","知らない人との同居を避けたい場合（特に女性）は、友人・知人と一緒に借りる、同性の中国人学生・留学生に入居してもらうなどの方法がおすすめ。","業者や大家によっては、追加料金（または空室分の家賃を負担）で他の部屋を募集しないよう対応してもらえる場合もある。"]}]},{"heading":"■ 設備・掃除ゴミ出し・家事代行サービス","level":2,"blocks":[]},{"heading":"設備・掃除ゴミ出しなど","level":3,"blocks":[{"t":"list","ordered":false,"items":["個室には\u003cstrong>ベッド・机\u003c/strong>など、共有スペースには\u003cstrong>洗濯機・冷蔵庫・キッチン・トイレ・シャワー\u003c/strong>などが備え付けられていることが多い。ただし、一部設置されていない物件もあるため、内見時に確認する。","個人の個室の掃除は基本的に自分で行う。","共有スペース（シャワー・トイレ・キッチンなど）の掃除・ゴミ出しは、特に家事代行サービスを利用していなければ、住人たちで分担して行う。ルームメイトと事前にルールを決めておくと安心。ルールを先に決めておかないと、気付いた人が掃除・ゴミ出しをすることになる可能性もあるので注意。"]}]},{"heading":"家事代行サービス","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>自如（Ziroom）\u003c/strong>などは最初から独自の\u003cstrong>家事代行サービスを契約・手配してくれ（服务费等の名目で毎月支払い）\u003c/strong>、共有スペースの掃除・ゴミ出しを週１〜２回程度行ってくれる。","\u003cstrong>京东家政、天鹅到家、好慷在家などの一般の家事代行サービス\u003c/strong>を個人で契約することも可能。専門スタッフが共有スペースの掃除・ゴミ出し等を行ってくれる。費用は1時間あたり40-70元程（1時間50元で週1回の場合は月200元。住人が２人の場合は１人100元。）"]}]},{"heading":"インターネット・光熱費","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>Wi-Fi\u003c/strong>は最初から設置されていればそのまま利用でき、未設置の場合はインターネットまたは最寄りの通信会社ショップで申し込む。","\u003cstrong>水道・電気などの光熱費\u003c/strong>は、\u003cstrong>Alipay\u003c/strong>や\u003cstrong>WeChat\u003c/strong>から支払えることが一般的（公共料金支払いのページから、部屋の水道・電気などの番号を入力して支払い）。","日本は後払いが基本だが、\u003cstrong>中国は先払いが多く\u003c/strong>、先に支払った分だけ利用可能で、支払った分がなくなると水道・電気が突然止まる\u003cstrong>（チャージ式）\u003c/strong>。","家賃は部屋ごとが基本だが、光熱費は物件ごとの場合が多いため、ルームメイトとあらかじめ相談して、支払い方法を決める（基本は人数で割り勘）。"]}]},{"heading":"■ 解約条件の確認（契約前に確認）","level":2,"blocks":[{"t":"list","ordered":false,"items":["各物件で解約時にどのような対応が取られるのかの解約条件が異なります。退去の際にスムーズに賃貸契約の解約が済むように、契約する前によく確認・理解しておいてください。","多くの物件は契約期間が決められており、契約から１ヶ月間や１年間などきりの良い期間の場合や、不動産業者・大家さんなどが「契約日〜20XX年6月25日まで」などと具体的な年月日を指定しているところもあります。","決められた契約期間の最後まで住む（＝家賃を払う）か途中で解約するかにより、デポジット（敷金/押金）がどれだけ返還されるかが物件により異なることがよくあるため、事前に確認しましょう。","例："]},{"t":"list","ordered":false,"items":["契約期間を終えて退去・解約する場合は、デポジット（敷金/押金）は一般的には全額返還される。","契約期間が終わる前に退去・解約する場合、デポジット（敷金/押金）が全額返還されるか、或いは一部〜全額返還されないかは物件により異なるので事前確認が必要。","契約期間が終わる前に退去・解約する場合、すでにまとめ払いした家賃の一部は返還されるか、全額返還されないのかは物件により異なるので事前確認が必要（例えば３ヶ月分払って10日住んだ後に事情により退去・解約する場合、住んでいない月の２ヶ月分が返還されるか、或いは全額返還されないか）。","契約期間が終わる前に退去・解約する場合、次にすぐに住む人（转租）が見つかれば・紹介して実際に住めばデポジットが全額返還されるのか、或いは返還されないのか。次に住む人が元々の契約期間が終わるまですめば返還されるのか、或いデポジットは本人には返還され、次に住む人から再度デポジットを徴収するのか。"]}]},{"heading":"■ 注意点","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>外国人不可物件あり\u003c/strong>（基本的に大家さん次第）なので、内見や初回連絡で必ず確認。","内装は綺麗でも外観が古いケース多いので外観では部屋の設備や綺麗さは判断できない。","中国のローカルバスは発着時間が日本のように時刻表/固定で決まっていないため、バス停で待っても5分後に来るのか30分後に来るのか分からず、家に出てから学校に着くまでの時間を予測しずらいため、\u003cstrong>バス通学はおすすめしない\u003c/strong>。","契約延長をする場合は、日本よりも賃貸価格が変動しやすいので注意（2010年代は契約更新時に家賃倍増などがあったが、現在は10%未満の変動が多い）","ごく稀に大家さんの都合により契約期間中の退去を要求される場合が有り。退去までの期間が短いなどの問題があれば交渉する（日本より確率が高いが稀に有り。特に仲介業者等を利用せずに大家さんと直接契約やそれに近い契約の場合は稀にある。例：物件の売買、大家さんの家族親戚が住むためなど）"]}]},{"heading":"◾️賃貸関連中国語用語","level":2,"blocks":[{"t":"dl","rows":[{"k":"押一付一","v":"敷金(押金)1か月・家賃1か月払い（契約時に敷金1か月分と家賃1か月分を支払う。敷金は退去時に戻ってくるが、部屋設備の破損等があると費用を引かれる場合もある）"},{"k":"押一付三","v":"敷金1か月・家賃3か月払い（契約時に敷金1か月分と家賃3か月分をまとめて支払う。最も多いタイプ。）"},{"k":"押一付半年","v":"敷金1か月・家賃半年払い（契約時に敷金1か月分と家賃半年分を支払う。）"},{"k":"押一付一年","v":"敷金1か月・家賃1年払い（契約時に敷金1か月分と家賃1年分をまとめて支払う。）"},{"k":"月付","v":"月払い（家賃を毎月１ヶ月分ずつ支払う。）"},{"k":"季付","v":"3か月払い（家賃を3か月ごとに３ヶ月分ずつまとめて支払う。）"},{"k":"半年付","v":"半年払い（家賃を半年ごと６ヶ月分ずつまとめて支払う。）"},{"k":"年付","v":"年払い（家賃を1年ごとに１年分まとめて支払う。）\u003cbr>※一般的に、まとめて多く支払うほど家賃が割引される。"},{"k":"两室一厅","v":"2L(D)K相当（部屋2つ＋リビング1つ。）"},{"k":"三室一厅","v":"3L(D)K相当（部屋3つ＋リビング1つ。）"},{"k":"一厨一卫","v":"キッチン1つ・浴室・トイレ1つ（キッチン1つ、トイレ・シャワー室1つ。）"},{"k":"主卧","v":"主寝室（最も広い寝室。専用バス・トイレ付きの場合もある。）"},{"k":"次卧","v":"サブベッドルーム（主寝室以外の部屋。）"},{"k":"独立卫浴","v":"専用シャワー・トイレ（バス・トイレが自室専用。）"},{"k":"公共卫浴","v":"共用シャワー・トイレ（バス・トイレを他の住人と共用する。）"},{"k":"合租","v":"シェアハウス（複数人で借りるタイプの賃貸、個室単位で借りてシャワー・トイレ・キッチンなどは共有の形式。）"},{"k":"整租","v":"一室・一戸貸し（部屋や住居全体を借りる、日本の一般的な賃貸と同じ形式。）"},{"k":"单租","v":"個室賃貸（シェアハウスなどで個室だけを借りること。地域・物件によっては「整租」と同義で使われる場合もある。）"},{"k":"朝南","v":"南向き（日当たりが良く人気が高い。）"},{"k":"朝北","v":"北向き（南向きより家賃が安いことがある。）"},{"k":"精装修","v":"フルリフォーム済み（内装や設備が新しく、そのまま住める状態。）"},{"k":"简装修","v":"簡易リフォーム（最低限の内装・設備。）"},{"k":"家具齐全","v":"家具付き（ベッド・机・収納などの家具が備え付け。）"},{"k":"拎包入住","v":"すぐ入居可能（家具・家電付きで、荷物だけ持って住める。）"},{"k":"水电费","v":"水道・電気代（家賃とは別に支払うことが多い。）"},{"k":"燃气费","v":"ガス代（ガス料金。）"},{"k":"网费","v":"インターネット代（Wi-Fi料金。家賃込みの場合もある。）"},{"k":"物业费","v":"管理費（マンションの共用部分などの管理費。）"},{"k":"中介费","v":"仲介手数料（不動産会社へ支払う手数料。）"},{"k":"押金","v":"敷金・デポジット（契約終了後、問題がなければ返金される保証金。）"},{"k":"房东","v":"大家（部屋の所有者・大家さん。）"},{"k":"中介","v":"不動産仲介業者（部屋探しや契約を仲介する会社。）"},{"k":"看房","v":"内見（部屋を見学すること。）"},{"k":"签合同","v":"契約する（賃貸契約を締結すること。）"},{"k":"入住","v":"入居（実際に住み始めること。）"},{"k":"退租","v":"退去・解約（契約を終了し、部屋を明け渡すこと。）"}]}]}],"wip":false},{"id":"n0dede70ff906","title":"2.2 住居：入寮・入居・住宿登記等（整理中）","directoryTitle":"2.2 住居：入寮・入居・住宿登記等","category":"housing","tags":{},"editorNote":"","published":"2026-08-24","modified":"2026-08-30","chars":4732,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["中国滞在・留学の際は、大学の寮に住む場合も、大学外で賃貸物件やホテルに住む場合も、\u003cstrong>「（临时）住宿登记/住宿登記」という手続きが必要\u003c/strong>です。","また、大学外の賃貸物件に住む場合、場所によっては賃貸物件のある社区（区域）を管轄している\u003cstrong>人民警察（民警）\u003c/strong>や\u003cstrong>社区居民委員会/社区共産党委員会（社区居委会/社区党委）\u003c/strong>などが、氏名・電話番号・身分証番号（パスポート番号）などの登録をするように問い合わせてくる・家まで訪問しにくる・事務所にくるように連絡してくる場合もあります。","X1ビザの場合には、居留許可を取得した後に、寮の場合は寮のスタッフに、賃貸物件の場合は管轄の公安局・派出所に居留許可の情報を提供する必要があるので忘れないようにしましょう。"]}]},{"heading":"■ 住宿登記（公安への宿泊届け）概要","level":2,"blocks":[{"t":"list","ordered":false,"items":["住宿登記は、中国国内での宿泊場所を公安局に届け出る手続きで、スマホ・PCからオンラインで手続きすることも、直接公安局・派出所に行って窓口で手続きすることも可能です。"]},{"t":"list","ordered":false,"items":["住む場所により、自分での申請登録が必要かどうか異なります："]},{"t":"dl","rows":[{"k":"寮","v":"寮スタッフが登録してくれる（自分でネットから登録するように言われる場合あるが）"},{"k":"ホテル","v":"ホテルスタッフが登録してくれる（稀に外国人がほとんど宿泊しないホテルだと自分で登録するように言われる場合あり）"},{"v":"\u003cstrong>賃貸：  自分でネットから登録&amp;最寄りの公安局派出所へ\u003c/strong>"},{"k":"親戚・友人知人宅","v":"自分でネットから登録"}]}]},{"heading":"■ 北京市公安局システム（スマホ・PC）","level":2,"blocks":[{"t":"p","html":"北京市公安局出入境管理局の以下のシステムからオンラインで住宿登記ができます："},{"t":"p","html":"\u003cstrong>境外人员服务区　网上住宿登记系统登录（住宿登記システム）\u003c/strong>\u003cbr>https://zwfw.gaj.beijing.gov.cn/epoint-web-zwfw/newproject/pages/foreignaccomodation/login.html"},{"t":"p","html":"QRコード"},{"t":"p","html":"登録画面の例"}]},{"heading":"オンライン住宿登記に必要な資料・情報","level":3,"blocks":[{"t":"label","html":"必要な資料（写真）"},{"t":"list","ordered":false,"items":["パスポートの写真・生年月日・有効期限等情報のあるページの写真","本人正面からの写真（その場で撮影した写真）","賃貸契約書等の住む契約をしている証明資料の写真"]},{"t":"label","html":"基本信息/Basic information"},{"t":"list","ordered":false,"items":["英文姓/Surname","英文名/Given names","性别/Sex","国家/地区/Country/Region","拟离开时间/Estimated departure time　（退寮・退居する予定日、契約の最終日）","住房种类/Type of housing","居住区域地/District of Residence","派出所/Police station","社区/Residence area（community）","详细地址/Detailed address","留宿人姓名/Name of the host　（本人が契約する場合は自分の名前。親戚知人友人宅に住む場合はその人の名前）"]},{"t":"p","html":"※住房种类、居住区域地、派出所、社区がわからない場合は、入寮・入居する際に寮職員・不動産業者スタッフなどに情報を確認して記入する。"}]},{"heading":"■ 大学の留学生寮の場合","level":2,"blocks":[{"t":"list","ordered":false,"items":["大学の留学生寮に住む場合には、事前に予約が必要です。予約していない場合には、寮に住むことはできません（予科、寮の提供が含まれる大学間交換留学プログラム、中国政府奨学金、国際中文教師奨学金などは北京大学側が部屋を確保するので予約不要）。","入寮する際には、中关新园1号楼（4号楼に変更の可能性あり）の受付へ行き、入寮手続きをします。","入学許可証/录取通知书とパスポートを提出後、契約書を記入し、寮費（１ヶ月分以上の家賃+家賃１ヶ月分相当のデポジット/押金）を支払い終えたら、部屋のカードキー（房卡）をもらい入寮することができます。","契約書を記入する際は、契約期間に注意してください。大学間の交換留学プログラムの場合には、あらかじめ指定されている場合がありますが、個人の場合には期間の指定が可能です。長期休暇中は北京大学が中国人学生・留学生向けの１週間〜２ヶ月間の各種短期プログラムを実施し、中关新园はその際の学生寮として使う目的で、留学プログラムが夏に終了する場合は最長で7月10-15日、冬に終了する場合は最長で1月10-15日には解約することになります。特殊な事情がある場合には、寮側の部屋の空き状況や内容次第で7月31日までや1月31日までなど、居留許可の有効期限まで契約を延長してくれる場合があります（例、大きな病気怪我で入院・通院中ですぐに引越しできないなど）。","中关新园の建物は全て顔認証システムが導入されているため、入寮手続きの際に顔認証の登録も行います。","部屋のカードキーには、部屋番号と有効期限が記録されていて、ビザの有効期限まで又は部屋の契約期限までだけ部屋に入れるようになっています。","X1ビザの留学生の場合、カードキーの有効期限が２〜３週間ほどに設定されています。居留許可を取得した後に再度受付に行き居留許可情報を登録すると、部屋の契約期間までカードキーが使えるように設定してくれます。","居留許可証の手続きの際には、「宿住登記表」が必要になります。寮の受付で宿住登記表が必要なことを説明すると無料で発行してもらえます。","退寮する際は、寮スタッフによる部屋のチェック（物品破損・紛失などがないか確認）があるため、実際に寮を出発する１時間前までに荷物を整理して寮受付に退寮することを連絡してください。寮のスタッフの勤務時間（平日・土日祝９〜１７時頃）以外の時間帯はスタッフが足りず確認に時間がかかる場合があります。午前１０時より前など、朝起きてからすぐに退寮する場合には前日に退寮の連絡をしておくと、先に部屋のチェックだけ対応してもらえます。退寮する際は部屋の掃除は不要で、不要な荷物（ごみ、カーペット、衣服、食料品、食器など）を部屋に置いたままにしても問題ありません。","退寮すると、最初に支払ったデポジット/押金と住まなかった分の寮費が１日単位で返還されます。返還方法は基本的にクレジットカードへやWeChat/Alipayへの返金ですが、事情がある場合には現金での返金も可能な場合があるのでスタッフに確認してください。"]}]},{"heading":"■ ホテルの場合","level":2,"blocks":[{"t":"list","ordered":false,"items":["基本的に日本のホテルと同じですが、中国のホテルの宿泊にはパスポートの提示が必要です。顔写真の撮影を行うホテルも多くあります（専用のカメラがない場合は、ホテルスタッフがスマホで撮影する場合あり）。","宿住登記はホテル側が行ってくれます。外国人の宿泊に慣れていない場合には、ホテル側が外国人の宿泊を拒否したり、宿泊者本人にホテルのシステムから宿泊手続き・宿住登記などを操作・記入してもらうような場合もあります。","長期的に住む場合も基本的に宿住登記は自分で行う必要がありません。","居留許可証の手続きの際には、「宿住登記表」が必要になります。ホテルの受付で宿住登記表が必要なことを説明すると無料or有料（1〜10元）で発行してもらえます。"]}]},{"heading":"■ 賃貸物件の場合","level":2,"blocks":[{"t":"p","html":"賃貸物件に入居する場合の手順："}]},{"heading":"1. 賃貸契約を締結（日本からオンラインも可）","level":3,"blocks":[{"t":"p","html":"契約書（租赁合同／房屋租赁合同）の内容を確認して署名します。\u003cbr>特に以下の点を確認してください："},{"t":"list","ordered":false,"items":["入居可能日（いつから入居可能か）","家賃（租金）","敷金（押金）","家賃の支払方式（押一付一、押一付三など）","家賃の支払い日（毎月20日など）","契約期間","退去・解約条件・解約方法","敷金の返還条件（契約期間終了前の退去で返還されないなど）","電気・水道・ガス・インターネット等の費用負担・支払い方法","ベッド・椅子・机・棚・洗濯機・冷蔵庫などの備え付けの家具・家電の状況と修理条件","管理費（物业费）の有無","仲介手数料（中介费）の有無","外国人の居住が可能か（一部大家さん・社区は断る場合や居住条件有り）"]}]},{"heading":"2. 家賃・敷金などを支払う","level":3,"blocks":[{"t":"p","html":"契約時に、一般的には「\u003cstrong>敷金＋最初の家賃＋仲介手数料（必要な場合）」\u003c/strong>を支払います。\u003cbr>支払いは、WeChat Pay・Alipay・クレカ・銀行振込など様々。"}]},{"heading":"3. 物件への入居","level":3,"blocks":[{"t":"p","html":"契約書の締結と家賃敷金の支払いの際に、大家さんまたは仲介会社と入居する日時を決定。\u003cbr>入居時には、大家さんまたは仲介会社スタッフから物件の鍵（パスワード式の場合はパスワード）をもらう。\u003cbr>入居の際には、物件・部屋に備えついている以下のような設備が正常に使えることを確認："},{"t":"list","ordered":false,"items":["家具・家電","エアコン","冷蔵庫","洗濯機","給湯器（シャワーのお湯が出るか）","コンロ","水道・電気・ガス","Wi-Fi","ドア・窓・鍵"]},{"t":"p","html":"\u003cstrong>入居直後に部屋全体や設備の写真・動画を一通り撮影しておく\u003c/strong>と、退去時の修理費用請求による敷金トラブルを防ぎやすくなります。\u003cbr>同時に、物件地域を管轄している\u003cstrong>社区居民委員会/共産党委員会\u003c/strong>と\u003cstrong>人民警察（民警）\u003c/strong>への個人情報の登録が必要かも確認してください。"}]},{"heading":"4. 電気・水道・ガス・ネットの支払い方法の確認","level":3,"blocks":[{"t":"p","html":"各種光熱費の支払い方法を確認します。\u003cbr>家賃などに含まれていない場合は、物件の個別の番号・コードを確認してください。\u003cbr>Alipay/WeChatpayの光熱費支払いのミニアプリで、住所と番号・コードを入力することで支払いができます。"}]},{"heading":"5. 住宿登記を行う・住宿登記表を取得する","level":3,"b
