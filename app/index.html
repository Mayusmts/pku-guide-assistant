locks":[{"t":"p","html":"外国人がホテル以外の場所に住む場合、\u003cstrong>住宿登記\u003c/strong>が重要です。\u003cbr>通常はオンラインで手続きするか、または大家・仲介業者と管轄の公安局派出所で手続きができます。\u003cbr>X1ビザの方は、居留許可申請で紙の住宿登記表が必要になるので、居留許可申請をするまでに管轄の公安局派出所へ行き、住宿登記表を発行してもらいます。"},{"t":"p","html":"公安局・派出所のイメージ オンラインorオフラインで住宿登記を申請 X1ビザの人は、派出所へ行き紙の「住宿登記表」をもらい、居留許可手続きの際に提出 営業時間は平日09:00-12:00, 14:00-17:00が一般的"}]},{"heading":"6. その他（人民警察、社区委員会への登録・物件や場所による）","level":3,"blocks":[{"t":"list","ordered":false,"items":["住宿登記以外に、物件・地域によっては社区の警備などを管轄している"]},{"t":"list","ordered":false,"items":["人民警察（民警）","社区の居民委員会/共産党委員会"]},{"t":"p","html":"の担当者から電話や部屋への直接訪問があり、個人情報・連絡先・その他（滞在目的・期間など）を登録する場合があります。必須ではありませんが、各社区などで状況が異なります。"},{"t":"p","html":"入居時に、大家さん・仲介業者にこれらへの登録が必要か確認してください（不明という大家さん・仲介業者も多い）。"},{"t":"p","html":"オフィスは両方とも社区内か近くにあるので、電話などでオフィスへ呼ばれた場合には、オフィスへ行き登録しましょう。"},{"t":"p","html":"時期は主に入居当日〜１週間以内ですが、居留許可手続きが済んだ後頃に連絡がくるor訪問しにくる場合があるので、入居後1ヶ月間は知らない人からの電話・訪問があった場合、人民警察や社区の委員会の方かどうか確認しましょう。"},{"t":"p","html":"社区の居民委員会/共産党委員会の入り口のイメージ画像 日本の市町村区の下にある町内会・自治会に相当。同区域の共産党党支部委員会も併設。 ※特に担当者から連絡・訪問が無い場合は登録は必要ありません"},{"t":"p","html":"警察による入居初期訪問のイメージ画像 入居初期（入居当日、住宿登記申請後、居留許可申請後ごろ）に警察が名前、電話番号、パスポート情報、居住目的などを確認しに来る場合があります 留学生・外国人が多い地域以外は基本的に中国語だけでのやり取りになるので、スマホ翻訳や筆記で手続き内容を確認してください。 ※特に担当者から連絡・訪問が無い場合は登録は必要ありません"}]}],"wip":false},{"id":"n14e161185f83","title":"2.2.1 留学生寮","directoryTitle":"1.4.1 住居：寮・主に中关新园（渡航前に予約）","category":"housing","tags":{"housing":["dorm"]},"editorNote":"","published":"2026-07-30","modified":"2026-09-01","chars":5002,"sections":[{"heading":null,"level":0,"blocks":[{"t":"p","html":"留学では住居の選択・確保が留学全体の合計費用や留学生活に大きく影響するため非常に重要です。\u003cbr>このページでは北京大学の留学生寮について説明します。"}]},{"heading":"◾️留学生寮","level":2,"blocks":[{"t":"p","html":"北京大学の主な寮は以下の\u003cstrong>中关新园\u003c/strong>と\u003cstrong>勺园\u003c/strong>の2箇所"}]},{"heading":"▶ 北京大学中关新园（メイン寮）","level":3,"blocks":[{"t":"list","ordered":false,"items":["1000人以上の留学生・北京大学の大半の留学生が居住","留学生寮、外国人教員寮、ホテル、各種施設が揃った複合型施設。","\u003cstrong>建物構成：\u003c/strong>"]},{"t":"dl","rows":[{"k":"1号楼","v":"総合受付（入寮退寮含む）、ホテル・会議室（4つ星：ビジネスホテルの上のランク、国際会議開催可能レベル。ホテルは1泊400-1500元程。北京大学在学生が予約すると10%前後割引）"},{"v":"\u003cstrong>2〜6号楼：留学生寮\u003c/strong>（数種類の部屋タイプあり：1人部屋、2人部屋、4人部屋）"},{"k":"2号楼","v":"1階に中華レストラン（北京ダックなどあり）。2階にホテル用ビュッフェ・バイキング（1号楼ホテル用だが、朝食は自費100元前後でも利用可能）"},{"k":"5号楼","v":"1階に中華レストラン。2階に寮用図書館、会議室（学生も留学生事務室に申請で活動・勉強会などに利用可能）"},{"k":"7号楼","v":"寮事務所・会議室など"},{"k":"8号楼","v":"ポスドク部屋（家族用の部屋など）"},{"k":"9号楼","v":"外国人教員寮（家族用の部屋など、外国人教員向け）、ホテル（中关新园のホテルは1号楼と9号楼の2箇所）"},{"k":"コンビニ","v":"4号楼と6号楼の間。飲食品・果物、生活雑貨等。"},{"k":"地下","v":"4号楼横階段が入口。康乐中心/複合型スポーツ施設。ジム、バドミントン、スカッシュ、ビリヤード、ボーリング、ダンス、プール（水深2m程、サウナ付き）、カラオケなど（全体的にキャンパス内施設より高め・外の施設と近い金額。ジムなどは1〜数ヶ月単位で利用券を購入すると割安。利用は地下受付から）。"},{"k":"テニスコート・バスケコート・小さい公園","v":"9号楼東側にあり（利用は無料、近隣住民も利用）。"}]},{"t":"p","html":"ウェブサイト：\u003cbr>\u003ca href=\"https://pkugv.pku.edu.cn/index.htm\" target=\"_blank\" rel=\"noopener\">https://pkugv.pku.edu.cn/index.htm\u003c/a>"},{"t":"p","html":"中关新园留学生宿舍のイメージ画像"},{"t":"p","html":"中关新园の地図・号楼"}]},{"heading":"▶ 北京大学勺园","level":3,"blocks":[{"t":"dl","rows":[{"k":"学生寮","v":"中国人大学院生・燕京学堂（Yenching Academy）プログラム留学生向け（燕京学堂プログラムは奨学金で寮費がカバーされるので予約等不要）"},{"k":"西餐厅","v":"1階は少し良い西洋レストラン"},{"k":"中餐厅","v":"1階は少し良い中華レストラン、2階は来客用個室/包间の中華レストラン"},{"k":"ホテル","v":"主に来客用"}]},{"t":"note","kind":"tip","html":"👉 \u003ca href=\"https://shaoyuan.pku.edu.cn/\" target=\"_blank\" rel=\"noopener\">https://shaoyuan.pku.edu.cn/\u003c/a>"}]},{"heading":"■ 中关新园寮費（参考）","level":2,"blocks":[{"t":"p","html":"\u003cstrong>部屋タイプ別月額目安（2025年時点寮費）：\u003cbr>\u003c/strong>留学生寮は、一般の賃貸物件の価格設定・市場価格に合わせて家賃が設定されています。そのため、大学周辺の賃貸物件相場と家賃は同程度です。\u003cbr>※中国の大学の寮は安いと聞く人がいるかもしれませんが、それは留学生寮ではなく中国人学生の4人1部屋の寮の場合です（1年で2000元＝4-5万円等に設定されています）"},{"t":"list","ordered":false,"items":["\u003cstrong>①シャワー・トイレ付・１人部屋（完全な１人部屋）：\u003c/strong>"]},{"t":"list","ordered":false,"items":["1泊150元 ＝ 1ヶ月4500元（約10-11万円） ＝ 11ヶ月49500元（約110-120万円）。","参考画像：\u003ca href=\"https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/drj/index.htm\" target=\"_blank\" rel=\"noopener\">https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/drj/index.htm\u003c/a>"]},{"t":"label","html":"②シャワー・トイレ付・２人部屋（部屋２つと共有部屋１つ。１部屋に１人住むタイプ）："},{"t":"list","ordered":false,"items":["1泊120元 ＝ 1ヶ月3600元（約8.5-9万円） ＝ 11ヶ月39600元（約95-100万円）。","参考画像：\u003ca href=\"https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/lrj/index.htm\" target=\"_blank\" rel=\"noopener\">https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/lrj/index.htm\u003c/a>"]},{"t":"label","html":"③シャワー・トイレ付・４人部屋（部屋２つと共有部屋１つ。１部屋に２人住むタイプ）："},{"t":"list","ordered":false,"items":["1泊80元 ＝ 1ヶ月2400元（約5.5-6万円） ＝ 11ヶ月26400元（約60-65万円）。","参考画像：\u003ca href=\"https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/srj/index.htm\" target=\"_blank\" rel=\"noopener\">https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/srj/index.htm\u003c/a>"]},{"t":"p","html":"※ デポジット必須：寮費1ヶ月分（約5.5万-11万円）。退寮時に返却してくれる。\u003cbr>※ 寮費免除の奨学金生でも寮費1ヶ月分デポジット必須。\u003cbr>※ 留学生寮は一般の賃貸価格に合わせて価格設定しているため費用は割安ではないが、大学横の立地・受付24時間対応・各種専属スタッフ・留学生仲間が近くにいる等の利便性は高い。"},{"t":"note","kind":"tip","html":"👉 入寮の際には、寮費1ヶ月分+デポジット1ヶ月分=2ヶ月分以上を支払い。"},{"t":"note","kind":"tip","html":"👉1号楼1階受付で現金、クレカ、WeChat Pay/Alipay、デビッド（Unionpay含む）で支払い、またはネットの寮予約システムから支払い。"},{"t":"p","html":"中关新园留学生宿舍の部屋の中のイメージ画像"}]},{"heading":"■ 寮の予約（⚠️重要）","level":2,"blocks":[{"t":"list","ordered":false,"items":["留学生寮は新学期開始の\u003cstrong>約1ヶ月前に事前予約が必要\u003c/strong>"]},{"t":"list","ordered":false,"items":["9月入学・留学開始 → 7月末〜8月上旬にネットから予約","2月入学・留学開始 → 1月末〜2月上旬にネットから予約"]},{"t":"list","ordered":false,"items":["予約は大学の留学生向けシステムの寮予約ページから：\u003ca href=\"https://www.studyatpku.com/\" target=\"_blank\" rel=\"noopener\">https://www.studyatpku.com/\u003c/a>","システム上で部屋のタイプを選択し、予約金を支払ったら予約完了。入学手続き日3日前ごろから寮1号楼受付で入寮手続き可能。"]}]},{"heading":"⚠️ 予約の注意点","level":3,"blocks":[{"t":"list","ordered":false,"items":["例年、予約開始から\u003cstrong>約5-10分で予約満室\u003c/strong>になるので予約開始日時を必ずチェック","予約開始直後はアクセス殺到でシステムが動かなくなる場合があるので、ページ更新が必要となる場合あり（そのままアクセスできずに予約満室の人も例年あり）","\u003cstrong>次の場合\u003c/strong>は大学側が寮の部屋を確保するので自分で\u003cstrong>予約不要\u003c/strong>"]},{"t":"list","ordered":false,"items":["①予科生（4人部屋割り当て）","②寮費免除が含まれる奨学金生（寮費支給ではない）","③大学間の協定に基づく留学プログラムで、大学からの寮の提供が含まれる場合（日本側の大学担当者へ協定内容要確認、寮提供が含まれないプログラムの場合は予約必要）","④北京大学等主催の短期長期プログラムで寮の提供が明記されている場合（特殊な例）","⑤留学仲介業者などが手配している場合（利用した業者に確認）"]},{"t":"p","html":"\u003cstrong>部屋数は全留学生数より少ない\u003c/strong>ので学期中は\u003cstrong>基本的に満室状態\u003c/strong>（特に学期開始頃）"},{"t":"p","html":"\u003cstrong>予約できなかった場合は、中关新园へ連絡すると、予約待ちリストに入れてくれる。\u003c/strong>寮に空きが出次第、リスト順に寮スタッフが連絡先（電話・メール）に連絡をしてくれるが、実際にいつ入寮できるかは予測できないため、リストの順番を定期的に確認して待つか諦めるか（賃貸を自分で探す）を各自決める。"},{"t":"p","html":"\u003cstrong>学期途中\u003c/strong>（特に卒業予定者が退寮し始める4〜5月頃から）に退寮者が出た場合も、その１〜２日後から空きの分だけ\u003cstrong>新しく入寮可能\u003c/strong>。途中から入寮する場合は、1号楼受付へ問い合わせ。同様に、入寮待ちリストに入れてもらい、待つという方法も可能。"},{"t":"p","html":"\u003cstrong>予約できなかった場合・寮以外の住居を選択したい場合\u003c/strong>（家賃が安い場所・設備やレイアウトがより良い場所を探すなど） \u003cstrong>→ 自力で賃貸を探す（大学側からの支援無し）\u003c/strong>"}]},{"heading":"■ 入寮","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>入寮は\u003c/strong>入学許可証/录取通知书記載の\u003cstrong>入学手続き日/报到日の3日前から\u003c/strong>中关新园1号楼の受付で入寮手続き可能。","\u003cstrong>入寮時の持ち物\u003c/strong>：入学許可証（本体orコピーorスマホ画面）、寮費2ヶ月分以上（寮費+デポジット。寮費免除の場合はデポジット分のみ）、パスポート。","寮の外との出入り口は顔認証システムのため、入寮時に顔認証登録。","x1ビザ/1年間の留学の場合は、居留許可取得後に再度受付へ行き、パスポートを提出して居留許可情報を登録（x2ビザ/半年留学は不要）。","\u003cstrong>契約期間\u003c/strong>はビザの期限範囲でのみ可能のため、１年以上の契約は不可。延長する場合には、先に居留許可の期間を延長（次学期分/年度分の学費支払い→居留許可延長）してから、寮の契約期間を延長。","8月は中国人学生・留学生のサマースクールプログラムの寮としても使われいるため、\u003cstrong>3日前より早く到着しても空き部屋がなく入寮できない場合あり\u003c/strong>（入学手続き日の7日前より早く行くと、入寮を断られる場合あり。4-7日前については状況次第なので要確認。）","部屋は寮スタッフ側が配分するので、前学期から既にルームメイトが住んでいる部屋の場合や、誰も住んでいない部屋となるなど様々。相手の国籍も日本だけでなく、欧米、東南アジア、中央アジア、南アジア、中東、アフリカなど様々。","友人と一緒の部屋にする場合には、一緒に受付へ行って部屋の空き状況などを確認・相談。"]}]},{"heading":"■ 住宿登記（公安への宿泊届け）","level":2,"blocks":[{"t":"p","html":"宿泊場所到着後は必ず実施："},{"t":"list","ordered":false,"items":["寮 → 寮スタッフが登録してくれる（自分でネットから登録するように言われる場合あるが）","ホテル→ホテルスタッフが登録してくれる（稀に外国人がほとんど宿泊しないホテルだと自分で登録するように言われる場合あり）","\u003cstrong>賃貸 → ネットで自分で登録&amp;公安局へ\u003c/strong>"]},{"t":"note","kind":"tip","html":"👉 北京市公安局システム（スマホ・PC）"},{"t":"p","html":"\u003cstrong>境外人员服务区　网上住宿登记系统登录（住宿登記システム）\u003c/strong>\u003cbr>\u003ca href=\"https://zwfw.gaj.beijing.gov.cn/epoint-web-zwfw/newproject/pages/foreignaccomodation/login.html\" target=\"_blank\" rel=\"noopener\">https://zwfw.gaj.beijing.gov.cn/epoint-web-zwfw/newproject/pages/foreignaccomodation/login.html\u003c/a>"},{"t":"p","html":"QRコード"},{"t":"p","html":"登録画面の例"},{"t":"p","html":"※中国の電話番号が必要なことが多いので、早めに中国のSIM/電話番号を取得する。電話番号がない場合は、友人知人の電話番号を借りて一時的に利用する。"}]},{"heading":"■ 寮の各種サービス","level":2,"blocks":[{"t":"p","html":"大学の留学生寮は、家賃が一般の賃貸とほぼ同じ水準だが、各種サービス有るのが利点："},{"t":"list","ordered":false,"items":["部屋の備品が破損した場合やエアコン・暖房/暖气（温水式暖房）・部屋のライトが不調な場合は、寮のスタッフに連絡すれば、基本的に無料で交換・修理可能（故意に破損した場合は弁償の場合があるが、特段のことがなければ無料交換・修理）。","供用のシャワー・トイレの掃除は、毎週定期的に寮のスタッフが行ってくれる（寮のスタッフに勝手に部屋に入って欲しくない場合や自分で掃除をする場合は、その旨を寮のスタッフに事前に連絡が必要）","定期的に留学生向けの中国文化体験、ミニマラソン・運動会などを開催している。参加景品などあり。","電気は使い放題（以前は家賃に対応した度数が決まっていて、無くなり次第チャージが必要だった。制度が変わっている場合は、エアコンなどの電気消費量が大きい設備を使用する際は注意。）","有料の洗濯機、乾燥機あり（WeChat Pay・Alipayで支払い）。供用キッチン有り。","郵便物は1号楼受付受け取りか、各部屋に寮スタッフが配達。","宅配ボックス/快递柜、フードデリバリーボックス/外卖柜あり。"]}]},{"heading":"■ 退寮・部屋変更・契約期間延長","level":2,"blocks":[{"t":"list","ordered":false,"items":["退寮/退房は留学プログラム終了時期・学期末だけでなく、学期途中も可能。","退寮の際は、部屋の掃除は不要だが、寮スタッフによる設備・備品点検（机・椅子・ポット等が破損していないか等の確認）があり10分以上時間がかかることがほとんどのため、出発予定時刻の30分前までに退寮の手続きを開始する（出発当日朝や前日にあらかじめ設備・備品点検をしてもらうことも可能）。","退寮すると、余分に払った分の寮費とデポジットが返却される。","各種事情により途中で部屋を変える場合は、受付へ行き、空き部屋などを確認・相談。","\u003cstrong>契約期間\u003c/strong>はビザの期限範囲でのみ可能のため、１年以上の契約は不可。延長する場合には、先に居留許可の期間を延長（次学期分/年度分の学費支払い→居留許可延長）してから、寮の契約期間を延長。","通常は1日単位での契約延長が可能だが、卒業学期/修了学期の場合には元の契約から延長できない場合あり。延長可能でも、原則7月15日までor1月15日までの契約・退寮となる。","退寮後に寮が荷物を預かるサービスは無いため、退寮後に旅行する場合には、友人知人に預けるか、高速鉄道駅・空港などの預かりサービスを利用する。","卒業/修了年度でない年の夏休みに寮の部屋を全く使わないためその間の寮費を節約したい場合（家賃を支払いたくない場合）、受付に頼むと、夏休み期間中だけ荷物を倉庫に預けてもらい、夏休み終了後に荷物返却と部屋の確保・契約をしてくれるサービスあり（夏休み中は、サマースクールの学生に部屋を貸出）。"]}]}],"wip":false},{"id":"ndeb841474810","title":"2.2.3 ホテル","directoryTitle":"1.4.3 住居：ホテル（寮賃貸に住む前に滞在など・渡航前に予約）","category":"housing","tags":{"housing":["hotel"]},"editorNote":"","published":"2026-07-19","modified":"2026-09-13","chars":4222,"sections":[{"heading":null,"level":0,"blocks":[{"t":"p","html":"旅行や家族友人知人が中国来た時だけでなく、留学初期に賃貸物件が決まるまでの一時滞在先（人によっては留学全期間をホテル住み、特に短期留学の場合）などとして、ホテルを利用することがあります。\u003cbr>このページでは、中国のホテルについて、関連情報を整理しています。"}]},{"heading":"■ 中国のホテルの特徴","level":2,"blocks":[{"t":"list","ordered":false,"items":["宿泊時に身分証/パスポートの提示や顔写真の登録必須（ホテルスタッフが、スマホでパスポートと顔写真を撮るなどもあり）。","日本と異なり、人数単位ではなく部屋単位の料金設定。","星の基準はサービスや品質基準ではなく、設備・施設基準。","基本的にはシャワーのみ。主に4つ星以上からバスタブ有りの可能性。","シャワー、トイレ、洗面台は同室で、シャワーは透明なガラスで区切られているだけの場合が多い。"]}]},{"heading":"■ 予約サイト","level":2,"blocks":[{"t":"p","html":"日本や外国の予約サイトの利用も可能。中国では下記サイト（中国語）が有名："},{"t":"dl","rows":[{"k":"携程旅行（Ctrip）","v":"\u003ca href=\"https://www.ctrip.com/\" target=\"_blank\" rel=\"noopener\">https://www.ctrip.com/\u003c/a>"},{"k":"去哪儿（Qunar）","v":"\u003ca href=\"https://www.qunar.com/\" target=\"_blank\" rel=\"noopener\">https://www.qunar.com/\u003c/a>"}]}]},{"heading":"■ ホテルの星・料金目安","level":2,"blocks":[{"t":"p","html":"中国のホテルは、文化観光部（文化旅游部）が定めたホテルの設備・広さ・規格などの基準により、1-5つ星によりホテルが設定されています。\u003cbr>３つ星であれば特に不便なく利用可能ですが、２つ星以下のホテルに宿泊する際はホテルの設備等の情報・写真を確認してから選択・予約しましょう。"}]},{"heading":"ホテルの星","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>1つ星\u003c/strong>＝最低限の宿泊設備を備えたホテル（設備・サービスは簡素・シャワー等のお湯は24時間ではなく時間指定の場合あり）。","\u003cstrong>2つ星\u003c/strong>：地方のビジネスホテル（簡素〜日本のビジネスホテルレベルまでやや差あり）","\u003cstrong>3つ星\u003c/strong>：日本の一般的なビジネスホテル～シティホテル程度（外国人が宿泊しても大きな不便はない）。","\u003cstrong>4つ星\u003c/strong>＝会議室などの設備・サービスが充実した中上級ホテル（国際会議開催可能、レストラン有り、ゲスト用など）。","\u003cstrong>5つ星\u003c/strong>＝いわゆる高級ホテル（国際水準の設備・サービスを提供）。"]},{"t":"p","html":"ホテルの星についての基準詳細："},{"t":"att","name":"旅游饭店星级的划分与评定GBT14308-2023.pdf","size":"733 KB","url":"https://note.com/api/v2/attachments/download/6c6c31239bbebe41664cfd2da2b729cb"}]},{"heading":"ホテルの料金目安","level":3,"blocks":[{"t":"p","html":"中国では「人単位」の料金ではなく「部屋単位」の料金が基本。\u003cbr>ユースホステルのような１部屋に複数人泊まるような施設は「人・ベッド単位」の料金。\u003cbr>都市部ほど料金が高く、地方に行くほど安い。"},{"t":"dl","rows":[{"k":"ビジネスホテル（2-3つ星）","v":"150〜400元/日"},{"k":"大学周辺のゲスト用ホテル（4つ星-5つ星）","v":"400元/日〜"},{"v":"ユースホステル/青年旅舍（星無し。１部屋に二段ベッド等が複数あり、1部屋に複数人泊まるタイプ）：50〜200元/日"}]},{"t":"p","html":"※ 地方都市では、１泊10-30元で泊まれる場所もあるが、設備が相当古い・掃除が行き届いていない等があるので、男性が低予算でバックパックをする場合以外の宿泊はおすすめしない。"}]},{"heading":"有名ビジネスホテルチェーン店","level":3,"blocks":[{"t":"p","html":"宿泊場所に困ったら有名チェーン店が綺麗さや設備の水準が一定以上なので無難。外国人も基本的に宿泊可能。"},{"t":"list","ordered":false,"items":["如家/Home Inns、汉庭/HANTING、7天连锁/Days Inn、锦江之星/Jin Jiang、尚客优/THANK、亚朵/ATOUR、全季/JI HOTEL、维也纳/Vienna、格林豪泰/Green Tree Inn、城市便捷/CCINNなど。","他にも地域ごと有名なビジネスホテルチェーン店があるため、予約サイト上の写真・設備情報や利用者による評価をみて判断すると良い。"]},{"t":"p","html":"宿泊場所に迷ったら有名なチェーン店がおすすめ"}]},{"heading":"外資系有名ホテル","level":3,"blocks":[{"t":"p","html":"家族・友人知人が中国にくる際、予算に余裕がある場合には外資系ホテルを利用するのもおすすめ。\u003cbr>ホテルによっては、日本などよりも宿泊料金が安く設定されていてお得な場合がある。"},{"t":"list","ordered":false,"items":["丽思卡尔顿酒店/The Ritz-Carlton、希尔顿/Hilton、洲际酒店/Intercontinental Hotel、诺富特/Novotel、半岛/Peninsula、凯悦/Hyatt、万豪/Marriott、香格里拉/Shangri-la、四季酒店/Four Seasons、文华东方/Mandarin Oriental、喜来登/Sheraton。","日系有名ホテル対訳：日航飯店/ニッコー・ホテル、長富宫飯店/ホテルニューオータニ。"]}]},{"heading":"■ 北京大学周辺ホテル例","level":2,"blocks":[{"t":"p","html":"北京大学周辺には、国内外著名専門家・来賓が大学を訪問する際にも利用可能なレベルの4-5つ星ホテルがあります。\u003cbr>家族・友人知人が中国・北京大学にくる際、予算に余裕がある場合にはおすすめ。"},{"t":"list","ordered":false,"items":["\u003cstrong>北京大学中关新园/Global Village\u003c/strong>：400-1500元/日（4つ星ホテル・北京大学系施設・北京大学東南門の東側。在校生予約の場合は割り引き適用）：\u003cbr>\u003ca href=\"https://pkugv.pku.edu.cn/\" target=\"_blank\" rel=\"noopener\">https://pkugv.pku.edu.cn/\u003c/a>　 \u003ca href=\"http://www.globalvillagepku.com/\" target=\"_blank\" rel=\"noopener\">http://www.globalvillagepku.com/\u003c/a>","\u003cstrong>博雅国际酒店/The Lake View Hotel\u003c/strong>（5つ星ホテル・北京大学系施設・北京大学東北側）：1000-4000元/日 \u003cbr>\u003ca href=\"http://www.thelakeviewhotel.com.cn/\" target=\"_blank\" rel=\"noopener\">http://www.thelakeviewhotel.com.cn/\u003c/a>","\u003cstrong>北京文津国际酒店/WenJin International Hotel\u003c/strong>（４つ星ホテル・北京大学東門の東側）：600-3000元/日 \u003cbr>\u003ca href=\"http://wenjin.beijing-hotels.cn/\" target=\"_blank\" rel=\"noopener\">http://wenjin.beijing-hotels.cn/\u003c/a>","北京友谊宾馆/BeiJing Friendship Hotel（中国風・庭園付きホテル・人民大学近く）：　 \u003cbr>\u003ca href=\"http://www.bjfriendshiphotel.com/\" target=\"_blank\" rel=\"noopener\">http://www.bjfriendshiphotel.com/\u003c/a>","富驿时尚酒店(北京中关村店)/FuramaXpress Hotel （ビジネスホテル・北京大学西南門近く）：　\u003cbr>\u003ca href=\"https://www.fxhotels.com/index.aspx\" target=\"_blank\" rel=\"noopener\">https://www.fxhotels.com/index.aspx\u003c/a>"]}]},{"heading":"■ 注意点","level":2,"blocks":[]},{"heading":"外国人の宿泊","level":3,"blocks":[{"t":"note","kind":"warn","html":"⚠️ 中国のホテルには旧制度の名残で\u003cstrong>外国人の宿泊を断るホテルが一部あり\u003c/strong>"},{"t":"list","ordered":false,"items":["以前はホテル側が外国人宿泊の資格を所有してないと外国人の宿泊ができない制度だったが、現在は資格不要。しかし、元々資格が無かったホテルを中心に\u003cstrong>外国人の宿泊手続き方法が不明なので拒否or現在も資格が必要と勘違いしているホテルも一定数有り\u003c/strong>。","特に\u003cstrong>地方都市にある非チェーン店系の安いホテル・2つ星以下のホテル\u003c/strong>は、外国人宿泊不可の場合も多いため注意。","地方都市で宿泊する場合、慣れていない場合はチェーン店系か少し高めのホテルを利用。慣れていないが選択肢が無いという場合は、予約の際にチャットや電話で外国人宿泊の可否を\u003cstrong>事前確認\u003c/strong>すると良い。","外国人は宿泊できないと言われた場合や、スタッフが外国人宿泊手続きの方法がわからないという場合でもそのホテルに宿泊したい場合は、スタッフに相談・説明の上、自分でホテルスタッフに宿泊手続き方法を教えるか、近くの派出所・公安に手続きをしに行くなどをして手続きして宿泊することも可能（中国に慣れていないと難しい。ネット上の情報を参考に手続きするなどで対応）。"]}]},{"heading":"ホテル設備不良等の問題","level":3,"blocks":[{"t":"note","kind":"warn","html":"⚠️ 部屋の中の\u003cstrong>設備が不良・壊れている\u003c/strong>という場合が時々あり（特に低価格帯のホテルの場合）"},{"t":"list","ordered":false,"items":["ユースホステルや1泊100元以下などの場合、シャワーのお湯が出ない、シャワーの水の出が悪い、ドアや窓が閉まりにくい、トイレが供用で非常に汚い、タバコや何かの匂いがする等、価格帯相応の不備あり。","中高価格帯でも、シャワーのお湯が出ない、シャワーのお湯がぬるい、テレビがつかない、コンセントの電気が無い等の不備がある場合もあり。その場合は、受付へ連絡して部屋を交換してもらうなどの対応をとってもらう（中国はこのあたりは比較的柔軟なので、不備があればなるべく受付へ相談する）。"]}]},{"heading":"水道水の水質","level":3,"blocks":[{"t":"note","kind":"warn","html":"⚠️ 地域により水質に大きな差あり"},{"t":"list","ordered":false,"items":["北京や北部は水道水が硬水、沿岸部や南部を中心に水道水が軟水","水道水やシャワーのお湯・水の水質が飲用に適さないものや非常に硬い・硬水で髪の毛がゴワゴワになりやすいなどがあるので、慣れていない人はホテル宿泊の際に最初にチェックしておくと良い","水道水を飲む場合、そのまま飲んでも問題ないレベルの地域もありますが、多くの地域では煮沸してから飲むのが一般的です。多くの地域ではそのまま飲んでも問題ありませんが、一部地域や硬度が高い地域では、硬水の水を飲んだ場合と同様に体質によっては下痢・腹痛を起こす場合があります。","見てわかるほどに色や濁りなどがある場合には、うがい・歯磨きなどで口に含むだけの場合も、煮沸してから使用してください。"]}]},{"heading":"◾️中国語関連用語","level":2,"blocks":[{"t":"p","html":"在线支付　zàixiàn zhīfù　オンライン決済\u003cbr>到店付款　dào diàn fùkuǎn　現地払い\u003cbr>优惠价　yōuhuì jià　割引料金\u003cbr>含早餐　hán zǎocān　朝食込み"},{"t":"p","html":"单人间　dānrénjiān　シングルルーム\u003cbr>双人间　shuāngrénjiān　2人部屋\u003cbr>大床房　dàchuángfáng　ダブルベッドの部屋\u003cbr>双床房　shuāngchuángfáng　ツインルーム（ベッド２つ）\u003cbr>标准间　biāozhǔnjiān　スタンダードルーム\u003cbr>豪华房　háohuáfáng　デラックスルーム\u003cbr>无烟房　wúyānfáng　禁煙室\u003cbr>吸烟房　xīyānfáng　喫煙室\u003cbr>无窗房　wúchuāngfáng　窓なしの部屋\u003cbr>有窗房　yǒu chuāngfáng　窓ありの部屋\u003cbr>阳台房　yángtái fáng　バルコニー付き客室\u003cbr>景观房　jǐngguān fáng　景観・眺望のある部屋\u003cbr>湖景房　hújǐng fáng　湖が見える部屋\u003cbr>江景房　jiāngjǐng fáng　川が見える部屋\u003cbr>海景房　hǎijǐng fáng　海が見える部屋"},{"t":"p","html":"客厅　kètīng　リビング\u003cbr>卧室　wòshì　寝室\u003cbr>干湿分离　gān shī fēnlí　乾湿分離（シャワー・洗面などを分離）\u003cbr>干区　gānqū　乾燥エリア（洗面など）\u003cbr>湿区　shīqū　水回りエリア（シャワーなど）\u003cbr>独立卫生间　dúlì wèishēngjiān　独立したバス・トイレ\u003cbr>独立卫浴　dúlì wèiyù　独立したバスルーム\u003cbr>浴缸　yùgāng　浴槽\u003cbr>冰箱　bīngxiāng　冷蔵庫\u003cbr>微波炉　wēibōlú　電子レンジ\u003cbr>洗衣机　xǐyījī　洗濯機\u003cbr>烘干机　hōnggānjī　乾燥機"}]}],"wip":false},{"id":"n42015e37d961","title":"3.1 留学生寮（中关新园）設備・ルール","directoryTitle":"3.1 留学生寮（中关新园）設備","category":"housing","tags":{"housing":["dorm"]},"editorNote":"","published":"2026-08-05","modified":"2026-09-06","chars":9167,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["北京大学には複数の寮がありますが、外国人留学生の主な住居となるのが\u003cstrong>中关新园\u003c/strong>です。","ここでは、北京大学の留学生寮\u003cstrong>中关新园\u003c/strong>についての情報をまとめています。"]},{"t":"p","html":"中关新园のイメージ画像"}]},{"heading":"1．北京大学の留学生寮","level":2,"blocks":[{"t":"p","html":"\u003cstrong>①中关新园\u003cbr>\u003c/strong>外国人留学生のメインとなる寮です。\u003cbr>1,500人前後の留学生が生活しており、北京大学の留学生の大部分がここに居住しています。\u003cbr>基本的には外国人留学生向けですが、国際交流プログラムの中国人学生や、サマースクール参加者などが利用することもあります。"},{"t":"card","title":"北京大学中关新园","site":"pkugv.pku.edu.cn","url":"https://pkugv.pku.edu.cn/index.htm"},{"t":"p","html":"\u003cstrong>②勺园\u003c/strong>\u003cbr>主に特定のプログラム・中国人大学院生向けの寮です。\u003cbr>燕京学堂（Yenching Academy）の学生用の部屋はリフォームされています。\u003cbr>中国人大学院生も勺园に住んでいますが、こちらは通常の寮です。"},{"t":"p","html":"\u003cstrong>③その他\u003cbr>\u003c/strong>プログラムによっては、中国人学生向けの寮に入居できる場合もあります。また、元培学院などでは、中国人学生と外国人学生が混住するケースもあります。"}]},{"heading":"2．中关新园（Zhongguanyuan Global Village, PKU）","level":2,"blocks":[{"t":"p","html":"中关新园は、単なる留学生寮向け施設ではなく、"},{"t":"list","ordered":false,"items":["留学生寮、外国人教員寮、ホテル、レストラン、コンビニ、会議室、スポーツ施設など"]},{"t":"p","html":"が一体となった複合型施設です。\u003cbr>そのため、国内外から北京大学への来賓・来客の宿泊や各種国際会議の開催などにも利用されます。"},{"t":"label","html":"建物構成"},{"t":"dl","rows":[{"k":"1号楼","v":"総合受付（入寮退寮含む）、ホテル・会議室（4つ星：ビジネスホテルの上のランク、国際会議開催可能レベル。ホテルは1泊400-1500元程。北京大学在学生が予約すると10%前後割引）"},{"v":"\u003cstrong>2〜6号楼：留学生寮\u003c/strong>（数種類の部屋タイプあり：1人部屋、2人部屋、4人部屋）"},{"k":"2号楼","v":"1階に中華レストラン（北京ダックなどあり）。2階にホテル用ビュッフェ・バイキング（1号楼ホテル用だが、朝食は自費100元前後でも利用可能）"},{"k":"5号楼","v":"1階に中華レストラン。2階に寮用図書館、会議室（学生も留学生事務室に申請で活動・勉強会などに利用可能）"},{"k":"7号楼","v":"寮事務所・会議室など"},{"k":"8号楼","v":"ポスドク部屋（家族用の部屋など）"},{"k":"9号楼","v":"外国人教員寮（家族用の部屋など、外国人教員向け）、ホテル（中关新园のホテルは1号楼と9号楼の2箇所）"},{"k":"コンビニ","v":"4号楼と6号楼の間。飲食品・果物、生活雑貨等。"},{"k":"地下","v":"4号楼横階段が入口。康乐中心/複合型スポーツ施設。ジム、バドミントン、スカッシュ、ビリヤード、ボーリング、ダンス、プール（水深2m程、サウナ付き）、カラオケなど（全体的にキャンパス内施設より高め・外の施設と近い金額。ジムなどは1〜数ヶ月単位で利用券を購入すると割安。利用は地下受付から）。"},{"k":"テニスコート・バスケコート・小さい公園","v":"9号楼東側にあり（利用は無料、近隣住民も利用）。"}]},{"t":"p","html":"中关新园の地図のイメージ"},{"t":"p","html":"4号楼と6号楼の間のコンビニ/便利店のイメージ画像 営業時間：07:00-23:00 長期休暇中は営業時間変動あり（別途通知）"},{"t":"p","html":"怡园中餐厅：2号楼1階、时光西餐厅：2号楼2階、 和园餐厅：5号楼1階"},{"t":"p","html":"康乐中心施設のイメージ画像"}]},{"heading":"3．部屋のタイプ・家賃（2025年時点参考）","level":2,"blocks":[{"t":"p","html":"留学生寮は、一般の賃貸物件の価格設定・市場価格に合わせて家賃が設定されています。そのため、大学周辺の賃貸物件相場と家賃は同程度です。\u003cbr>中関新園の部屋のタイプは次の4種類があります："},{"t":"list","ordered":false,"items":["\u003cstrong>①シャワー・トイレ付・１人部屋（完全な１人部屋）：\u003c/strong>"]},{"t":"list","ordered":false,"items":["1泊150元 ＝ 1ヶ月4500元（約10-11万円） ＝ 11ヶ月49500元（約110-120万円）。","参考画像：\u003ca href=\"https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/drj/index.htm\" target=\"_blank\" rel=\"noopener\">https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/drj/index.htm\u003c/a>"]},{"t":"label","html":"②シャワー・トイレ付・２人部屋（部屋２つと共有部屋１つ。１部屋に１人住むタイプ）："},{"t":"list","ordered":false,"items":["1泊120元 ＝ 1ヶ月3600元（約8.5-9万円） ＝ 11ヶ月39600元（約95-100万円）。","参考画像：\u003ca href=\"https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/lrj/index.htm\" target=\"_blank\" rel=\"noopener\">https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/lrj/index.htm\u003c/a>"]},{"t":"label","html":"③シャワー・トイレ付・４人部屋（部屋２つと共有部屋１つ。１部屋に２人住むタイプ）："},{"t":"list","ordered":false,"items":["1泊80元 ＝ 1ヶ月2400元（約5.5-6万円） ＝ 11ヶ月26400元（約60-65万円）。","参考画像：\u003ca href=\"https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/srj/index.htm\" target=\"_blank\" rel=\"noopener\">https://pkugv.pku.edu.cn/kfgy/gy/26hllxsgy/srj/index.htm\u003c/a>"]},{"t":"p","html":"④2\u003cstrong>人部屋（部屋1つのみ。１部屋に２人住むタイプ。シャワー・トイレはフロア共用）：\u003c/strong>"},{"t":"list","ordered":false,"items":["1泊120元 ＝ 1ヶ月3600元（約8.5-9万円） ＝ 11ヶ月39600元（約95-100万円）。","※主に寮費免除を含む奨学金プログラムと一部交換留学生向け・主に5号楼"]},{"t":"note","kind":"warn","html":"⚠️中国の大学の学生寮は安いと聞く人がいるかもしれませんが、それは留学生寮ではなく中国人学生寮の場合です（4人1部屋で1年で2000元＝4-5万円などに設定されています）。"},{"t":"note","kind":"warn","html":"⚠️奨学金により寮費が免除となる留学生が多いとの情報もありますが、中关新园では主に5号楼に奨学金生が住んでおり、他の2、3、4、6号楼の学生は基本的に家賃が自費となり、大多数/8割の留学生は寮費自費であることも注意してください（ごく稀に寮費無料と勘違いして留学予算を計算する方がいます）。"},{"t":"p","html":"中关新园留学生宿舍の部屋の中のイメージ画像"},{"t":"p","html":"洗面台、トイレ、シャワーのイメージ画像"}]},{"heading":"4．生活設備","level":2,"blocks":[{"t":"p","html":"留学生寮には最初から次のような家具・設備が備え付けられています。"},{"t":"label","html":"部屋の中："},{"t":"list","ordered":false,"items":["ベッド、敷布団/敷布団カバー、布団&amp;布団カバー、枕&amp;枕カバー、クローゼット、ミニチェスト、棚、椅子、机、電気ポッド/ケトル、ゴミ箱、テレビ","エアコン、温水暖房（冬のみ稼働）、洗面器、様式トイレ&amp;シャワー（部屋に無い場合はフロア共有）、WiFi/インターネット","※不要なものがある場合には、寮スタッフに連絡すると撤去してもらうことができます。","※壊れたり修理が必要な場合にも、寮スタッフに連絡すると無料で対応してもらえます。"]},{"t":"label","html":"寮内・フロアに設置："},{"t":"list","ordered":false,"items":["洗濯機・乾燥機・靴用洗濯機（有料）、共用キッチン（IHコンロ・水道・調理スペース）、共用シャワー・トイレ（5号楼のみ）","自習ルーム（各楼１つ）"]},{"t":"p","html":"洗濯機・乾燥機のイメージ画像"},{"t":"p","html":"自習室のイメージ画像"},{"t":"label","html":"寮１階フロアのみ："},{"t":"list","ordered":false,"items":["各楼専用受付（寮スタッフ滞在）、自動販売機","外卖柜（入り口外・近く）","大きいゴミ出しスペース（可燃ごみ、ビンカンなどは分類して捨てる。大きいゴミはスペースに置いておくと回収してくれる）"]},{"t":"note","kind":"warn","html":"⚠️洗濯機・乾燥機は有料で、WeChat PayやAlipayなどで支払います。現金しかない場合には、友人知人に支払ってもらうか、寮スタッフに頼んでください。"},{"t":"label","html":"部屋についていないもの（自分で購入が必要なもの）"},{"t":"p","html":"卓上電気スタンド、延長コード、冷蔵庫、ドライヤーなど"}]},{"heading":"5．スポーツ・娯楽施設","level":2,"blocks":[{"t":"p","html":"中关新园には\u003cstrong>康乐中心\u003c/strong>というスポーツ・娯楽施設（有料）があります。9号楼東側はテニスコートとバスケットボールコート（無料）もあります。"},{"t":"label","html":"康乐中心施設："},{"t":"list","ordered":false,"items":["ジム、バドミントン、スカッシュ、ビリヤード、ボウリング、プール（サウナ付き）、カラオケ、麻雀、多目的ホールなど"]},{"t":"p","html":"※大学内の学生用施設より料金設定が高く、学外の施設と同程度かやや安い程度。"},{"t":"label","html":"9号楼の東側（無料）："},{"t":"list","ordered":false,"items":["テニスコート・バスケットボールコート"]}]},{"heading":"6．寮のサービス","level":2,"blocks":[{"t":"p","html":"中关新园では、寮スタッフによる各種サポートを受けられます。"},{"t":"label","html":"①修理・メンテナンス"},{"t":"list","ordered":false,"items":["エアコン・暖房の故障、温度が下がらない・上がらない、エアコンの水漏れ、エアコンの定期クリーニングなど","照明の故障、電気がつかないなど","部屋の備品の破損、交換","網戸の修理・交換","椅子、机、クローゼットなどの破損、がたつきなどの修理、交換など","殺鼠剤・忌避剤の部屋入り口横への散布など"]},{"t":"p","html":"などは、受付・寮スタッフに連絡して無料で修理・交換を依頼できます。\u003cbr>ただし、明らかに故意に破損させた場合には、修理費を請求される場合もあります。\u003cbr>また、定期的な設備メンテナンスについても、寮側が事前に通知して、全部屋対象または申請者の部屋対象で対応してくれます。"},{"t":"label","html":"②掃除・ゴミ出し"},{"t":"list","ordered":false,"items":["主に、部屋備え付けのトイレ・シャワー、洗面台部分の掃除、ゴミ箱のゴミ出しを週２回ほど寮スタッフが行ってくれます。","寮スタッフが毎週決まった曜日に各フロア専用のマスターキーを使って部屋に勝手に入ってきてくれるので、学生は部屋に滞在する必要はありません。","⚠️部屋に寮スタッフが勝手に入ってくるのが嫌な場合には、掃除を断ることもできるので、その場合は事前に寮スタッフに連絡してください。ただし、掃除やゴミ出しは自分で行うか、必要な時だけ寮スタッフを呼ぶことになります。"]},{"t":"label","html":"③各楼1階受付・1号楼1階受付スタッフによる各種対応"},{"t":"list","ordered":false,"items":["入居時・入居後の各種手続き申請に関する簡単な情報の提供・アドバイス","住宿登记表など各種居住関連資料の発行","部屋のカードキーを部屋の中に忘れた際に、代替カードキーのレンタル","カードキーの再発行（有料、20元ほど）","各種問い合わせ、相談、苦情連絡など","緊急時の対応（警察、救急車など）"]},{"t":"label","html":"④定期的なイベントの開催"},{"t":"list","ordered":false,"items":["留学生向けの中国文化体験（中国茶、漢服、月饼/喜饼作り、中国文化講座、参加無料）","寮の留学生・寮スタッフなどが参加するスポーツイベント（ミニマラソン、バドミントン、ミニ運動会、ボーリング大会など。参加無料、北京大学グッズなどの景品あり）","卒業記念写真の無料撮影会","卒業シーズンの中古品売買イベントの開催","⚠️イベントの申し込みは基本的に先着順なので、情報を確認次第早めに応募が必要"]}]},{"heading":"7．寮のルール（引越・延長・違反）","level":2,"blocks":[{"t":"p","html":"寮にはいくつかルールが設けられています。"}]},{"heading":"部屋の引越・移動","level":3,"blocks":[{"t":"list","ordered":false,"items":["寮の中で別の部屋へ引越・移動したい場合は、寮のスタッフへ連絡してください。","寮の部屋に空きがあり、尚且つ適切な理由があれば部屋の移動が可能です。","寮のスタッフが適切な理由でないと判断した場合は移動できないこともありますが、それでも移動したい場合は、理由を増やす・強調するなどすると移動させてもらえる場合もあります。","移動することを決めた場合は、1号楼受付で再度契約書を書き直します。","移動する日を決めると、その日に移動先の部屋のカードキーを受け取ることができます。また、その日一日は現在の部屋と移動先の部屋の２つの部屋のカードキーを同時所有でき、引っ越し作業ができます。ただし、基本的には08:00-17:00の時間帯内に現在の部屋のカードキーを返却しなければならないので、効率よく作業してください（寮のスタッフに事情を説明すれば２日目も現在の部屋のカードキーを利用できる場合あり）。"]},{"t":"p","html":"移動理由例："},{"t":"list","ordered":false,"items":["ルームメイトとの生活習慣やスタイルの相性・摩擦により部屋を変更したい","夏場・冬場に部屋が暑すぎ・寒すぎるが冷房・暖房があまり効かないので移動したい","部屋が１階でカーテンを閉めていない場合は外から部屋の中が見えてしまう場所なので移動したい","部屋を４人部屋から２人部屋・１人部屋に移動したい","部屋が１０階にありエレベーターなどでの移動が大変なので１階に移動したい","など"]}]},{"heading":"部屋の契約延長","level":3,"blocks":[{"t":"list","ordered":false,"items":["部屋の契約期間が過ぎる前であれば、部屋の契約期間を延長することができます。例えば、7月10日までの契約の場合、7月10日までに1号楼の受付へ行き、契約延長を申請してください。延長は１日単位で申請可能です。","延長は、大学在籍中の期間または居留許可の有効期間の範囲内で可能です。","日本の大学からの交換留学や奨学金関連のプログラムの場合、部屋の契約期間が延長できない場合もあります。また、奨学金関連で部屋を提供されている場合には、延長すると自費に切り替わる場合もあります（例えば、7月10日まで奨学金適用、7月11日からは自費でのみ対応）。","卒業・修了の年の場合は、特別な理由がない限り部屋の延長はできません。"]}]},{"heading":"夏休み中の一時退去・荷物預かり","level":3,"blocks":[{"t":"p","html":"中关新园の寮の部屋は、夏休みになると、北京大学で行われる各種サマースクールプログラムに参加する中国人学生・外国人留学生の部屋としても利用されます。毎年多くの学生がサマースクールに参加するため、寮側もなるべく多くの空き部屋の確保をしています（寮に住めない学生はホテルなどに住む状況）。\u003cbr>寮側では空き部屋の確保と在学生の寮費負担軽減&amp;部屋の確保を考慮し以下のようなサービス・対応を行っています：\u003cbr>　・7-8月に部屋を完全に空き部屋にする\u003cbr>　・7-8月の退去期間中は寮費支払い不要\u003cbr>　・荷物は寮の倉庫で一時保管\u003cbr>　・新学期開始時の部屋の確保を約束（予約なしで寮に入居できる）"},{"t":"p","html":"このサービスを利用する際は下記の点に注意してください：\u003cbr>　・7-8月中は寮に住めない・戻れない\u003cbr>　・新学期に寮に住める・戻れるのが9月以降になる（授業開始数日前）\u003cbr>　・特に要望しなければ、部屋のタイプ・家賃は同じだが場所が変わる"}]},{"heading":"違反行為とその対応","level":3,"blocks":[{"t":"p","html":"ルール違反が寮管理者に報告され、合計3回を超えると寮の契約延長停止や強制退寮になるため注意してください（基本的にはルームメイトや隣人に迷惑がかからないようであれば問題ありません）。"},{"t":"label","html":"違反行為例："},{"t":"list","ordered":true,"items":["部屋の中での電動自動車用バッテリーの充電（発火のリスクがあるため）","部屋の中でガスコンロ・IHコンロなどを使っての調理（発火のリスクがあるため。炊飯器や各種調理器具をフロアのキッチンに持って行って使うことは可）","部屋での他人の宿泊（中关新园の他の部屋に住んでいる留学生も対象）","ペットの飼育（基本的には猫や犬など鳴き声や臭いの問題がある動物が対象だが、寮スタッフによっては魚・亀/爬虫類・虫などでも各種理由で違反認定する場合あり）","ルームキーの他人への貸出（特に大きな問題が発生した場合に違反対象）","室内での喫煙","騒音（大音量で音楽を流す、大音量で楽器を演奏する、友人知人と集まって部屋の外・廊下に聞こえるくらい騒ぐなど。主に22:00-08:00の時間帯の騒音が違反対象、他の時間帯は基本的に注意されるのみ）","寮への連絡申請なしに寮の部屋を他の人の部屋と勝手に交換する（部屋の移動・交換をしたい場合は寮スタッフへ連絡必須）","寮に住んでいない人が寮に入る際に1階入口で受付をせずに入った、または08:00-22:00の時間内に寮から出て行っていない（中关新园に住んでいない学生はすべて対象なので、家族知人友人や賃貸物件に住んでいる北京大学留学生などの場合も、寮に入る際には受付で名前などを記入必須）","他の理由（大きな問題が発生した場合）"]},{"t":"label","html":"違反行為認定のおおまかなプロセス："},{"t":"p","html":"①ルームメイト、隣人、上下の部屋など違反行為の影響を受ける人や他の人から寮スタッフへの報告・相談・苦情連絡。\u003cbr>②寮スタッフによる状況確認・証拠確認（騒音などの場合はその場で注意して終わり）。\u003cbr>③寮スタッフが違反認定（騒音などの場合はすぐに違反認定されるわけではなく、寮スタッフが注意しても解決しなかった場合や何度も苦情連絡が来た場合に違反認定される）。\u003cbr>④寮スタッフが違反者を呼び出して違反通知を発行。"},{"t":"note","kind":"warn","html":"⚠️違反通知が合計３回で契約期間延長停止（契約期間終了後は中关新园に住むことができない）、または寮宿泊資格の取消し（強制退去）となります。"},{"t":"note","kind":"warn","html":"⚠️基本的には、集団生活での問題発生防止・問題解決手段としてルールの決定と違反通知をしているため、ルームメイトや隣人等に事前に了承を得ていれば、寮スタッフに苦情連絡をされたり違反認定されることはありません。"},{"t":"note","kind":"warn","html":"⚠️寮では違反行為防止のために、年１〜４回ほど、事前通知・予告をし上で寮スタッフによる部屋の見回り・チェックを実施しています。見回りがある際は、違反に当たるものなどの処理に注意してください。"},{"t":"note","kind":"warn","html":"⚠️ペットなどについては、トイレ・シャワー等の掃除・ごみ出しで寮スタッフが部屋に入った際に見つかる場合があるので注意。"},{"t":"p","html":"違反通知のイメージ画像 該当する違反行為にマークがつけられます 3回目（最終）の違反通知で宿泊資格取消し（強制退去）または契約期間延長停止となる"},{"t":"p","html":"違反３回以上での強制退去の通知のイメージ画像"}]},{"heading":"8．寮 Tips","level":2,"blocks":[{"t":"p","html":"寮の部屋で生活する際、さまざまな方法で生活環境を改善することができます。"},{"t":"label","html":"ベッドにマットレスを追加"},{"t":"list","ordered":false,"items":["寮のベッドは丈夫で硬めのマットレスが使われています。柔らかいマットレスを好む方は、柔らかいマットレスを購入して上から重ねるのがおすすめです。","留学期間が1年未満の場合には、100元以下の安価なスポンジのマットレスでも留学終了まで特に問題なく使用できます。","ベッドサイズ：1.1m ×　1.8m　（サイズが異なる可能性があるため要確認）"]},{"t":"p","html":"柔らかいマットレスを購入してひくイメージ画像"},{"t":"label","html":"部屋の机、クローゼット、壁にフックをつける"},{"t":"list","ordered":false,"items":["寮の机、クローゼット、壁などには粘着テープでくっつくフックをつけても問題ありません。トイレ・シャワー・洗面台周辺にもつけることが可能です。","フックをつけると、バッグやリュックをかけたり、部屋の整理などが便利になります。","寮の壁は、学生が退寮した後に簡単な修理がおこなわるため、少しくらいの傷や跡は残っても問題はなく、弁償の請求もされません。また、数年に１回室内壁用のペンキで全面的に塗り直したりもしています。"]},{"t":"p","html":"クローゼット横や壁にフックをつけたイメージ画像"},{"t":"label","html":"床にカーペットをひく"},{"t":"list","ordered":false,"items":["寮の部屋の床はタイル張りになっています。人によって部屋の中では靴を脱ぐか脱がないか、異なる使い方をしています。","部屋では靴を脱ぐ場合や秋〜冬に床が冷たいと感じる場合には、床にカーペットをひくのがおすすめです。","大きなカーペットを１枚、小中サイズのカーペットを複数枚、タイルカーペットを敷き詰めるなど、ひき方はさまざまです。","床のタイル1枚の大きさ：60cm × 60cm"]},{"t":"p","html":"床にカーペットをひいたイメージ画像"},{"t":"label","html":"ドアの隙間に防音用ゴム・スポンジなどをつける"},{"t":"list","ordered":false,"items":["寮の部屋のドアの下はドアの開閉がスムーズになるように数ミリ〜１センチほどの隙間が空いています。","隙間があるため、内外の音漏れがあったり、冬は冷たい風が入ってきたりすることが気になる学生も一定数います。","防音用のゴム・スポンジなどの製品がネットなどで販売されているので、音や隙間風が気になる方は装着するのがおすすめです。","门、门底、门缝、噪音、隔音、密封条、防风条、静音条、静音贴などでネットショッピングで検索すると製品が出てきます。","⚠️部屋によってはドアの隙間は非常に狭いため、なるべく薄いゴム・スポンジの製品を利用してください。一番薄い製品でもドアが閉まりにくくなる・閉まらなくなる場合もあるので、その場合は隙間のある部分にだけ使用（ハサミで短く切って貼り付け）したり、さらに薄い製品を購入して使用してください。"]},{"t":"p","html":"上：隙間に貼るゴム・スポンジのイメージ画像 下：ドア下の隙間を埋めるスポンジ・ゴムの製品のイメージ画像"},{"t":"label","html":"ウォーターサーバーを購入"},{"t":"list","ordered":false,"items":["北京の水道水は水が硬質のため、そのまま水道水を飲むのに体が慣れていない人も一定数います。また、電気ポット/ケトルで沸かしたりすると白い水垢が残りやすいです。","普段から水道水ではなく、購入した水を飲み水として利用する場合には、ウォーターサーバーを購入して、タンクの水を購入すると便利です。","特に普段から料理をすることが多く、料理でも購入した飲み水を使う場合には、多量の水が必要になるので、ウォーターサーバとタンクを購入するのがおすすめです。","ウォーターサーバーもタンクも、ネットや外卖などで購入が可能ですが、中国には飲み水を専門に扱う業者があり、寮・北京大学周辺にもあります。その業者に頼むと、比較的安価にタンクを注文することができます。","業者にタンクを注文した場合は、寮の入り口または部屋の中までタンクを持ってきてくれます（寮の管理状況により入り口までか部屋までかは異なるので、寮スタッフに要確認）。","業者ではウォーターサーバーだけでなく、500ml〜5Lのペットボトルの水のまとめ売りもしているので、500mlペットボトル24本を3セット購入するなども可能です。各業者が各種ブランドの水を取り扱っています。"]},{"t":"p","html":"左：水販売業者のイメージ画像 中：ウォーターサーバーとタンクのイメージ画像 右：各種飲料水とタンクの例"},{"t":"p","html":"水販売業者の例 WeChatまたは電話で問い合わせてサーバーと水の購入ができる 一定の水票/水購入券をまとめ買いすると、各種サーバーが無料で提供される"},{"t":"p","html":"\u003cstrong>関連単語：\u003c/strong>\u003cbr>\u003cstrong>桶装水　\u003c/strong>tǒng zhuāng shuǐ　容器入りの大容量飲料水・水のタンク\u003cbr>\u003cstrong>饮用水　\u003c/strong>yǐn yòng shuǐ　飲料水（飲み水全般）\u003cbr>\u003cstrong>纯净水　\u003c/strong>chún jìng shuǐ　精製水（浄水した飲み水）\u003cbr>\u003cstrong>矿泉水　\u003c/strong>kuàng quán shuǐ　ミネラルウォーター（天然水、元々綺麗な水を利用した飲み水）\u003cbr>\u003cstrong>水桶　\u003c/strong>shuǐ tǒng　水ボトル・水タンク\u003cbr>\u003cstrong>空桶　\u003c/strong>kōng tǒng　空ボトル・空タンク\u003cbr>\u003cstrong>饮水机　\u003c/strong>yǐn shuǐ jī　ウォーターサーバー\u003cbr>\u003cstrong>台式饮水机　\u003c/strong>tái shì yǐn shuǐ jī　卓上型ウォーターサーバー\u003cbr>\u003cstrong>立式饮水机\u003c/strong>l　ì shì yǐn shuǐ jī　床置き型ウォーターサーバー\u003cbr>\u003cstrong>送水员　\u003c/strong>sòng shuǐ yuán　水配達員\u003cbr>\u003cstrong>水站　\u003c/strong>shuǐ zhàn　給水・桶装水販売店・水倉庫（大学周辺にも数箇所あり）\u003cbr>\u003cstrong>订水　\u003c/strong>dìng shuǐ　水を注文する\u003cbr>\u003cstrong>买水　\u003c/strong>mǎi shuǐ　水を買う\u003cbr>\u003cstrong>配送地址　\u003c/strong>pèi sòng dì zhǐ　配送先住所\u003cbr>\u003cstrong>送到宿舍　\u003c/strong>sòng dào sù shè　寮まで届ける\u003cbr>部屋まで届けてもらう場合は「\u003cstrong>送到中关新园 X号楼 YYYYYY号房间」\u003c/strong>と連絡\u003cbr>\u003cstrong>一桶　\u003c/strong>yì tǒng　1本・1ボトル・1タンク\u003cbr>\u003cstrong>一桶多少钱？　\u003c/strong>yì tǒng duōshao qián　1本いくらですか？\u003cbr>\u003cstrong>18.9升　\u003c/strong>shíbā diǎn jiǔ shēng　18.9L（5ガロン、一般的な1本あたりの量）\u003cbr>\u003cstrong>押金　\u003c/strong>yā jīn　預かり金・デポジット（初回購入時にボトル・タンク代として必要）\u003cbr>\u003cstrong>水票　\u003c/strong>shuǐ piào　水の回数券・購入券（まとめ買いすると値引きされることが多い）"}]}],"wip":false},{"id":"n690d781e6106","title":"2.1 中国渡航後・北京大学到着直後","directoryTitle":"2.1 空港 → 北京大学までの移動","category":"procedure","tags":{},"editorNote":"","published":"2026-07-30","modified":"2026-08-29","chars":2025,"sections":[{"heading":"✈️中国への渡航日","level":2,"blocks":[{"t":"list","ordered":false,"items":["「入学許可書/录取通知书」に記載されている\u003cstrong>入学手続き（报到/Registration）の日の朝\u003c/strong>までに、北京大学・北京大学周辺に到着する日程で渡航準備を進めてください。入学手続きは手続き日の16:00（日本時間17:00）頃には終了します。","多くの留学生は、入学手続き日の\u003cstrong>１〜３日前\u003c/strong>に北京に到着し、大学の留学生寮又は予約・契約した賃貸・ホテルに住み始めます。","新入生は入学手続き当日まで北京大学のキャンパス内に入れない可能性があるので注意してください。入学手続き当日にキャンパス内に入る際は、門の顔認証で顔をスキャンするか、スキャンしても通れない場合は大学の門の警備員に入学許可証/录取通知书の写真やコピーを見せると入れてもらえます。","入学手続きをして学生証を取得するまたは電子版学生証の登録をするまでは、大学内の食堂は利用できない（学生証にお金をチャージして学生証で購入）ので注意してください。実物の学生証は入学手続き当日に渡されますが、電子版は各自スマホから登録が可能なので、入学手続き日より早めに利用できる場合もあります。"]}]},{"heading":"2.1 空港から北京大学までの移動","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>事前準備：地図アプリを確認（心配な場合は地図画像や経路を紙に印刷）\u003c/strong>"]},{"t":"list","ordered":false,"items":["百度地图、高德地图（中国現地用）","Google Map（日本で予め確認可）"]},{"t":"label","html":"学校送迎バスの有無を確認（特に同じ大学から団体で留学するプログラムの場合）"},{"t":"list","ordered":false,"items":["新学期は、首都国際空港で学校の担当職員・学生ボランティアが指定時間・場所で迎えに来る場合あり。","個別や日本の大学の担当者宛にメール等で関連の連絡が来ていないか確認し、来ている場合は事前予約・指定時間・集合場所を確認。","メール等の連絡が来ていない場合や、指定時間外に到着の場合は、自力で大学まで移動する。"]}]},{"heading":"2.1.1 公共交通機関の支払い・切符","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>電子マネー・アプリ準備\u003c/strong>"]},{"t":"list","ordered":false,"items":["WeChat/微信、Alipay/支付宝決済","交通機関用アプリ（一卡通）"]},{"t":"label","html":"切符・現金の準備"},{"t":"dl","rows":[{"k":"アプリが使えない場合","v":"駅の自動券売機・窓口で購入"},{"k":"タクシー","v":"現金払い（小銭を準備）"},{"k":"バス","v":"乗車後、運転手横・車内前方ポスト型箱に2元投入"}]}]},{"heading":"2.1.2 寮に住む場合","level":3,"blocks":[{"t":"p","html":"寮に住む場合には、寮に近い場所にタクシーを止めてもらいましょう。"},{"t":"label","html":"北京大学中关新园に住む場合"},{"t":"dl","rows":[{"k":"タクシー","v":"「北京大学中关新园1号楼」（1号楼で入寮手続き）まで"},{"k":"地下鉄","v":"北京大学東門駅（地下鉄4号線）下車、徒歩5〜10分"},{"k":"バス","v":"「中关园」駅または「中关村北」「蓝旗营」駅下車、徒歩5〜10分"}]}]},{"heading":"北京大学勺園に住む場合","level":3,"blocks":[{"t":"dl","rows":[{"k":"タクシー","v":"「北京大学東門1号楼」まで"},{"k":"地下鉄","v":"北京大学東門駅下車、徒歩5〜10分"},{"k":"バス","v":"「中关园」駅または「北京大学西門」駅下車、徒歩"}]}]},{"heading":"2.1.4 空港から北京大学までの参考移動時間・費用","level":3,"blocks":[{"t":"p","html":"\u003cstrong>①首都国際空港→北京大学東門&amp;中関新園\u003c/strong>\u003cbr>\u003cstrong>・タクシー：\u003c/strong>40〜60分、80〜140元（夕方〜夜に四幹線〜空港間の渋滞に巻き込まれると1時間半〜2時間かかることも有り）"},{"t":"p","html":"\u003cstrong>・電車：\u003c/strong>1〜1時間20分、約30元（首都机场线25元+地下鉄5元）\u003cbr>　\u003cstrong>経路：\u003c/strong>首都国際空港第2ターミナル駅or第3ターミナル駅→首都机场线→三元橋駅→地下鉄10号線→海淀黄庄駅→地下鉄4号線→北京大学東門駅"},{"t":"p","html":"\u003cstrong>②大興国際空港→北京大学東門&amp;中関新園\u003c/strong>\u003cbr>\u003cstrong>・タクシー：\u003c/strong>1時間〜1時間40分、150〜250元"},{"t":"p","html":"\u003cstrong>・電車：\u003c/strong>1〜1時間40分、約40元（大興机场線35元＋地下鉄5元）\u003cbr>　\u003cstrong>経路\u003c/strong>：大興空港駅→大興机场線→草橋駅→地下鉄10号線→海淀黄庄駅→地下鉄4号線→北京大学東門駅"},{"t":"list","ordered":false,"items":["\u003cstrong>他地域から移動\u003c/strong>：天津・上海などから高速鉄道・列車で北京へ"]},{"t":"list","ordered":false,"items":["移動方法は事前に地図アプリで確認"]}]},{"heading":"2.2 留学生寮・賃貸・ホテル","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>寮の事前予約（寮は予科生・特定の奨学金を受給する学生以外は自分で予約が必要）\u003c/strong>"]},{"t":"dl","rows":[{"k":"9月開始","v":"7月末〜8月上旬"},{"k":"2月開始","v":"1月末〜2月上旬"},{"v":"サマースクール・短期留学は別途通知を確認"}]},{"t":"p","html":"\u003cstrong>寮が満員の場合\u003c/strong>："},{"t":"p","html":"留学生寮の部屋数は限りがあるため、半数近くの留学生は大学の留学生寮以外に住んでいます。"},{"t":"p","html":"大学の寮にすまない場合は、学校付近で賃貸を探して契約する必要があります。"},{"t":"p","html":"※ホテルや親戚や友人知人の家に一定期間or留学期間中ずっと住むのも可能。ただし、ホテル以外の場合は、公安局へ行き、住宿登記（中国国内での滞在先住所等の登録）が必要。"},{"t":"label","html":"住宿登記（滞在登録）"},{"t":"list","ordered":false,"items":["URL/QRコード：北京市公安局「北京境外人员网上住宿登记系统」"]},{"t":"list","ordered":false,"items":["\u003ca href=\"https://zwfw.gaj.beijing.gov.cn/zsdj/zsdj-q/\" target=\"_blank\" rel=\"noopener\">https://zwfw.gaj.beijing.gov.cn/zsdj/zsdj-q/\u003c/a>"]},{"t":"p","html":"中国の電話番号が必要（SIMカード購入後に手続き可能）"},{"t":"p","html":"「语言/Language」から日本語選択可"},{"t":"note","kind":"tip","html":"💡 \u003cstrong>ポイント\u003c/strong>"},{"t":"list","ordered":false,"items":["交通アプリは日本で事前に画面スクリーンショットやルート確認","タクシーは現金支払い必須、小銭を準備","寮の予約は開始10分で満員になることもあるため、事前準備は早めに"]}]}],"wip":false},{"id":"n3584dbcda120","title":"2.3 入学手続き（报到）","directoryTitle":"2.3 入学手続き・报到","category":"procedure","tags":{},"editorNote":"","published":"2026-08-04","modified":"2026-09-02","chars":2158,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["北京大学では、\u003cstrong>入学許可書に記載された入学手続き日（报到日）に手続き\u003c/strong>を行います。手続きの日に大学に到着できない・渡航が遅れる場合は\u003cstrong>必ずメールや電話等（友人知人づてでも）で必ず連絡してください。\u003c/strong>事情により入学手続きの日に手続きができなかった・間に合わなかった場合も、平日9:00-12:00, 13:00-17:00に留学生オフィスで個別手続き可能です。","プログラムや年によって日時・場所が異なるため、大学から送られてきた案内書類に沿って手続きを行なってください。例年二日間に渡り入学手続が行われ、プログラムごとに手続日がどちらか１日に割り当てられています。","遅れて手続きをする場合でも、入学手続きの日から\u003cstrong>2週間を過ぎると自動的に入学放棄扱いになります\u003c/strong>。必要に応じて大学へ連絡し、手続きのためだけに１〜２日間だけ北京大学に行き、また日本へ戻ることも各種手続きが煩雑（再度X1/X2ビザ発行）ですが可能なので、様々な方法を検討してみてください。"]}]},{"heading":"2.3.1 入学手続き当日","level":2,"blocks":[]},{"heading":"■ 持ち物チェックリスト","level":3,"blocks":[{"t":"list","ordered":false,"items":["入学許可書（录取通知书 / Admission Notification）","パスポート","証明写真 2枚","関連費用支払い手段（現金 / WeChat Pay / Alipay / クレカ / Unionpay/银联卡）※学費、保険料など、先にオンラインで支払いを済ませていて、SIMカードの購入、有料の新入生向け行事等への参加も不要であれば不要"]},{"t":"p","html":"あれば念の為次の資料も持っていく"},{"t":"list","ordered":false,"items":["JW201 / JW202表 / DQ表 / ビザ関連資料（コピー）","他留学申請で提出した資料のコピー、電子版ファイルなど"]},{"t":"p","html":"その他大学から指定されたもの"},{"t":"list","ordered":false,"items":["卒業証明書・成績表（該当者のみ。主に北京大学進学者でまだ提出していない方、特に欧米大学を6-7月に卒業したばかりの方）","居留許可申請をする人は次の資料（※居留許可の申請は後日行う人が多い。入国後30日以内であれば後日でも良い。）"]},{"t":"list","ordered":false,"items":["証明写真","住宿登記表（寮前台でスタッフに発行してもらう。賃貸の場合は最寄り派出所or公安局で発行）","健康診断書（境外人员体格检查记录验证证明・青色の証明）"]}]},{"heading":"■ 当日の主な手続き","level":3,"blocks":[{"t":"label","html":"全員："},{"t":"list","ordered":false,"items":["入学登録・学籍登録","各種資料の受け取り","学費・保険料の支払い","学生証の受け取り","新入生イベント申込み（任意）","SIMカードの購入、銀行口座開設など（任意・年により会場に各会社が担当者を派遣する場合あり）"]},{"t":"label","html":"X1ビザの人のみ（X2ビザの人は不要）："},{"t":"list","ordered":false,"items":["健康診断が必要or認証が必要な人は、医療機関までの往復無料送迎バスの予約（先着順）→後日、指定された日時・場所に集合して医療機関へ","居留許可申請手続き（9月中はいつでも可能）","公安局職員・警察による本人確認（簡単な面接、全員の場合と特定の人だけ/サンプル調査の場合あり）"]},{"t":"label","html":"その他："},{"t":"list","ordered":false,"items":["オリエンテーション参加申し込み（キャンパスツアー、長城などの観光名所無料or有料ツアーなど）"]}]},{"heading":"■ 学費・保険","level":2,"blocks":[]},{"heading":"▶ 学費","level":3,"blocks":[{"t":"list","ordered":false,"items":["費用：数万元（プログラムによる）","支払い方法："]},{"t":"list","ordered":false,"items":["オンライン","当日会場"]},{"t":"note","kind":"warn","html":"⚠️金額が高いので、中国渡航前にオンラインで支払いを済ませておくと安心"},{"t":"p","html":"大学の留学生向けシステムURL：\u003cbr>\u003ca href=\"https://www.studyatpku.com/\" target=\"_blank\" rel=\"noopener\">https://www.studyatpku.com/\u003c/a>"}]},{"heading":"▶ 保険/来华留学生保险/来華留学生保険（必須）","level":3,"blocks":[{"t":"dl","rows":[{"k":"半年","v":"400元　（800元プランを選択後、対象期間を180日未満に設定すると400元になる）"},{"k":"1年","v":"800元"},{"k":"会社","v":"国任保险（GUOREN P&amp;C）、安盛（AXA）、中国财政平安（PINGAN）　\u003cbr>※どの会社も保険内容は同じ。基本的には「国任保险」を選択する。"}]},{"t":"note","kind":"warn","html":"⚠️ 日本の留学保険に入っていても\u003cstrong>必ず中国側の保険にも加入。\u003c/strong>中国へ来る留学生の増加により保険未加入留学生の医療費問題や保障完備等へ対応するため、現在は外国の保険加入状況に関わらず強制加入となっている。"},{"t":"p","html":"中国の留学生用保険購入サイトURL：\u003cbr>\u003ca href=\"https://www.lxbx.net/home\" target=\"_blank\" rel=\"noopener\">https://www.lxbx.net/home\u003c/a>"},{"t":"att","name":"来華留学生保険購入方法と利用方法（中国語・英語）.pdf","size":"569 KB","url":"https://note.com/api/v2/attachments/download/b0ee4e9fb4fe56dba8ff5c952154e2f6"},{"t":"att","name":"来華留学生保険内容に関する説明（日本語）.pdf","size":"734 KB","url":"https://note.com/api/v2/attachments/download/c760386c486df74ced192121b208740b"}]},{"heading":"■ 入学後に使うシステム","level":2,"blocks":[]},{"heading":"▶ 学生証（校园卡）","level":3,"blocks":[{"t":"list","ordered":false,"items":["学内の食堂・売店で支払い可能","チャージして使用"]}]},{"heading":"▶ チャージ方法","level":3,"blocks":[{"t":"list","ordered":false,"items":["Webサイト","WeChat / Alipay","学内機械（現金対応）","北京大学App"]}]},{"heading":"▶ 主なシステム","level":3,"blocks":[{"t":"list","ordered":false,"items":["ポータル（重要）\u003cbr>\u003ca href=\"https://portal.pku.edu.cn\" target=\"_blank\" rel=\"noopener\">https://portal.pku.edu.cn\u003c/a>","カードチャージ\u003cbr>\u003ca href=\"https://card.pku.edu.cn\" target=\"_blank\" rel=\"noopener\">https://card.pku.edu.cn\u003c/a>","Wi-Fi\u003cbr>\u003ca href=\"https://its.pku.edu.cn\" target=\"_blank\" rel=\"noopener\">https://its.pku.edu.cn\u003c/a>","学校メール\u003cbr>\u003ca href=\"https://mail.pku.edu.cn\" target=\"_blank\" rel=\"noopener\">https://mail.pku.edu.cn\u003c/a>","学校メール（stu）","\u003ca href=\"https://mail.stu.pku.edu.cn/\" target=\"_blank\" rel=\"noopener\">https://mail.stu.pku.edu.cn/\u003c/a>"]}]},{"heading":"2.3.2 入学後〜1ヶ月の流れ","level":2,"blocks":[]},{"heading":"■ 必ずやること","level":3,"blocks":[{"t":"list","ordered":false,"items":["WeChat / Alipay設定","SIMカード購入","銀行口座開設","居留許可申請（X1のみ）"]}]},{"heading":"■ 授業開始前（9月第一週）","level":3,"blocks":[{"t":"list","ordered":false,"items":["学部・学院説明会・新入生オリエンテーション","履修登録/选课","入学式（学位生のみ）"]}]},{"heading":"■ 授業開始後（9月第二週〜）","level":3,"blocks":[{"t":"list","ordered":false,"items":["履修授業の変更・確定（9月第三週頃まで履修授業の変更可能）"]}]}],"wip":false},{"id":"n6305b4e3cabf","title":"2.4 SIMカード購入","directoryTitle":"2.4 SIMカード購入","category":"procedure","tags":{},"editorNote":"","published":"2026-08-04","modified":"2026-08-29","chars":3602,"sections":[{"heading":null,"level":0,"blocks":[{"t":"p","html":"中国では、\u003cstrong>現地の電話番号・SIMカード・eSIMが必須\u003c/strong>です。\u003cbr>アプリ登録・決済・予約など、生活のあらゆる場面で使います。"}]},{"heading":"■ 中国SIM・中国現地電話番号","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>中国で生活する場合、中国の電話番号は必須です\u003c/strong>。銀行口座の開設、Alipay・WeChat Payの利用、配車アプリ、フードデリバリー、宅配、各種会員登録や本人認証など、多くのサービスなど、中国では日本以上に電話番号が必要になる機会が多いため、中国の携帯番号が必要になります。","日本のSIMでも、グローバルローミング（一部契約内容による）などで、そのまま中国でもデータ通信と電話番号の利用が可能ですが、料金が割高です。各種登録でエラーになる場合があるため、必ず中国現地の電話番号を取得しましょう。","日本で旅行用等の１日〜１ヶ月用を購入することも可能ですが、番号の使い回しが多く、前の同じ電話番号の利用者が各種システム・ソフトに登録していて新しく登録できない・エラーになる等の問題がある場合があるため、基本的には中国現地で電話番号を普通の電話番号を取得するのがおすすめ。"]}]},{"heading":"◾️日本・外国でSIMを購入する場合の注意","level":2,"blocks":[{"t":"list","ordered":false,"items":["中国渡航前に、日本の家電量販店でSIMを直接購入したり、Amazonや各種企業のウェブサイトからも中国SIM/eSIMを購入することができ、渡航前に中国の電話番号・データ通信環境を準備することができます。事前に購入すると、中国現地についてからもすぐに電話やネットが使えるため、アプリの使用や連絡がスムーズにできます。","しかし、このようなSIMの一部は次のような特徴があります："]},{"t":"list","ordered":false,"items":["中国大陸で電話番号・データ通信が利用可能な香港SIM・海外SIM（多くが香港経由通信のため、VPN無しでもgoogle等接続可能）","中国大陸で何度も使われている・再利用されている電話番号のSIM"]},{"t":"p","html":"これらのSIMは、半年〜１年間利用のために専用に販売されているものを除いて、中国現地で利用すると次のような問題が発生することがあります："},{"t":"list","ordered":false,"items":["一部システムの利用・ウェブサイトへのアクセス・WeChat/Alipay等のアプリ利用などの際に香港SIMや海外SIMと認識され、\u003cstrong>大陸SIMと同様に動作しない・エラーになる\u003c/strong>","\u003cstrong>使い捨てSIM/電話番号として何度も利用されている\u003c/strong>ため、以前の利用者が中国の各種サービスに既に登録しており新規登録ができない、利用者の記録が残っている、登録情報を削除・退会して新規登録しようとすると新規登録回数上限を超えている等で登録ができなくなる、前の利用者宛の電話がかかってくるなど"]},{"t":"p","html":"そのため、日本・外国で中国SIMを購入する場合、特にSIMに詳しくない場合には、\u003cstrong>3日間-30日間用のSIMを一時利用用として購入し、中国現地で新しくSIMを買い直すことがおすすめです\u003c/strong>。"}]},{"heading":"■ 中国の三大通信会社","level":2,"blocks":[{"t":"p","html":"中国には次の3大通信会社があります"},{"t":"list","ordered":false,"items":["\u003cstrong>中国移动（China Mobile）\u003cbr>\u003c/strong>　→ 学内に店舗あり","\u003cstrong>中国联通（China Unicom）\u003c/strong>\u003cbr>　→ 学内に店舗あり","\u003cstrong>中国电信（China Telecom）\u003c/strong>\u003cbr>　→ 学内店舗なし"]},{"t":"list","ordered":false,"items":["都市部では通信会社による電話・ネット通信などの利用に差はほぼありませんが、地方では4G・5G回線のカバー範囲などに違いが若干あります（日本の3大電話会社が日本国内の地方でのカバー範囲に若干違うのと同じ）。","VPNの接続のしやすさは、通信会社によってVPNの種類による相性や時期的な制限が大きく異なることがあります（中国特有の問題）。"]}]},{"heading":"■ 料金（目安）","level":2,"blocks":[]},{"heading":"▶ 学生向けセットプラン（校园卡/学生套餐）","level":3,"blocks":[{"t":"p","html":"新学期・入学シーズンになると、学校キャンパス内・寮周辺に電話会社の仮設店舗が設置され、学生向けの「通話＋データ通信」がセットになったプランが販売されています。\u003cbr>三大通信社はどれもほぼ同じ学生向けのセットプランを提供しているので、特別な要望がなければ近い場所で契約しましょう。"},{"t":"dl","rows":[{"k":"1年間","v":"500元"},{"k":"2年間","v":"800元"},{"v":"※年によって料金や内容が変更される場合があります"}]},{"t":"p","html":"普通に支払うよりも基本的に得なので、特に詳しくなければ留学年数分のプランを契約しましょう。\u003cbr>ただし、毎月の各データ通信、通話時間、SMS等の上限を超えると、個別にチャージが必要になるので注意してください。\u003cbr>特に通話に関しては、セットプランの上限を超えると、データ通信も通話もストップしてしまうので、「電話が繋がらない」「ネットが繋がらない」という場合には、個別にチャージするなどを試してください。\u003cbr>※国際電話をすると１日でオーバーする可能性あり。"},{"t":"p","html":"学生向けセットプランの内容例 800元2年間、500元1年間 毎月200分国内通話 + 60GBデータ通信+SMS10通 データ通信内訳：国内(20GB+10GB) +北京市内大学内(20GB+10GB)"}]},{"heading":"▶ 普通のプラン","level":3,"blocks":[{"t":"p","html":"中国の通話料・データ通信料は前払い・チャージ制。\u003cbr>支払いはセットで払うか、通話料とデータ通信料の２つを別々に支払うか自分で選択。\u003cbr>普通のプランなら、毎月50-100元程かかる。\u003cbr>学生向けのセットプランで、データ通信や通話料が上限を超えた場合もチャージが必要。\u003cbr>\u003cstrong>セット料金月払い目安：\u003c/strong>\u003cbr>48元：データ通信10GB、国内通話100分程\u003cbr>88元：データ通信20GB、国内通話500分程\u003cbr>（時期・地域・店舗によって取り扱いセットプランが異なる）"},{"t":"p","html":"\u003cstrong>別払い料金目安：\u003c/strong>\u003cbr>国内通話：約0.10〜0.19元/分\u003cbr>SMS送信：約0.1元/通\u003cbr>データ通信：約0.29元/MB（約290元/GB）\u003cbr>（セットで支払ったが、データ通信を使いすぎた場合にデータ通信だけチャージなども可能）"},{"t":"p","html":"普通のセット/套餐料金と、別払い/套外料金 48元/月セット ：データ通信10GB+100分通話 88元/月セット ：データ通信20GB+500分通話 別払い/套外料金 ：通話0.1元/分、SMS/短信0.1元/通、0.29元/MB(290元/GB)"}]},{"heading":"チャージ方法","level":3,"blocks":[{"t":"list","ordered":false,"items":["WeChat/Alipayのミニプログラム","契約している通信会社のアプリ","通信会社の店舗"]},{"t":"note","kind":"warn","html":"⚠️学生プランで1年500元or2年800元が終了した後も同じ電話番号を使う場合は、月払いに自動的に切り替わる。"},{"t":"p","html":"チャージ制のため、事前チャージなしの場合は契約が切れた月から突然通話・データ通信ができなくなるので、電話会社の専用アプリ、Wechat/Alipayの電話料金支払いページから支払い（支払っても使えない場合は、通話料とデータ通信料のどちらか片方をチャージしていない可能性があるので、残量を確かめる。）"}]},{"heading":"■ 購入・契約場所","level":2,"blocks":[]},{"heading":"▶北京大学キャンパス内","level":3,"blocks":[{"t":"dl","rows":[{"k":"中国移动","v":"45甲地下（物美スーパー付近）"},{"k":"中国联通","v":"29楼地下（ファミマ付近）"}]}]},{"heading":"▶ その他","level":3,"blocks":[{"t":"list","ordered":false,"items":["街中の三大電話会社店舗","新学期にキャンパス内・寮周辺に出る仮設店舗（おすすめ）"]},{"t":"list","ordered":false,"items":["時期："]},{"t":"list","ordered":false,"items":["8月末〜9月上旬","2月下旬"]},{"t":"p","html":"公式サイト・ネット注文（店舗にSIMカードの在庫がなく、尚且つすぐに取得できなくても良い場合）\u003cbr>→急ぎの場合は、付近の店舗を数箇所回る"}]},{"heading":"■ 契約時の持ち物","level":2,"blocks":[{"t":"list","ordered":false,"items":["パスポート","入学許可書 or 学生証　（学生向けプラン・パックを契約する場合）","料金（前払い。学生向けプラン・パックは1年間500元 or 2年間800元）"]}]},{"heading":"■ eSIM","level":2,"blocks":[{"t":"list","ordered":false,"items":["近年はeSIMもあるため、物理SIMとeSIMのどちらが良いかは個人で選択。","i Phoneは設定などが世界共通のため中国でも店員さんが設定可能。","Androidは機種により若干設定方法が異なるため、不安な場合は基本的に物理SIM（eSIMは設定などがうまくできない場合あり）。"]}]},{"heading":"■ 解約（留学修了時・帰国前）","level":2,"blocks":[{"t":"list","ordered":false,"items":["中国の通話料・データ通信料は前払い制・チャージ制なので、チャージした分だけ使える契約で、解約をしなくても問題無し。","1年セット、2年セットなどの場合は、期間が過ぎると自動的に使えなくなるので解約は不要。","毎月セット料金を自動支払いにしている場合には、そのまま支払い元のWeChat pay/Alipay/口座残高が無くなるまで支払われ続けるため、自動支払い設定を切る必要あり。"]},{"t":"note","kind":"warn","html":"⚠️ 一般的に、残高不足での料金未払い（停机）・未使用状態が90日を超えると、SIMの電話番号が自動解約（销号）&amp;回収され使えなくなる。その後一定期間がすぎてから、同じ電話番号が中国国内のどこかで再販売され、次の契約者に渡る。"},{"t":"note","kind":"warn","html":"⚠️一度使えなくなった電話番号を再度利用・復活させることが可能な場合は、数百元ほど（500元前後など）で再度利用することができます。"},{"t":"note","kind":"warn","html":"⚠️留学修了後・帰国後も次に中国に訪問した時のために中国の電話番号を維持したい場合には、30元/月などの最低元の料金を支払い続ける必要あり（できれば自動支払い設定にしておくと安心）。"}]}],"wip":false},{"id":"n35eb601ddae5","title":"2.5 銀行口座開設","directoryTitle":"2.5 銀行口座開設","category":"procedure","tags":{},"editorNote":"","published":"2026-08-05","modified":"2026-08-23","chars":1470,"sections":[{"heading":null,"level":0,"blocks":[{"t":"p","html":"中国に長期滞在する場合、中国現地の\u003cstrong>銀行口座の開設はほぼ必須\u003c/strong>です。\u003cbr>特に以下の用途で必要になります："},{"t":"list","ordered":false,"items":["WeChat Pay・Alipayなどとの連携","奨学金の受け取り","各種費用の受け取り・振込","各種支払い"]},{"t":"p","html":"日本の銀行口座・カードを利用（VISA・MasterCard・银联卡/Unionpayなどのデビッドカード機能つき）して中国のATMなどで現金を下ろすことも可能ですが、毎回少額手数料の発生、一部サービスの制限・設定登録ができないなどの問題がある。"}]},{"heading":"■ 中国の主要銀行（四大銀行）","level":2,"blocks":[{"t":"list","ordered":false,"items":["中国銀行（Bank of China / BOC）","中国工商銀行（ICBC）","中国農業銀行（ABC）","中国建設銀行（CCB）"]},{"t":"p","html":"その他、北京大学周辺・北京市内にある四大銀行以外の銀行でも口座開設可"},{"t":"list","ordered":false,"items":["北京銀行","民生銀行","招商銀行","中信銀行","など"]}]},{"heading":"■ どの銀行で開設するか","level":2,"blocks":[{"t":"p","html":"特に指定がなければ、\u003cstrong>キャンパス内・キャンパス近隣にある銀行が便利で、銀行スタッフも外国人留学生の対応にも慣れているので比較的安心\u003c/strong>"},{"t":"dl","rows":[{"k":"中国工商銀行（ICBC）","v":"西南門/小西门の近くに支店あり"},{"k":"中国農業銀行（ABC）","v":"キャンパス内西側に支店あり"}]},{"t":"note","kind":"warn","html":"⚠️一部中国の奨学金は、銀行の指定あり（指定銀行でない場合は、手数料が発生する、振り込みが若干遅くなるなどの場合あり）"},{"t":"note","kind":"tip","html":"⭐️念の為、２つ以上の銀行の口座を開設しておくと安心"},{"t":"note","kind":"tip","html":"⭐️北京大学内の中国農業銀行では北京大学オリジナル銀行カードが発行される（他の銀行も、学内でキャンペーンをやっている際は、北京大学オリジナルのカードを発行してくれる場合あり）"}]},{"heading":"■ 口座開設に必要な書類","level":2,"blocks":[{"t":"list","ordered":false,"items":["パスポート（ビザ付き）","在学証明書or学生証or大学留学生オフィスが発行した在籍証明","住宿登記表","中国の電話番号（SMS認証で使うことが多いので、長期的に使える番号を登録）","50-100元（初回貯金用）","マイナンバー（マイナンバーカードの番号がわからなければ、保険証番号などの個人を特定できる番号でも良い場合あり）"]},{"t":"note","kind":"warn","html":"⚠️サマースクール等の１ヶ月未満の滞在で銀行口座を開設する場合は、大学留学生オフィスに在籍証明などの発行が必要な場合あり"}]},{"heading":"■ 注意点","level":2,"blocks":[]},{"heading":"▶ パスポート本体がないと口座開設できないことが多い","level":3,"blocks":[{"t":"list","ordered":false,"items":["留学開始当初、居留許可申請でパスポートを提出すると、手続きが完了するまで口座開設ができない場合あり"]}]},{"heading":"▶ 銀行の各支店ごとに、１日に開設できる口座数が決まっている場合が多い","level":3,"blocks":[{"t":"list","ordered":false,"items":["近年、キャンパス外の銀行の各支店では、1日外国人10人までなど、口座開設可能な数量上限が決まっている場所が多くなっています。","そのため、銀行支店に直接行っても、当日は口座開設できず、支店で口座開設の日・時間帯を予約することになる場合があるので注意してください。中国語で電話が可能な場合には、銀行支店に電話してすぐに口座開設可能か、可能でない場合は予約できるかなどを確認するのもおすすめです。"]}]},{"heading":"▶ パスポート期限切れでの一部サービス停止","level":3,"blocks":[{"t":"list","ordered":false,"items":["銀行に登録しているパスポートの有効期限が切れると、各種サービスが停止するため、パスポートを更新したら早めに銀行の登録情報も更新しましょう。"]}]},{"heading":"銀行関連の中国語","level":2,"blocks":[{"t":"p","html":"中国語 / 日本語\u003cbr>开户 / 口座開設\u003cbr>银行卡 / 銀行カード\u003cbr>借记卡 / デビットカード（キャッシュカード）\u003cbr>密码 / 暗証番号\u003cbr>手机号码 / 携帯電話番号\u003cbr>护照 / パスポート\u003cbr>学生证 / 学生証\u003cbr>余额 / 残高\u003cbr>转账 / 送金\u003cbr>取款 / 出金\u003cbr>存款 / 入金\u003cbr>网上银行 / インターネットバンキング\u003cbr>手机银行 / 銀行アプリ"}]}],"wip":false},{"id":"nbbed5fc388e1","title":"2.6 健康診断／体格検査（体检）","directoryTitle":"2.6 健康診断・体检","category":"procedure","tags":{"visa":["X1"]},"editorNote":"","published":"2026-08-05","modified":"2026-09-01","chars":4680,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["中国で\u003cstrong>居留許可を取得する際には健康診断/体格検査の結果の提出が必要\u003c/strong>です。","居留許可の有効期限内に居留許可を申請、または過去2年以内に居留許可を申請した方は、居留許可申請の際の体格検査資料の提出は免除になります（政策が変わる可能性があるので要確認）。","入学手続き/报到の際には、大学から医療機関まで送り迎えしてくれるバスを無料提供している（先着順）ので、バスで行く場合には指定された日時・場所に指定された荷物を持って行ってください。"]}]},{"heading":"■ 基本ポイント","level":2,"blocks":[{"t":"label","html":"対象："},{"t":"list","ordered":false,"items":["\u003cstrong>X1ビザ（長期留学）を持っていてこれから居留許可を申請する方\u003c/strong>","日本で健診を受けてない場合は、中国の指定医療機関で健診。","日本で健診を受けた場合にも、中国側の医療機関で認証を受けて書類の切り替えをする必要あり。"]}]},{"heading":"2.6.1 中国で健康診断を受ける場合","level":2,"blocks":[ ","チケット価格は、一律同価格のものと席により異なる場合あり。新作映画が最安で10元で鑑賞可能（大学外の映画館だと最安30/40元〜）","国内外の有名な楽団/オーケストラ、劇団、伝統芸能（京劇、昆曲、相声など）、伝統楽器奏者などによる公演も多数あり。価格は大学外の一般の劇場の1/5〜半額以下の価格で非常に安く設定されている。","映画などの記念イベントが開催される場合もあり、映画監督・原作者・主演の有名俳優などのトークイベントが行われることもあり（特に注目される・人気なイベントは、指定された日時に新太陽中心などで先着順販売などが行われ、販売開始の数時間前から行列ができることもあり）"]},{"t":"p","html":"公式サイト"},{"t":"card","title":"北京大学百周年纪念讲堂","site":"hall.pku.edu.cn","url":"https://hall.pku.edu.cn/"},{"t":"p","html":"百讲外観と观众厅"}]},{"heading":"北京大学校史馆","level":3,"blocks":[{"t":"list","ordered":false,"items":["北京大学燕園校区の西門内、蓮花池のほとりに位置する校史博物館。地上１階・地下２階の３層構造。","北京大学創立100周年の1998年に着工し、2001年に完成、2002年5月4日に正式開館。2019年から1年半ほどかけて改修・展示内容の刷新が行われたため、比較的新しい設備・内装になっています。","\u003cstrong>主な展示\u003c/strong>："]},{"t":"dl","rows":[{"k":"「百年北大」","v":"1898年の京師大学堂創設から現在までの北京大学の歴史を紹介。1919年の五四運動、新文化運動、マルクス主義の伝播と中国共産党の結成などから現在まで、中国の重要な歴史に大きな影響を与えた北京大学について紹介。"},{"k":"「今日北大」","v":"近年の北京大学の発展・研究・教育などを紹介。"},{"k":"他","v":"１階などで企画展。"}]},{"t":"p","html":"\u003cstrong>開館時間\u003c/strong>：火・木・土・日の \u003cstrong>9:00～16:00\u003c/strong>。入場は15:45まで。法定祝日は休館。長期休暇中は開館時間を別途通知。"},{"t":"p","html":"\u003cstrong>入館料\u003c/strong>：北京大学の学生・教職員・卒業生は無料。学外者は成人5元。"},{"t":"p","html":"公式サイト"},{"t":"card","title":"北京大学校史馆","site":"www.xsg.pku.edu.cn","url":"https://www.xsg.pku.edu.cn/"},{"t":"p","html":"校史馆外観と大学堂看板 「北京大学校史馆」の字は江沢民主席が執筆した字を利用"}]},{"heading":"北京大学赛克勒考古与艺术博物馆（英語名：ARTHUR M. SACKLER Museum of Art and Archaeology At Peking University）","level":3,"blocks":[{"t":"list","ordered":false,"items":["1993年5月27日に正式開館。中国の高等教育機関では初の考古学専門博物館で、当時としては国内でも近代化された博物館。名称は北京大学と、アメリカの事業家・慈善活動家であるアーサー・M・サックラー博士およびジリアン・サックラー女爵の協力によって建設されたことに因む。","\u003cstrong>収蔵品\u003c/strong>：石器、陶器、青銅器、磁器など1万点以上を収蔵。大部分は中国考古学の各時代を代表する標本、および北京大学の考古学研究100年の歴史を伝える学術資料。","\u003cstrong>常設展示：\u003c/strong>"]},{"t":"list","ordered":false,"items":["西周の青銅器","唐代の文化財","秦文化・西戎文化","シルクロード文明","中国古代の海外輸出陶磁器","北京大学考古学の100年の歴史","西洋版画・現代美術など"]},{"t":"p","html":"\u003cstrong>開館時間\u003c/strong>：火・水・木・金・土・日の9:00a〜17:00。月曜定休日。入場は16:30まで。長期休暇中は開館時間を別途通知。"},{"t":"p","html":"公式サイト"},{"t":"card","title":"北京大学赛克勒考古与艺术博物馆","site":"amsm.pku.edu.cn","url":"https://amsm.pku.edu.cn/"}]},{"heading":"運動場・屋外スポーツ施設","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>五四運動場\u003c/strong>"]},{"t":"list","ordered":false,"items":["400mトラック、バスケットコート、フットサルコート、バレーコートなどを完備","入学式・卒業式を屋外で開催する際にも利用","屋外での比較的大きなイベントを開催する際にも利用される","大学内や大学〜円明園のミニマラソンイベントなどの発着点","学部生/本科生は体育の授業を選択している場合、学期中に授業外の時間に合計85kmを走ることが課せられているため、毎日夜は400mトラックを走っている学生が多い（「PKU Runner」または「乐动力」というGPS・タイマー付アプリで走行距離を記録して提出）。同様に、学部生/本科生の体力測定では、各種目で一定の記録を超える必要があるため、それに向けて練習する人も多い。それ以外にも各個人で体力作りやダイエットの目的で走る学生も多い。"]},{"t":"p","html":"五四運動場のイメージ画像"},{"t":"list","ordered":false,"items":["\u003cstrong>第一体育館・第二体育館周辺グラウンド\u003c/strong>"]},{"t":"list","ordered":false,"items":["サッカーコート、野球場、その他スポーツ用グラウンド"]}]},{"heading":"未名湖（冬・スケート場）","level":3,"blocks":[{"t":"list","ordered":false,"items":["12月下旬〜1月中旬に、未名湖の湖面の氷の厚さが一定以上になると、自然の屋外スケート場として開放される。暖冬で氷が厚くならない場合は、スケート場として開放されない。（北京市内の他の湖でも同様に、氷の厚さが一定以上になるとスケート場として無料・有料で開放される）","入場料無料。","スケートシューズは第一体育館の未名湖に面した側の１階で低価格でレンタル可能。"]},{"t":"p","html":"未名湖スケート場のイメージ画像"}]},{"heading":"体育館・屋内スポーツ施設","level":2,"blocks":[]},{"heading":"五四体育中心","level":3,"blocks":[{"t":"list","ordered":false,"items":["バドミントンコート"]},{"t":"p","html":"五四体育中心のイメージ画像"}]},{"heading":"邱德拔体育館","level":3,"blocks":[{"t":"dl","rows":[{"v":"2008年北京オリンピックの卓球競技専用会場として建設。体育館内中心の天井には2008年オリンピック当時のデザインの幕などが貼られており、体育館外の石碑には歴代卓球優勝者の名前が刻まれている。地上4階・地下2階の構造。"},{"k":"1階","v":"フィットネス・ジム、卓球場、体操室/バレエ/ダンス室、トレーニングルーム、バドミントンコート/バスケットコート、更衣室、シャワールーム"},{"k":"2〜4階","v":"客席など"},{"k":"地下1階","v":"ビリヤード場、重量競技場。"},{"k":"地下2階","v":"トレーニングホール、フェンシング場、剣道場、ボルダリング場、スカッシュコート、プール、バスケットボールコート、更衣室、シャワールーム。"}]},{"t":"p","html":"邱德拔体育馆のイメージ画像"}]},{"heading":"第一体育館","level":3,"blocks":[{"t":"list","ordered":false,"items":["体育館","体育館横にボルダリング、グラウンド（サッカーコート、野球場など）など"]},{"t":"p","html":"第一体育館のイメージ画像"}]},{"heading":"第二体育館","level":3,"blocks":[{"t":"list","ordered":false,"items":["体育館","体育館横にバスケットコート、テニスコートなど"]},{"t" k":"スマホ修理・スマホPC周辺機器・時計修理","v":"45甲号楼地下"},{"k":"薬局","v":"45甲号楼地下"},{"k":"自転車・電動バイク修理","v":"44号楼西側の赤い建物内"},{"k":"洗濯・クリーニング・アイロン・靴洗い・裁縫・補修","v":"40号楼北側、36号楼東側、29号楼地下"},{"k":"燕园美发（散髪）","v":"31号楼地下東側"},{"k":"中国農業銀行（中国农业银行）","v":"45甲号楼北側"},{"k":"中国銀行・中国工商銀行・中国農業銀行ATM","v":"新太阳南側"},{"k":"中国農業銀行ATM","v":"第四教学楼（四教）東側"}]}]},{"heading":"備考","level":3,"blocks":[{"t":"list","ordered":false,"items":["外卖（フードデリバリー）や近隣の繁華街（五道口、中関村）でも様々な買い物が可能"]}]}],"wip":false},{"id":"nd7655beed895","title":"学内の食堂・飲食店","directoryTitle":"4.4 食堂・飲食店","category":"life","tags":{},"editorNote":"","published":"2026-09-01","modified":"2026-09-02","chars":3295,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["北京大学の学生食堂・学食は主に「北京大学餐饮中心」が運営しています。","北京大学は、多くの学生・教職員が通学通勤するだけでなく、キャンパス内の寮・教職員住宅にも普段から住んでいるため、その需要を満たすだけの飲食店も豊富に用意されています。","多くの学食は中国人学生寮の近くにありますが、中国人学生寮中关园食堂、成府路食堂などは留学生寮近くや北京大学医院などに有ります。","注文方式は、ビュッフェスタイルで小皿を選んで会計カウンターでまとめて支払う方式と、各窓口で注文・選択してその場で支払う方式があります。"]},{"t":"p","html":"大学キャンパス内の食堂位置概要"}]},{"heading":"食堂の利用方法","level":2,"blocks":[{"t":"list","ordered":false,"items":["食堂の営業時間は食堂ごとに異なり、基本的には\u003cstrong>07:00-09:00、11:00-13:00、17:00-19:00の時間帯に営業\u003c/strong>しています。営業していない時間帯は、学内外の他の営業している飲食店を利用してください。","食堂での支払いは、一部を除いて学生証/スマホの電子版学生証（QRコード/NFC）のみです。支払いは、機械にタッチするかQRコードを読み込ませることでできます。","学生証による1日の利用金額が40元（金額は要確認）を超えると、支払いの際に暗証番号が必要となる場合があります（紛失・盗難時に多額の利用を防ぐため）。\u003cstrong>暗証番号は、パスポート番号の下6桁（TM1234567なら「234567」）\u003c/strong>、または「888888」、「000000」です。","テイクアウト・持ち帰って食べる場合には、注文する際・支払いの際に\u003cstrong>「打包」（ダーバオ）\u003c/strong>と言い、使い捨てのテイクアウト用容器（打包盒）・食品用ビニール袋（どちらも基本有料）に食べ物を詰めてもらいましょう。容器・ビニール袋だけ別で購入して、自分で詰めることも可能です。","\u003cstrong>中国の重さ表記\u003c/strong>（食堂でもよく使う）：\u003cbr>克・ku・クー ＝ g \u003cbr>公斤・gong jin・ゴンジン ＝ kg \u003cbr>两・liang・リャン ＝ 50g \u003cbr>斤・jin・ジン ＝ 500g \u003cbr>例：1斤＝500g、2斤＝1kg、半斤＝250g、2两＝100g、1两＝50g"]},{"t":"p","html":"食堂での支払い方法イメージ画像"}]},{"heading":"北京大学餐饮中心各種情報","level":2,"blocks":[{"t":"p","html":"ウェブサイト"},{"t":"card","title":"首页_北京大学餐饮中心","site":"cyzx.pku.edu.cn","url":"https://cyzx.pku.edu.cn/index.htm"},{"t":"p","html":"食堂営業時間 ※冬季休暇中、夏季休暇中、国慶節連休、メーデー（五一）連休は営業時間変更の可能性あり（北大餐饮中心から別途通知）"}]},{"heading":"🍜 学一食堂","level":2,"blocks":[{"t":"p","html":"燕园校区の一番南西側、38号楼学生宿舍近く、西南門/小西門に近い\u003cbr>一階建ての多くの中国の大学にあるタイプの学生食堂\u003cbr>値段設定が大学の中で一番安い\u003cbr>刷羊肉など有り"}]},{"heading":"🍱 家園食堂","level":2,"blocks":[{"t":"p","html":"北京大学最大の学生食堂。\u003cbr>2020年11月にオープンした新しい食堂。\u003cbr>階ごとに料理が異なる\u003cbr>\u003cstrong>1階：\u003c/strong>ビュッフェスタイル\u003cstrong>\u003cbr>2階：\u003c/strong>各地域国の料理\u003cstrong>\u003cbr>3階：\u003c/strong>セット料理、麻辣湯/マーラータン、麻辣香鍋など\u003cstrong>\u003cbr>4階：\u003c/strong>洋食、火鍋、パン屋（小北面包房）\u003cstrong>\u003cbr>地下1階（外南側）：\u003c/strong>パラディソカフェ/paradiso coffee"},{"t":"p","html":"小北面包房では、中秋节、春節、卒業シーズンなどに北京大学ロゴ・西門・博雅塔などの北京大学系柄の入った軽食・お菓子を限定販売（一部予約販売）"}]},{"heading":"🍗 学五食堂","level":2,"blocks":[{"t":"p","html":"燕园校区南西側の二階建ての学生食堂\u003cbr>\u003cstrong>1階：\u003c/strong>麺、洋食、米粉や麻辣湯/マーラータン\u003cbr>\u003cstrong>2階：\u003c/strong>広い食事スペース。壁側に日本・韓国・洋食系料理を提供する合理屋/Hollywood。"}]},{"heading":"🌾 燕南美食","level":2,"blocks":[{"t":"p","html":"百周年記念講堂北側、図書館南側の食堂\u003cbr>様々な授業を行う各教学楼から近いため、昼食・夕食時は授業前授業後の学生や職員が押し寄せ、非常に混む。席がない時は立ったまま食べる人もいるため立ち食い（站着吃饭）で有名。"},{"t":"p","html":"\u003cstrong>1階：\u003c/strong>一般的な学生食堂\u003cbr>\u003cstrong>2階：\u003c/strong>広い食事スペース\u003cbr>\u003cstrong>地下1階\u003c/strong>（百讲裏の入口から）：カフェ\u003cbr>\u003cstrong>地下2階\u003c/strong>（百讲裏の入口から）：ビュッフェスタイル"}]},{"heading":"🍚 勺園食堂（一般の食堂はリフォーム中）","level":2,"blocks":[{"t":"p","html":"燕园校区西側で、国際関係学院の近く。\u003cbr>勺園食堂の近くに、現金/微信/支付宝支払い可能で来客も使える勺园西餐厅と勺园中餐厅あり"},{"t":"p","html":"\u003cstrong>1階：\u003c/strong>一般の食堂\u003cbr>\u003cstrong>2階：\u003c/strong>各地域料理、烤鱼など。教師餐厅あり\u003cbr>\u003cstrong>勺园西餐厅：\u003c/strong>洋食レストラン（少し質の高いレストラン）\u003cbr>\u003cstrong>勺园中餐厅：\u003c/strong>中華レストラン（少し質の高いレストラン）\u003cbr>\u003cstrong>勺园雅间包间（勺园中餐厅2階）：\u003c/strong>貸切個室のレストラン、個別注文・コース料理、予約制。"},{"t":"p","html":"レストランウェブサイト"},{"t":"card","title":"勺园","site":"shaoyuan.pku.edu.cn","url":"https://shaoyuan.pku.edu.cn/cyfw/sy7hlzct/index.htm red":false,"items":["中国で薬を購入する場合、薬の箱などに「 OTC」マークがついている場合があります。これは、病院・医師のの処方せんなしで購入が可能な薬で、日本の「一般用医薬品」「第一類医薬品」「第二類医薬品」「第三類医薬品」など相当します。"]}]},{"heading":"薬の日本・中国・英語対照","level":2,"blocks":[{"t":"list","ordered":false,"items":["薬の商品名は国ごとに異なりますが、\u003cstrong>有効成分名は世界共通\u003c/strong>です。日本で飲み慣れた薬や合わない薬がある場合には、ネットでその薬の名前を調べて有効成分名を確認し、中国で薬を購入する際の参考情報としてください。"]},{"t":"label","html":"\u003cbr>アセトアミノフェン"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：对乙酰氨基酚\u003cbr>\u003cstrong>英語\u003c/strong>：Acetaminophen（Paracetamol）\u003cbr>\u003cstrong>用途\u003c/strong>：解熱・鎮痛\u003cstrong>\u003cbr>日本での代表的な商品名：\u003c/strong>タイレノールA、カロナール、ノーシン"},{"t":"label","html":"イブプロフェン"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：布洛芬\u003cbr>\u003cstrong>英語\u003c/strong>：Ibuprofen\u003cbr>\u003cstrong>用途\u003c/strong>：解熱・鎮痛・消炎\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>イブA錠、リングルアイビー、ブルフェン"},{"t":"label","html":"ロキソプロフェン"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：洛索洛芬\u003cbr>\u003cstrong>英語\u003c/strong>：Loxoprofen\u003cbr>\u003cstrong>用途\u003c/strong>：鎮痛・消炎\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>ロキソニンS、ロキソニン"},{"t":"label","html":"アスピリン"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：阿司匹林\u003cbr>\u003cstrong>英語\u003c/strong>：Aspirin\u003cbr>\u003cstrong>用途\u003c/strong>：解熱・鎮痛・抗血小板\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>バファリンA、バイアスピリン"},{"t":"label","html":"クロルフェニラミン"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：马来酸氯苯那敏\u003cbr>\u003cstrong>英語\u003c/strong>：Chlorpheniramine\u003cbr>\u003cstrong>用途\u003c/strong>：抗ヒスタミン\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>新ルルA（配合）、パブロンゴールドA（配合）"},{"t":"label","html":"ジフェンヒドラミン"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：苯海拉明\u003cbr>\u003cstrong>英語\u003c/strong>：Diphenhydramine\u003cbr>\u003cstrong>用途\u003c/strong>：睡眠補助・抗アレルギー\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>ドリエル"},{"t":"label","html":"デキストロメトルファン"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：右美沙芬\u003cbr>\u003cstrong>英語\u003c/strong>：Dextromethorphan\u003cbr>\u003cstrong>用途\u003c/strong>：咳止め\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>メジコンせき止め錠Pro"},{"t":"label","html":"ロペラミド"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：洛哌丁胺\u003cbr>\u003cstrong>英語\u003c/strong>：Loperamide\u003cbr>\u003cstrong>用途\u003c/strong>：下痢止め\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>ストッパ、ロペミン"},{"t":"label","html":"ビサコジル"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：比沙可啶\u003cbr>\u003cstrong>英語\u003c/strong>：Bisacodyl\u003cbr>\u003cstrong>用途\u003c/strong>：便秘薬\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>コーラック"},{"t":"label","html":"酸化マグネシウム"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：氧化镁\u003cbr>\u003cstrong>英語\u003c/strong>：Magnesium Oxide\u003cbr>\u003cstrong>用途\u003c/strong>：便秘・胃酸中和\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>酸化マグネシウムE便秘薬、マグミット"},{"t":"label","html":"乳酸菌製剤"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：益生菌制剂\u003cbr>\u003cstrong>英語\u003c/strong>：Probiotics\u003cbr>\u003cstrong>用途\u003c/strong>：整腸\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>新ビオフェルミンS、ビオフェルミン、ミヤBM"},{"t":"label","html":"ファモチジン"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：法莫替丁\u003cbr>\u003cstrong>英語\u003c/strong>：Famotidine\u003cbr>\u003cstrong>用途\u003c/strong>：胃酸抑制\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>ガスター10"},{"t":"label","html":"オメプラゾール"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：奥美拉唑\u003cbr>\u003cstrong>英語\u003c/strong>：Omeprazole\u003cbr>\u003cstrong>用途\u003c/strong>：胃潰瘍・逆流性食道炎\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>オメプラール"},{"t":"label","html":"ポビドンヨード"},{"t":"p","html":"\u003cstrong>中国語\u003c/strong>：聚维酮碘\u003cbr>\u003cstrong>英語\u003c/strong>：Povidone-Iodine\u003cbr>\u003cstrong>用途\u003c/strong>：消毒\u003cbr>\u003cstrong>日本での代表的な商品名：\u003c/strong>イソジンうがい、イソジンきず薬"}]},{"heading":"⚠️免責事項","level":2,"blocks":[{"t":"p","html":"実際に薬を購入・使用する際は、必ず薬の添付文書を確認し、必要に応じて医師・薬剤師に相談してください。"}]}],"wip":false},{"id":"n1ff0c3032fc0","title":"🏥 病院の行き方・診察の受け方","directoryTitle":"3.5.1 病院・挂号・来華留学生保険利用方法","category":"health","tags":{},"editorNote":"","published":"2026-09-02","modified":"2026-09-15","chars":2204,"sections":[{"heading":null,"level":0,"blocks":[{"t":"p","html":"このページでは中国（北京）での病院の行き方・診察の受け方の説明をまとめています。"}]},{"heading":"➕病院の種類","level":2,"blocks":[{"t":"p","html":"中国の病院は、病院の規模・機能により「一級・二級・三級」の級に分かれて、それぞれさらに「（特）甲乙丙」に分類されています。"},{"t":"p","html":"他に、外資により設立されたり外国人向けに運営されている病院もあります。"},{"t":"p","html":"中国の病院へ行く場合には、\u003cstrong>「一級・二級・三級・三甲・外資」\u003c/strong>の５つ分類を覚えておき、何かあれば二級以上にいきましょう。"},{"t":"note","kind":"warn","html":"⚠️同じ治療・サービスでも等級が上がるほど医療費が高くなります。"},{"t":"dl","rows":[{"k":"一级医院（社区医院、社区卫生服务中心）","v":"小規模・社区の医療機関、日本での診療所のような規模。日常的な診療、比較的軽い症状や薬の処方対応。手術等は不可がほとんど。"},{"k":"二级医院","v":"普通の規模の病院・地域の病院。一般的な診療・検査などに幅広く対応、簡単な手術も対応。北京大学医院（北京大学燕園校区北側）、清华大学医院（清華大学北西側）など。"},{"k":"三级医院","v":"大規模な総合病院。高度な医療や専門的な診療など、ほとんどの治療・診療に対応。救急の場合や二級医院で対応できない場合の搬送先。北京市中关村医院（中关村站と海淀黄庄站の間）、北京市海淀医院（海淀黄庄站すぐ横）など。"},{"k":"三级甲等医院/三甲医院","v":"三級医院の中で水準の高い病院。病院によっては、特定の病気・疾病の治療に特化しており、北京中から患者さんがくるようなところもある。北京大学第三医院、北京大学第六医院、中国中医科学院西苑医院、中日友好医院など。"},{"k":"外資系・外国人向け医院","v":"外国資本によって運営される医療機関や外国人を対象とした医療機関。英語（一部日本語）での対応可能。医療費がやや高いので海外留学保険加入者向け。北京莱佛士医院（Raffles Hospital）、北京和睦家医院（United Family）など。"}]},{"t":"p","html":"中国の病院の種類・等級"},{"t":"p","html":"三級・二級・一級のそれぞれの標準医療費（2025年時点） 等級が上がるほど医療費が高くなる"},{"t":"p","html":"北京大学周辺の病院・等級 普段の病気・怪我は二級（北京大学医院）へ 大怪我・骨折・入院が必要な場合は三級（海淀医院、中关村医院）へ"}]},{"heading":"🏥病院への行き方・診療の受け方","level":2,"blocks":[{"t":"p","html":"\u003cstrong>1. 病院・診療科を探す\u003c/strong>\u003cbr>百度地图・高德地图や病院の公式アプリなどで、症状に合った病院と診療科を探します。大きな病院では、病院内に複数の診療科があります。"},{"t":"p","html":"\u003cstrong>2. 予約する（预约挂号）\u003c/strong>\u003cbr>中国の病院では、\u003cstrong>预约挂号（yùyuē guàhào）＝診察予約\u003c/strong>をしてから受診することが一般的です。\u003cbr>病院の公式アプリやWeChat公众号/小程序などから予約できる場所も多いです。\u003cbr>予約時には、診療科・医師・日時などを選びます。\u003cbr>医師によって費用が異なる場合もあります（特に重症・重病でなければ費用の安い方を選べばOK）。"},{"t":"p","html":"\u003cstrong>3. 病院で受付する（挂号）\u003c/strong>\u003cbr>予約した日時に病院へ行き、受付をします。\u003cbr>初めての場合は、\u003cstrong>パスポート\u003c/strong>などの身分証明書が必要になることがあります。\u003cbr>病院によっては、病院のカードを作り、先にチャージが必要な場合もあります。100元以上チャージしておくと良いです。\u003cbr>受付後、診察室や待合場所を確認して順番を待ちます。"},{"t":"p","html":"\u003cstrong>4. 医師の診察を受ける\u003c/strong>\u003cbr>自分の症状や、いつから具合が悪いのかを医師に伝えます。必要に応じて、血液検査・X線・CTなどの検査を受けます。"},{"t":"label","html":"5. 支払い・薬を受け取る"},{"t":"p","html":"診察や検査の費用を支払います。"},{"t":"p","html":"薬の処方が必要な場合は、処方箋（必要な薬名・数・量などが記載された資料）をもらい、病院内や病院近くの药房（yàofáng）＝薬局などで薬代を支払って薬を受け取ります。病院内にない場合は近くの薬局を探し、処方箋を見せて薬を購入してください。"},{"t":"note","kind":"warn","html":"⚠️中国の多くの病院は、\u003cstrong>「西洋医学＋中国医学」\u003c/strong>の診察・薬の処方です。処方される薬は、日本でも処方される西洋医学のタブレットや粉などの薬だけでなく、漢方薬のような薬が一緒に処方される場合もあります。もし漢方薬が苦手・不要な場合は、その旨を病院・薬局で伝えると西洋医学の通常の薬だけを提供してもらえます。"},{"t":"p","html":"\u003cstrong>6. 診察・検査結果を確認する\u003c/strong>\u003cbr>検査結果や医師からの説明を確認し、必要であれば再診（复诊）を予約します。"}]},{"heading":"🚶 病院への同行","level":2,"blocks":[{"t":"list","ordered":false,"items":["病院の利用方法がわからず不安な場合には、友人知人に同行してもらってください。","中国の病院は、日本語対応の一部病院を除き、基本的に中国語での診察になります。中国語に自信がない場合は、\u003cstrong>中国語のできる友人に同行してもらう、翻訳機能を利用する、外国人・国際医療部のある病院を選ぶ\u003c/strong>などの方法を選択してください。","平日昼間の場合には、北京大学留学生事務室の職員に連絡すれば、職員または学生アシスタントが病院まで同行してくれます（基本的に英語か中国語での対応になります）。"]}]},{"heading":"🚑 緊急の場合","level":2,"blocks":[{"t":"p","html":"急な症状や重症の場合は、通常の予約ではなく、\u003cstrong>急诊（jízhěn）＝救急外来\u003c/strong>を利用します。"},{"t":"p","html":"\u003cstrong>救急車：120\u003c/strong>\u003cbr>\u003cstrong>急診 → 救急外来\u003c/strong>"},{"t":"list","ordered":false,"items":["中关新园に住んでいる場合には、寮のスタッフに連絡すれば、寮まで救急車を呼んでもらえます。","搬送先は、海淀医院（海淀黄庄站のすぐ横）となることが多いですが、北京大学第三医院や少し離れた病院に搬送される場合もあります。"]}]},{"heading":"📃来華留学保険の利用方法","level":2,"blocks":[{"t":"p","html":"（整理中）"}]},{"heading":"北京市内病院一覧","level":2,"blocks":[{"t":"p","html":"（整理中）"}]},{"heading":"主な病状名称一覧","level":2,"blocks":[{"t":"p","html":"（整理中）"}]},{"heading":"主な薬名称一覧","level":2,"blocks":[{"t":"p","html":"（整理中）"}]}],"wip":true},{"id":"n45a0835bada6","title":"5.1 北京大学の掲示板・BBS","directoryTitle":"5.1 掲示板（BBS）","category":"online","tags":{},"editorNote":"","published":"2026-08-04","modified":"2026-09-06","chars":1045,"sections":[{"heading":null,"level":0,"blocks":[{"t":"p","html":"このページでは、北京大学の学生間んの情報共有などで普段から使われている掲示板・BBSについて整理しています。"}]},{"heading":"1. 北京大学の掲示板について","level":2,"blocks":[{"t":"list","ordered":false,"items":["北京大学には学生・教職員のみ利用可能な専用サイト・掲示板が2つ存在（一般のサイトで北京大学用ページ、グループが作られているものもある）。","学校内のイベント・講演会情報、就職・インターン情報（ごく一部留学生向けあり）、学内情報、学校近辺・北京市内情報、賃貸情報、サークル情報、落とし物情報など様々な情報が共有・発信されている。","試験情報・過去問など、\u003cstrong>授業に関係のある情報\u003c/strong>も提供されているので、\u003cstrong>新学期・中間テスト・期末テスト時期などは要チェック\u003c/strong>。","知人友人に聞いても\u003cstrong>わからない事項があった際\u003c/strong>は、質問を投稿すると回答が来る場合があるので必要に応じて\u003cstrong>普段から利用するのがおすすめ\u003c/strong>（例：今日の百周年記念講堂の映画のチケットはまだ残っているか？今新太陽中心に人が多いのは何故か？いつから未名湖でスケートができるか？XXXの授業は難しいか？）。","どちらも大学側で管理しているのでセンシティブな内容は原則禁止。"]}]},{"heading":"2. 树洞（X・WeiboなどのSNS形式の表示・匿名）","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>概要\u003c/strong>：匿名で投稿できる学内掲示板・SNS。"]},{"t":"list","ordered":false,"items":["内容は雑談から、学校内外での落とし物情報、授業情報、学校情報、日常の質問など幅広く投稿される。"]},{"t":"p","html":"\u003cstrong>利用制限\u003c/strong>：北京大学の学生・職員のみ利用可能。"},{"t":"p","html":"\u003cstrong>管理体制\u003c/strong>：大学担当部署が管理。学籍番号でログインするため、管理者側から投稿者は特定可能。"},{"t":"p","html":"\u003cstrong>注意点\u003c/strong>："},{"t":"list","ordered":false,"items":["中国国内的に好ましくない内容・センシティブな内容や規則違反の投稿は削除対象。","違反があると投稿内容削除や利用停止などの対応が取られる。","センシティブな内容の場合は、大学管理者を通して学校側に呼ばれる・注意される場合あり。"]},{"t":"p","html":"\u003cstrong>ログイン\u003c/strong>：北京大学の门户（portal）などで使用しているIDとパスワードでログイン可能。"},{"t":"list","ordered":false,"items":["定期的にログインできなくなるが、基本的にはアプリを再インストール・アップデートするとログインできるようになる。"]},{"t":"p","html":"\u003cstrong>Web版URL\u003c/strong>： \u003ca href=\"https://treehole.pku.edu.cn/web/\" target=\"_blank\" rel=\"noopener\">https://treehole.pku.edu.cn/web/\u003c/a>"}]},{"heading":"3. 未名BBS（掲示板形式の表示・ニックネーム）","level":2,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>概要\u003c/strong>：北京大学の掲示板・BBS。树洞よりも以前から存在。"]},{"t":"list","ordered":false,"items":["分野ごとにページが分かれている。"]},{"t":"p","html":"\u003cstrong>ログイン\u003c/strong>：学校のシステムで使用しているIDとパスワードで初回ログイン可能。"},{"t":"p","html":"\u003cstrong>URL\u003
