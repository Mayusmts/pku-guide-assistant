>\u003cbr>\u003cstrong>餐饮中心\u003c/strong>\u003cbr>食堂の情報を配信。冬休み・夏休み前は休み中の食堂営業日程が出されるので必ず確認。\u003cbr>\u003cstrong>动力中心\u003c/strong>\u003cbr>大学内のインフラ関連の通知を配信。供暖/暖房供給の開始と終了については確認必須。\u003cbr>\u003cstrong>燕园微后勤\u003cbr>・・・\u003cbr>北京大学百周年纪念讲堂\u003cbr>北大讲堂online\u003c/strong>\u003cbr>百讲の各種イベント情報の通知を配信。公演・映画などの席予約もこの公式アカウントから可能。\u003cbr>\u003cstrong>留学北大\u003c/strong>\u003cbr>留学生関連情報を配信。\u003cbr>\u003cstrong>北京大学勺园 中关新园\u003c/strong>"},{"t":"p","html":"\u003cstrong>他\u003cbr>各院系の公式アカウント\u003cbr>各サークルの公式アカウント\u003cbr>pku社团服务平台\u003cbr>PKU体委\u003cbr>北京大学教务部\u003cbr>北京大学研究生会\u003cbr>北京大学研究生教育\u003cbr>北京大学学生服务总队\u003cbr>北大与世界\u003c/strong>"}]}],"wip":false},{"id":"n280685d12e73","title":"6.2 進学・入学","directoryTitle":"6.2 進学(予科、本科、大学院、進修生)","category":"academic","tags":{"program":["yoka","honka","grad","shinshu"]},"editorNote":"","published":"2026-08-06","modified":"2026-09-07","chars":3758,"sections":[{"heading":"■ 基本事項","level":2,"blocks":[{"t":"list","ordered":false,"items":["中国の大学に外国人が入学・進学・留学する場合、現地の中国人学生とは申請方法・条件が異なるため、募集要項をよく確認する必要があり。","中国国籍（※二重国籍含む）がある場合、外国人留学生としての入学は不可のため両親の片方または両方が現在・元中国国籍の場合は注意。","語学留学でも、定員上限を超える応募がある場合や、書類不備などで審査が通らない可能性があるため、必ず複数大学に出願（大学間の協定に基づく交換留学などを除く）。","⚠️中国の大学院修士課程は2年制だけでなく3年制もあるので要確認。博士課程は全て4年制だが、修士&amp;博士まとめての5年制も有り。"]}]},{"heading":"6.2.1 予科（Pre-University / 大学準備課程）","level":2,"blocks":[]},{"heading":"■ 概要","level":3,"blocks":[{"t":"list","ordered":false,"items":["学部（本科）進学のための準備コース（主に高校卒業者対象）","内容：語学＋数学など","欧米の foundation / pre-college と同様の仕組み"]}]},{"heading":"■ 特徴","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国語要件は必須ではないが、以下レベル推奨："]},{"t":"list","ordered":false,"items":["日常会話レベル &amp; HSK4級／中国語検定3-4級以上"]},{"t":"p","html":"修了時に本科進学試験あり、合格すれば本科へ進学可能"},{"t":"p","html":"修了者の本科進学率は例年半分〜半分以下なので、予科在学中や試験前も努力が必要"},{"t":"p","html":"理工系希望者は特に数学の学習はかなり必要（進学できても本科入学後に挫折するケースがあるため、予科在学中に本科範囲を先取りして学習するペースでも良い）"},{"t":"note","kind":"warn","html":"⚠️ \u003cstrong>半数以上が進学試験に不合格になる年もあるため、日々の学習・努力が非常に重要。\u003c/strong>"}]},{"heading":"■ 注意点","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国国内の高校・国際班・インターナショナルスクール卒業者は申請不可\u003cbr>（中国の日本人学校など外国政府系学校の卒業者は申請可能）"]}]},{"heading":"6.2.2 本科（学部・医学部除く）","level":2,"blocks":[]},{"heading":"■ 基本条件","level":3,"blocks":[{"t":"list","ordered":false,"items":["全日制高校卒業を入学までに卒業予定or卒業済み","入学前4年間のうち\u003cstrong>2年以上を中国国外で居住\u003c/strong>していること"]}]},{"heading":"■ 入試方式①：大学独自試験","level":3,"blocks":[{"t":"list","ordered":false,"items":["試験科目：\u003cbr>① 中国語・英語・数学の合計３科目\u003cbr>② 面接","目安："]},{"t":"dl","rows":[{"k":"中国語","v":"HSK6級以上"},{"k":"英語・数学","v":"日本の高校卒業・大学受験レベル"}]},{"t":"p","html":"評価配分："},{"t":"dl","rows":[{"k":"人文系","v":"語学重視"},{"k":"理工系","v":"数学重視"}]},{"t":"list","ordered":false,"items":["準備方法："]},{"t":"list","ordered":false,"items":["北京大学は過去問や例題を公開していないため、CSCA関連資料や他の有名大学の問題を解くのがおすすめ。","\u003cstrong>⭐️参考資料ページ\u003c/strong>"]}]},{"heading":"■ 入試方式②：欧米系試験での出願（筆記試験免除）","level":3,"blocks":[{"t":"list","ordered":false,"items":["スコア条件："]},{"t":"dl","rows":[{"k":"SAT","v":"1400以上"},{"k":"IB Diploma","v":"36以上"},{"k":"A-Level","v":"ABB以上"},{"k":"ACT","v":"30以上"}]},{"t":"p","html":"その他要件："},{"t":"list","ordered":false,"items":["中国語成績（HSK等）","面接"]},{"t":"p","html":"※最終スコア未確定の場合は予測スコア提出可\u003cbr>※主に欧米星等の英語圏大学学部併願者向け\u003cbr>※大学独自試験を受験するよりも難易度は高めだが併願しやすい"}]},{"heading":"■ 入試方式③：CSCA（China Scholastic Competency Assessment/来华留学本科入学学业水平测试）","level":3,"blocks":[{"t":"list","ordered":false,"items":["2025年から本格導入が始まった留学生向け大学入試試験","多くの大学で①「CSCAスコアのみ」または②「CSCAスコア+大学側筆記試験」の形式で入学審査に使用","年数回試験開催（オンライン受験可能）","CSCA公式サイト：\u003ca href=\"https://csca.cn/home\" target=\"_blank\" rel=\"noopener\">https://csca.cn/home\u003c/a>"]}]},{"heading":"6.2.3 大学院（修士・中国語プログラム）","level":2,"blocks":[]},{"heading":"■ 入試内容","level":3,"blocks":[{"t":"list","ordered":false,"items":["基本：\u003cbr>① 書類審査\u003cbr>② 面接（10〜30分・中国人学生と同じ内容）"]},{"t":"dl","rows":[{"v":"おおよその傾向"},{"k":"人文科学系専攻","v":"中国語での面接"},{"k":"社会科学系専攻","v":"中国語での面接＋英語での面接"},{"k":"理工系専攻","v":"中国語での面接＋英語での面接"}]}]},{"heading":"◾️準備方法（主に面接）","level":3,"blocks":[{"t":"p","html":"志望専攻や北京大学・中国の大学の大学院受験経験者の受験体験談を参考にしたり、直接アドバイスをもらうのが望ましいが、関連の記録が無い・知り合いがいない場合は下記方法で準備："},{"t":"list","ordered":true,"items":["\u003cstrong>教科書\u003c/strong>：志望専攻と関係のある学部/本科の教科書を１〜３冊で勉強"]},{"t":"list","ordered":false,"items":["北京大学または有名大学で使用されている中国語の教科書を使用。","無ければ中国語で書かれた教科書ならどれでも可。","中国語書籍/電子版が入手できなければ、日本の関連教科書&amp;中国語専門用語の勉強で対策。"]},{"t":"p","html":"\u003cstrong>論文\u003c/strong>：北京大学の志望専攻所属の教員や該当分野で有名な中国の研究者が近年・過去５〜10年間に発表した論文・論考・記事・ニュース等を一通り勉強・内容確認。中国語論文が見れない場合には、日本語や英語で書かれているものを同様に過去５〜10年間分ほどピックアップして勉強・内容確認。"},{"t":"p","html":"\u003cstrong>英語\u003c/strong>：\u003cstrong>社会科学系・理工系専攻の場合\u003c/strong>は、面接で英語能力が問われることが多く、英語で専攻分野の内容に関する質疑応答面接が行われる場合があるため、選考分野の英単語学習・英語の問答集（質問例と解答例）作成などで準備。人文科学系は英語が無い場合が多いので準備不要。"}]},{"heading":"■ 特徴・注意点","level":3,"blocks":[{"t":"list","ordered":false,"items":["外国人留学生の場合はまずは中国語ができるかどうかが課題","選考は欧米大学院と似た書類＋面接の審査","事前に指導教官にしたい教員へ連絡するのが望ましい（必須ではないが、事前に連絡していない場合、面接で「どの先生を指導教官したいか・するのか」と問われる場合があるため）。"]}]},{"heading":"6.2.4 大学院（修士・英語プログラム）","level":2,"blocks":[]},{"heading":"■ 入試内容","level":3,"blocks":[{"t":"list","ordered":false,"items":["基本：\u003cbr>① 書類審査\u003cbr>② 面接"]}]},{"heading":"◾️MBA、燕京学堂/Yancheng Academy（英語プログラム）","level":3,"blocks":[{"t":"list","ordered":false,"items":["英語プログラムの中でも、MBA、燕京学堂などは、欧米シンガポール香港MBAと併願者が多い。","他の修士プログラムに比べて、課外活動・実務経験や将来計画など、総合的な評価が重視されやすい。","MBAのプログラムは実務経験必須の場合が多いので、申請条件を（学部卒直後は不可の場合多い）"]}]},{"heading":"■ 特徴・注意点","level":3,"blocks":[{"t":"list","ordered":false,"items":["欧米大学院とほぼ同様の選考方式","MBAや英語プログラムは欧米星香港などと併願しやすい","事前に指導教官にしたい教員へ連絡するのが望ましい（必須ではない）"]}]},{"heading":"6.2.4 大学院（博士・PhD）","level":2,"blocks":[]},{"heading":"■ 入試内容","level":3,"blocks":[{"t":"list","ordered":false,"items":["基本：\u003cbr>① 書類審査\u003cbr>② 面接（30分前後〜・中国人学生と同じ内容）","専攻によっては："]},{"t":"list","ordered":false,"items":["筆記試験（1〜3時間・中国人学生と同じ内容）","PPTを使った研究実績・研究計画の中国語or英語でのプレゼンとディスカッション（特に理工系）"]}]},{"heading":"■ 他のポイント","level":3,"blocks":[{"t":"list","ordered":false,"items":["入学後〜１年目に指導教員を決定する院系もあるが、指導教官の決定・教員が博士課程の学生として受け入れるかどうかが審査に影響することが多いため、教員への事前連絡・相談はほぼ必須。"]}]},{"heading":"6.2.5 進修生/Visiting Student（語学・交換・短期）","level":2,"blocks":[]},{"heading":"■ 対象","level":3,"blocks":[{"t":"list","ordered":false,"items":["語学留学","visiting student","サマースクール／ウィンタースクール"]}]},{"heading":"■ 特徴","level":3,"blocks":[{"t":"list","ordered":false,"items":["書類審査のみ","審査自体は学位生ほど厳しくはない","語学留学は申請条件さえ満たせば受け入れ可能性高","ただし大学側・各プログラムに定員上限があるため、各国からの申請が多い年・多いプログラムは定員以上の申請があると不合格者が多数でる"]}]},{"heading":"◾️他のポイント","level":3,"blocks":[{"t":"list","ordered":false,"items":["北京大学へ留学したいが、学位生、高級進修生、訪問研究者などとしての申請条件を満たさないなどの場合は進修生プログラムで申請が一番容易","語学留学でも書類不備、定員を超える応募者多数で受け入れ不可などがあるため、複数大学への出願（３校以上）が安全。"]}]},{"heading":"6.2.6 高級進修生/Senior Visiting Student（語学・交換・短期）","level":2,"blocks":[]},{"heading":"■ 対象","level":3,"blocks":[{"t":"list","ordered":false,"items":["修士号取得済み以上での留学","特に大学院博士課程の学生や研究者・専門家の学習・研究のための留学"]}]},{"heading":"■ 特徴","level":3,"blocks":[{"t":"list","ordered":false,"items":["書類審査のみ","北京大学側の指導教官・受け入れ教員が先に決まっている必要があるので、先に希望する教員へ連絡が必要"]}]},{"heading":"◾️他のポイント","level":3,"blocks":[{"t":"list","ordered":false,"items":["授業などの受講要求がないため、学生個人や北京大学側の教員の計画に沿って自由に学習・研究ができる（普通進修生の場合は最低単位数の授業受講が必須）"]}]},{"heading":"6.2.7 奨学金経由での入学","level":2,"blocks":[{"t":"list","ordered":false,"items":["中国政府奨学金（大使館＋JASSO）経由での申請あり","北京大学を含め、有名大学では通常の入学申請と同様に、書類審査＋面接（＋各種審査）もあり","審査通過後に、大学側が受入に関する証明を発行","北京大学などの有名大学以外の場合は、中国政府奨学金の日本での審査が通った（＝一定以上の水準にあると確認された）後に、個別に連絡がきて比較的簡易な審査だけ行われるという大学もあり。"]}]},{"heading":"■ 各種手続き・試験","level":2,"blocks":[]},{"heading":"● HSK（中国語試験）","level":2,"blocks":[]},{"heading":"日本で受験","level":3,"blocks":[{"t":"p","html":"・HSK日本実施委員会\u003cbr>\u003ca href=\"https://www.hskj.jp/\" target=\"_blank\" rel=\"noopener\">https://www.hskj.jp/\u003c/a>"},{"t":"p","html":"・HSKネット試験事務局（PC受験）\u003cbr>\u003ca href=\"https://www.hskibt.jp/\" target=\"_blank\" rel=\"noopener\">https://www.hskibt.jp/\u003c/a>"}]},{"heading":"中国で受験","level":3,"blocks":[{"t":"p","html":"・中文考试服务网\u003cbr>\u003ca href=\"https://www.chinesetest.cn/\" target=\"_blank\" rel=\"noopener\">https://www.chinesetest.cn/\u003c/a>"},{"t":"p","html":"・旧サイト\u003cbr>\u003ca href=\"https://old.chinesetest.cn/index.do\" target=\"_blank\" rel=\"noopener\">https://old.chinesetest.cn/index.do\u003c/a>"}]},{"heading":"● 無犯罪証明","level":2,"blocks":[]},{"heading":"中国で取得","level":3,"blocks":[{"t":"p","html":"・在中国日本国大使館（亮馬橋）\u003cbr>\u003ca href=\"https://www.cn.emb-japan.go.jp/itpr_ja/keisatsu_shoumei.html\" target=\"_blank\" rel=\"noopener\">https://www.cn.emb-japan.go.jp/itpr_ja/keisatsu_shoumei.html\u003c/a>"}]},{"heading":"日本で取得","level":3,"blocks":[{"t":"p","html":"・各都道府県警察"},{"t":"p","html":"例：警視庁\u003cbr>\u003ca href=\"https://www.keishicho.metro.tokyo.lg.jp/tetsuzuki/toko/toko.html\" target=\"_blank\" rel=\"noopener\">https://www.keishicho.metro.tokyo.lg.jp/tetsuzuki/toko/toko.html\u003c/a>"}]}],"wip":false},{"id":"n790e19250f29","title":"6.3 奨学金・奨励","directoryTitle":"6.3 奨学金","category":"academic","tags":{},"editorNote":"","published":"2026-08-06","modified":"2026-09-07","chars":3260,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["中国では教育部や地方政府、大学等から留学生向けの奨学金が提供されています。また、日本側からも政府・地方自治体・各種財団などから海外留学者向けの奨学金が提供されています。","留学生全体の中で奨学金を受給できる方は少数派となりますが、どの学生でももらえる可能性はあるので、金銭的余裕がない方・経済的負担を減らしたい方は、申請条件を満たす奨学金プログラムに応募しましょう。"]}]},{"heading":"6.3.1 留学生向け奨学金（入学・進学前に申請）","level":2,"blocks":[]},{"heading":"■ 中国政府奨学金(CSC)","level":3,"blocks":[{"t":"p","html":"\u003cstrong>概要\u003c/strong>：中国政府奨学金（Chinese Government Scholarship／中国政府奖学金）は、中国教育部・中国国家留学基金管理委員会（CSC）が外国人留学生を対象に提供する奨学金制度です。\u003cbr>\u003cstrong>審査プロセス\u003c/strong>：推薦機関（駐日中国大使館&amp;JASSO、日中友好協会等）の審査　→　推薦機関が候補者を教育部CSCへ推薦　→　CSCと受入候補大学で留学生受入選定・決定　→　申請者へ結果通知（受け入れ先大学・受け入れプログラム種類）\u003cbr>\u003cstrong>奨学金内容\u003c/strong>：学費免除＋寮費免除＋生活費支給\u003cbr>\u003cstrong>申請ルート\u003c/strong>："},{"t":"list","ordered":false,"items":["\u003cstrong>駐日中国大使館教育処&amp;日本学生支援機構（JASSO）\u003c/strong>（普通進修生／高級進修生／本科／修士／博士）"]},{"t":"list","ordered":false,"items":["※日本全体を対象に毎年約110名の推薦枠があるため合格可能性は高い（志望校３校を申請→志望校３校orそれ以外の大学で受入許可がおりた大学へ留学の仕組み。志望校3校以外に留学が決まる例もごく少数有り）。","※本科、修士、博士に申請の場合は、志望先大学から受入承諾/预录取函等の関連書類を入手して申請時に提出することで、志望先に受け入れてもらえる可能性が高くなる。","※HSK等が志望先大学の要求に達していないor受入大学の判断により、本科・修士・博士に入学する前に1年間の語学留学（奨学金付き）を課す場合有り（1年間の語学留学→本科・修士・博士進学）。"]},{"t":"p","html":"\u003cstrong>北京大学や各大学\u003c/strong>（本科／修士／博士 ※入学前に申請）"},{"t":"list","ordered":false,"items":["※本科〜博士合わせて毎年50〜100名近く分の推薦枠有り。","審査は北京大学進学予定者・在学生の他の国の留学生と合わせて審査されるため、JASSO等から申請するよりも難易度が高い。"]},{"t":"p","html":"\u003cstrong>日本中国友好協会\u003c/strong>（普通進修生）"},{"t":"list","ordered":false,"items":["※毎年約20名の推薦枠有り。主に語学留学者向け。","HSK3級180点以上","HSK6級180点以上を既に取得している場合は、基本的に中国語語学留学以外の留学区分を選択・志望してください（既に高い語学力があると語学留学の意味が低く、採用されない可能性が高い）。"]},{"t":"p","html":"\u003cstrong>中国駐新潟総領事館\u003c/strong>（普通進修生 ※新潟大学、東北大学等の学生のみ申請可能）"},{"t":"p","html":"中国政府奨学金・審査プロセス概要 ※実際にはこのプロセスに大学ごとの受入承諾書の申請・審査・取得のプロセスが加わります"}]},{"heading":"■ 北京大学外国留学生奨学金","level":3,"blocks":[{"t":"dl","rows":[{"k":"内容","v":"学費免除＋生活費支給"},{"k":"申請ルート","v":"北京大学から（※入学前に申請）"}]}]},{"heading":"■ 北京市政府奨学金","level":3,"blocks":[{"t":"dl","rows":[{"k":"内容","v":"学費全額免除 または 一部免除"},{"k":"申請ルート","v":"北京大学から（※入学前に申請）"}]}]},{"heading":"■ 国際中文教育奨学金（旧・孔子学院奨学金）","level":3,"blocks":[{"t":"dl","rows":[{"k":"内容","v":"学費免除＋寮費免除＋生活費支給"},{"k":"条件","v":"孔子学院、HSK事務局など関連機関の推薦が必要（申請要件は各機関へ直接問い合わせ。基本的には孔子学院の中国語講座参加経験者や関連のスピーチコンテスト等のイベント参加経験者がメイン。）"},{"k":"申請ルート","v":"孔子学院等から推薦を得たら、同時に北京大学からも申請が必要（片方だけでは申請が完了しないので注意）"}]}]},{"heading":"■ 新漢学計画（博士課程学生向け。会議参加・研究活動関連の支援も別途あり）","level":3,"blocks":[{"t":"dl","rows":[{"k":"内容","v":"学費＋寮費＋生活費がカバーできる金額（年額）×最長4年間"},{"k":"備考","v":"申請可能な専攻・指導教官が指定されている（指定外の指導教官は選択できない）。中国政府奨学金をすべて金銭換算した内容と同程度の金額の奨学金が支給される。"},{"k":"申請ルート","v":"新漢学計画サイトから"}]}]},{"heading":"■ 百賢亜洲未来領袖奨学金（AFLSP）","level":3,"blocks":[{"t":"dl","rows":[{"k":"正式名称","v":"Asian Future Leaders Scholarship Program"},{"k":"概要","v":"香港の百賢教育基金が提供。"},{"k":"内容","v":"学費＋寮費＋生活費+α 相当額を支給"},{"k":"条件","v":"本科３年・４年になる前の年、大学院修士入学前の北京大学学生"},{"k":"申請","v":"北京大学から申請可能"}]},{"t":"list","ordered":false,"items":["※英語での審査のため英語プログラムの学生以外からの申請が例年少ない。初回応募者が募集人数に達しない年もあるため、奨学金が必要な方は英検2級/TOEIC600点から申請を検討して良い。"]}]},{"heading":"■ その他","level":3,"blocks":[{"t":"list","ordered":false,"items":["奨学金情報をまとめているサイトも各種あり"]},{"t":"list","ordered":false,"items":["例：ガクシー \u003ca href=\"https://gaxi.jp/\" target=\"_blank\" rel=\"noopener\">https://gaxi.jp/\u003c/a>"]},{"t":"note","kind":"tip","html":"\u003cstrong>⭐️奨学金は「優秀な人が選ばれたすい」が、審査・支給機関の目的・方針に合致する学生も選ばれる\u003c/strong>"},{"t":"p","html":"例："},{"t":"list","ordered":false,"items":["HSK6級の学生とHSK3級の学生が語学留学支援の奨学金に応募したが、HSK3級の学生（伸び代が大きい学生）が採用された","目的・方針として多様な学生（大学、専攻、国・地域、職業、家庭環境、将来の目標など）を求めている奨学金・支援機関のため、有名大学から優秀な学生の典型例と言える学生が多数応募したと聞いていたが、結果的にはその大学から１〜２人しか採用されず、比較的多種多様な学生が採用されていた","どの国・地域の留学でも応募できる奨学金であるが、過去に採用された人の情報・データを見ると、国・地域の人数比率がほぼ固定されてる傾向がある（機関側で留学先国・地域のおおよその割合を決めており、欧米留学者との比較ではなく実際には各国・地域内での比較により合格者が決定されていると考えられる）","審査員・機関が特に興味関心を持っている内容と留学目的が一致している学生が採用された","など"]},{"t":"p","html":"そのため"},{"t":"list","ordered":false,"items":["自分は優秀ではないから無理だと考えずに、申請条件を満たす奨学金には積極的に応募・複数応募することが重要（同時受給できない奨学金などは、結果を確認後に必要に応じて辞退する）"]}]},{"heading":"6.3.2 留学生向けの年度評価に基づく奨励・奨学金（外国人留学生だけが対象のもの）","level":2,"blocks":[{"t":"p","html":"北京大学国際合作部留学生事務室では、毎年外国人留学生を対象にした奨学金を提供しています。大学側から自動的にもらえるものではないため、学生が自分で申請する必要があります。留学生の中で一定以上の成績・成果がある場合には申請してみましょう。"},{"t":"list","ordered":false,"items":["北京大学外国人留学生学习优秀奖","本科、修士、博士の分類により、奨学金が与えられる。"]}]},{"heading":"6.3.3 年度評価に基づく奨励・奨学金（中国人学生も対象のもの）","level":2,"blocks":[{"t":"p","html":"北京大学の各学院・系や基金では、毎年年度評価などに基づいて、条件に合う全学生を対象に奨励。奨学金を提供しています。"},{"t":"list","ordered":false,"items":["各年度の評価に基づき、奨励・奨学金が授与される。","各院系等で推薦・提供できる奨励奨学金が複数あり、教職員が成績等に応じて優秀な学生から順番に奨学金金額が高い/基準が厳しい奨励奨学金を推薦・提供（教職員側が選ぶため学生側の申請は不要。ただし、推薦された場合には、プログラムに応じて候補者としての情報・活動記録・奨学金提供元へのお礼文等の執筆・提出が必要になる場合がある）。"]}]},{"heading":"■ 評価対象","level":3,"blocks":[{"t":"list","ordered":false,"items":["学業成績、スポーツ、芸術、学術研究、社会貢献・課外活動、学内ボランティア・業務など奨励・奨学金により評価対象が異なる"]}]},{"heading":"■ 奨励・奨学金の例","level":3,"blocks":[{"t":"list","ordered":false,"items":["学生五四奖章、三好学生标兵、优秀毕业生（特に優秀な学生）","优秀学生干部（ 03c/a>"}]}],"wip":true},{"id":"n3b55242670ab","title":"アルバイト・インターン","directoryTitle":"7.2 アルバイト・インターン","category":"activity","tags":{},"editorNote":"","published":"2026-07-20","modified":"2026-09-13","chars":4389,"sections":[{"heading":"1. 基本ルール（ビザと活動制限）","level":2,"blocks":[{"t":"list","ordered":false,"items":["外国ではビザの種類により、外国人が行える活動に制限があります。","中国留学では\u003cstrong>①X1・X2ビザ（入国ビザ）\u003c/strong>または\u003cstrong>②「学習」タイプの居留許可証（居留ビザ）\u003c/strong>を利用しますが、いずれの場合もインターンを行うには\u003cstrong>ビザへの活動内容追加・許可（加注）が必要\u003c/strong>です。","これは、日本に来る外国人留学生が「資格外活動許可」を申請しなければアルバイトをできないのとほぼ同じ制度です。","⚠️ 許可無しでアルバイトやインターンを行ったことが発覚すると、学校や警察に処分される場合があります（違反違法記録が付けられる、罰金が課されるなど）。処分記録が付くと、今後の学校内での各種申請に影響が出るだけでなく、将来旅行・留学・就労などで中国へ渡航する際のビザ申請や出入国審査に影響が出る可能性があるので注意してください！（特にコロナ禍以降は留学生の摘発が増えています）。","留学中にアルバイト・インターンを行う場合には、必要に応じて以下を申請してください。\u003cbr>　①インターン許可（\u003cstrong>「实习」\u003c/strong>加注）\u003cbr>　②勤労学生・ワークスタディ許可（\u003cstrong>「勤工助学」\u003c/strong>加注","⚠️大学・教育研究機関の学生アシスタント・TA/RA等のアルバイト、研究・実験等への協力、個人間のやり取りと見なせる活動などは例外。","⚠️インターンにより報酬を得ることも原則禁止されているため、一般的には「交通費・食費・諸経費」等の名目で相当額が支給され、それを給与・アルバイト代などと呼んでいます（例：往復タクシー代50-200元+食費30-100元 = 1日100-300元）。","⚠️学外でビザ許可なしでアルバイトすることも原則禁止されています。もし報酬を受け取って行う作業・労働がある場合、基本的に企業側などでは別名目で処理されているか、個人間のやり取りと見なせる方式でのバイト代支給が行われています。"]}]},{"heading":"2. 「实习（インターン）」加注の方法","level":2,"blocks":[]},{"heading":"▼ 申請条件","level":3,"blocks":[{"t":"p","html":"成績などの条件あり（ただし院系の判断による）"},{"t":"dl","rows":[{"k":"本科生","v":"必修科目に不合格なし、成績が上位50％以内（再履修合格でも可）"},{"k":"院生","v":"履修科目に不合格なし"},{"k":"進修生/Visiting Student","v":"\u003cstrong>申請不可・資格無し\u003c/strong>"}]},{"t":"p","html":"※実際には条件を満たさなくても許可を得られる場合が多いので、大学担当者に要確認。"},{"t":"p","html":"\u003ca href=\"https://www.isd.pku.edu.cn/procedures/detail/12.html\" target=\"_blank\" rel=\"noopener\">https://www.isd.pku.edu.cn/procedures/detail/12.html\u003c/a>"},{"t":"p","html":"※上記条件は北京大学の例のため、他大学では大学の関係規約を確認or担当職員に相談。"}]},{"heading":"▼ 手続きの流れ","level":3,"blocks":[{"t":"p","html":"① インターン先を探す\u003cbr>② インターン契約締結（時間・場所・内容を明記）\u003cbr>③ 以下書類をインターン先に記入・押印してもらう\u003cbr>　・「中华人民共和国外国人签证证件申请表」\u003cbr>　・「实习单位同意函」\u003cbr>④ 「北京大学外国留学生办理居留证件加注实习申请表」を記入\u003cbr>⑤ 院系に提出し審査\u003cbr>⑥ 院系の承認・押印\u003cbr>⑦ 留学生オフィスに提出\u003cbr>　→ 約5営業日〜1週間後に\u003cbr>　　「北京大学外国留学生校外实习同意函」取得\u003cbr>⑧ 公安局出入境管理局で加注申請\u003cbr>⑨公安局で加注申請済のパスポート受け取り（完了）"}]},{"heading":"▼ ⭐️北京大学留学生用関連資料","level":3,"blocks":[{"t":"p","html":"下記ZIPファイルにインターン許可申請（实习加注）の手続きを行う際の参考資料・申請資料を入れているので必要に応じてご利用ください。\u003cbr>※関連書類には「労働」「工作」「就労」などの言葉が入ると「インターン」とは認められない可能性があるので、できるだけこれらの単語を避けて作成。"},{"t":"att","name":"インターン許可申請（实习加注）参考資料.zip","size":"1010 KB","url":"https://note.com/api/v2/attachments/download/171d4e4f1881f7a54b214511f56c7260"}]},{"heading":"▼ ⭐️ビザのインターン許可申請(实习加注)の概要","level":3,"blocks":[]},{"heading":"3. 「勤工助学（ワークスタディ）」加注","level":2,"blocks":[]},{"heading":"▼ 特徴","level":3,"blocks":[{"t":"list","ordered":false,"items":["実習（实习）より条件が緩い","成績条件なし","ただし\u003cstrong>労働時間制限あり\u003c/strong>"]}]},{"heading":"▼ 労働時間制限","level":3,"blocks":[{"t":"dl","rows":[{"k":"学期中","v":"週8時間以内・月40時間以内"},{"k":"長期休暇中","v":"週16時間以内・月80時間以内"}]},{"t":"p","html":"\u003ca href=\"https://www.isd.pku.edu.cn/information/Policy/detail/9544.html\" target=\"_blank\" rel=\"noopener\">https://www.isd.pku.edu.cn/information/Policy/detail/9544.html\u003c/a>"}]},{"heading":"▼ 「实习」と「勤工助学」の使い分け","level":3,"blocks":[{"t":"list","ordered":false,"items":["\u003cstrong>勤工助学\u003c/strong>"]},{"t":"list","ordered":false,"items":["手続きを簡略化したい場合","インターン許可が出ない場合","軽めのアルバイト向け"]},{"t":"label","html":"实习"},{"t":"list","ordered":false,"items":["長期インターン","企業から要求される場合"]}]},{"heading":"4. フルタイム勤務について","level":2,"blocks":[{"t":"list","ordered":false,"items":["「留学ビザ」（X1/X2/学習類居留許可）所持→給与をもらう勤務は不可（インターン＝無給として、相当額の交通費・食費等をもらう or 大学・研究機関内の学生アシスタントとして労務費をもらうことは可）","「就労ビザ」所持→　全日制プログラムは大学入学・在籍不可","▶留学と就労を同時に行うことはできない（大学を半年〜１年間等休学し、その間だけビザを切り替えて就労する等は可能）"]},{"t":"p","html":"※非全日制（夜間・週末・短期等）は就労ビザでも大学側が許可すれば通学可。\u003cbr>※フルタイムとほぼ同じスケジュールでインターン等を行うことは可能だが、関連の規則に違反すると処分される可能性があるので注意が必要。\u003cbr>※中国に留学しながら、日本や外国で就労（オンライン）することは可能だが、雇用元の企業が許可するかどうかの問題や、当該国の税金関連手続きが煩雑な場合あり。"}]},{"heading":"5. 留学生のアルバイト・インターンの例","level":2,"blocks":[]},{"heading":"▼ 日本人留学生に多いアルバイト・インターン等","level":3,"blocks":[{"t":"list","ordered":false,"items":["日本語教師（オンライン・家庭教師・塾など）","各種翻訳・通訳","日本市場向け業務（中国企業）","日系企業でのインターン"]},{"t":"p","html":"※日本語が必要な業務の場合には、日本人留学生の需要が高く採用されやすい"}]},{"heading":"▼ 日本人含む各国留学生に多いアルバイト・インターン等","level":3,"blocks":[{"t":"label","html":"学部生A（人文社会系）"},{"t":"list","ordered":false,"items":["北京大学 就職センター 学生助理（半年）","国際組織人材養成プログラム 学生助理（半年）","国連北京事務所 インターン（1年）"]},{"t":"label","html":"修士B（人文社会系）"},{"t":"list","ordered":false,"items":["メディアセンター 学生助理（3ヶ月）","国際合作部 学生助理（半年・兼任）","就職センター 学生助理（半年・兼任）","小米集团（Xiaomi）海外人事 インターン（3ヶ月）","美的集团（Midea）海外人事 インターン（3ヶ月）"]},{"t":"label","html":"修士C（英語プログラム）"},{"t":"list","ordered":false,"items":["法律事務所 Legal Intern（半年）","Legal Associate（半年）"]},{"t":"label","html":"修士D（英語プログラム・国際機関等での仕事を経験してから修士入学）"},{"t":"list","ordered":false,"items":["AIIB（アジアインフラ投資銀行） Consultant（1年）"]},{"t":"label","html":"博士E"},{"t":"list","ordered":false,"items":["研究室RA（3年・兼任）","研究機関アナリスト（1年）","研究機関Visiting Fellow・Intern（1年・兼任）","国際合作部 学生助理（2年・兼任）"]},{"t":"label","html":"情報系修士F"},{"t":"list","ordered":false,"items":["指導教官研究室情報系プロジェクトアシスタント（1年）"]},{"t":"note","kind":"warn","html":"⚠️卒業後の進路により、インターンをしてもしなくても実際にはあまり評価が変わらないという場合も多いので、自分の進路にあった形で留学中の計画を立ててください。"}]},{"heading":"6. 学内アルバイト（校内勤工助学）","level":2,"blocks":[{"t":"p","html":"大学内の「学生助理/学生アシスタント」「助教/TA」「助研/RA」等は、ビザ手続き必要無しで行うことができます。"}]},{"heading":"▼ 主なポスト","level":3,"blocks":[{"t":"list","ordered":false,"items":["各院系・研究所の事務アシスタント","図書館・施設アシスタント","助教/TA・助研/RA（基本的に大学院生以上）","短期プログラム運営補助"]}]},{"heading":"▼ 特徴","level":3,"blocks":[{"t":"list","ordered":false,"items":["労務費：大学・学院の規定により時給約10-30元（約200-600円）、北京市内の大学はほぼ同じ水準。プロジェクト単位等の場合は担当教職員が指定するので時給換算では100元以上（2000円以上）となる場合もあり。","一部ポストは待機時間が多いため、空き時間に宿題をやったりすることが可能（例：図書館・施設アシスタントは、指定された席にいる必要があるが、１時間に２〜３回対応する以外は宿題・勉強をすることが可能）","北京大学の各種業務に関われる場合も多く、教職員・専門家との交流や大学外でのイベントの参加などの可能性もあり。"]}]},{"heading":"▼ 探し方・応募方法","level":3,"blocks":[{"t":"p","html":"学期開始前後に各部門のwechat公式アカウント、ホームページなどに「学生助理」「项目助理」などの募集情報が掲載されるので、内容にしたがって応募。"}]},{"heading":"▼ 他大学の機会","level":3,"blocks":[{"t":"p","html":"清華大学・北京語言大学・北京外国語大学などでも留学生向け就職・インターン情報あり　→ 学外生の応募可否を確認して利用"}]},{"heading":"7. 中国でのインターン・求人探し","level":2,"blocks":[]},{"heading":"▼ 主なサイト（インターンなど）","level":3,"blocks":[{"t":"dl","rows":[{"k":"BOSS直聘","v":"\u003ca href=\"https://www.zhipin.com/beijing/\" target=\"_blank\" rel=\"noopener\">https://www.zhipin.com/beijing/\u003c/a>"},{"k":"实习僧","v":"\u003ca href=\"https://tuiguang.shixiseng.com/\" target=\"_blank\" rel=\"noopener\">https://tuiguang.shixiseng.com/\u003c/a>"},{"v":"就職・インターン希望先企業の公式サイト"}]}]},{"heading":"▼ 注意点","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国語ができることが前提（一部は英語のみでも可）","外国人可否を必ず確認（外国人インターンを受入れてない場所有）","日本語・日本関連業務は日本人に有利（採用可能性が高い）","開始1〜2ヶ月前から準備（応募→審査→採用→関連手続き→インターン開始の一連の手続きで１ヶ月以上かかる）"]},{"t":"p","html":"※その他、公众号・紹介なども多数あり"}]},{"heading":"▼ 北京大学の就職支援","level":3,"blocks":[{"t":"list","ordered":false,"items":["学生就业指导服务中心\u003cbr>\u003ca href=\"https://scc.pku.edu.cn/home.action\" target=\"_blank\" rel=\"noopener\">https://scc.pku.edu.cn/home.action\u003c/a>","国際組織就業情報\u003cbr>\u003ca href=\"http://io.scc.pku.edu.cn/home\" target=\"_blank\" rel=\"noopener\">http://io.scc.pku.edu.cn/home\u003c/a>","PKUIO（公众号）：pkuioer"]},{"t":"p","html":"※主に中国人向けだが、一部は外国人も応募可。\u003cbr>※興味のある日本企業の就職説明会が北京大学・北京で開催された場合も、一部は参加可能。説明会開催企業の担当者に相談すると、中国留学・外国留学をしている日本人学生の場合の応募方法を教えてくれる例もあり。"}]},{"heading":"8. 日本での就活（帰国・並行）","level":2,"blocks":[]},{"heading":"▼ 就活時期","level":3,"blocks":[{"t":"list","ordered":false,"items":["卒業の半年〜2年前から準備"]}]},{"heading":"▼ 日中の違い","level":3,"blocks":[{"t":"dl","rows":[{"k":"中国","v":"9月年度開始"},{"k":"日本","v":"4月入社（主流）\u003cbr>※秋入社（9〜10月）制度ありの企業も存在"}]}]},{"heading":"▼ 日本の就活サイト","level":3,"blocks":[{"t":"dl","rows":[{"k":"リクナビ","v":"\u003ca href=\"https://job.rikunabi.com/\" target=\"_blank\" rel=\"noopener\">https://job.rikunabi.com/\u003c/a>"},{"k":"マイナビ","v":"\u003ca href=\"https://job.mynavi.jp/\" target=\"_blank\" rel=\"noopener\">https://job.mynavi.jp/\u003c/a>"}]}]},{"heading":"▼ インターン","level":3,"blocks":[{"t":"list","ordered":false,"items":["「インターン　募集」などで検索"]}]},{"heading":"▼ 国際系","level":3,"blocks":[{"t":"list","ordered":false,"items":["PARTNER（JICA）：\u003ca href=\"https://partner.jica.go.jp/\" target=\"_blank\" rel=\"noopener\">https://partner.jica.go.jp/\u003c/a>"]}]},{"heading":"▼ 海外学生向け就活イベント","level":3,"blocks":[{"t":"list","ordered":false,"items":["キャリアフォーラム：\u003ca href=\"https://careerforum.net/ja/\" target=\"_blank\" rel=\"noopener\">https://careerforum.net/ja/\u003c/a>"]},{"t":"p","html":"特徴："},{"t":"list","ordered":false,"items":["大手・外資企業中心","即日内定の可能性あり","東京・大阪・ボストン等で開催"]},{"t":"p","html":"※参加のために一時帰国・渡航する人も多い"}]},{"heading":"9. トラブル例（参考）","level":2,"blocks":[{"t":"p","html":"欧米系留学生が友人の紹介で、小規模の業者が行っている小中高生向け英語家庭教師の講師募集に応募。实习加注などの手続きなしで、業者を通して紹介された家庭に定期的に訪問し、１軒あたり英語を１〜２時間教育。ある日、子供の親が教え方が悪いと指摘され担当を交代。その後、親が警察に連絡"}]}],"wip":false},{"id":"n491ac622d20d","title":"サークル（社団）","directoryTitle":"7.1 サークル・社団","category":"activity","tags":{},"editorNote":"","published":"2026-07-26","modified":"2026-09-08","chars":2102,"sections":[{"heading":"1. 概要","level":2,"blocks":[{"t":"p","html":"中国語では、大学の「サークル」は「社団」（she tuan）と言います。"},{"t":"p","html":"北京大学には、公式登録されているだけでも\u003cstrong>100以上\u003c/strong>のサークル（社団）があり、文化系・体育系・学術系・同郷会系など幅広いジャンルに渡っています。"},{"t":"p","html":"大学側のサークル管理担当部署は以下のとおりです。サークルに関する質問や新サークルの設立、活動に関する相談がある場合は、それぞれの担当部署へ問い合わせてください。"},{"t":"dl","rows":[{"k":"一般のサークル","v":"団委（共産党青年団）学生団体部"},{"k":"体育系サークル","v":"体育教研部"},{"k":"留学生会","v":"国际合作部留学生办公室"},{"k":"各院系（学部）が組織しているサークル","v":"各院系担当者"}]},{"t":"p","html":"北京大学の公式サークル一覧は、以下の北京大学サイトの「社团活动」をご覧ください。"},{"t":"p","html":"\u003ca href=\"https://www.pku.edu.cn/campus.html#item6\" target=\"_blank\" rel=\"noopener\">https://www.pku.edu.cn/campus.html#item6\u003c/a>"}]},{"heading":"2. 新歓イベント（入部・入会の主なタイミング）","level":2,"blocks":[{"t":"p","html":"秋学期・春学期の開始時期（\u003cstrong>9月下旬・3月中旬\u003c/strong>）には、大学内で新歓イベントが開催されます："},{"t":"dl","rows":[{"k":"名称","v":"百团大战、社团文化节（百团大战は、抗日戦争で約１００個の団が参戦した戦いの名称から。）"},{"k":"場所","v":"新太阳学生中心〜百周年纪念讲堂付近"},{"k":"開催期間","v":"9月下旬or3月中旬の土日or金土日の2〜3日間（午前10時〜午後5時ごろ）"},{"v":"\u003cstrong>内容：\u003c/strong>"}]},{"t":"list","ordered":false,"items":["各サークルの活動内容を部員に直接聞く・相談","新入生用サークルのWeChatグループへの参加（後日新入生向けイベントや入部方法の通知がグループで送られる）","体験イベント・次回活動のお知らせ案内","新入生歓迎会・サークル説明会の日程","その場で入部手続き＆部費の支払い"]}]},{"heading":"3. サークル選びの注意点","level":2,"blocks":[{"t":"p","html":"サークルごとに活動内容や雰囲気が大きく異なるため、事前によく確認することをおすすめします。"},{"t":"dl","rows":[{"k":"入部費・参加費","v":"無料〜数百元以上まで様々（例えば、ゴルフなどは、本格的に参加すると道具一式購入や毎回のゴルフ場利用・交通費などで出費が大きいが、校内の練習だけなら安く済むなど、活動参加方法によっても費用は変化する）"},{"k":"活動頻度","v":"幽霊部員でも問題ない緩いサークルから、毎週活動・練習があるサークルまで幅広い"},{"k":"レベル","v":"初心者歓迎のサークルもあれば、一定以上の経験や実力が求められるサークルや審査があるサークルもある"},{"k":"規模","v":"数人程度から100人以上まで様々"},{"k":"使用言語","v":"基本的には中国語のみ。留学生が多いと、サークル幹部や部員が英語でWeChatグループなど情報を流してくれる場合もある"},{"k":"サークルを通した学外の大会・試合への参加","v":"外国人留学生も参加できるもの、中国人学生しか参加できないもの、外国人留学生向けの専用の大会があるものなど様々"},{"k":"サークルを通した学内の試合への参加","v":"学内の試合の多くは外国人留学生も参加可能（主に院系が組織する体育系サークル）"},{"k":"未経験者・初心者向けレッスン","v":"特に音楽系サークルでは、初心者向けのレッスンあり。上級者の学生が、週1回・1時間程度（1学期約10回）のグループレッスンやマンツーマンレッスンを担当。受講料は\u003cstrong>500〜1000元\u003c/strong>など様々。"}]},{"t":"p","html":"迷った場合は、新歓イベントなどで実際の部員に話を聞いてから決めるのがおすすめです。\u003cbr>とりあえず入部&amp;入部費支払いをし、後から実際に継続して活動に参加するか決める学生も多い。"}]},{"heading":"4. 学期途中からの参加","level":2,"blocks":[{"t":"p","html":"新歓時期以外でも参加できるサークルは多くあります。"},{"t":"label","html":"参加方法"},{"t":"list","ordered":false,"items":["サークルの「公众号（公式SNS）」から連絡する","所属している学生に紹介してもらう"]},{"t":"p","html":"なお、北京大学の公式サークルでは、毎学期の初めに大学へ部員登録を行います。その時期までに入部しないと、\u003cstrong>正式部員\u003c/strong>として大学に登録されない場合があります。"},{"t":"p","html":"正式部員でないと活動へ参加できないサークルもある一方で、正式登録前でも活動への参加を認めてくれるサークルもあります。サークルによって運営方法が異なるため、詳細は各サークルへ問い合わせてください。"}]},{"heading":"5. 留学生に人気のサークル","level":2,"blocks":[{"t":"p","html":"留学生が比較的多く参加しているサークルには、次のようなものがあります。"},{"t":"list","ordered":false,"items":["中日交流協会、国際交流協会、語学系サークル","音楽系サークル（経験者向け）","音楽系サークルの初心者向けレッスン・教室（中国人学生が中国伝統楽器などを基礎から教えてくれる）","スポーツ系サークル（経験者向け）","ダンス系サークル（経験者向け）","など"]}]},{"heading":"6. 大学外のサークル・団体への参加","level":2,"blocks":[{"t":"p","html":"北京大学以外にも、さまざまな団体へ参加できます。"},{"t":"p","html":"例えば、"},{"t":"list","ordered":false,"items":["他大学のサークル（日中交流・国際交流団体など）","日本人留学生の団体","社会人を含む日本人コミュニティ","スポーツクラブ","中国人学生有志による各種団体","日本の大学の中国同窓会","都道府県人会　など"]},{"t":"p","html":"これらの団体は、\u003cstrong>公众号（公式SNS）\u003c/strong>、日本人向け情報誌・フリーペーパーの団体紹介、参加者からの紹介などを通じて情報を得て参加できます。"},{"t":"p","html":"なお、社会人も参加する団体では、大学サークルより活動費が高い場合があります。また、学生料金が設定されていることや、参加者の年齢・職業が幅広いこともあるため、事前に活動内容や費用を確認しておくことをおすすめします。"}]}],"wip":false},{"id":"n35c660733e3c","title":"8.1 北京大学概要","directoryTitle":"8.1 北京大学概要","category":"about","tags":{},"editorNote":"","published":"2026-07-15","modified":"2026-09-03","chars":1579,"sections":[{"heading":"🏫 基本情報","level":2,"blocks":[{"t":"dl","rows":[{"k":"正式名称","v":"北京大学（英語名称：Peking University、英語略称：PKU）"},{"k":"略称","v":"「北大（Beida）」"},{"k":"設立","v":"1898年。清朝末期、1912年まで「京師大学堂」、1912年に「国立北京大学」へ改称。"},{"k":"種類","v":"教育部管轄・985工程・211工程・双一流。"},{"v":"\u003cstrong>所在地\u003c/strong>："}]},{"t":"dl","rows":[{"k":"本部（燕園（Yanyuan））","v":"北京市海淀区燕园街道颐和园路5号。"},{"k":"医学部","v":"海淀区花园路街道学院路38号。"},{"k":"深圳研究生院（英語大学院プログラム）","v":"深圳市南山区桃源街道丽水路2199号。"},{"v":"他に特定のプログラム・研究室等が設置されている昌平新校区、大興校区、無錫校区、英国校区などがある。"}]},{"t":"label","html":"校訓："},{"t":"list","ordered":false,"items":["公式の校訓は無し。北京大学章程序言、五四運動精神、蔡元培の方針などに因む以下様な内容が事実上の校訓として長年利用されている：\u003cbr>「继承\u003cstrong>爱国、进步、民主、科学\u003c/strong>的光荣传统，弘扬勤奋、严谨、求实、创新的优良学风，秉承\u003cstrong>思想自由\u003c/strong>、\u003cstrong>兼容并包\u003c/strong>的学术精神」。\u003cbr>「太学（古代最高学府）の正統性を継承し、大学（近代高等教育機関）の本山を確立する」。\u003cbr>など。"]},{"t":"p","html":"\u003cstrong>校歌：\u003c/strong>\u003cbr>公式の校歌は無し。北京大学創立100周年を記念して1998年に創作・編曲された\u003cstrong>『燕园情』\u003c/strong>が現在まで事実上の校歌として入学式・卒業式などで歌われている。"},{"t":"p","html":"\u003cstrong>『燕园情』\u003c/strong>\u003cbr>词：周保平\u003cbr>曲：孟卫东"},{"t":"p","html":"红楼飞雪，一时英杰，先哲曾书写，爱国进步民主科学。\u003cbr>忆昔长别，阳关千叠，狂歌曾竟夜，收拾山河待百年约。\u003cbr>我们来自江南塞北，情系着城镇乡野；\u003cbr>我们走向海角天涯，指点着三山五岳。\u003cbr>我们今天东风桃李，用青春完成作业；\u003cbr>我们明天巨木成林，让中华震惊世界。\u003cbr>燕园情，千千结，问少年心事，\u003cbr>眼底未名水，胸中黄河月。"},{"t":"p","html":"注釈：\u003cbr>\u003cstrong>红楼\u003c/strong>：北京大学紅楼（故宮北東側の旧校舎）。\u003cbr>\u003cstrong>爱国进步民主科学\u003c/strong>：北京大学は公式の校訓が無いが、事実上の校訓として長年使用されている8文字。\u003cbr>\u003cstrong>阳关\u003c/strong>：唐代の詩人王維の「送元二之安西（陽関の曲）という送別詩に因む言葉。この陽関の曲を歌う際、感情を込めて三度繰り返して歌ったことから「陽関三畳」と呼び、別れを惜しむ意味で使われる。同様に、陽関千畳（阳关千叠）は、千回歌うほど別れを惜しむ意味。\u003cbr>\u003cstrong>燕园\u003c/strong>：北京大学本部所在地の燕園校区/キャンパスのこと。"}]},{"heading":"📚 他情報","level":2,"blocks":[{"t":"dl","rows":[{"v":"QS World University Rankings 2027：13位（QS 2026：14位）"},{"k":"2026软科中国大学排名","v":"2位"},{"k":"北京大学公式ホームページ（中国語）","v":"\u003ca href=\"https://www.pku.edu.cn/\" target=\"_blank\" rel=\"noopener\">https://www.pku.edu.cn/\u003c/a>"},{"k":"北京大学公式ホームページ（英語）","v":"\u003ca href=\"https://english.pku.edu.cn/\" target=\"_blank\" rel=\"noopener\">https://english.pku.edu.cn/\u003c/a>"}]}]},{"heading":"🌏 留学生人数","level":2,"blocks":[{"t":"dl","rows":[{"k":"北京大学在学生数","v":"約5万〜5万5千人（学部生1.5万人〜1.7万人、修士1.5万人〜1.7万人、博士1.5万人〜1.7万人）"},{"k":"留学生合計","v":"毎年3000〜3500人程の各国留学生が在籍（留学生の中では韓国人留学生が最多で600〜1000人程）。"}]}]},{"heading":"🇯🇵日本人学生数（本部キャンパスのみ）","level":3,"blocks":[{"t":"p","html":"本部キャンパスにはおおよそ180〜240人が常に在籍\u003cbr>\u003cstrong>内訳：\u003c/strong>"},{"t":"list","ordered":false,"items":["普通進修生/Visiting Student：80〜120人"]},{"t":"dl","rows":[{"k":"中国語語学留学/語学交換留学","v":"60〜100人"},{"k":"学部聴講生/学部交換留学","v":"10〜30人"}]},{"t":"p","html":"高級進修生/大学院研究生/Senior Visiting Student：5〜10人"},{"t":"p","html":"学部ダブルディグリー/DD：10〜20人"},{"t":"p","html":"予科生/Pre-university/Foundation：0〜10人"},{"t":"p","html":"本科生/BA：40〜70人"},{"t":"p","html":"修士/MA：10〜30人"},{"t":"p","html":"博士/PhD：0〜5人"},{"t":"p","html":"※データは概算。年間延べ人数ではない。医学部キャンパス、深圳キャンパスなどは除く。正式データは大学へ問い合わせてご確認ください。"}]},{"heading":"北京大学の各種公開情報","level":2,"blocks":[{"t":"p","html":"下記ウェブページ参照："},{"t":"card","title":"信息公开网","site":"xxgk.pku.edu.cn","url":"https://xxgk.pku.edu.cn/index.htm"}]}],"wip":false},{"id":"n4c7ddd634fa9","title":"8.2 北京大学の歴史概要","directoryTitle":"8.2 北京大学の歴史","category":"about","tags":{},"editorNote":"","published":"2026-07-15","modified":"2026-08-07","chars":1167,"sections":[{"heading":"🎓年：内容","level":2,"blocks":[{"t":"p","html":"\u003cstrong>1898年：\u003c/strong>戊戌維新が始まった1898年に梁啓超が起草した「京師大学堂」設立に関する章程を光緒帝が批准し、北京大学の前身となる「京師大学堂（Imperial University of Peking）」が設立。\u003cbr>\u003cstrong>1912年：\u003c/strong>「国立北京大学」に改名。厳復出が初代校長に就任。\u003cbr>\u003cstrong>1917年：\u003c/strong>蔡元培が1916年12月に校長に、陳獨秀が1917年1月に文科学長となる。蔡元培が校長に就任“思想の自由&quot;と&quot;兼容並包”を教育改革の方針として掲げる。\u003cbr>\u003cstrong>1918年：\u003c/strong>主に和碩和嘉公主府（故宮の北側）にあった北京大学の施設が、1918年に完成した故宮北東側の北京大学紅楼へ移動。\u003cbr>\u003cstrong>1918年：\u003c/strong>毛沢東が湖南第一師範学校を卒業。恩師である楊昌済は先に師範学校を離れ北京大学教授となり、その紹介によって毛沢東は北京大学図書館主任であった李大釗のもとで図書館助手・司書補として1918年から1919年まで勤務。北京大学勤務期間中、魯迅、胡適、周作人、李大釗などの当時の知識人を中心に記事が寄稿されていた『新青年』（編集者：陳独秀）に毛沢東もたびたび寄稿。同時に、北京大学で陳独秀などの授業を聴講するなど、後に中国共産党の発起メンバーとなる人物と交流を始める。\u003cbr>\u003cstrong>1919年：\u003c/strong>北京大学が五四運動の中心拠点となる。英米系教会学校3校が合併し、「燕京大学（Yenching University）」が現在の北京大学本部キャンパスの場所に設立。司徒雷登（ジョン・スチュワート）が初代学長に就任。（後に、「国立北京大学」と「燕京大学」の２校が統合され、現在の北京大学となる。）"},{"t":"p","html":"燕園（旧燕京大学・現北京大学）と紅楼の位置"},{"t":"p","html":"\u003cstrong>1928年：\u003c/strong>ハーバード大学と燕京大学が共同で「ハーバード燕京研究所」を設置。\u003cbr>\u003cstrong>1937年：\u003c/strong>国立清華大学、私立南開大学と「国立長沙臨時大学」を編成し長沙へ。翌年、昆明へ移り「国立西南連合大学」に改名。\u003cbr>\u003cstrong>1946年：\u003c/strong>国立西南連合大学は終了を宣言し、北京へ戻る。\u003cbr>\u003cstrong>1952年：\u003c/strong>全国大学院系調整。燕京大学は北京大学に統合され、燕京大学のキャンパスが北京大学のキャンパスとなる（現在の本部キャンパス）。北京大学の工学系は清華大学へ、社会科学系は中国人民大学へ移管。清華大学等からは文学・理学・法学分野が移管される。\u003cbr>\u003cstrong>1998年：\u003c/strong>創立100周年。当時の江沢民党総書記が北京大学創立100周年にあたり985工程（世界一流大学建設政策）始動。\u003cbr>\u003cstrong>2000年：\u003c/strong>北京医科大学が北京大学と合併、北京大学医学部に改名、キャンパスはそのまま（現在でも大学内の各種システムで統合されていない部分が多い）。\u003cbr>2016年4月18日：李克強総理が北京大学を視察。\u003cbr>2018年5月2日：習近平国家主席が北京大学を視察。\u003cbr>2018年10月26日：安倍晋三総理が北京大学を訪問。\u003cbr>\u003cstrong>2024年：\u003c/strong>創立125周年。"}]}],"wip":false},{"id":"n9a854627e103","title":"8.3 校内施設・遺物・北京大と関連のある人物など","directoryTitle":"8.3 校内施設・人物など","category":"about","tags":{},"editorNote":"","published":"2026-07-15","modified":"2026-09-05","chars":4320,"sections":[{"heading":"🏫校内施設・遺物など","level":2,"blocks":[{"t":"p","html":"\u003cstrong>北京大学校章\u003c/strong>\u003cbr>現在の北京大学の校章は1917年に蔡元培が魯迅にデザインを依頼し、魯迅が作成した原案を基にしている。校章は「北大」という字が上下に並んでおり、上部の「北」の字は背中合わせに立った2人の人形で、下部の「大」の字は正面に立った人形で、「三人成众」（人が三人いれば衆である）という意味を含んでいる。同時に上下に並んだ「北大」という字は背骨をイメージしており、北京大学の学生が国家民族復興の背骨となることを期待している。"},{"t":"card","title":"他不仅设计了北大校徽——纪念鲁迅先生诞辰140周年","site":"news.pku.edu.cn","url":"https://news.pku.edu.cn/xwzh/98bcbcbf76f245efbcb3bf037f727a5c.htm"},{"t":"p","html":"\u003cstrong>北京大学西門\u003c/strong>\u003cbr>北京大学西門は燕京大学校友（OBOG）が1926年に資金を集めて建設した校門であるため、「校友門」とも呼ばれている。西門は燕京大学（現本部キャンパス）時代には、蔡元培により書かれた「燕京大学」という文字が掲げられていた。\u003cbr>1952年に北京大学が燕京大学を合併し現本部キャンパス・燕園に移転した後、毛沢東が1950年に書いた「北京大学」という文字を西門に掲げている。西門の獅子の像は、燕京大学が1924年に購入したもの。\u003cbr>\u003cstrong>一塔湖图（One Tower, One Lake, One Library）\u003c/strong>\u003cbr>北京大学の３つの名所の総称：\u003cbr>\u003cstrong>一塔\u003c/strong>：博雅塔（Boya Pagoda/Tower）\u003cbr>\u003cstrong>一湖\u003c/strong>：未名湖（Weiming Lake）\u003cbr>\u003cstrong>图（図）\u003c/strong>：図書館（Peking University Library）\u003cbr>\u003cstrong>博雅塔（Boya Tower）\u003c/strong>\u003cbr>1924年建造の燕京大学キャンパスの給水塔/配水塔（水を高い場所まで上げて、そこから水が下に流れる水圧で水を供給する給水システム）。北京市通州区の燃灯佛舍利塔を参考に設計。高さ37メートル。当時の燕京大学哲学科教授・主任の博晨光（Lucius Chapin Porter、1880-1958）が建設資金を寄付したことから、名前の&quot;博&quot;をとって「博雅塔」と命名された。博晨光はハーバード燕京研究所（哈佛燕京学社、Harvard-Yenching Institute）北平事務所初代総幹事も歴任。\u003cbr>\u003cstrong>未名湖（Weiming Lake）\u003c/strong>\u003cbr>校内最大の人工湖。燕京大学歴史系教授の銭穆（1895-1990）が命名したと言われているが諸説あり。元々は清朝時代の円明園付属の淑春園の一部であり、燕京大学が設立される際に再度設計。未名湖の真ん中には「湖心島」という小島があり、「石舫」（Shi Fang、せきほう、Stone Boat）や「翻尾石魚」（Roll-Tailed Stone Fish）などの円明園の遺物も湖に点在している。湖畔には、外国人記者として1936年に毛沢東ら中国共産党を取材してその姿を描いた著書『中国の赤い星』（Red Star Over China）で有名な「エドガー・スノー」（Edgar Snow）の墓の２つのうちの１つがおかれている（もう１つはアメリカ・ニューヨークのハドソン川近く）。エドガー・スノーは燕京大学の講師をした縁がある。\u003cbr>\u003cstrong>燕南園\u003c/strong>\u003cbr>1919年に燕京大学が司徒雷登によって創設された後、現在の燕南園（元円明園付属の淑春園や勺園等の敷地）に大学教員用住宅を建設。中国の著名大学のキャンパス・建物等を設計した米国人建築設計士亨利·墨菲（Henry Killam Murphy、1877-1954）により住宅が設計された。過去には、歴史学者の洪業、向達、翦伯賛、数学者の江沢涵、物理学者の周培源、饒毓泰、褚聖麟、経済学者の馬寅初、陳岱孫、哲学者の馮友蘭、湯用彤、馮定、化学者の張龍翔、黄子卿、言語学者の王力、林焘、美学者の朱光潜、生物学者の沈同、文学者の林庚、歴史地理学者の侯仁之、社会学者の呉文藻、文学者の氷心（謝婉瑩）らが住んでいた。現在ある古い建物群は、主に大学の各種オフィスとして利用されている。\u003cbr>\u003cstrong>静園\u003c/strong>\u003cbr>民国時代には女子寮として使用。未明湖の北に男子寮、南に女子寮という配置は中国伝統文化の「水北为阳，水南为阴」（水の北は日、水の南は陰）に由来。\u003cbr>\u003cstrong>華表（かひょう）\u003c/strong>\u003cbr>元々は円明園の安佑宫の遺物の一つで、後に燕京大学（現本部キャンパス）に移された。華表は中国の伝統建築様式に用いられる標柱で、宮殿や陵墓などへ続く参道の入り口両側に置かれる。\u003cbr>\u003cstrong>邱德拔体育馆（Qiu De Ba）\u003c/strong>\u003cbr>体育館。2008年夏季北京オリンピックの卓球競技会場として建設・使用。その際、2006年11月、邱德拔基金が北京大学へ約1.733億人民元を寄付。\u003cbr>\u003cstrong>北京大学図書館\u003c/strong>\u003cbr>北京大学図書館の前身は1989年に設立した京師大学堂蔵書楼、辛亥革命後に北京大学図書館へと改名。1952年に北京大学が燕京大学（現本部キャンパス）を合併し移転すると、燕京大学図書館を合併。2000年に北京医科大学を合併すると、北京医科大学図書館も北京大学図書館へと改名。蔵書数は1000万冊を超え、アジア最大級。\u003cbr>1918年から李大釗が図書館館長、毛沢東は管理員・司書の一人として勤務。1975年に現在の図書館西館が完成、1978年5月に鄧小平が北京大学図書館」の字を執筆。1992年に江沢民が「百年書城」（全文は「几代英烈百年书城；发扬传统继往开来」）の字を執筆。北京大学図書館創立100周年の1998年に李嘉誠（香港最大の企業グループ長江実業集団創設者兼会長、一時期アジア最大・世界８位の資産家）の寄付により、現在の東館/新館を建設。\u003cbr>\u003cstrong>阿卜杜勒·阿齐兹国王公共图书馆北京大学分馆/ King Abdulaziz Public Library Branch in Peking University/アブドゥルアズィーズ国王公共図書館北京大学分館\u003c/strong>\u003cbr>2018年に正式開館したサウジアラビアの国王・アブドゥルアズィーズにより設立されたアラビア語書籍の図書館。1987年にサウジアラビアの本館設立、1985年にモロッコ分館設立。北京大学分館は２つ目の分館。2006年に中国分館設立の構想を提案、2009年に北京大学に分館設立を計画、2012年に北京大学分館設立を決定、2015年から施行、2018年に正式開館。"},{"t":"p","html":"\u003cstrong>北京大学外国語学院　明治大学マンガ図書館閲覧室\u003c/strong>\u003cbr>2010年に明治大学と北京大学が日本のマンガ・アニメ文化の展示を通じ、文化・学術的な交流を促進することを目的に設立意向書を調印、2014年開館（明治大学現代マンガ図書館：\u003ca href=\"https://www.naiki-collection.jp/\" target=\"_blank\" rel=\"noopener\">https://www.naiki-collection.jp/\u003c/a>）。\u003cbr>\u003cstrong>学校内の動植物\u003c/strong>\u003cbr>黒鳥（黒いハクチョウ）、ハリネズミ、リス、イタチなど様々な動植物が生息している。\u003cbr>※北京大学北西の実験動物センターでは、各種実験用動物もいる（関係者以外立ち入り禁止）。\u003cbr>\u003cstrong> \u003c/strong>"}]},{"heading":"🎓 北京大学に関連する人物","level":2,"blocks":[{"t":"p","html":"\u003cstrong>陳獨秀\u003c/strong>（Chen Duxiu、1879-1942）\u003cbr>中国共産党の設立者の一人、初代総書記（1921年7月-1927年8月、中央局書記➝中央執行委員会委員長➝中央委員会総書記）。1917年から北京大学文科学長、雑誌『新青年』創刊。\u003cbr>\u003cstrong>李大釗\u003c/strong>（Li Dazhao、1889-1927）\u003cbr>中国共産党の設立者の一人、1918年から北京大学図書館館長・主任、北京大学史学系・政治学系・経済学系等教授を歴任。\u003cbr>\u003cstrong>毛沢東\u003c/strong>（Mao Zedong/Mao Tse-Tung、1893-1976）\u003cbr>中国共産党の創立党員の一人、1945-1976年中央委員会主席、1949-1954年中央人民政府主席、1954-1959年国家主席。1918年に湖南省立第一師範学校卒業。師範学校の恩師である楊昌済（1918年6月まで湖南省立第一師範学校教員、1918年6月から北京大学倫理学教授）の推薦により、1918年8月から1919年春まで北京大学図書館の管理員として勤務。北京大学図書館館長の李大釗や北京大学文科学長の陳獨秀などと関係を深めるとともに『新青年』などの雑誌へも文章を投稿。1921年7月の中国共産党第一次全国代表大会に長沙代表として出席、後に主席となる。\u003cbr>\u003cstrong>蔡元培\u003c/strong>（Cai Yuanpei、1868-1940）\u003cbr>中華民国初代教育総長（教育大臣）、北京大学学長（1916年-1927年）などを歴任。中国の教育・学術界の近代化に大きな影響を与えた。新文化運動・文学革命の代表者の一人。\u003cbr>\u003cstrong>胡适\u003c/strong>（Hu Shi、1891-1962）\u003cbr>文学者、哲学者、新文化運動・文学革命の代表者の一人。1917年（1927年博士号取得）米国コロンビア大学博士課程卒業、北京大学教授、1918年から『新青年』編集委員、1922年北京大学教務長兼代理文科学長就任、1932年文学院院長兼駐文系主任、1938-1942年中華民国駐米国大使、1945-1948年北京大学校長。\u003cbr>\u003cstrong>魯迅\u003c/strong>（Lu Xun、1881-1936）\u003cbr>文学者、思想家。1917年に蔡元培の依頼により北京大学校章をデザイン。1920-1926年に北京大学講師。『狂人日記』、『阿Ｑ正伝』等を執筆。\u003cbr>\u003cstrong>ジョン・レイトン・スチュアート\u003c/strong>（John Leighton Stuart、司徒雷登、1876-1962）\u003cbr>中国生まれのアメリカ人。燕京大学創設者、初代校長（1919年-1945年）、米国駐中国大使（1946年7月-1952年11月）。\u003cbr>\u003cstrong>エドガー・スノー\u003c/strong>（Edgar Snow、埃德加·斯诺、1905-1972）\u003cbr>アメリカ人ジャーナリスト。『中国の赤い星』（Red Star over China、红星照耀中国）著者。1934年（？）から1937年まで燕京大学新聞系講師。遺灰の一部は未名湖湖畔の墓に埋葬されている。\u003cbr>\u003cstrong>邱德拔（クー・テクバ、Tan Sri Khoo Teck Puat，1917-2004）\u003c/strong>\u003cbr>邱德拔体育館設立の資金を提供した基金の設立者。\u003cbr>1960年に後にマレーシア最大の銀行となるメイバンク（Maybank、马来亚银行、Maybank Group）を創業、一時直接的・間接的に80%以上の株を保有。後にシンガポール国籍取得。1980年代後半には、英国スタンダード・チャータード銀行の最大の株主となる。後にシンガポールのコロニアルホテル（植民地期創業の高級ホテル）のグッドウッド・パーク・ホテル（Goodwood Park Hotel）を買収し、メイバンクグループ傘下に。2002年にシンガポール最大・アジアトップ18位・26億米ドル（3000億円程）の資産家となる。\u003cbr>📺 \u003cstrong>觉醒年代\u003c/strong>\u003cbr>中国中央電視台・CCTVのドラマ『觉醒年代』（2021年）で、北京大学を中心とした1915年から1921年頃の中国の歴史が描かれており、上記北京大学に関連する人物も多数登場している。"}]}],"wip":false},{"id":"n28763e69ba9f","title":"9.1 その他情報・注意事項","directoryTitle":"9.1 ⭐️注意事項・Q&A一覧","category":"misc","tags":{},"editorNote":"","published":"2026-07-30","modified":"2026-09-12","chars":26683,"sections":[{"heading":null,"level":0,"blocks":[{"t":"list","ordered":false,"items":["留学中の注意事項について、発生する可能性・発生事例のある内容を中心に一覧にしてまとめています。","北京大学だけでなく、他大学や中国への観光旅行・短期滞在などでも発生する事例も多く記載しています。","問題が発生した場合は、状況や必要に応じて、大学・警察・大使館/領事館などへ連絡・相談などをしてください。"]}]},{"heading":"（重要）日本に比べて中国の大学・行政機関の手続きは遅く不親切な場合有り","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国の大学や各種機関は、日本とはサービスや申請・手続きの進め方が大きく異なります。日本と同じ感覚で進むことは期待せず、\u003cstrong>特に重要な事項の場合には根気強く何度も確認・連絡・催促を行い、申請や手続きの完了まで見届ける・遂行させることが重要です。また、担当者が対応してくれない等があれば、別の職員・スタッフにも連絡するなど様々な手段を試みてください。\u003c/strong>","学校・機関の職員によって対応の丁寧さや迅速さには大きな差があります。日本のように比較的統一された対応にはなっていません。中国では一般的・よくある対応や態度であっても（言動が粗雑、説明不足など）、慣れていない日本人からすると違和感のあることも多く、対応対処方法に慣れ、不要な摩擦を減らしたり目的がなるべく遂行できるようにしましょう。","申請や手続きが完了しなかった場合、学校・機関側の問題であっても基本的に全て\u003cstrong>「自己責任」\u003c/strong>となり、学校側・機関側は何も対処してくれない場合が多いです。学校・機関に提出したからといって「あとは先生がやってくれるだろう」と安心せずに、手続き完了まで定期的に進捗を確認する等してください（特に重要な手続きの場合は催促や別の職員・スタッフへ確認してみる、知人友人に確認を依頼するなど、さまざまな方法を試してください）。","中国の組織は縦割り体制の場合が多く、各部門は各部門の担当業務以外は受け付けない・回答できない場合があり、複数部署をたらい回しにされることも多いです。また、公的機関などで口頭で受けた説明の通り資料を準備しても、再度行った際に別の資料を要求されたり、後から全く別の手続きが必要だったことが判明して全部やり直しということもあります。あるいは、担当者によって言っていることが異なる、本当は可能なことでも担当者の作業効率・負担・全体の管理の都合の観点からできないと回答することもあります。","\u003cstrong>連休・長期休暇の際には、対応が連休・長期休暇終了後となる可能性が高いので注意してください。進級・卒業が絡むような重要な場合は、普通以上にしつこく連絡・催促・確認をし、他の直接ではないが関連する職員にも連絡して代理で手続きをしてもらえないかなどを確認してください。\u003c/strong>もしも様々な方法で連絡・確認したにもかかわらず結果として問題が発生した場合には、中国側の大学や日本側の大学にその問題について情報共有をし、再発防止ができるようにしてください（大学側へフィードバックしないと、基本的には今後も改善されないまま他の方が同様の問題に遭遇する可能性があります）。","そのため可能であれば、ネット・SNS上の情報や知人友人に手続き方法・情報を確認した上で手続き等を進めてください（特に中国語が苦手・中国に慣れていない場合は必須）。","実例１：公安局で实习加注の手続きをしに行ったが、１回目行った時は職員３人ほどいたが「手続きがわかる人がいないので明日来て」と言われ、２回目は手続きのわかる職員に資料を提出したところ「資料Aが足りないので資料Aも持ってきて」と言われ、３回目に行ったら前回と別の職員がいたのでその職員に資料Aを含め全資料を提出したら「こっちの資料にはインターン先のハンコが必要だからハンコを押して持ってきて」と言われ、さすがに職員の対応を不審に思って職員に必要資料や形式を細かく聞き直したところもう一つの資料にもインターン先のハンコが必要だと言われ、４回目でやっと申請・手続きができた。→解決方法：解決方法はあまりないので、担当職員にしつこく必要な書類は何か、形式や記載内容などは合っているかなどを聞くしかない。各種手続きを完了させるために３〜４回公的機関に行くことになるというのはよくあるため、慣れるしかない可能性が高い。場合によっては、口頭で色々確認や説明すれば、資料不足や内容の不備があっても、実際にはそのまま問題なく申請できる場合もある。","実例２：7月上旬に留学修了して数日後に「日本側の大学で進級・卒業認定のために、８月末までに単位取得証明の書類の提出が必要なので証明を発行してください」と某大学の担当職員にメールで連絡したところ「すぐに送る」と返信が来たが、中国側の担当職員がすぐに夏休み期間に入り、その後音沙汰がないため催促の連絡をその職員に２〜３回送ったが、結局返信が来たのは夏休み終了後の９月となり、日本側の大学へ単位取得証明を提出できず、進級・卒業ができなかった。　→解決方法：中国の場合、日本のように98~99%の完成度で対応というより、90%の完成度で対応して何か問題があれば学生側が質問・連絡・催促してくるだろうと考えていると思って良いので、連絡や催促は積極的に行うとよい。重要な場合は、他の関連しそうな職員にも同時に連絡をするなどするのが良い。"]}]},{"heading":"（重要）パスポートまたは学生証は常に携帯する（最低でもコピーや写真は準備）","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国では現地の中国人も留学生を含む外国人も、身分証の確認や身分証番号・パスポート番号利用する機会が日本に比べて非常に多いです。","学校外へ出る場合、パスポートまたは学生証などの身分証明書本体は必ず携帯してください。","\u003cstrong>最低でもコピーやスマートフォンで撮影した写真\u003c/strong>を携帯しておくことが望ましいです。","身分証がないと、多くの観光施設/区画・飛行機・高速鉄道・宿泊施設などが利用できません。区画の出入り口で一時的な身分証チェックを行っている場合も、そこを通らせてもらえません。","北京市内でも観光地などでは、パスポート本体やパスポート番号と名前を利用して入場券購入・入場する場合が多くあります。","故宮・天安門広場周辺など政府機関が密集する地区では、警察が一般通行者に声をかけたり、区画の出入り口に簡易チェック所を設けるなどして、普段から警察による身分証・手荷物の簡易チェックが頻繁に行われています。各区画の門での荷物チェックが行われている場合もあります。特に、国の重要行事や大規模イベント前後は、交通機関や会場周辺でのチェックが厳しくなるため注意してください。パスポートがない場合には、学生証を提示してください。","北京市外へ行く場合は、パスポートと学生証は必ず携帯してください。"]}]},{"heading":"クレジットカードの一時停止","level":3,"blocks":[{"t":"list","ordered":false,"items":["日本国外でクレジットカードを初めて使用する際に（WeChat/微信やAlipay/支付宝経由で使用した場合含む）、通常とは異なる国での不正使用と見なされて一時的にクレジットカードの利用が停止されることがあります。","その場合は、日本の家族や知人に依頼して、カード会社に事情を連絡して一時停止を解除してもらってください。"]}]},{"heading":"値札のない商品・価格交渉（讨价还价）","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国では露天、屋台、市場、昔ながらの店舗などでは値札のない商品が多くあります。この場合、実際には価格がほぼ決まっている場合もあれば、店主/老板の言い値や価格交渉での購入となる場合もあります。","観光客・外国人であることを察して、最初に相当高い価格・ぼったくり価格を提示してくることもあるので、適正価格か・自分が買いたいと思う価格かを判断し、必要に応じて価格交渉してください。","交渉次第で値下げできる場合もあり、まとめ買いや商品の質を理由に割引を求めることも可能です。また、買わずに帰るふりをすると、値下げ要求に応じたり、安い価格を提示してくることもあります。"]}]},{"heading":"観光地の事前予約","level":3,"blocks":[{"t":"list","ordered":false,"items":["コロナ禍/2020年以降、多くの観光地が事前予約制となっています。","人気の観光地・観光施設は数日前〜1週間前でないと予約が取れない場合もあるため、観光の計画を立てる時点で事前に予約方法や混み具合などを確認してください。","北京大学など一部の大学も、在学生・OBOG以外は予約制でのキャンパス内入場となっています。"]}]},{"heading":"観光地での詐欺（上海＆上海近郊のお茶会・茶馆骗局・茶艺骗局）","level":3,"blocks":[{"t":"list","ordered":false,"items":["上海&amp;近郊では、日本人や外国人旅行客が「外国語・日本語学習者」「大学生」「旅行中」などと名乗る１〜２人の若者・20代の女性に「写真を撮ってくれないか」「道に迷った」などと声をかけられ、しばらく話しているうちに「有名なお茶屋さんがある・予約しているお茶屋さんがある・お茶会があるので一緒に行こう」と誘われてお茶屋さん（目の前で中国式の方法でお茶を入れてくれるタイプ）に行き、お茶を飲み終えると数百元〜数千元（日本円で1〜6万円程）の高額請求されるぼったくり・詐欺が以前から発生しています（10年以上前からある典型的なぼったくり・詐欺）。","実際の価格などを知らずにそのまま満足して終える場合もありますが、一般的な価格の数倍〜十倍の料金を請求されているので、注意が必要です。","観光地で見ず知らずの人と知り合っても、すぐには信用しないようにしてください。また、お茶会についていった場合でも、最初に金額と内容を必ず確認してください。","特に価格を確認せずにお茶を飲み、高額を請求された場合には、価格が高いことをはっきりと言いましょう。または、「価格が高い、中国人の友人・大学の先生がもうすぐ近くに来るので、ここに来て価格が適正化確認してもらう」などと言い、騙しにくい相手であると思わせるような対応なども試して、相手の様子を伺うのも方法の一つですが、仕方なく支払うしかない場合もあります。","同様に、少し良いお茶屋さんの場合は200-600元ほどすることもあるので、その範囲の価格を言われ、尚且つ値段が書かれたメニューを後から見せられた場合は、支払うしかない場合もあるので注意。"]}]},{"heading":"観光地・芸術品・書道作品詐欺・艺术馆骗局","level":3,"blocks":[{"t":"list","ordered":false,"items":["お茶会詐欺と同様に、街中で声をかけられ、小規模の個展やギャラリーに誘われ、芸術・美術・書道作品を紹介される。","良い品だと言われたり、原価が1万元だが事情により4000元に値引き販売しているなどと言われ購入するが、全て嘘だった・特に価値の無い品だったと後から発覚するという詐欺があります。","若い方からお年寄りまでさまざまな方が引っかかるため、家族が中国に旅行に来る際などにも注意しましょう。"]}]},{"heading":"観光地・繁華街での詐欺（地推，街头扫码）","level":3,"blocks":[{"t":"list","ordered":false,"items":["街中などで、商品のセール、無料サンプル配布、景品配布、会員登録サービス、イベント無料参加などで、QRコードをスキャンして会員登録・アプリインストールなどを勧める手口。","会員登録やインストールなどをすると、その場では問題なかったが、知らないうちに個人情報が利用されて、有料サービスに登録されている、阿里巴巴/京东などで商品を自動注文されている、WeChatなどで広告が自動転送・朋友圈への発信などが行われるなどの問題が発生する。","PRをしているスタッフが会員登録・インストールの操作を手伝わせると、勝手にスマホで色々操作されることもあり。","街中で会員登録・インストールなどのようなことが必要な場合は注意する。"]}]},{"heading":"観光地・施設・交通機関での詐欺（チケット転売・黄牛）","level":3,"blocks":[{"t":"list","ordered":false,"items":["駅・観光地・チケットが必要な施設の入口付近でチケットの転売をする人がよくいます。電子チケットの場合は、QRコードの写真やチケット情報を提供。","正規チケットを何らかの方法で入手して定価や定価より高い・安い価格で販売しることが多く、窓口でチケットがすでに売り切れた場合などには利用するメリットもあり。","ただし、偽のチケット、実名制で本人しか使えないチケット、５割増しの価格で販売するなど割高、ほとんど説明がなく実際に利用したら立ち見・席なし乗車などの元々購入者が少ないチケット等の問題がある場合もあるので、購入する際には注意が必要。"]}]},{"heading":"観光地での詐欺（着ぐるみを着た人・コスプレの人との写真撮影）","level":3,"blocks":[{"t":"list","ordered":false,"items":["観光地の路上で着ぐるみを着た人が近寄ってきて、そのまま一緒にスマホで写真撮影すると「写真撮影30元」のように書かれた札を見せてきて、撮影料を請求してくる一種の詐欺が各地に存在。","請求された場合でも、そのまま断れば執拗に請求しないことが多いので、状況に応じて対応。"]}]},{"heading":"観光地・高速鉄道駅近くなど（タクシーのぼったくり・言い値料金）","level":3,"blocks":[{"t":"list","ordered":false,"items":["観光地・主要公共交通機関の近くなど、人が非常に多い地帯では、メーターではなく言い値で料金をとるタクシーがあります。","特に、23時以降の公共交通機関が運休していてタクシーが混んでいる時間帯などや、大型イベントが終わった後の会場付近などでは、DiDiなどでタクシーを呼んでも30分以上待ち（場合によっては1時間以上待ち）という場所では、通常の３〜５倍の料金を提示するタクシーもあります。","基本的には先に価格交渉し、その後に乗車、目的地到着後に決済となります（目的地到着後にぼったくり価格を提示するタクシーは大幅に減少）。タクシー料金を知らないとぼったくられる可能性があります。他に交通手段が無い状況で早めに帰りたいので料金が高くても利用したいという場合は、状況に応じて価格交渉をし、念の為タクシーのナンバーを写真撮影してから注意して利用しましょう。"]}]},{"heading":"観光地の貸切タクシー・包车の利用","level":3,"blocks":[{"t":"list","ordered":false,"items":["観光地では、観光・旅行会社が提供する貸切タクシーだけでなく、個人でやっている貸切タクシー（日本では白タクに該当）もあります。","会社のタクシーも個人のタクシーもどちらも価格に大きな差は無く、現在は問題も発生しにくくなっています。","貸切タクシーは先に価格決定し乗車終了後に後払いをする方式が多いです。利用時間が長いため、合計金額がやや高額（例えば6時間貸切500元=1万円など）になります。","利用者側が最初に金額を見ていなかったため、合計金額が高いと誤解することもありますが、ごく稀にタクシー側が費用を上乗せ・ぼったくりしてくるなどの問題が発生することもあります。","また、最初に目的地・料金を決めたにも関わらず、移動中にタクシー運転手が「あそこの観光地も有名です。行きますか？」と言ってきて、利用者側が「はい、行きます」と言って実際に行った場合、最初の料金に含まれない追加の目的地として料金が加算される場合もあります。最初に決めた場所以外に行く場合には必ず追加料金が発生するのか、あるいは無料なのかを確認してください。","貸切タクシーを利用する際は、中国に慣れていない場合（特に女性１人の場合）は注意しましょう。"]}]},{"heading":"観光地近く・繁華街近く・一定の人通りのある場所の物乞い","level":3,"blocks":[{"t":"list","ordered":false,"items":["中关新园から北京大学東南門へ渡る歩道橋や五道口の道端など、人通りが一定程度ある場所で、WeChat/AlipayなどのQRコードや空き缶・入れ物を置いて物乞いをしている人が時々見られます。高齢の方や体に障害のある方等が多く、盲目の方が楽器を演奏している場合もあります。","実際に金銭的に困っている方が個人で行っていることもありますが、一部は組織的に物乞いを利用して金銭的利益を得ていることもあるので、不要にお金をめぐむことはしないようにしましょう。"]}]},{"heading":"タクシーの乗車拒否・途中下車など","level":3,"blocks":[{"t":"list","ordered":false,"items":["日本人留学生・観光客が中国でタクシーに乗車する際、日本人であることがわかると、乗車拒否されることが偶にあります。 DiDiなどのアプリでよんだ場合も、手を挙げたり停車しているタクシーを捕まえた場合も両方とも発生することがあります。","日本人複数人で日本語で会話している場合や、中国語が訛っているため「何人か・どこから来たか」と聞かれて「日本人・日本から来たと」回答するなどにより、日本人であることが運転手にわかるとこのような事が起きやすいです。","乗車前だけでなく、乗車した後にしばらく移動してから日本人であるという理由で、途中下車させられるということもあります。","普段からこのような事は発生しますが、日中関係が悪化すると発生する可能性が高くなります。","中国に慣れている場合には、各自その場に応じた対応が可能と思われますが、中国に慣れていない場合（中国語が流暢でない場合）には、揉め事やいざこざに発展すると対処が難しくなるため、素直に下車・利用をやめて別のタクシーを利用しましょう。","また必要に応じて、タクシーのナンバーの写真・記録をとり、DiDiなどのアプリの通報・举报機能を使って、または中国に慣れている場合には警察等へ通報し、再発防止・状況改善を図ってもらいましょう。"]}]},{"heading":"国旗・旗・和服など","level":3,"blocks":[{"t":"list","ordered":false,"items":["近年、中国国内で日本の国旗を手に持ったり、和服を着ているということで、日本人留学生や中国人・外国人学生が中国の方に通常とは異なる接し方をされたり、注意されるなどの摩擦が発生いることがごく稀に発生しています。","学生が自分で用意しなくても、国際交流・国際大会・各国留学生が参加する中小規模のイベントなどでは、イベント開催側が日本国旗や和服を準備していて、それを手に持ったり着たりできる場合もあります。","基本的に学生以外の不特定多数の人（中国現地の社会人や中高年層など）が参加するイベントや場所（野外・普通の道・歩道・観光地など）でこのような事例が発生しているため、このような場所では注意してください。","警備員・警察や会場スタッフが複数人いる限られた空間で、参加者も学生のみなど制限されている場合には基本的に問題にならず、比較的安全です。","しかし、比較的安全な会場で和服を着たり日本国旗を持ったりする場合でも、そこへ向かう経路が不特定多数の方がいる場合（地下鉄・道路脇の歩道など）には、上着を羽織ったりカバンにしまうなどして注意しましょう。上着などを羽織ったりが難しい場合には、現地入口までタクシーで移動するのも無難な方法です。","他にも、中国国内でセンシティブなものに当たる旗などは、基本的に使用しないようにしましょう。"]}]},{"heading":"夜のお店系の詐欺・被害","level":3,"blocks":[{"t":"list","ordered":false,"items":["留学生が夜のお店を興味本位で利用して問題発生・被害に遭うケースあり。他国の留学生に誘われて、という場合にも詐欺や違法性のリスクのある場所に行く場合には必ず断る。","下記のような専門に対応している企業サイトもあるので、参考にする。","在中国日本人トラブル相談センター　上海STCC"]},{"t":"card","title":"在中国日本人トラブル相談センター 上海STCC","site":"stccenter.net","url":"https://stccenter.net/"}]},{"heading":"タイや他国からの中国入国の際に大麻・薬物などを持ち込まない","level":3,"blocks":[{"t":"list","ordered":false,"items":["近年タイで大麻が市販されていますが、中国では大麻は所持するだけで違法・重罪となります。","近年、外国人留学生がタイなどから不注意で中国に大麻などの違法なものを持ち込んでしまい、空港などで見つかってそのまま拘束・逮捕される事例も発生しています。","他にも、タイや別の国の現地では違法ではないが中国では違法のものには注意してください。","中国では政策・対応が急に変化することや、地域・管轄によって対応が相当異なる場合が多い（上海では問題なかったが北京ではNGなど）ため、過去に持ち込んでいる人がいた、バレなければ大丈夫という場合でも、絶対に持ち込まないでください。"]}]},{"heading":"政治的にセンシティブな書籍・資料の持ち込み","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国に入国する際は、空港などの税関でスーツケースなどの荷物の検査をされることがあります。スーツケースのX線検査で不審に思われた人を対象としたものだけでなく、ランダムな抜き打ち検査、一定の人数をまとめての検査、検査が厳しくなっている国・地域からの入国者を対象とした検査などが行われます。","\u003cstrong>日本、香港、台湾、他国\u003c/strong>で出版・販売されている書籍・資料のうち、中国ではセンシティブな内容に当たるものは持ち込めず、税関で没収される可能性あります。","特に、\u003cstrong>写真・画像\u003c/strong>が掲載されている、\u003cstrong>漢字\u003c/strong>で人物名・歴史上の出来事などのキーワードが書かれている場合は、写真・画像・漢字は中国人スタッフでも理解可能なため、実際の内容に問題がなくても没収&amp;パスポートを記録される場合があります。","特に、中国で扱いに注意が必要な（特に政治に関連する）事件や人物の写真・画像が載っているものや議論となりやすそうな地図が載っているだけでも没収対象になる可能性があります。","中国大陸内で購入したものは基本的に問題ありませんが、20年以上前のやや古い書籍・資料の場合には、その後センシティブな内容に分類されるような内容が含まれている場合もあり、ごく稀に没収の対象となることがあります。","X線検査で調べた結果スーツケースの半分以上が書籍・資料という場合には、中身チェックの対象になりやすくなります。また、日本に比べて税関での抜き打ちチェックも頻繁に行われているので、普段から注意してください。"]}]},{"heading":"空港・港などの税関で荷物に黄色い帯・鍵がかかっていたら中身チェック対象","level":3,"blocks":[{"t":"list","ordered":false,"items":["2023-2024年ごろから、X線検査で特に不審と思われたスーツケースを対象に、GPS付きの黄色い帯や黄色い鍵がかけられるような対応が行われています。もしも帯や鍵がついていたら、税関スタッフのところへ行き、中身チェックを受けましょう。","輸出入管理が厳しい時期や、中国が重点的にチェックしている国・地域から入国した場合には、帯・鍵がついている確率が大きく上がることがあります。"]}]},{"heading":"一定期間内での出入国回数が多い・ビザ発行回数が多い場合は事情を聞かれる可能性","level":3,"blocks":[{"t":"list","ordered":false,"items":["家族の事情や仕事の事情などにより、3ヶ月間で5往復以上出入国（出国＆入国が合計10回以上）しているような場合や、X1・X2・居留許可のどれかを半年間で3回以上発行している場合には、出入国審査の際に事情聴取（いわゆる別室行き）される場合があります。","何度も出入国したり、ビザの発行をしている場合には、事情を聞かれた際にすぐに説明できるように、必ず正当な理由の用意と写真・資料などの証拠を常に持参しましょう（例、家族の入院・冠婚葬祭等の場合は病院や入院関連の資料・写真・説明用に整理したメモ、就活・資格試験受験の場合は関連資料・受験会場入り口等の証拠写真・就活試験受験の日程等を説明するためのメモなど、と大学側のビザ発給に関する資料などを携帯する）。"]}]},{"heading":"陸路での入国・出国はチェックが厳重","level":3,"blocks":[{"t":"list","ordered":false,"items":["中央アジア、南アジア、東南アジア、モンゴル、ロシアなどから陸路で中国に入国する場合、出入国審査の際のチェックが厳重な場合があります。","なぜ飛行機では無いのか、どのようなルートで来たか、入国後のスケジュールや目的地などを質問される場合が比較的多くあります（中国語がわからない場合は翻訳アプリ・ソフトを利用）。","不審と思われた場合には、スマホやPCの中身のチェックも行われます。写真・動画の削除などを要求された場合には、素直にしたがってください。","同様に、中国から他国へ出入国する際も、陸路の場合には審査が厳しくなることがあるので注意してください。"]}]},{"heading":"国家行事・大型イベント開催都市からの入国はチェックが厳重","level":3,"blocks":[{"t":"list","ordered":false,"items":["人民代表大会、軍事パレードなど、重要な行事が行われている都市から入国する場合、普段はほとんど何もチェックのない空港でも、入国審査の際に入国目的、当日の移動ルート、入国後のスケジュールなどを聞かれる場合があります。","留学生の場合には、学生証や入学許可証などの書類・写真を見せて説明しましょう。"]}]},{"heading":"入国後の24時間以内の公安への住宿登記（居住場所の登録）","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国では入国後に原則24時間以内に宿泊場所を公安へ届け出る必要があります。","ホテルの場合にはホテル側が宿泊手続きする際に公安に届出を出してくれるため、個人での登録は不要です。","大学の寮の場合には、寮の職員側が届出を出してくれる場合もありますが、学生に届出を自分で出すように説明する場合もあります。","ホテルや大学の寮以外に住む場合（親戚・知人友人の家、賃貸物件など）には、自分で届出を出す（スマホ・PCで手続き可能）必要があるので注意が必要です。","原則24時間以内ですが、実際には２〜３日間出さなくても問題はないので、気づいた時や時間ができてから早めに出しましょう。（留学初期は移動、大学の入学手続きや説明会、新生活の準備などで時間がない場合が多く、３日後に出す例も少なくありません。）","１〜２週間を超えて出さなかった場合には、特別なやむを得ない事情（病気・入院で寝たきりなど）がなければ「警告」の記録が付いたり「罰金」の対象になる可能性があるので注意してください。"]}]},{"heading":"X2ビザ／居留許可の取得前にX1ビザで中国から出国した場合","level":3,"blocks":[{"t":"list","ordered":false,"items":["X2ビザや居留許可を取得する前のX1ビザの状態で中国大陸から出国すると、原則として、日本でX1ビザ／X2ビザの発行手続きをやり直す必要があります。"]},{"t":"list","ordered":false,"items":["香港・マカオ・台湾への出国も含まれます。"]},{"t":"p","html":"このようなケースは毎年一定数あります。例えば："},{"t":"list","ordered":false,"items":["本人・家族・親族の冠婚葬祭","緊急・重要な用事","資格試験、進学・就職面接への参加","大きな病気・怪我の治療のための帰国","「香港・マカオ・台湾なら出国できる」と勘違いした","友人・知人が出国していたため、自分も出国できると勘違いした"]},{"t":"p","html":"出国してしまった場合は、日本でX1ビザ／X2ビザを再発行してください。"},{"t":"p","html":"再発行にあたっては、北京大学の留学生事務室に連絡し、ビザ申請に必要な資料を再発行してもらいます。"},{"t":"p","html":"必要資料の発行連絡からビザ手続き完了までは、"},{"t":"dl","rows":[{"k":"最速","v":"約2週間"},{"k":"一般的には","v":"3～4週間程度\u003cbr>かかります。"}]},{"t":"p","html":"そのため、帰国した場合ですぐに中国へ戻れず授業の出席ができないと分かったら、帰国したこと・帰国理由・中国へ戻る予定時期を授業担当の先生やTA・助教（あるいは友人知人に伝えてもらう）に早めに連絡しておきましょう。"},{"t":"p","html":"あらかじめ一時帰国することが決まっている場合は、帰国前に留学生事務室へ帰国理由を伝え、関連資料の発行手続きを早めに進めておくと、日本でのX1／X2ビザの発行がスムーズになります。"}]},{"heading":"中国国内・国外で居留許可の有効期限が切れた場合","level":3,"blocks":[{"t":"list","ordered":false,"items":["1年を超える留学では、毎年、居留許可の延長手続きが必要です。","延長手続きを忘れ、中国国内だけでなく、日本や外国にいる間に居留許可の有効期限が切れる場合もあります。"]},{"t":"list","ordered":false,"items":["中国国内で期限が切れた場合"]},{"t":"list","ordered":false,"items":["中国国内で居留許可の期限が切れると、オーバーステイ（違法滞在）にあたります。","気付いた時点で、できるだけ早く大学の留学生事務室に相談してください。","目安として、"]},{"t":"dl","rows":[{"k":"1週間～10日程度","v":"警察による「警告」の記録のみとなる場合がある"},{"k":"それ以上","v":"警告に加えて、罰金が科される場合がある"}]},{"t":"p","html":"具体的な処分はケースによって異なるため、期限切れに気付いたら自己判断せず、早めに大学へ相談しましょう。"},{"t":"list","ordered":false,"items":["日本・外国で期限が切れた場合"]},{"t":"list","ordered":false,"items":["日本や外国（香港・マカオ・台湾を含む）にいる間に居留許可の期限が切れた場合は、大学の留学生事務室に連絡してください。","X1ビザの発行に必要な資料を再発行してもらい、日本でX1ビザを申請します。","X1ビザ取得後に中国へ渡航し、改めて居留許可を申請・取得します。"]}]},{"heading":"不法滞在・オーバーステイ","level":3,"blocks":[{"t":"list","ordered":false,"items":["留学生の中には、不注意や勘違い等により居留許可・ビザで許可された期間を過ぎて中国に滞在する方がごく稀にいます。","例：期限の最終日に出国する予定だったが台風（7月下旬）や大雪（1月下旬）で航空便がキャンセルや遅延になった・空港までの交通機関が停止し予定変更を余儀なくされた、居留許可の期限が切れた後はビザフリーの30日間が自動的に追加されると思った、友人が7月31日までの期限なので自分も同じだと思ったら自分は7月15日までだった、中国での予定を優先していたら期限を忘れていた、夏休みに中国人の友人・知人や恋人の家に滞在している間に期限を超えた（中国人は居留許可などの制度を知らないので気付けない）など。","在学中や中国滞在中にオーバーステイが発覚すると、警察から本人や大学等の関係機関にその旨と処分内容（「警告」の注意のみや罰金など）が通知されるので、その内容にしたがって対応してください。数日程度であれば口頭での注意だけか、或は「警告」などの記録がつくだけになりますが、５日〜１週間越えくらいから罰金が課せられる可能性が高くなります。","オーバーステイの場合、法律上は1日につき最大500元（＝1万円程）の罰金が課せられます。実際には、１日あたり50-200元程（＝1000円〜4000円）の罰金が課せられることが多いと言われています（10日間超過→500-2000元の罰金）。","本人が警察や大学等から連絡を受けていなくても、空港などでの出国審査の際にも確認されます。出国審査の際に別室に呼ばれるなどして、同様に処分内容が出されるため、その内容に従って対応してください。"]},{"t":"label","html":"オーバーステイに間違われた場合は説明する"},{"t":"dl","rows":[{"v":"ごく稀に、あるいは本人の認識ではオーバーステイでは無いのに、オーバーステイとして扱われる場合があります。オーバーステイではなく警察や出国審査職員の間違いであると考えられる場合には、その証拠資料・写真・記録などを提示して説明をしてください。説明に問題がなければ、オーバーステイではない計算方法に基づいて記録を訂正してくれます。"},{"k":"例１","v":"居留許可を取得後に出国し、その後再入国。入国した際には本人は居留許可での入国だと認識していたが、入管職員は旅行客だと間違ってビザフリー（30日間まで滞在可能）の旅行客として入国記録を作成。3ヶ月後に留学プログラムが終わり、空港から出国しようとした際に別室に連れて行かれ、2ヶ月間のオーバーステイだと出国審査担当職員から言われた　→有効期間内の居留許可があるためオーバーステイでないこと、入国の際には特に「観光」などのことは入国審査官に話していないこと、観光ではないため普段は大学に通っていた証拠としてスマホにある大学・寮で撮影した写真を見せるなどして説明する。"},{"k":"例２","v":"7月31日までの有効期限の居留許可を持っているが、7月10日に留学プログラム終了したため一度日本へ帰国。また中国へ遊びに行きたいと思い7月25日に中国へ入国し2週間滞在。8月7日に空港から日本へ帰国しようとしたら、出国審査職員に呼ばれて別室へ行き、居留許可の有効期限が7月31日までなのでオーバーステイだと言われた　→7月25日に入国した際はビザフリー（30日間まで滞在可能）で入国したつもりである、7月上旬には留学プログラムが終わったという証拠として授業や留学スケジュールが書かれた資料や修了証明書のスマホの写真を見せるなどして説明する。"}]}]},{"heading":"ホテル予約の注意","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国のホテル宿泊には、外国人の場合はパスポートが必須。ホテルは日本とは異なり、人数単位ではなく部屋単位の料金。ユースホステル・青年旅舎等の場合は、ベッド単位の料金。","設備自体がやや古いホテルの場合、お風呂シャワーのお湯が出ない、部屋の電気がつかない、タバコ臭い等の匂いの問題がある、ドアや窓の閉まりが悪い、などの問題のあるケースが偶にあるので、その場合はホテル従業員に理由と部屋の交換をお願いする。","中国は外国人宿泊不可や拒否のホテルがあります。ここ2~3年は制度上、外国人宿泊不可のホテルは無くなったが、外国人宿泊手続きが不明・面倒・外国人宿泊の資格を持っていないから泊めさせられないと勘違いしている等の理由により、現在も外国人宿泊不可のホテルは非チェーン店の低価格ホテルを中心に多数存在します。","ホテルを予約する際は、外国人が宿泊可能か事前に確認してください。目安として、一泊200元以上のホテル（地方都市であれば100元以上）、有名チェーン、国際系ホテル、ユースホステルなどは外国人宿泊可の場合が多いです。","外国人の宿泊ができても、ホテル従業員が外国人客の宿泊届の出し方がわからない場合は、従業員と一緒に最寄りの派出所や公安局へ行き手続きをするという場合があるので注意。ホテルのPCから宿泊届を出すための公安のシステムにパスポート情報や顔写真等の個人情報を自分で入力してもらえないかと頼まれる例もある。"]}]},{"heading":"緊急連絡先の確認","level":3,"blocks":[{"t":"list","ordered":false,"items":["学校外や旅行先での事故・トラブルに備えて、友人・学校職員・大使館・領事館などの連絡先（WeChat、電話、メール、住所）を事前に確認しておく。"]}]},{"heading":"特別区域（チベット）の注意","level":3,"blocks":[{"t":"list","ordered":false,"items":["チベット旅行をする場合、外国人は許可が必要（出発前や到着後に駅・空港・道路の各地点で確認される）なため、必ず申請を行う。特に特殊な理由がなければ、チベット現地の中国の旅行会社を&quot;小红书/Red&quot;やネットで探し、問い合わせて手続きする。","特別区域を訪問する場合、事前に許可書の申請が必要な場合があります（チベットは約1か月前に旅行会社を通して入藏証を申請、ウイグルの一部地域は現地公安等で申請）。","撮影禁止の施設・区域が存在するため注意してください。","観光客が少ない地域へ行くと、警察による職務質問や事情聴取を受ける可能性が高くなり、事情聴取の内容も厳格になるので注意してください。","警察に持ち物、スマホ・PCの写真・動画、WeChatなどSNSの記録を見せるように言われた場合には素直に見せてください。また、それらの記録の削除を指示された場合、あるいは警察が削除しようとした場合には、理由の確認するとともに、言われたことに従って削除してください。必要以上に削除される場合もある（例えば、滞在中の写真全削除など）ので、一つ一つ一緒に確認し、明らかに問題のない記録については残すように交渉してください。","観光客の少ない地域で警察に事情聴取を受けると、場合によっては大学側へ本当に学生として在籍しているのかを確認される場合が有ります。その場合には、大学の留学生事務室や自分が所属する学院・系の職員などへWeChatや電話で連絡をしてください。大学職員への確認ができるまで公安局に数時間一時待機となることも有ります。当日中に確認が取れない場合には、翌日や翌々日もその公安局に来るように言われ、２〜３日間足止めされる場合もあるので、大学職員と連絡が取れそうな知人友人などにも連絡するなどして早く確認が取れるように対応してください。"]}]},{"heading":"特別区域（ウイグルなど）の注意","level":3,"blocks":[{"t":"list","ordered":false,"items":["ウイグル自治区へ行く際には外国人は特に何も手続き無しに行くことが可能だが、ウイグル自治区の中に許可が必要な場所も多いので、そのような場所に行く場合は、ウイグル自治区現地（基本的にウルムチ市内で手続きすると良い）の関連機関で手続きを行う。","ウイグル自治区以外でも入るのに手続きが必要なエリアがある場合もあるので、特殊な場所へ行く場合には事前に確認する。","撮影禁止の施設・区域が存在するため注意してください。","観光客が少ない地域へ行くと、警察による職務質問や事情聴取を受ける可能性が高くなり、事情聴取の内容も厳格になるので注意してください。","警察に持ち物、スマホ・PCの写真・動画、WeChatなどSNSの記録を見せるように言われた場合には素直に見せてください。また、それらの記録の削除を指示された場合、あるいは警察が削除しようとした場合には、理由の確認するとともに、言われたことに従って削除してください。必要以上に削除される場合もある（例えば、滞在中の写真全削除など）ので、一つ一つ一緒に確認し、明らかに問題のない記録については残すように交渉してください。","観光客の少ない地域で警察に事情聴取を受けると、場合によっては大学側へ本当に学生として在籍しているのかを確認される場合が有ります。その場合には、大学の留学生事務室や自分が所属する学院・系の職員などへWeChatや電話で連絡をしてください。大学職員への確認ができるまで公安局に数時間一時待機となることも有ります。当日中に確認が取れない場合には、翌日や翌々日もその公安局に来るように言われ、２〜３日間足止めされる場合もあるので、大学職員と連絡が取れそうな知人友人などにも連絡するなどして早く確認が取れるように対応してください。"]}]},{"heading":"現地調査・資料収集・持ち込み・持ち出し","level":3,"blocks":[{"t":"list","ordered":false,"items":["化石、鉱物、植物、文献資料などを収集する場合、外国人規制や事前申請・許可が必要な場合があります。","日本への持ち帰りや海外からの持ち込みにも制限がある場合があります。","二胡や民芸品に使われるヘビ皮・毛皮などはワシントン条約の対象となる可能性があるため、事前申請・許可を取得してください。"]}]},{"heading":"偽物ブランド品の日本への持ち帰りは禁止","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国では、シャネルやルイビトンなどの各種ブランド品の偽物が街中やネットで販売されています。全く似ていないものから、完成度の高いものまで様々ありますが、どれも日本へ帰国する際には、税関などで見つかると没収対象となり、持ち込むことはできません。"]}]},{"heading":"北京ダックなどの肉類や野菜・果物は日本へ持ち込めない","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国・外国で購入した\u003cstrong>肉類や野菜・果物（パックの北京ダック、肉まんなど）\u003c/strong>などはそのままでは日本に持ち込むことはできず、日本の税関で見つかった場合には没収対象となります。","どうしても持ち込みたい場合には、検疫などの手続きが必要になるので注意してください。"]}]},{"heading":"交通機関（高速鉄道）","level":3,"blocks":[{"t":"list","ordered":false,"items":["重要行事（国家行事・国際行事等）が開催される都市へ行き来する鉄道に乗車する場合、乗車前に手荷物チェックが追加される場合があり、原則車内への持ち込み禁止となっているものの徹底的にチェックされる場合がある。","重要行事開催都市へ行き来しない場合でも、最寄りの都市やその都市との往来が多い都市の駅では、駅構内入場等の際の荷物チェックが厳格化される場合有り。","持ち込めない荷物を持っている場合は、その駅に預けることが可能（他の場所へ送ることは不可）なことが多いので、駅員に確認する（例、スプレー缶、充電器、アルコール度数の非常に高い酒、電子タバコ・ライター等）。","自分の席に知らない人が座っている（自由席・席なしチケットを購入した客、個人の好みの席に勝手に移動、家族友人知人に近い席に勝手に移動等）場合が稀に有り。その場合は、スマホなどの予約画面を見せて自分の席であることを説明し、移動してもらう。席の交換を求められる等移動を断られる場合もあるので、その場合はそのまま席を交換してあげるか、添乗員を呼んで対応してらうなど、柔軟に対応する（逆に、自分が家族友人知人の近くの席に移動したい等の理由があれば、理由を説明して他のお客さんに移動してもらうということも可）。"]}]},{"heading":"交通機関（列車・寝台列車・绿皮车）","level":3,"blocks":[{"t":"list","ordered":false,"items":["自分の席に知らない人が座っている率や席交換をお願いされる率が高速鉄道より高くなります。状況に応じて柔軟に対応してください。","コンセントの無い車両、コンセントの数が少ない車両があるため、長時間移動の場合には事前にネットなどで確認したり、モバイルバッテリーを準備しておくと良い。","景色がきれいな場所を通る列車の場合（中国西部・南部など）、出発前や列車が駅に停車している間に、乗車位置の窓をティッシュ等できれいに磨くと良い（チベット等へ行く列車は磨く人が多い）。"]}]},{"heading":"交通機関（飛行機）","level":3,"blocks":[{"t":"list","ordered":false,"items":["国内線では2025年夏からモバイルバッテリーに中国の規格である「CCC」マークが無いと手荷物検査時に没収（弁償無し）されるので注意。手荷物検査の場所では預けることが出来ないことが殆どのため、高価なバッテリーの場合には必要に応じて先に空港内で預けるか、郵便・宅配の店舗を探して寮・自宅へ別途郵送する。","繁忙期には北京や上海等の大都市では、国内便・国際便に関わらず日本では想像出来ないほど混雑する事が稀にあるため（手荷物検査→出国審査で２時間以上並ぶ等）繁忙期にはいつもより早めに空港に到着するように向かう（例、16:00発の便に乗る場合、いつもなら2時間前の14:00に空港についていれば間に合うが、超繁忙期のときは余裕をもって12:00頃に行く等。）。","もし並んでいて登場時間に間に合わなそうになったら、空港職員に搭乗券を見せて間に合わないことを伝え、優先的に手荷物検査や出国審査をさせてもらう。"]}]},{"heading":"電動バイクはヘルメット着用・北京市内では2026年5月から義務化","level":3,"blocks":[{"t":"list","ordered":false,"items":["大学敷地外で電動バイクを乗る場合、特に警察がいる場所ではヘルメットを着用してください。","2026年5月からヘルメット着用が義務化され、北京市内の一部交差点・道路等で警察が定期的に取り締まりを行うことが多くなっています。北京以外でも一部で取り締まりが厳しくなっています。","人通り・交通の少ない道路、北京の郊外、他の都市などでは、現在でもヘルメットを着用しない方が大多数というところもあり、警察に見つからなければ問題はありませんが、大学近くや交通量の多いところではヘルメットを着用しておきましょう。","着用していないところを警察に見つかると、警告の記録がつけられたり、10元〜50元（約200円〜1,400円）の罰金が課せられます（WeChat/Alipayで支払い可）。"]}]},{"heading":"交通事故・加害者の場合は寮・賃貸物件の部屋まで警察が来る場合も","level":3,"blocks":[{"t":"list","ordered":false,"items":["徒歩や自転車の場合は基本的に問題ありませんが、大学外で電動バイクを運転する場合、交通事故に遭う可能性が高くなります。","人を負傷させたり車に傷をつけるなどして加害者となった場合、監視カメラなどの記録をもとに、大学の寮・賃貸物件の部屋まで警察が訪ねてくることもあるので、交通事故には十分注意しましょう。","また、被害者となった場合には、写真・動画で記録をとると同時に、警察へ連絡しましょう。"]}]},{"heading":"美容室・ヘアサロン・ネイルサロン・エステ等の各種お店のチャージ・デポジットの注意","level":3,"blocks":[{"t":"list","ordered":false,"items":["五道口、三里屯や各地繁華街の美容室やネイルサロン等では、１回ずつ料金を支払うよりも、先に500元分や3000元分などをまとめ払いして会員登録・割引チケット購入・チャージ式・デポジット式のお店でまとめ払いすると、通常よりも相当割引されることがあります。","例："]},{"t":"dl","rows":[{"k":"满300减50","v":"300元以上購入で50元引き"},{"k":"满300打8折","v":"300元以上購入で20%引き（80%の支払いのみ）"},{"k":"满300赠50","v":"300元以上購入で50元分贈呈"},{"k":"满300赠礼品","v":"300元以上購入で景品・商品プレゼント"},{"k":"满500赠会员积分500分","v":"500元以上購入で会員ポイント500点進呈"}]},{"t":"p","html":"このような割引サービスは、飲食店、カラオケなど、様々なお店で実施されています。"},{"t":"p","html":"しかし、お店自体が潰れる・倒産してしまうと返金されない場合が多いので、半年後や１年後の利用までを見据えて大金を一括支払い・チャージする際には注意してください。また、店舗が遠くに移転する場合・店舗閉鎖により別の店舗でしか使えなくなるというケースもあります。"},{"t":"p","html":"特に、各地繁華街など営業している個人経営・小規模チェーン店の美容室やネイルサロンについては、時期・景気によっては閉店や店の入れ替わりが頻繁に発生し、3000元チャージして200元分利用した後、1〜2ヶ月後に訪問したら閉店していたということもしばしば起こるので、そのようなリスクに注意してください。"}]},{"heading":"環境・衛生","level":3,"blocks":[{"t":"dl","rows":[{"k":"空気汚染・黄砂","v":"北京はPM2.5やPM10が高くなることがあります。マスクや防護メガネ、空気清浄機の使用を検討してください。"},{"k":"乾燥","v":"秋〜冬は乾燥が強いため、加湿器や濡れタオル、観葉植物などで対策してください。"},{"k":"水道水","v":"北京は硬水のため飲用は煮沸推奨。電気ポット等で水道水を沸かすと水垢が付きやすいので注意してください。水道水に慣れていない場合は、うがいをする場合にも市販の水を使用してください。"}]}]},{"heading":"吞卡・カードがATMに呑み込まれる","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国のATMでは、ATMからカードをしばらく抜かなかったり、カードに問題があると認識された場合に、ATMにカードが呑み込まれることがあるので注意してください（カードを１〜２分くらい抜かないという場合に他人による盗難防止のためによく呑まれます）。","その際には、サービスセンター/客户服务热线等に連絡してください。当日〜数日後（〜１週間後）にATMを開けて取り出してくれます。"]}]},{"heading":"トイレ・衛生・ティッシュは必ず持参","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国ではごく一部の場所を除いて、\u003cstrong>トイレットペーパーは便器の中に流さずゴミ箱へ捨て\u003c/strong>てください"]},{"t":"list","ordered":false,"items":["水圧やパイプがトイレットペーパーを流すことを想定して作られていないため詰まりやすくなっています","また、中国で販売しているトイレットペーパーは基本的に非水溶性＝水に溶けないような比較的丈夫な紙ということもあり、そのまま流すと詰まりやすく、何度か流しているうちに紙が砕けて流れるということもありません。"]},{"t":"p","html":"近年開店した大きいデパート、高級なお店、高級なホテル以外では、トイレに紙が補充されていないことも多いので普段からテイッシュ持参必須です。"},{"t":"p","html":"北京大学内のトイレは、現在はほとんどのトイレが定期的に補充されるようになっていますが、利用者が少ないトイレや夏休み・冬休みの長期休暇中は紙が定期的に補充されずに無いこともあるので注意してください。"},{"t":"p","html":"北京市内の路地や地方都市の公衆トイレは、最初から紙をつけるホルダーが無いようなところも多いため、\u003cstrong>外出の際は必ず紙を持参\u003c/strong>してください。"},{"t":"p","html":"公衆トイレの場合は、壁やドアで仕切られていないいわゆる「ニーハオトイレ」のところが多く存在します。また、郊外、地方都市、山間部などに行くと溝のタイプのトイレ、水洗ではないトイレ（ぼっとんトイレ）で臭いが非常にキツイ場所なども多数あります。そのようなトイレに慣れていない場合には、旅行・遠出の際には綺麗なトイレがあり次第早めに利用するのがおすすめです。"}]},{"heading":"スマホ・PCの中国でのアップデート（特にOS・アプリのアップデート）","level":3,"blocks":[{"t":"list","ordered":false,"items":["OS・アプリのアップデート利用で、中国仕様に変わったりエラーが発生する場合があります。特別な操作が必要な場合を除き、通常は大きな問題はありません。"]}]},{"heading":"アルバイト・インターン","level":3,"blocks":[{"t":"list","ordered":false,"items":["日本人留学生や他国の留学生が中国でアルバイト・インターンをした際に、給与未払い、契約違反、長時間労働、損害賠償問題など、各種典型的なトラブルが稀に発生しています。問題が大きく友人知人だけでは解決できそうにない場合には、学校関連部門や大使館・領事館、場合によっては法律事務所へ相談してください。"]}]},{"heading":"政治に関わる動画、ドラマ、映画への出演オファー、記事執筆依頼など","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国留学・滞在中は、中国人の知人・友人や他の留学生から、外国人留学生や日本人留学生を対象とした動画・ドラマ・映画への出演、記事の執筆、インタビューなどの有償無償の依頼・募集を紹介されることがあります。中国でさまざまな活動に参加することは中国を理解する上で重要なことですが、中には抗日戦争などの歴史を扱うものや、政治的に機微なテーマを扱うものもあります。","本人に各種立場を表明する意図がなくても、出演・執筆した内容や、その掲載方法によっては、特定の立場を支持しているように受け取られる可能性があります。特に\u003cstrong>名前・所属・写真/動画\u003c/strong>も一緒に公開されるものについては注意してください。一般に公開されない大学内の活動やほとんど注目されない個人・小規模の活動等もあれば、比較的注目されやすい活動にも容易に参加できる場合があります。","もしも興味があり参加・応募する際は、以下のような点を事前に確認しましょう："]},{"t":"list","ordered":false,"items":["どのような内容・テーマなのか","誰が制作・運営しどの媒体・SNSで公開されるのか","自分の名前・所属・写真・動画などは掲載されるか、掲載される場合はどのように掲載されるのか","完成した動画・記事等を公開前に確認・修正・内容変更はできるか"]},{"t":"list","ordered":false,"items":["特に、日本や中国の政治・歴史・時事問題などに関わる内容の場合、本人の立場や意思が明確であると言う場合を除いて安易には参加せず、内容や掲載方法を十分に確認し、知人友人に相談をしたり、場合によっては応募後に断ったりしてください。","メディアなどで一般に公開されないと言う活動の場合には、参加しても特に問題ないと言う場合が多いです。"]},{"t":"label","html":"SNS・メディアの利用・出演・協力に関する注意"},{"t":"list","ordered":false,"items":["中国の大学に在学中は中国の法律・政策などに従ってSNSを利用してください。","メディアに出演・協力する場合にも、中国の法律・政策などに従ってください。","個人が特定できる場合で、特に大学が特定できる場合（過去の投稿内容に大学名や大学の写真などが含まれている）や大学名を利用している場合は、大学側が自分の大学の学生として管理対象とする可能性が高くなります。","留学生活、旅行、グルメ、文化風習紹介などであれば基本的に何も許可なしに問題なく情報発信することはできますが、単なる時事ネタや学術的な内容ではなく、極めてセンシティブな内容が含まれる場合には、大学側から注意される場合もあります。","状況に応じて、個人・大学を特定できる状態か、あるいは極めてセンシティブな内容が含まれていないかなどに注意してSNSの利用やメディアの出演・協力を行ってください。"]}]},{"heading":"紛失・盗難","level":3,"blocks":[{"t":"list","ordered":false,"items":["大学内で物をなくした場合は、以下を試してください："]},{"t":"list","ordered":true,"items":["思い当たる場所を探す","教学楼の出入り口付近で落とし物を確認","「树洞」に投稿して周囲の目に触れる","警備員に監視カメラを確認してもらう"]}]},{"heading":"治安","level":3,"blocks":[{"t":"dl","rows":[{"k":"北京大学内","v":"大学内は2018年頃から監視カメラが教室内、廊下、屋外など様々な場所に設置・増設されています。また、2020年のコロナ禍以降には監視カメラの増設や監視・管理強化により、置いていたものが盗まれるなどの問題はほぼ無くなっています。また、何か物品の紛失の際や問題が発生した場合も、監視カメラの映像をもとに対応してくれるようになっています。"},{"k":"寮","v":"寮は出入り口が顔認証システム導入により、基本的に住んでいる学生と関係者しか入れなくなっています。また、出入り口や廊下などには監視カメラが設置されています。そのため、学生による行為を除き、2010年代にまだ発生していた寮スタッフ（阿姨、アーイー）・関係者・部外者により部屋のものが盗まれる等の事例は基本的に無くなっています。また、何か問題が発生した場合も、スタッフに連絡すると、監視カメラの映像をもとに対応してくれます。"},{"k":"大学外","v":"大学外も以前はスリ・ひったくりが発生していましたが（2019年ごろまでは学校の周囲徒歩1分圏内でも発生例あり）、コロナ禍以降は監視カメラ増設と監視・管理の強化により、ほぼなくなっています。しかし、監視カメラがほとんど無い地域や人が非常に混んでいるような場所では貴重品・物品の管理はしっかりすることが必要です。"}]}]},{"heading":"個人情報の流出と詐欺","level":3,"blocks":[{"t":"list","ordered":false,"items":["パスポート、銀行カード番号などが記載された書類の取り扱いや、知らない人からの関連情報を利用した問い合わせ注意してください。中国では、ホテルの宿泊や施設の利用などで、パスポート・カード・顔写真・電話番号等を使うことが多く、個人情報が漏れる可能性も一定程度あり、日本とは異なる事に遭遇する場合があります。","例えば、ごく稀に留学生が公安局などを名乗る者から電話やメールを受け、金銭被害に遭うケースもあります。","中には、メールで添付資料としてパスポート写真、本人写真、銀行口座番号、電話番号等の情報一式が載っている逮捕状や請求書等が送られてきたり、電話上で本人の正確な各種情報を伝えて罰金などとして料金請求をするようなこともあります。","もしも身に覚えの無い問い合わせ・請求がきた場合や、警察・公安局・中国国内外関連機関職員などを名乗る怪しい人から連絡がきた場合には、必ず事実確認をするとともに、知人友人・家族・大学職員・大使館領事館などに相談しましょう。","詳細は在中国日本国大使館の安全情報を参照：\u003cbr>\u003ca href=\"https://www.cn.emb-japan.go.jp/itpr_ja/security_information.html\" target=\"_blank\" rel=\"noopener\">https://www.cn.emb-japan.go.jp/itpr_ja/security_information.html\u003c/a>"]}]},{"heading":"社会人（日本人駐在員、外国人駐在員、中国人社会人等）とのトラブル","level":3,"blocks":[{"t":"dl","rows":[{"k":"金銭問題","v":"駐在員の方や現地社会人の方は、金銭・生活スタイル等が留学生と大きく異なる場合があります。一緒に食事・観光・１〜２泊の旅行をした際に予想以上の出費（1〜2ヶ月分の生活費相当が１〜２日で無くなるなど）となる場合があるので、事前に予算を確認し、必要に応じて断るなど注意してください。同様に、高額な金銭的やり取りや貸し借りに関してもトラブルが発生するケースがあるため注意してください。"},{"k":"男女間トラブル","v":"中国留学や欧米等の他国への留学も含め、駐在員・現地社会人との男女間の様々なトラブルが発生しているので注意してください。特に、女性留学生側が被害者となるケースも発生した場合には、大学や大使館・領事館または日本国内の関連機関（公的機関やNPO・民間団体など）へ相談して解決を図ってください。"}]}]},{"heading":"身元の知らない人への知人友人の紹介・個人情報の提供","level":3,"blocks":[{"t":"list","ordered":false,"items":["現地社会人や駐在員などで所属・身元がはっきりしていない人（口頭のみでの説明など）から「日本人・留学生の友人知人を紹介してほしい」等と言われても安易に紹介せず、身元や目的を確認してください。","女性を狙ったもの、詐欺に類するもの、日本人留学生や外国人留学生関連のビジネスや業務を行っている人が、日本人留学生に友人知人の紹介を依頼する事例が過去に発生しています。","日本人や日本人留学生が参加するイベントの会場内や会場周辺で「道に迷ったので教えて欲しい」など各種理由で声をかけて連絡先を交換しようとする例もあります。"]}]},{"heading":"「回执证明」（黄色い証明）が身分証/パスポート代わりとして通用しない","level":3,"blocks":[{"t":"list","ordered":false,"items":["居留許可の申請中はパスポートを公安機関に提出するため、手元にパスポートがありません。この際にパスポートの受け取り証明として発行される黄色い紙の「回执证明」は、公安局が発行した正式な資料として、パスポートの代わりにホテル宿泊、高速鉄道・飛行機の利用、観光施設への入場などに使える場合があります。","ただし、「回执证明」の認知度は非常に低く、各窓口の担当者・スタッフによっては身分証として認めてもらえないことがあります。その場合は、パスポートのコピーや写真を提示し、「回执证明」にも本人の顔写真、氏名、パスポート番号があることと公安局のハンコがあることを説明すると身分証として認められる場合もあります（それでも拒否される場合があります。）。"]}]},{"heading":"パスポート更新後は大学に連絡","level":3,"blocks":[{"t":"list","ordered":false,"items":["留学中にパスポートを更新してパスポート番号や個人情報が変わった場合、大学の登録情報の変更が必要になります。旧パスポートと新パスポートの両方を持って留学生事務室へ行き、情報の更新を行ってください。","WeChatなど、中国で登録している各種サービスについても情報更新が必要になる場合があります。"]}]},{"heading":"名前が変わった場合の手続き","level":3,"blocks":[{"t":"list","ordered":false,"items":["結婚などによって氏名が変わった場合、パスポートの更新だけでなく、大学・ビザ・各種登録情報の変更が必要になります。","その際には、変更理由を証明する資料（結婚の場合は結婚したことの関連証明を英語か中国語で発行）と新・旧パスポートなどの情報更新が必要な資料を大学の留学生事務室の職員にも見せて、情報更新を行なってください。ビザ・居留許可などの更新が必要な場合もあります。"]}]},{"heading":"中国で採用されたが就職できない・勤務開始が遅れる","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国で就職先が決まっても、勤務先の会社・機関が外国人のビザ・就労許可手続きを十分に理解していない場合があります。その結果、勤務先側での手続きが進まず、最終的に勤務できなくなったり、勤務開始が数か月～1年後になったりするケースがあります。","日系企業・外資系企業・大企業などではなく、外国人を雇用した経験も少ない企業に就職する際は、勤務先にもビザ手続きについて問い合わせたり、自分でいろいろ調べて勤務先担当者に手続き方法の説明を行なって、手続きを進めてもらうなどしてください。","また、時期や業種によっては、ビザ発行手続きをしてもビザがなかなか降りず、数ヶ月〜半年経つというケースもあり、場合によってはビザが発行されない場合もあります。そのため、就労できない可能性があると思われる場合には、同時並行で中国だけでなく日本などでも仕事を探したり、アルバイトなどをするのがおすすめです。"]}]},{"heading":"日本・中国の二重国籍、中国の戸籍など留学への影響","level":3,"blocks":[{"t":"list","ordered":false,"items":["本人が生まれた際に、親の一方または両方が中国国籍の場合には、本人が知らずに中国国籍を自動的に取得しており、日本国籍と中国国籍の二重国籍となっているケースがあります。二重国籍の場合も含め、中国国籍があると中国大陸への留学の際に、留学申請・審査・ビザ手続き・入学後のどこかの段階で申請や資格を取り消される場合があります。特に留学申請〜ビザ手続きのプロセスで、本人情報を中国の公安や各機関に照合するため、途中でも申請・資格取り消しの連絡が来る場合があります。","中国国籍の離脱などをすでに行なっているが、中国に戸籍（戸口）が残っているという理由で、留学申請・入学・ビザ手続きの過程で大学側から連絡がくる場合があります。この場合は戸籍所在地の公安局や関連機関へ行き、戸籍を取り消す手続きが必要になることがあります。","中国系の親がいる場合には、留学申請の前に自身の国籍の状況について必ず確認しましょう。日本で確認する場合には、日本にある中国大使館・領事館へ問い合わせて確認してください。国籍離脱は数ヶ月〜数年かかるようなことも多いため、中国留学を検討した段階で早めに手続きを開始しましょう。","また、日本国籍と台湾側の籍を持っているという場合には、管轄が異なるため、中国大陸への留学に支障がないケースもありますが、事前に籍の離脱をしておきましょう。"]}]},{"heading":"親の一方または両方が中国国籍の場合、予科・本科入学資格に条件あり","level":3,"blocks":[{"t":"list","ordered":false,"items":["次の条件に当てはまる場合には、予科・本科（修士、博士、進修生は対象外）に進学する際に、入学の4年前の4月30日から入学直前の4月30日までの4年間のうち、2年間は中国国外に居住していなければならないという条件があります："]},{"t":"list","ordered":false,"items":["両親の一方または両方が現在も中国国籍 AND 本人は生まれた時から中国国籍がない場合（日本国籍のみの場合）。","本人が過去に中国籍から日本国籍へ国籍を移した場合や、中国国籍との二重国籍状態から中国国籍を離脱して日本国籍のみにした場合。"]}]},{"heading":"中国政府奨学金などの中国側の奨学金があっても最初は自腹","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国政府奨学金・国際中文教師奨学金などで、「学費免除＋寮費免除＋生活費支給」となっていても、最初の月は一定の費用は自分で負担する必要があります。","寮費が無料でも、入寮時に家賃1か月分相当（約1,000～4,500元）のデポジットを支払う必要がある場合があります。退寮時に返還されるものですが、留学開始直後・入寮時に支払いが必要になります。","北京大学での発生例はありませんが、他の大学で留学生寮に全く空きがなくなり（大学間の交換留学プログラムなどで他の留学生へ優先して寮の部屋を提供、留学生寮の取り壊し・再建設で一時的に留学生寮の部屋数が極端に少なくなるなど）、大学側から学外の賃貸物件を借りるよう指示される例がごくごく一部で例があります。奨学金の内容として家賃補助が500-700元ほど出ますが、全額補助はされないため、支給される生活費から残りの家賃を払うまたは自腹で家賃を払うなどして対応してください。","奨学金には生活費も含まれるため、「入学手続きの際に奨学金を受け取れる」勘違いする留学生も一定数います。実際の初回振込・受け渡しは早くても\u003cstrong>9月20日ごろ、遅いと10月25日ごろ\u003c/strong>となるため、少なくとも9-10月の2ヶ月分の生活費は自分であらかじめ用意してください（9月下旬振り込みの場合は9-10月の2ヶ月分、10月下旬振り込みの場合は9-11月の3ヶ月分が提供されるため、留学期間中の生活費は全て提供されることになる）。"]}]},{"heading":"クリスマス、ハロウィンなどのキリスト教系の装飾・活動の制限","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国では2019年ごろから、大学や公的機関でのクリスマス・ハロウィンなどのキリスト教系や外国文化・宗教関連行事の活動が一部制限されています（一般企業などの非公的機関、ショッピングモール、個人の場合は基本的には制限なし）。大学の教室・会議室などを借りて関連のイベントを企画する際には、そのような趣旨を含む内容をのぞいてイベントを企画してください。","また、寮などでも通路などの多くの人が通る場所に関連の飾り付けをすると、寮スタッフから取り除くことを求められることもあるので注意しましょう（室内は制限なし）。"]}]},{"heading":"日本から送った荷物が税関で止まる","level":3,"blocks":[{"t":"list","ordered":false,"items":["日本から郵便局や宅配業者を通して国際便で送った荷物が中国の税関で止まり、手続きや関税の支払いが完了するまで荷物を受け取れないことがあります。","中国側の税関のAppやWeChatミニプログラムから関税を支払えるので、そちらで請求された料金を支払ってください。支払いが完了すると、税関側で荷物の送付を再開してくれます。"]}]},{"heading":"野良犬に噛まれた場合は狂犬病ワクチンを打つ","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国で野良犬などに噛まれた場合には、必ず病院へ行き、狂犬病ワクチンを接種してください。","ワクチンは種類・接種方法によって、間隔をあけて合計5回前後の接種が必要になる場合があります。"]}]},{"heading":"スマホの電池切れで何もできない","level":3,"blocks":[{"t":"list","ordered":false,"items":["中国ではAlipayやWeChat Payを日常的に利用するため、スマートフォンの電池が切れると、各種支払い、食事、地下鉄やタクシーの利用などが一切できなくなります。","電池切れとなった場合には、近くの人やスタッフにモバイルバッテリーを借りて充電したりしてください。","特に何もないような場所でスマホの電池切れになると一切の手段を失う可能性があるため、常に100元札などを財布や荷物に入れておくことがおすすめです。"]}]},{"heading":"WeChatが突然使えなくなる・本人認証が必要となる","level":3,"blocks":[{"t":"list","ordered":false,"items":["WeChatのアカウントがBAN・制限され、突然利用できなくなると、連絡手段だけでなく支払い手段まで失う可能性があります。","WeChatの利用中に追加の認証が必要になり、WeChatでつながっている2人から認証を手伝ってもらう必要が生じる場合があります。しかし、「追加してから6か月以上」などの条件があり、条件を満たす知人がいなくて利用できなくなるケースがあります。"]}]},{"heading":"「北京大学」などの大学名・ロゴを無断使用する塾・研修・ツアー","level":3,"blocks":[{"t":"list","ordered":false,"items":["「北京大学」「清華大学」などの大学名やロゴを無断使用している塾・研修・ツアーなどを開催する個人・団体・業者が北京大学の学生・留学生を講師や解説員などとして雇おうとしたり、入学・留学体験を話す講演を依頼する例があります。","大学名やロゴの無断使用をしていると感じた場合には、必ず依頼を断りましょう（特に大学名やロゴを使っていない場合には、通常の業者と同じなので関連の問題はない）。"]}]},{"heading":"営利目的の入校予約・入校枠の売買は禁止","level":3,"blocks":[{"t":"list","ordered":false,"items":["北京大学などでは、部外者の入校に事前予約が必要となっており、一般の予約システムからだと満員で予約ができないという状態が頻繁に見られます。","一方、現役の在学生（学位生）は、一人当たり毎月8人分の入校予約枠が提供され、当日〜１週間後まで予約することが可能となっています。一部業者はそれを利用し、入校予約枠を在学生から1枠数十元〜数百元で購入しようとする例があります（業者はそれの入校枠を元に見学・研修ツアーを開催し、高額のツアー料を外部の参加者から得る）。","大学側でこのような行為に加担した学生を把握した場合、当該学生に対してキャンパス予約システムの利用停止や「警告」などの処分が行われる場合があるので、入校枠の売買などはしないようにしましょう。"]}]},{"heading":"心理的変化・異文化","level":3,"blocks":[{"t":"list","ordered":false,"items":["留学開始後、留学中、帰国後に、カルチャーショックや逆カルチャーショックが起こるようなことが一定数あります。","\u003cstrong>中国滞在中は日本で生活している時とは良くも悪くも異なる\u003c/strong>扱いを受けることがあります。その結果、、日本・中国・他国や様々な物事に対する認識や価値観が急激に変化し、日本の家族・友人知人等にもすぐにわかるほどに言動が変わる方もいます。物事に進んで取り組むようになるなど、一般的に良い方向と思われる方に変わる場合は問題ありませんが、金銭感覚・人への対応・政治や文化的価値観の急な変化が摩擦を生みやすくなることもあるので、日本と中国のどちらにも適応できるようにしましょう。"]},{"t":"dl","rows":[{"k":"積極的な例","v":"日本では大多数のうちの普通の日本人の１人だったが中国に行った途端に外国人・留学生などの少数派の身分（特に北京大学の学生ということで）になり特に何もしなくとも特別な存在になる・評価される、日本では一般的だった所得・消費水準で中国へ行くと自動的にある程度裕福・金銭的余裕のある状態になり金銭的感覚が変化する、日本の漫画・アニメ・文化・日本製品などについて良い評価を受けるなど。"},{"k":"消極的な例","v":"中国語や英語ができず他の学生との交流がうまくできず孤独感がある・孤立する、留学生ということで奨学金や進学・留学などで優遇されていると非難される、日本の歴史・政治問題を度々問われる・非難される、日本人という理由で問題に遭遇数r、日本と異なる粗雑なサービス・対応をされて自分だけ・日本人だからだと勘違いして不安になるなど。"}]}]}],"wip":false},{"id":"n240b8b8daa44","title":"大使館・大学・緊急連絡先など","directoryTitle":"9.2.1 s://its.pku.edu.cn\" target=\"_blank\" rel=\"noopener\">https://its.pku.edu.cn\u003c/a>"},{"k":"体育教研部","v":"\u003ca href=\"https://pe.pku.edu.cn/index.htm\" target=\"_blank\" rel=\"noopener\">https://pe.pku.edu.cn/index.htm\u003c/a>"},{"k":"医学部病院","v":"\u003ca href=\"https://hospital.pku.edu.cn/\" target=\"_blank\" rel=\"noopener\">https://hospital.pku.edu.cn/\u003c/a>"},{"k":"病院利用方法","v":"\u003ca href=\"https://hospital.pku.edu.cn/info/1004/1169.htm\" target=\"_blank\" rel=\"noopener\">https://hospital.pku.edu.cn/info/1004/1169.htm\u003c/a>"}]},{"t":"p","html":"※リンク等の削除・追加はご連絡ください。"}]}],"wip":false},{"id":"na0ee16446457","title":"空気汚染・黄砂のチェック","directoryTitle":"9.3 空気汚染・黄砂","category":"misc","tags":{},"editorNote":"","published":"2026-09-07","modified":"2026-09-07","chars":930,"sections":[{"heading":null,"level":0,"blocks":[{"t":"p","html":"北京では、\u003cstrong>空気汚染\u003c/strong>と\u003cstrong>黄砂\u003c/strong>が時々発生するため、留学中は\u003cstrong>「AQI（空气质量指数）」\u003c/strong>と\u003cstrong>「沙尘天气」\u003c/strong>の両方を確認するのがおすすめです。"}]},{"heading":"1. AQI（空气质量指数）サイト","level":2,"blocks":[{"t":"p","html":"\u003ca href=\"https://aqicn.org/city/beijing/haidianwanliu/jp/\" target=\"_blank\" rel=\"noopener\">https://aqicn.org/city/beijing/haidianwanliu/jp/\u003c/a>"},{"t":"card","title":"北京海淀万柳大気汚染：リアルタイムPM2.5大気汚染指数（AQI）","site":"aqicn.org","url":"https://aqicn.org/city/beijing/haidianwanliu/jp/"}]},{"heading":"2. 沙尘天气サイト","level":2,"blocks":[{"t":"p","html":"\u003ca href=\"https://m.nmc.cn/publish/severeweather/dust.html\" target=\"_blank\" rel=\"noopener\">https://m.nmc.cn/publish/severeweather/dust.html\u003c/a>"},{"t":"card","title":"沙尘天气预报","site":"m.nmc.cn","url":"https://m.nmc.cn/publish/severeweather/dust.html"},{"t":"p","html":"\u003ca href=\"http://www.asdf-bj.net/publish/forecasts/ens/ea/surface-concentration/index.html\" target=\"_blank\" rel=\"noopener\">http://www.asdf-bj.net/publish/forecasts/ens/ea/surface-concentration/index.html\u003c/a>"},{"t":"card","title":"Forecasts_ENSEMBLE_Surface concentration","site":"www.asdf-bj.net","url":"http://www.asdf-bj.net/publish/forecasts/ens/ea/surface-concentration/index.html"}]},{"heading":"3. 北京の空気汚染","level":2,"blocks":[{"t":"list","ordered":false,"items":["北京では、主にPM2.5（微小粒子状物質）などによる大気汚染が以前ほどではありませんが、一定程度あります。","北京市での発生源は、北京市内だけでなく、河北省などの地域外からの汚染の影響も大きな割合を占めています。季節によっても原因が変わり、春は粉じん、秋冬は石炭などの燃料を使用した暖房などの影響が目立ちます。"]}]},{"heading":"4. 黄砂・沙塵（沙尘）","level":2,"blocks":[{"t":"list","ordered":false,"items":["北京では黄砂・沙尘（shāchén）が3～5月の春に１〜３回程度発生します。","黄砂は、内モンゴル、西北・華北地域、モンゴル南部から飛来するものが大きな割合を占めています。","黄砂は北京や周辺地域の地面などに落ちると、場合によっては目に見えるくらいの砂として堆積します。部屋の窓を開けておいた日に黄砂がきた場合も、部屋の床などが目で見たり手で触ってわかるくらいに砂っぽくなるので注意してください。","また、一度地面に落ちた砂が風によって再び舞い上がり、「二次扬尘」として再度黄砂が発生する場合もあります。","黄砂の場合は粒の大きさがPM2.5よりも大きいPM10などの粒子が多く、視界がすぐに悪くなりやすいのが特徴です。","各種データで、PM2.5が増えた場合は通常の大気汚染、PM10が増えた場合は黄砂である可能性が高いと言えます。"]}]}],"wip":false},{"id":"nf782fd3fad87","title":"🗺北京大学・鉄道地図","directoryTitle":"地図・地下鉄概要","category":"misc","tags":{},"editorNote":"","published":"2026-07-15","modified":"2026-08-27","chars":1401,"sections":[{"heading":null,"level":0,"blocks":[{"t":"label","html":"北京市内の交通"},{"t":"list","ordered":false,"items":["北京では、タクシー料金が日本より安く、北京市内の移動は東京都内の約3分の1程度の料金で利用できます。そのため、多くの留学生が日常的な移動手段としても比較的多く利用しています。配車アプリ「滴滴出行（DiDi）」も便利です。","地下鉄は運賃が安く、渋滞の影響を受けないため、市内移動には特におすすめです。","中国では地図アプリとして「高德地图（Amap）」や「百度地图」が広く利用されています。渡航前にインストールし、使えるようにしておくと安心です。"]}]},{"heading":"高德地图/Gaode（app版あり）","level":3,"blocks":[{"t":"card","title":"高德地图","site":"www.amap.com","url":"https://www.amap.com/"}]},{"heading":"百度地图/Baidu（app版あり）","level":3,"blocks":[{"t":"card","title":"百度地图","site":"map.baidu.com","url":"https://map.baidu.com/"}]},{"heading":"空港から北京大学までの参考移動時間・費用","level":3,"blocks":[{"t":"p","html":"\u003cstrong>①首都国際空港→北京大学東門&amp;中関新園\u003c/strong>\u003cbr>　\u003cstrong>・タクシー：\u003c/strong>40〜60分、80〜140元（夕方〜夜に四幹線〜空港間の渋滞に巻き込まれると1時間半〜2時間かかることも有り）\u003cbr>　\u003cstrong>・電車：\u003c/strong>1〜1時間20分、約30元（首都国際空港→首都机场线25元＋地下鉄4号線5元→地下鉄4号線北京大学東門駅）"},{"t":"p","html":"北京首都国際空港〜北京大学東門"},{"t":"p","html":"\u003cstrong>②大興国際空港→北京大学東門&amp;中関新園\u003c/strong>\u003cbr>　\u003cstrong>・タクシー：\u003c/strong>1時間〜1時間40分、150〜250元\u003cbr>　\u003cstrong>・電車：\u003c/strong>1〜1時間40分、約40元（大興空港→大興机场線35元＋地下鉄4号線5元→地下鉄4号線北京大学東門駅）"},{"t":"p","html":"北京大興国際空港〜北京大学東門"}]},{"heading":"空港から大学までの移動","level":3,"blocks":[{"t":"list","ordered":false,"items":["空港や高速鉄道駅にはタクシー乗り場があり、配車アプリを使わなくてもタクシーに乗ることができます。料金はメーター制で、現金・キャッシュレス決済・クレジットカードに対応している車両がほとんどです。一方、個人営業の車両ではクレジットカードが使えない場合もあります。","配車アプリを利用する場合は、指定した場所まで迎えに来てもらえます。ただし、車両が進入できない場所では、近くの駐車場や道路脇が乗車場所になることがあります。","空港や高速鉄道駅、観光地ではタクシーの客引きがいることがあります。地図アプリで表示された料金（普通のタクシーと同じ料金）を請求される場合や、口頭で料金を提示される場合があります。交渉次第で普通のタクシーよりも料金を安くできますが、慣れていないうちは、正規のタクシーを利用することをおすすめします。"]},{"t":"label","html":"北京大学中関新園へ向かう場合"},{"t":"list","ordered":false,"items":["空港から大学の寮へ向かう際は、\u003cstrong>運転手に「北京大学中関新園」と伝えてください。「北京大学」とだけ伝えると、観光名所でもある北京大学西門\u003c/strong>で降ろされることがあり、\u003cstrong>中関新園まで徒歩20分以上\u003c/strong>かかります。","もし運転手が「北京大学中関新園」を知らない場合は、「北京大学東門」まで行ってもらい、到着後に中関新園まで案内するとスムーズです。"]}]},{"heading":"各種地図・路線図","level":3,"blocks":[{"t":"label","html":"1.1 北京大学公式サイト地図（名所・史跡紹介付き）"},{"t":"card","title":"北京大学","site":"www.pku.edu.cn","url":"https://www.pku.edu.cn/visit.html"},{"t":"label","html":"1.2 北京大学燕園（本部キャンパス）地図"},{"t":"label","html":"1.3 北京大学燕園（本部キャンパス）地図　英語併記版\u003cbr>"},{"t":"card","title":"Map","site":"english.pku.edu.cn","url":"https://english.pku.edu.cn/map.html"},{"t":"label","html":"2.1 北京市鉄道路線図"},{"t":"card","title":"展示线路图 | 北京地铁官方网站","site":"www.bjsubway.com","url":"https://www.bjsubway.com/station/xltzs/"},{"t":"label","html":"2.2 北京市鉄道路線図"},{"t":"card","title":"线路图 - 北京京港地铁有限公司","site":"www.mtr.bj.cn","url":"https://www.mtr.bj.cn/article/line"},{"t":"label","html":"2.3 中国鉄道地図"},{"t":"card","title":"中国鉄道地図","site":"cnrail.geogv.org","url":"http://cnrail.geogv.org/jajp/about"}]}],"wip":false}]}</script>
