name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 运行时只需要 index.html（数据已内嵌）和 img/。
      # template.html / retrieval.js.part / data/*.json 是构建输入，不发布。
      - name: Assemble site
        run: |
          mkdir -p _site
          cp app/index.html _site/
          cp -r app/img _site/img
          ls -lR _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
